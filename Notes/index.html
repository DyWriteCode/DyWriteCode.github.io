    <style>
        /* 修复整体布局：页头页尾居中 */
        .hero-section {
            flex-direction: column;
            align-items: center;
            padding: 20px 0 0 0;
        }

        .hero-section>* {
            width: 100%;
        }

        /* 顶部与底部文字样式 */
        .page-header {
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 24px 20px 12px 20px;
            letter-spacing: 2px;
        }

        .page-footer {
            text-align: center;
            color: #999;
            font-size: 16px;
            padding: 30px 20px 24px 20px;
            line-height: 2.2;
            font-family: 'Georgia', 'SimSun', serif;
        }

        /* 底部 "三+三" 强化样式 */
        .page-footer strong {
            font-weight: 700;
            font-size: 1.4em;
            color: #8a5a3a;
            text-shadow: 0 0 8px rgba(181, 101, 75, 0.2);
            border-bottom: 2px solid #dccfc8;
            padding-bottom: 2px;
            display: inline-block;
            transition: all 0.3s;
        }

        .page-footer strong:hover {
            color: #b5654b;
            text-shadow: 0 0 16px rgba(181, 101, 75, 0.4);
            border-bottom-color: #b5654b;
        }

        /* 顶部链接样式美化 */
        .page-header a {
            color: #b5654b;
            text-decoration: none;
            border-bottom: 1px dashed #dccfc8;
            transition: color 0.3s, border-color 0.3s;
            padding-bottom: 1px;
        }

        .page-header a:hover {
            color: #8a5a3a;
            border-bottom-color: #b5654b;
            border-bottom-style: solid;
        }

        /* === 卡片网格居中改造（flex 自适应） === */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            /* 卡片间距 */
            max-width: 800px;
            /* 限制最大宽度，防止过度拉伸 */
            width: 100%;
            margin: 0 auto;
            padding: 20px 0;
        }

        .card {
            flex: 0 0 280px;
            /* 固定宽度，可根据需要调整 */
            list-style: none;
            position: relative;
            max-width: 100%;
        }

        /* 保持卡片比例不变（原有 before 伪元素保留） */
        .card:before {
            content: '';
            display: block;
            padding-bottom: 150%;
            width: 100%;
        }

        .card__background {
            background-size: cover;
            background-position: center;
            border-radius: var(--spacing-l);
            bottom: 0;
            filter: brightness(0.75) saturate(1.2) contrast(0.85);
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transform-origin: center;
            transform: scale(1) translateZ(0);
            transition: filter 200ms linear, transform 200ms linear;
        }

        .card:hover .card__background {
            transform: scale(1.05) translateZ(0);
            filter: brightness(0.5) saturate(1) contrast(1.2) blur(4px);
        }

        .card__content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-l);
        }

        .card__category {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-s);
            text-transform: uppercase;
        }

        .card__qrcode {
            width: 180px;
            height: 180px;
            margin-top: 20px;
            display: none;
            object-fit: cover;
        }

        .card:hover .card__qrcode {
            display: inline-block;
        }

        .card__heading {
            color: var(--text-lighter);
            font-size: 1.9rem;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.2);
            line-height: 1.4;
            word-spacing: 100vw;
            text-align: center;
        }

        /* 响应式：小屏幕下卡片宽度自适应 */
        @media (max-width: 540px) {
            .card {
                flex: 0 0 100%;
                max-width: 320px;
            }

            .page-header {
                font-size: 15px;
                padding: 16px 12px 8px 12px;
            }

            .page-footer {
                font-size: 14px;
                padding: 20px 12px 16px 12px;
                line-height: 2;
            }

            .page-footer strong {
                font-size: 1.2em;
            }
        }
    </style>
