<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES 加密解密（密码模式）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js?v=20260826135549">
    </script>
    <style>
        /* 样式与之前相同，为节约篇幅不再重复，但下方已包含完整代码 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6f9fc, #e9f0f8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            padding: 36px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 34px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1e33;
            background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .badge {
            font-size: 12px;
            font-weight: 500;
            background: rgba(45, 106, 159, 0.12);
            color: #1a4a7a;
            padding: 4px 14px;
            border-radius: 40px;
            margin-left: auto;
            border: 1px solid rgba(45, 106, 159, 0.15);
            -webkit-text-fill-color: #1a4a7a;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #1d3b5a;
            margin-bottom: 6px;
        }

        .field-label .hint {
            font-weight: 400;
            font-size: 12px;
            color: #7a8fa6;
            margin-left: 4px;
        }

        .key-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .key-row input[type="text"],
        .key-row input[type="password"] {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid #dbe4ed;
            border-radius: 14px;
            font-size: 15px;
            background: #fff;
            transition: border .2s, box-shadow .2s;
            outline: none;
            color: #0f2a44;
        }

        .key-row input:focus {
            border-color: #2d6a9f;
            box-shadow: 0 0 0 4px rgba(45, 106, 159, 0.10);
        }

        .key-row .toggle-vis {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1.5px solid #dbe4ed;
            background: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            color: #4a6f8f;
        }

        .key-row .toggle-vis:hover {
            background: #f0f5fb;
            border-color: #b6cedb;
        }

        .count-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .count-row .count-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f2f7fc;
            border-radius: 14px;
            padding: 2px;
            border: 1.5px solid #dbe4ed;
        }

        .count-row .count-control button {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            font-size: 20px;
            font-weight: 300;
            color: #1d3b5a;
            cursor: pointer;
            border-radius: 12px;
            transition: background .15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .count-row .count-control button:hover {
            background: rgba(45, 106, 159, 0.08);
        }

        .count-row .count-control .count-value {
            width: 52px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #0b1e33;
            background: transparent;
            border: none;
            outline: none;
            padding: 6px 0;
            font-family: inherit;
        }

        .count-row .count-control .count-value::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .count-row .count-control .count-value[type="number"] {
            -moz-appearance: textfield;
        }

        .count-row .count-display {
            font-size: 14px;
            color: #4a6f8f;
            font-weight: 500;
        }

        .count-row .count-display span {
            font-weight: 700;
            color: #0b1e33;
        }

        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #dbe4ed;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            resize: vertical;
            min-height: 110px;
            background: #fff;
            transition: border .2s, box-shadow .2s;
            outline: none;
            color: #0f2a44;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: #2d6a9f;
            box-shadow: 0 0 0 4px rgba(45, 106, 159, 0.08);
        }

        textarea::placeholder {
            color: #a7bbc8;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 8px 0 4px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 0 auto;
            min-width: 80px;
            color: #fff;
            background: #eef3f8;
            color: #1d3b5a;
        }

        .btn-primary {
            background: linear-gradient(145deg, #1a4a7a, #2d6a9f);
            color: #fff;
            box-shadow: 0 4px 12px rgba(45, 106, 159, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 106, 159, 0.30);
        }

        .btn-success {
            background: linear-gradient(145deg, #0f7b5a, #1a9b7a);
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 155, 122, 0.25);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 155, 122, 0.30);
        }

        .btn-outline {
            background: transparent;
            color: #2d6a9f;
            border: 1.5px solid #dbe4ed;
        }

        .btn-outline:hover {
            background: #f0f5fb;
            border-color: #b6cedb;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
            min-width: auto;
            flex: 0 1 auto;
        }

        .btn:disabled {
            opacity: 0.5;
            transform: none !important;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        .result-area {
            margin-top: 6px;
        }

        .result-area .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .log-area {
            margin-top: 16px;
            padding: 12px 16px;
            background: #f2f7fc;
            border-radius: 14px;
            border: 1px solid #e3edf5;
            max-height: 140px;
            overflow-y: auto;
            font-size: 13px;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: #1d3b5a;
            line-height: 1.7;
            transition: all .2s;
        }

        .log-area .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .log-area .log-entry:last-child {
            border-bottom: none;
        }

        .log-area .log-entry .log-time {
            color: #7a8fa6;
            margin-right: 10px;
            font-size: 11px;
        }

        .log-area .log-entry.log-success {
            color: #0f7b5a;
        }

        .log-area .log-entry.log-error {
            color: #b13e3e;
        }

        .log-area .log-entry.log-info {
            color: #2d6a9f;
        }

        .log-empty {
            color: #a7bbc8;
            font-style: italic;
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e3edf5;
            font-size: 12px;
            color: #7a8fa6;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer-bar .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-bar .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .footer-bar .status .dot.idle {
            background: #a7bbc8;
        }

        .footer-bar .status .dot.busy {
            background: #f5b342;
            animation: pulse 0.8s infinite alternate;
        }

        .footer-bar .status .dot.done {
            background: #1a9b7a;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .log-area::-webkit-scrollbar {
            width: 4px;
        }

        .log-area::-webkit-scrollbar-thumb {
            background: #c9dae8;
            border-radius: 8px;
        }

        @media (max-width:640px) {
            .container {
                padding: 24px 18px 28px;
                border-radius: 28px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header .badge {
                font-size: 10px;
                padding: 2px 10px;
            }

            .key-row input {
                font-size: 14px;
                padding: 10px 14px;
            }

            .count-row .count-control .count-value {
                width: 40px;
                font-size: 16px;
            }

            .count-row .count-control button {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 14px;
                min-width: 60px;
            }

            textarea {
                font-size: 14px;
                min-height: 80px;
            }

            .action-row {
                gap: 6px;
            }

            .footer-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width:420px) {
            .container {
                padding: 16px 12px 20px;
                border-radius: 20px;
            }

            .header .icon {
                font-size: 26px;
            }

            .header h1 {
                font-size: 17px;
            }

            .key-row {
                flex-wrap: wrap;
            }

            .key-row input {
                flex: 1 1 100%;
            }

            .key-row .toggle-vis {
                flex: 0 0 40px;
                height: 40px;
            }

            .btn {
                font-size: 13px;
                padding: 6px 12px;
                min-width: 50px;
            }

            .action-row .btn {
                flex: 1 1 40%;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="app">
        <div class="header">
            <span class="icon">🔐</span>
            <h1>AES 加密·解密</h1>
            <span class="badge">密码模式 (密钥任意长度)</span>
        </div>

        <div class="field-group">
            <div class="field-label">🔑 密码 <span class="hint">（任意长度，推荐长密码）</span></div>
            <div class="key-row">
                <input type="password" id="keyInput" placeholder="请输入密码" value="demo-key-2026">
                <button class="toggle-vis" id="toggleKeyVis" type="button">👁️</button>
            </div>
        </div>

        <div class="field-group">
            <div class="field-label">🔄 加密 / 解密 次数 <span class="hint">（1 ~ 100）</span></div>
            <div class="count-row">
                <div class="count-control">
                    <button id="countDec" type="button">−</button>
                    <input type="number" class="count-value" id="countInput" value="1" min="1" max="100">
                    <button id="countInc" type="button">+</button>
                </div>
                <div class="count-display">将执行 <span id="countDisplay">1</span> 次</div>
            </div>
        </div>

        <div class="field-group">
            <div class="field-label">📝 输入内容</div>
            <textarea id="inputArea" placeholder="在此输入要加密或解密的内容…">Hello, 世界！</textarea>
        </div>

        <div class="action-row">
            <button class="btn btn-primary" id="encryptBtn">🔒 加密</button>
            <button class="btn btn-success" id="decryptBtn">🔓 解密</button>
            <button class="btn btn-outline" id="clearBtn">🗑️ 清空</button>
            <button class="btn btn-outline" id="swapBtn">⇄ 交换</button>
        </div>

        <div class="field-group result-area">
            <div class="field-label">📋 输出结果 <span class="hint" id="resultHint"></span></div>
            <textarea id="outputArea" placeholder="结果将显示在这里…" readonly></textarea>
            <div class="result-actions">
                <button class="btn btn-outline btn-sm" id="copyBtn">📄 复制结果</button>
                <button class="btn btn-outline btn-sm" id="copyInputBtn">📄 复制输入</button>
                <button class="btn btn-outline btn-sm" id="diagnoseBtn">🔍 诊断</button>
            </div>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-empty">💡 准备就绪，开始操作吧</div>
        </div>

        <div class="footer-bar">
            <div class="status">
                <span class="dot idle" id="statusDot"></span>
                <span id="statusText">就绪</span>
            </div>
            <span>⚡ AES-CBC · 固定 IV · 密码派生</span>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // DOM 引用
            const keyInput = document.getElementById('keyInput');
            const toggleKeyBtn = document.getElementById('toggleKeyVis');
            const countInput = document.getElementById('countInput');
            const countDec = document.getElementById('countDec');
            const countInc = document.getElementById('countInc');
            const countDisplay = document.getElementById('countDisplay');
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const encryptBtn = document.getElementById('encryptBtn');
            const decryptBtn = document.getElementById('decryptBtn');
            const clearBtn = document.getElementById('clearBtn');
            const swapBtn = document.getElementById('swapBtn');
            const copyBtn = document.getElementById('copyBtn');
            const copyInputBtn = document.getElementById('copyInputBtn');
            const diagnoseBtn = document.getElementById('diagnoseBtn');
            const logArea = document.getElementById('logArea');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const resultHint = document.getElementById('resultHint');

            // 固定 IV (16 字节) — 注意：密码模式中，IV 仍起作用
            const FIXED_IV = CryptoJS.enc.Utf8.parse('0123456789abcdef');

            let isKeyVisible = false;

            function getKey() {
                return keyInput.value.trim(); // 去除首尾空格
            }

            function getCount() {
                let v = parseInt(countInput.value, 10);
                if (isNaN(v) || v < 1) v = 1;
                if (v > 100) v = 100;
                countInput.value = v;
                countDisplay.textContent = v;
                return v;
            }

            function setStatus(text, type) {
                statusText.textContent = text;
                statusDot.className = 'dot ' + (type || 'idle');
            }

            function addLog(message, type) {
                const time = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = 'log-entry' + (type ? ' log-' + type : '');
                entry.innerHTML = `<span class="log-time">${time}</span>${message}`;
                const empty = logArea.querySelector('.log-empty');
                if (empty) empty.remove();
                logArea.appendChild(entry);
                logArea.scrollTop = logArea.scrollHeight;
                while (logArea.children.length > 80) {
                    logArea.removeChild(logArea.firstChild);
                }
            }

            function clearLog() {
                logArea.innerHTML = '';
                const empty = document.createElement('div');
                empty.className = 'log-empty';
                empty.textContent = '💡 日志已清空';
                logArea.appendChild(empty);
            }

            function setResult(text, hint) {
                outputArea.value = text;
                resultHint.textContent = hint || '';
            }

            function getInput() { return inputArea.value; }
            function setInput(text) { inputArea.value = text; }

            // ----- AES 核心操作（密码模式：直接使用字符串密码） -----

            function aesEncrypt(plaintext, password) {
                // 直接使用 password 字符串，CryptoJS 内部通过 KDF 派生密钥
                const encrypted = CryptoJS.AES.encrypt(plaintext, password, {
                    iv: FIXED_IV,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                return encrypted.toString(); // Base64
            }

            function aesDecrypt(ciphertext, password) {
                const decrypted = CryptoJS.AES.decrypt(ciphertext, password, {
                    iv: FIXED_IV,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                if (decrypted.sigBytes === 0) {
                    throw new Error('解密结果为空，请检查密码或密文是否正确');
                }
                const result = decrypted.toString(CryptoJS.enc.Utf8);
                if (result === '') {
                    // 尝试 Latin1 诊断
                    const latin = decrypted.toString(CryptoJS.enc.Latin1);
                    if (latin) {
                        throw new Error('UTF-8 解码为空，Latin1 解码为: ' + latin);
                    } else {
                        throw new Error('解密结果无法解码为 UTF-8，数据可能损坏');
                    }
                }
                return result;
            }

            function multiEncrypt(plaintext, password, times) {
                let data = plaintext;
                for (let i = 0; i < times; i++) {
                    try {
                        data = aesEncrypt(data, password);
                    } catch (e) {
                        throw new Error('第 ' + (i + 1) + ' 次加密失败: ' + e.message);
                    }
                }
                return data;
            }

            function multiDecrypt(ciphertext, password, times) {
                let data = ciphertext.trim();
                if (!data) throw new Error('密文为空');
                // 检查是否为有效的 Base64（仅提示，不阻断）
                try {
                    atob(data);
                } catch (_) {
                    // 可能不是 Base64，但 CryptoJS 可处理，不抛出
                }
                for (let i = 0; i < times; i++) {
                    try {
                        const decrypted = CryptoJS.AES.decrypt(data, password, {
                            iv: FIXED_IV,
                            mode: CryptoJS.mode.CBC,
                            padding: CryptoJS.pad.Pkcs7
                        });
                        if (decrypted.sigBytes === 0) {
                            throw new Error('第 ' + (i + 1) + ' 次解密结果为空，请检查密码');
                        }
                        data = decrypted.toString(CryptoJS.enc.Utf8);
                        // 如果是最终结果且为空，尝试 Latin1 诊断
                        if (data === '' && i === times - 1) {
                            const latin = decrypted.toString(CryptoJS.enc.Latin1);
                            if (latin) {
                                throw new Error('最终明文 UTF-8 解码为空，Latin1 解码为: ' + latin);
                            } else {
                                throw new Error('最终明文无法解码（sigBytes=' + decrypted.sigBytes + '）');
                            }
                        }
                    } catch (e) {
                        throw new Error('第 ' + (i + 1) + ' 次解密失败: ' + e.message);
                    }
                }
                return data;
            }

            // ----- 诊断功能 -----

            function diagnose() {
                const password = getKey();
                const ciphertext = getInput().trim();
                if (!password) {
                    addLog('⚠️ 请输入密码', 'error');
                    return;
                }
                if (!ciphertext) {
                    addLog('⚠️ 请输入要诊断的密文', 'error');
                    return;
                }
                addLog('🔍 开始诊断 (密码模式)...', 'info');
                // 检查 Base64
                try {
                    atob(ciphertext);
                    addLog('✅ 密文是有效的 Base64', 'success');
                } catch (_) {
                    addLog('⚠️ 密文不是标准 Base64，但 CryptoJS 仍可尝试', 'info');
                }
                // 尝试解密
                try {
                    const result = aesDecrypt(ciphertext, password);
                    addLog('✅ 解密成功！明文: ' + result, 'success');
                    setResult(result, '诊断解密成功');
                } catch (e) {
                    addLog('❌ 解密失败: ' + e.message, 'error');
                    // 额外尝试：如果密码含特殊字符，可能编码问题，但不处理
                }
            }

            // ----- 操作处理 -----

            function handleEncrypt() {
                const password = getKey();
                if (!password) {
                    addLog('⚠️ 请先输入密码', 'error');
                    setStatus('缺少密码', 'error');
                    return;
                }
                const plaintext = getInput();
                if (!plaintext) {
                    addLog('⚠️ 请输入要加密的内容', 'error');
                    setStatus('内容为空', 'error');
                    return;
                }
                const times = getCount();
                setStatus('加密中…', 'busy');
                encryptBtn.disabled = true;
                decryptBtn.disabled = true;
                setTimeout(() => {
                    try {
                        const start = performance.now();
                        const result = multiEncrypt(plaintext, password, times);
                        const elapsed = ((performance.now() - start) / 1000).toFixed(2);
                        setResult(result, `✅ 加密 ${times} 次完成 (${elapsed}s)`);
                        addLog(`🔒 加密 ${times} 次成功，密文长度 ${result.length}`, 'success');
                        setStatus('加密完成', 'done');
                    } catch (e) {
                        addLog('❌ ' + e.message, 'error');
                        setStatus('加密失败', 'error');
                        setResult('', '');
                    } finally {
                        encryptBtn.disabled = false;
                        decryptBtn.disabled = false;
                    }
                }, 50);
            }

            function handleDecrypt() {
                const password = getKey();
                if (!password) {
                    addLog('⚠️ 请先输入密码', 'error');
                    setStatus('缺少密码', 'error');
                    return;
                }
                const ciphertext = getInput();
                if (!ciphertext) {
                    addLog('⚠️ 请输入要解密的内容', 'error');
                    setStatus('内容为空', 'error');
                    return;
                }
                const times = getCount();
                setStatus('解密中…', 'busy');
                encryptBtn.disabled = true;
                decryptBtn.disabled = true;
                setTimeout(() => {
                    try {
                        const start = performance.now();
                        const result = multiDecrypt(ciphertext, password, times);
                        const elapsed = ((performance.now() - start) / 1000).toFixed(2);
                        setResult(result, `✅ 解密 ${times} 次完成 (${elapsed}s)`);
                        addLog(`🔓 解密 ${times} 次成功，明文长度 ${result.length}`, 'success');
                        setStatus('解密完成', 'done');
                    } catch (e) {
                        addLog('❌ ' + e.message, 'error');
                        setStatus('解密失败', 'error');
                        setResult('', '');
                    } finally {
                        encryptBtn.disabled = false;
                        decryptBtn.disabled = false;
                    }
                }, 50);
            }

            function handleClear() {
                setInput('');
                setResult('', '');
                clearLog();
                setStatus('已清空', 'idle');
                addLog('🗑️ 已清空所有内容', 'info');
            }

            function handleSwap() {
                const inputVal = getInput();
                const outputVal = outputArea.value;
                if (outputVal) {
                    setInput(outputVal);
                    setResult(inputVal, '⇄ 已交换');
                    addLog('⇄ 输入与输出交换', 'info');
                } else {
                    addLog('⚠️ 输出为空，无法交换', 'error');
                }
            }

            function handleCopy(text, label) {
                if (!text) {
                    addLog('⚠️ 没有内容可复制', 'error');
                    return;
                }
                navigator.clipboard.writeText(text).then(() => {
                    addLog(`📄 已复制 ${label} 到剪贴板`, 'success');
                    setStatus('已复制', 'done');
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                        addLog(`📄 已复制 ${label} 到剪贴板`, 'success');
                        setStatus('已复制', 'done');
                    } catch (_) {
                        addLog('⚠️ 复制失败，请手动复制', 'error');
                    }
                    document.body.removeChild(ta);
                });
            }

            // ----- 事件绑定 -----

            toggleKeyBtn.addEventListener('click', function () {
                isKeyVisible = !isKeyVisible;
                keyInput.type = isKeyVisible ? 'text' : 'password';
                this.textContent = isKeyVisible ? '🙈' : '👁️';
            });

            countDec.addEventListener('click', function () {
                let v = parseInt(countInput.value, 10) || 1;
                v = Math.max(1, v - 1);
                countInput.value = v;
                countDisplay.textContent = v;
                getCount();
            });
            countInc.addEventListener('click', function () {
                let v = parseInt(countInput.value, 10) || 1;
                v = Math.min(100, v + 1);
                countInput.value = v;
                countDisplay.textContent = v;
                getCount();
            });
            countInput.addEventListener('change', function () { getCount(); });
            countInput.addEventListener('input', function () {
                let v = parseInt(this.value, 10);
                if (!isNaN(v) && v >= 1 && v <= 100) {
                    countDisplay.textContent = v;
                } else {
                    const valid = getCount();
                    countDisplay.textContent = valid;
                }
            });

            encryptBtn.addEventListener('click', handleEncrypt);
            decryptBtn.addEventListener('click', handleDecrypt);
            clearBtn.addEventListener('click', handleClear);
            swapBtn.addEventListener('click', handleSwap);
            copyBtn.addEventListener('click', function () { handleCopy(outputArea.value, '输出结果'); });
            copyInputBtn.addEventListener('click', function () { handleCopy(getInput(), '输入内容'); });
            diagnoseBtn.addEventListener('click', diagnose);

            inputArea.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    handleEncrypt();
                } else if (e.key === 'Enter' && e.shiftKey) {
                    e.preventDefault();
                    handleDecrypt();
                }
            });

            // 初始化演示
            (function init() {
                getCount();
                setStatus('就绪', 'idle');
                addLog('🚀 工具已加载（密码模式，支持任意长度密码）', 'info');
                addLog('💡 提示: Ctrl+Enter 加密 ｜ Shift+Enter 解密', 'info');
                // 预置演示：使用密码模式加密"Hello, 世界！"以便测试
                const demoPass = 'demo-key-2026';
                const demoPlain = 'Hello, 世界！';
                try {
                    const demoEnc = CryptoJS.AES.encrypt(demoPlain, demoPass, {
                        iv: FIXED_IV,
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    }).toString();
                    addLog(`📌 演示: 加密 "${demoPlain}" => "${demoEnc}"`, 'info');
                } catch (_) { }
            })();

        })();
    </script>
</body>

</html>
