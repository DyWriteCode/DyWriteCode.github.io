<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Home</title>
        <link rel="stylesheet" href="preview_assets/style.css" />
        <link rel="icon" type="image/png" href="preview_assets/home.ico">
    </head>
    <body>
        <script type="text/javascript" src="preview_assets/click.js"></script>
        <script type="text/javascript" src="preview_assets/modal_box.js"></script>
        <!-- 模态框 -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div id="modalTitle" class="modal-title">标题</div>
                <div id="modalDesc" class="modal-desc">描述文字</div>
                <div id="modalCarousel" class="modal-carousel">
                    <button class="carousel-btn prev" id="carouselPrev">❮</button>
                    <img id="carouselImg" src="" alt="图片">
                    <button class="carousel-btn next" id="carouselNext">❯</button>
                </div>
                <div class="modal-messages">
                    <h4>留言板</h4>
                    <ul id="messageList"></ul>
                    <div class="message-input">
                        <input type="text" id="messageInput" placeholder="写下你的祝福...">
                        <button id="sendMessageBtn">发送</button>
                    </div>
                </div>
            </div>
        </div>
        <section class="hero-section background_color">
            <div class="card-grid"">
                <a class="card" href="birthday/index.html">
                    <div
                        class="card__background"
                        style="background-image: url(preview_assets/birthday.jpg);"
                    ></div>
                    <div class="card__content">
                        <p class="card__category">Birthday-Gift</p>
                        <h3 class="card__heading">谨以此表达对友人生日的由衷祝福</h3>
                        <img class="card__qrcode"src="preview_assets/birthday.jpg"/>
                    </div>
                </a>
                <a class="card" href="MiddleSchoolYearBook/index.html">
                    <div
                        class="card__background"
                        style="background-image: url(preview_assets/sunshine.jpeg);"
                    ></div>
                    <div class="card__content">
                        <p class="card__category">Middle-School-YearBook</p>
                        <h3 class="card__heading">谨以此纪念三年的初中时光</h3>
                        <img class="card__qrcode" src="preview_assets/sunshine.jpeg"/>
                    </div>
                </a>
            </div>
        </section>
    </body>
</html>
