name: Update pages.json

on:
    push:
        branches:
            - main # 监听 main 分支，如果你的主分支是 master，请修改
            - master # 同时保留两种写法

permissions:
    contents: write # 允许提交更改

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }} # 确保检出当前分支
                  fetch-depth: 0 # 获取完整历史，以便后面提交

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Run generate script
              run: python ../scripts/generate_pages.py

            - name: Commit and push if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add pages.json
                  # 检查是否有变更，如果有则提交
                  if git diff --staged --quiet; then
                    echo "📭 没有检测到 pages.json 的变化，跳过提交。"
                  else
                    git commit -m "chore: auto-update pages.json [skip ci]"
                    git push
                    echo "🚀 已提交并推送 pages.json 更新。"
                  fi
