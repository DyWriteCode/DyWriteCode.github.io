name: Generate Version File

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3  # 临时改回 v3
        with:
          fetch-depth: 0

      - name: Create version.json
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          HASH=$(git rev-parse --short HEAD)
          echo "{\"version\":\"${TIMESTAMP}-${HASH}\"}" > version.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'beautifulsoup4>=4.9.0'

      - name: Update resource links with version identifiers
        run: python .github/update_resources.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git add .
          git diff --staged --quiet || git commit -m "chore: update version.json and resource links [skip ci]"
          git push