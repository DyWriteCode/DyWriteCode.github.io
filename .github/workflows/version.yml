name: Generate Version File

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version.json
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          HASH=$(git rev-parse --short HEAD)
          echo "{\"version\":\"${TIMESTAMP}-${HASH}\"}" > version.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python
        run: python -m pip install --upgrade pip

      - name: Replace resource links with version identifiers
        run: python .github/scripts/update_resources.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git add .
          # 如果文件有变更则提交
          git diff --staged --quiet || {
            git commit -m "chore: update version.json and resource links [skip ci]"
            # 先拉取远程最新，避免冲突
            git pull --rebase origin main
            git push
          }
