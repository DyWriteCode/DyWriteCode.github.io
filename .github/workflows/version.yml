name: Generate Version File

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create version.json
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          HASH=$(git rev-parse --short HEAD)
          echo "{\"version\":\"${TIMESTAMP}-${HASH}\"}" > version.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 djlint

      - name: Replace resource links with version identifiers
        run: python .github/update_resources.py

      - name: Format all HTML files with djlint (4 spaces)
        run: |
          djlint . --reformat --indent 4 || true
          # 检查是否有实际改动
          if git diff --quiet; then
            echo "No formatting changes."
          else
            echo "Formatting changes applied, will commit."
            git add .
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git add .
          git diff --staged --quiet || git commit -m "chore: update version.json and resource links, formatted HTML [skip ci]"
          git push