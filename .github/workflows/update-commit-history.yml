name: Generate Commit History HTML

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Generate commit-history.html
              run: python .github/scripts/generate_commit_history.py

            - name: Commit and push if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add commit-history.html
                  git diff --staged --quiet || {
                    git commit -m "chore: update commit-history.html [skip ci]"
                    # 先拉取远程最新，避免冲突
                    git pull --rebase origin main
                    git push
                  }
