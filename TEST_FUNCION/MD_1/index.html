<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System.exit(0) - 青春毕业答卷</title>
    <style>
        :root {
            --bg: #0a0c10;
            --term-bg: #0d1117;
            --term-header: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --green: #3fb950;
            --blue: #58a6ff;
            --purple: #bc8cff;
            --yellow: #d29922;
            --red: #f85149;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: var(--font-mono);
        }

        .terminal-window {
            width: 100%;
            max-width: 850px;
            height: 85vh;
            background: var(--term-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            background: var(--term-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .terminal-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
            scroll-behavior: smooth;
        }

        /* 自定义滚动条 */
        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: var(--term-bg); }
        .terminal-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        .terminal-body::-webkit-scrollbar-thumb:hover { background: #484f58; }

        .line {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            animation: fadeIn 0.1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .prompt {
            color: var(--green);
            font-weight: bold;
            flex-shrink: 0;
            user-select: none;
        }

        .prompt::before {
            content: "➜  ";
            color: var(--text-muted);
        }

        .output {
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        /* 语法高亮 */
        .c-comment { color: var(--text-muted); font-style: italic; }
        .c-keyword { color: var(--purple); }
        .c-string { color: var(--green); }
        .c-number { color: var(--yellow); }
        .c-func { color: var(--blue); }
        
        .log-info { color: var(--blue); }
        .log-warn { color: var(--yellow); }
        .log-err { color: var(--red); }
        .log-success { color: var(--green); }

        .data-highlight {
            color: #ff7b72;
            background: rgba(255, 123, 114, 0.1);
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .box-quote {
            border-left: 3px solid var(--blue);
            background: rgba(88, 166, 255, 0.05);
            padding: 12px 18px;
            border-radius: 0 8px 8px 0;
            margin: 10px 0;
            color: #a5d6ff;
            font-style: italic;
        }

        /* 光标 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--green);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 进度条 */
        .progress-bar {
            display: inline-block;
            width: 200px;
            height: 12px;
            background: #21262d;
            border-radius: 6px;
            overflow: hidden;
            vertical-align: middle;
            margin-right: 10px;
            border: 1px solid #30363d;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--green);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="window-controls">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-title">bash — birthday_gift_final_compilation — 120×40</div>
        </div>
        
        <div class="terminal-body" id="terminal-body">
            <!-- 终端内容将由 JS 动态生成 -->
        </div>
    </div>

    <script>
        // ==========================================
        // 终端执行引擎
        // ==========================================
        
        const termBody = document.getElementById('terminal-body');
        
        // 模拟打字机效果
        async function typeCommand(text, speed = 40) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<div class="prompt"></div><div class="output"></div>`;
            termBody.appendChild(line);
            
            const outputDiv = line.querySelector('.output');
            const cursorSpan = document.createElement('span');
            cursorSpan.className = 'cursor';
            outputDiv.appendChild(cursorSpan);

            for (let i = 0; i < text.length; i++) {
                outputDiv.textContent = text.substring(0, i + 1);
                outputDiv.appendChild(cursorSpan);
                termBody.scrollTop = termBody.scrollHeight;
                await sleep(speed + Math.random() * 30);
            }
            
            // 换行时移除光标，准备下一个命令
            cursorSpan.remove();
            outputDiv.textContent = text;
            await sleep(300); // 回车后的停顿
        }

        // 模拟直接输出日志（带短暂延迟或逐行显示）
        async function printLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = 'line';
            let colorClass = 'log-info';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-err';
            if (type === 'success') colorClass = 'log-success';
            
            // 简单的语法高亮替换
            let htmlContent = text
                .replace(/\[INFO\]/g, '<span class="log-info">[INFO]</span>')
                .replace(/\[WARN\]/g, '<span class="log-warn">[WARN]</span>')
                .replace(/\[ERROR\]/g, '<span class="log-err">[ERROR]</span>')
                .replace(/\[SUCCESS\]/g, '<span class="log-success">[SUCCESS]</span>')
                .replace(/\[DEBUG\]/g, '<span class="c-comment">[DEBUG]</span>')
                .replace(/42.5%/g, '<span class="data-highlight">42.5%</span>')
                .replace(/46.5%/g, '<span class="data-highlight">46.5%</span>')
                .replace(/22.0%/g, '<span class="data-highlight">22.0%</span>')
                .replace(/127/g, '<span class="c-number">127</span>')
                .replace(/const/g, '<span class="c-keyword">const</span>')
                .replace(/let/g, '<span class="c-keyword">let</span>')
                .replace(/await/g, '<span class="c-keyword">await</span>')
                .replace(/function/g, '<span class="c-keyword">function</span>')
                .replace(/class/g, '<span class="c-keyword">class</span>')
                .replace(/require/g, '<span class="c-func">require</span>')
                .replace(/console.log/g, '<span class="c-func">console.log</span>')
                .replace(/process.exit/g, '<span class="c-func">process.exit</span>')
                .replace(/"([^"]*)"/g, '<span class="c-string">"$1"</span>');
                
            line.innerHTML = `<div class="output">${htmlContent}</div>`;
            termBody.appendChild(line);
            termBody.scrollTop = termBody.scrollHeight;
            await sleep(150); // 日志输出的微小停顿
        }

        // 进度条模拟
        async function runProgressBar(label, duration = 1500) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<div class="output"><span class="c-comment">${label}</span> <span class="progress-bar"><div class="progress-fill"></div></span><span class="progress-text">0%</span></div>`;
            termBody.appendChild(line);
            
            const fill = line.querySelector('.progress-fill');
            const text = line.querySelector('.progress-text');
            
            for (let i = 0; i <= 100; i += 5) {
                fill.style.width = i + '%';
                text.textContent = i + '%';
                termBody.scrollTop = termBody.scrollHeight;
                await sleep(duration / 20);
            }
            text.textContent = '完成';
        }

        // 简单延迟
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ==========================================
        // 主执行流程
        // ==========================================
        
        async function executeProgram() {
            await sleep(500); // 初始加载等待

            // 1. 初始化
            await typeCommand('git checkout -b final_goodbye', 35);
            await printLog('Switched to a new branch \'final_goodbye\'');
            await sleep(800);

            await typeCommand('node questionnaire_analysis.js', 35);
            await printLog('[INFO] 正在加载 127 份真实样本...');
            await sleep(600);
            await printLog('[INFO] 解析数据中...');
            await sleep(800);

            // 2. 数据呈现
            await printLog('==================================================');
            await printLog('数据剖析结果：');
            await printLog('原来，42.5% 的青春，都会输给“圈子不同”。');
            await printLog('原来，46.5% 的旧友，最终都会走向“随缘”。');
            await printLog('原来，无论异性还是同性，都有 22.0% 的概率，最终变成“熟悉的陌生人”。');
            await printLog('==================================================');
            await sleep(1000);

            // 3. 情绪处理
            await typeCommand('python manage_emotions.py', 35);
            await printLog('[DEBUG] Scanning for unsent birthday gifts...');
            await sleep(800);
            await printLog('[WARN] 警告：检测到未发送的报告数据，发送可能导致关系系统崩溃。');
            await sleep(1000);
            await printLog('[INFO] 正在执行回滚操作 (rollback)...');
            await sleep(600);
            await printLog('[SUCCESS] 已删除发送企图。保留过去三年真挚数据。');
            await sleep(800);

            // 4. 内心独白（特殊输出）
            const monologue = [
                '不用冰冷的数据去覆盖曾经真挚的三年，',
                '不让你看到我深夜内耗的偏执，',
                '是我能给你，也能给我自己，最后的温柔。'
            ];
            for (let line of monologue) {
                await printLog('> ' + line);
                await sleep(500);
            }
            await sleep(1000);

            // 5. 重新编译人生
            await typeCommand('bash start_new_life.sh', 35);
            await printLog('[INFO] 正在编译新的未来...');
            await runProgressBar('[====================] 进度:', 2000);
            await sleep(500);
            await printLog('[SUCCESS] 编译完成，版本号：v2.0.0');
            await sleep(500);

            await printLog('> class NewLife {');
            await printLog('>   constructor() {');
            await printLog('>     this.role = "自己的主角";');
            await printLog('>     this.location = "重点高中";');
            await printLog('>   }');
            await printLog('>   sail() {');
            await printLog('>     console.log("生日快乐，我曾经在乎的女孩。");');
            await printLog('>     console.log("这艘船曾在你港湾停靠，现在，它要去征服自己的海域了。");');
            await printLog('>   }');
            await printLog('> }');
            await sleep(800);

            await typeCommand('node start_new_life.js', 35);
            await printLog('[INFO] 执行新实例...');
            await sleep(500);
            await printLog('生日快乐，我曾经在乎的女孩。');
            await printLog('这艘船曾在你港湾停靠，现在，它要去征服自己的海域了。');
            await sleep(1000);

            // 6. 完美退出
            await printLog('[INFO] 正在退出旧进程...');
            await sleep(800);
            await printLog('System.exit(0); // 进程正常终止，状态：已释怀');
            await sleep(1000);
            await printLog('状态：剧本杀青。');
            await sleep(500);

            // 最后的闪烁光标
            const finalLine = document.createElement('div');
            finalLine.className = 'line';
            finalLine.innerHTML = `<div class="prompt"></div><div class="output"><span class="cursor"></span></div>`;
            termBody.appendChild(finalLine);
            termBody.scrollTop = termBody.scrollHeight;
        }

        // 启动程序
        window.onload = executeProgram;
    </script>
</body>
</html>
