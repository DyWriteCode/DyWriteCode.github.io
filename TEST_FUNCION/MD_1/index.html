<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园人际交往与倾诉习惯调查问卷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --primary:#2563eb; --primary-hover:#1d4ed8;
    --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
    --ok-bg:#f0fdf4; --ok-fg:#15803d; --ok-bd:#86efac;
    --er-bg:#fef2f2; --er-fg:#b91c1c; --er-bd:#fca5a5;
    --pd-bg:#eff6ff; --pd-fg:#1d4ed8; --pd-bd:#93c5fd;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 16px 80px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.65;
  }
  .container{max-width:800px;margin:0 auto}

  details.panel{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    margin-bottom:16px;overflow:hidden;
  }
  details.panel>summary{
    cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel>summary::after{content:"▾";margin-left:auto;transition:.2s;color:var(--muted)}
  details.panel[open]>summary::after{transform:rotate(180deg)}
  .panel-body{padding:0 18px 18px;border-top:1px solid var(--border)}

  label{display:block;margin:12px 0 4px;font-size:14px;font-weight:500}
  input[type=text],input[type=password],input[type=email],textarea,select{
    width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;outline:none;transition:.15s;
    color:var(--text);
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)
  }
  select{cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}

  button{
    padding:9px 18px;border:none;border-radius:8px;background:var(--primary);color:#fff;
    font-size:14px;font-weight:500;cursor:pointer;transition:.15s;font-family:inherit;
  }
  button:hover:not(:disabled){background:var(--primary-hover)}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--er-fg);border:1px solid var(--er-bd);padding:4px 10px;font-size:12px}
  button.ghost:hover{background:var(--er-bg)}
  button.small{padding:7px 14px;font-size:13px}
  button.outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  button.outline:hover:not(:disabled){background:rgba(37,99,235,.08)}
  .save-row{display:flex;align-items:center;gap:12px;margin-top:16px}
  #configStatus{color:var(--ok-fg);font-size:13px}

  h1{font-size:22px;margin:28px 0 8px}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:20px}

  fieldset.question{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin:0 0 14px;
  }
  fieldset.question legend{font-weight:600;font-size:15px;padding:0 6px;color:var(--text)}
  .q-num{color:var(--primary);margin-right:4px}
  .note{color:var(--muted);font-weight:400;font-size:13px}
  .option{
    display:flex;align-items:flex-start;gap:10px;padding:9px 12px;margin:6px 0;
    border-radius:8px;cursor:pointer;font-size:14px;transition:.12s;font-weight:400;
  }
  .option:hover{background:#f8fafc}
  .option input{margin-top:3px;flex-shrink:0;accent-color:var(--primary);cursor:pointer}
  textarea{resize:vertical;min-height:90px;margin-top:8px}

  .extra-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
  .extra-field{margin:14px 0}

  #result{
    display:none;margin-top:20px;padding:14px 16px;border-radius:10px;
    font-size:14px;white-space:pre-wrap;word-break:break-word;border:1px solid;
  }
  #result.ok{display:block;background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
  #result.er{display:block;background:var(--er-bg);color:var(--er-fg);border-color:var(--er-bd)}
  #result.pd{display:block;background:var(--pd-bg);color:var(--pd-fg);border-color:var(--pd-bd)}

  .submit-row{text-align:center;margin-top:24px}
  .submit-row button{padding:12px 48px;font-size:15px}

  /* Token 行 */
  .token-row{display:flex;gap:8px;align-items:stretch}
  .token-row>input{flex:1}
  .token-status{
    display:none;margin-top:8px;padding:8px 12px;border-radius:8px;
    font-size:13px;border:1px solid;
  }
  .token-status.visible{display:block}
  .token-status.loading{background:var(--pd-bg);color:var(--pd-fg);border-color:var(--pd-bd)}
  .token-status.success{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
  .token-status.error{background:var(--er-bg);color:var(--er-fg);border-color:var(--er-bd)}
  .token-status .user-info{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .token-status .user-avatar{
    width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--border);
  }
  .token-status .username{font-weight:600}

  /* 密码解密块 */
  .pwd-box{
    margin-top:14px;border:1.5px dashed var(--border);border-radius:10px;
    padding:12px 14px;background:#f8fafc;transition:.2s;
  }
  .pwd-box:hover{border-color:var(--primary)}
  .pwd-header{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
    color:var(--text);cursor:pointer;user-select:none;
  }
  .pwd-toggle{font-size:11px;color:var(--muted);transition:transform .25s}
  .pwd-toggle.open{transform:rotate(90deg)}
  .pwd-body{
    display:none;margin-top:12px;flex-direction:column;gap:10px;
  }
  .pwd-body.open{display:flex}
  .pwd-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pwd-input-wrap{flex:1;min-width:160px;position:relative}
  .pwd-input-wrap input{width:100%;padding-right:36px}
  .pwd-eye{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;font-size:16px;color:var(--muted);
    cursor:pointer;padding:4px;border-radius:4px;
  }
  .pwd-eye:hover{background:var(--border)}
  .pwd-status{
    display:none;padding:8px 12px;border-radius:8px;font-size:13px;
    border:1px solid;
  }
  .pwd-status.visible{display:block}
  .pwd-status.loading{background:var(--pd-bg);color:var(--pd-fg);border-color:var(--pd-bd)}
  .pwd-status.success{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
  .pwd-status.error{background:var(--er-bg);color:var(--er-fg);border-color:var(--er-bd)}
  .pwd-hint{font-size:12px;color:var(--muted)}

  /* 仓库信息 */
  .repo-info{
    margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;
    background:#f8fafc;border:1px solid var(--border);color:var(--muted);
    min-height:36px;display:flex;align-items:center;
  }
  .repo-info.filled{color:var(--text)}
</style>
</head>
<body>
<div class="container">

  <!-- ========== 配置面板 ========== -->
  <details class="panel" id="configPanel" open>
    <summary>⚙️ GitHub 配置（首次使用请填写，保存在本机浏览器）</summary>
    <div class="panel-body">

      <!-- —— Token 输入 —— -->
      <label>🔑 Personal Access Token <span style="color:var(--er-fg)">*</span></label>
      <div class="token-row">
        <input type="password" id="cfgToken" placeholder="github_pat_... 或 ghp_..." autocomplete="off">
        <button type="button" class="outline small" id="toggleTokenVisibility">👁 显示</button>
        <button type="button" class="small" id="btnVerifyToken">🔍 验证</button>
      </div>
      <div class="token-status" id="tokenStatus"></div>

      <!-- —— 密码解密 Token —— -->
      <div class="pwd-box">
        <div class="pwd-header" id="pwdToggleHeader">
          <span>🔐 通过密码获取 Token</span>
          <span class="pwd-toggle" id="pwdToggleIcon">▶</span>
          <span style="font-weight:400;font-size:12px;color:var(--muted);margin-left:auto;">
            密码仅在本地解密，不上传
          </span>
        </div>
        <div class="pwd-body" id="pwdBody">
          <div class="pwd-row">
            <div class="pwd-input-wrap">
              <input type="password" id="pwdInput" placeholder="请输入解密密码" autocomplete="off">
              <button type="button" class="pwd-eye" id="pwdEyeBtn" title="显示/隐藏">👁</button>
            </div>
            <button type="button" class="small" id="pwdGetTokenBtn">🔑 获取 Token</button>
            <button type="button" class="outline small" id="pwdClearBtn">✕ 清空</button>
          </div>
          <div class="pwd-status" id="pwdStatus"></div>
          <div class="pwd-hint">💡 使用内置密文 + AES-CBC 10 轮解密，完成后自动填入 Token 并验证。</div>
        </div>
      </div>

      <!-- —— Owner + Repo（选项卡风格）—— -->
      <div class="row">
        <div>
          <label>👤 所有者 Owner <span style="color:var(--er-fg)">*</span></label>
          <input type="text" id="cfgOwner" placeholder="验证 Token 后自动填充" autocomplete="off">
        </div>
        <div>
          <label>📦 仓库名 Repo <span style="color:var(--er-fg)">*</span></label>
          <input type="text" id="cfgRepo" list="repoDatalist"
                 placeholder="选择或手动输入" autocomplete="off">
          <datalist id="repoDatalist"></datalist>
        </div>
      </div>
      <div class="repo-info" id="repoInfo">📋 请先验证 Token 以加载仓库列表</div>

      <!-- —— 分支 + 路径 —— -->
      <div class="row">
        <div>
          <label>🌿 分支 Branch</label>
          <select id="cfgBranch">
            <option value="">— 请先选择仓库 —</option>
          </select>
        </div>
        <div>
          <label>📁 保存路径（目录）</label>
          <input type="text" id="cfgPath" value="submissions">
        </div>
      </div>

      <label>📝 文件名前缀</label>
      <input type="text" id="cfgPrefix" value="survey">

      <div class="save-row">
        <button type="button" id="saveConfigBtn">保存配置</button>
        <span id="configStatus"></span>
      </div>
    </div>
  </details>

  <!-- ========== 附加字段 ========== -->
  <details class="panel" id="extraPanel">
    <summary>📋 附加信息字段（自定义需要随问卷一起收集的内容）</summary>
    <div class="panel-body">
      <p style="color:var(--muted);font-size:13px;margin:12px 0 8px">
        例如「姓名」「班级」「学号」。添加后，答题者会在问卷末尾看到对应输入框。
      </p>
      <div id="extraList"></div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="extraNameInput" placeholder="字段名，例如：姓名">
        <button type="button" id="addExtraBtn">添加字段</button>
      </div>
    </div>
  </details>

  <!-- ========== 问卷 ========== -->
  <form id="surveyForm" novalidate>
    <h1>校园人际交往与倾诉习惯调查问卷</h1>
    <p class="subtitle">本问卷用于了解中学生对旧友谊与倾诉习惯的真实想法，感谢你的参与。</p>

    <div id="questionsContainer"></div>
    <div id="extraFieldsForm"></div>

    <div class="submit-row">
      <button type="submit" id="submitBtn">提交问卷</button>
    </div>
    <div id="result"></div>
  </form>

</div>

var FIXED_IV = CryptoJS.enc.Utf8.parse('0123456789abcdef');

function multiDecrypt(ciphertext, password, times) {
  var data = ciphertext.trim();
  if (!data) throw new Error('密文为空');
  for (var i = 0; i < times; i++) {
    try {
      var decrypted = CryptoJS.AES.decrypt(data, password, {
        iv: FIXED_IV,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
      });
      if (decrypted.sigBytes === 0) throw new Error('第 ' + (i + 1) + ' 次解密结果为空');
      if (i === times - 1) {
        var result = decrypted.toString(CryptoJS.enc.Utf8);
        if (result === '') {
          var latin = decrypted.toString(CryptoJS.enc.Latin1);
          if (latin) throw new Error('最终明文 UTF-8 解码为空，Latin1 解码为: ' + latin);
          throw new Error('最终明文无法解码（sigBytes=' + decrypted.sigBytes + '）');
        }
        data = result;
      } else {
        data = decrypted.toString(CryptoJS.enc.Utf8);
      }
    } catch (e) {
      throw new Error('第 ' + (i + 1) + ' 次解密失败: ' + e.message);
    }
  }
  return data;

/* ============================================================
 *  2. 本地存储
 * ============================================================ */
const CFG_KEY = 'gh-survey-config';
const EXT_KEY = 'gh-survey-extra-fields';
const loadConfig = () => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch { return {}; } };
const saveConfig = c => localStorage.setItem(CFG_KEY, JSON.stringify(c));
const loadExtra = () => { try { return JSON.parse(localStorage.getItem(EXT_KEY)) || []; } catch { return []; } };
const saveExtra = a => localStorage.setItem(EXT_KEY, JSON.stringify(a));

/* ============================================================
 *  3. GitHub API 请求（简化版）
 * ============================================================ */
async function ghFetch(url, options = {}) {
  const res = await fetch(url, options);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const msg = (data && data.message) || res.statusText || ('HTTP ' + res.status);
    const err = new Error(msg);
    err.status = res.status;
    err.body = data;
    throw err;
  }
  return data;
}

/* ============================================================
 *  4. 渲染问卷
 * ============================================================ */
function renderQuestions() {
  const box = document.getElementById('questionsContainer');
  box.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const fs = document.createElement('fieldset');
    fs.className = 'question';
    const legend = document.createElement('legend');
    legend.innerHTML = `<span class="q-num">${idx + 1}.</span>${q.title}`
      + (q.note ? ` <span class="note">（${q.note}）</span>` : '');
    fs.appendChild(legend);

    if (q.type === 'single' || q.type === 'multiple') {
      q.options.forEach(opt => {
        const label = document.createElement('label');
        label.className = 'option';
        const input = document.createElement('input');
        input.type = q.type === 'single' ? 'radio' : 'checkbox';
        input.name = q.id;
        input.value = opt.value;
        const span = document.createElement('span');
        span.textContent = `${opt.value}. ${opt.label}`;
        label.appendChild(input);
        label.appendChild(span);
        fs.appendChild(label);
      });
    } else if (q.type === 'textarea') {
      const ta = document.createElement('textarea');
      ta.name = q.id;
      ta.rows = 4;
      ta.placeholder = q.placeholder || '请填写…';
      fs.appendChild(ta);
    }
    box.appendChild(fs);
  });
}

/* ============================================================
 *  5. 附加字段
 * ============================================================ */
function renderExtra() {
  const listBox = document.getElementById('extraList');
  const formBox = document.getElementById('extraFieldsForm');
  const fields = loadExtra();
  listBox.innerHTML = '';
  formBox.innerHTML = '';

  if (fields.length === 0) {
    listBox.innerHTML = '<div style="color:var(--muted);font-size:13px">暂未添加任何附加字段。</div>';
    return;
  }

  fields.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'extra-row';
    const span = document.createElement('span');
    span.textContent = `• ${name}`;
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'ghost';
    del.textContent = '删除';
    del.onclick = () => {
      const arr = loadExtra();
      arr.splice(i, 1);
      saveExtra(arr);
      renderExtra();
    };
    row.appendChild(span);
    row.appendChild(del);
    listBox.appendChild(row);

    const wrap = document.createElement('div');
    wrap.className = 'extra-field';
    const lab = document.createElement('label');
    lab.textContent = name;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = `请填写${name}`;
    inp.dataset.extraIdx = i;
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    formBox.appendChild(wrap);
  });
}

/* ============================================================
 *  6. 工具函数
 * ============================================================ */
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function timestamp(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`
       + `-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function showResult(kind, msg) {
  const el = document.getElementById('result');
  el.className = kind === 'ok' ? 'ok' : kind === 'er' ? 'er' : 'pd';
  el.textContent = msg;
}
function escapePath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}
function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ============================================================
 *  7. Token 验证 + 仓库/分支加载
 * ============================================================ */
let repoList = [];
let currentUser = null;

function setTokenStatus(type, html) {
  const el = document.getElementById('tokenStatus');
  el.className = 'token-status visible ' + type;
  el.innerHTML = html;
}
function hideTokenStatus() {
  document.getElementById('tokenStatus').classList.remove('visible');
}

async function verifyToken() {
  const token = document.getElementById('cfgToken').value.trim();
  if (!token) {
    setTokenStatus('error', '⚠️ 请先输入 Token');
    return false;
  }
  setTokenStatus('loading', '⏳ 正在验证 Token…');
  try {
    const user = await ghFetch('https://api.github.com/user', {
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json'
      }
    });
    currentUser = user;

    // 自动填充 owner
    document.getElementById('cfgOwner').value = user.login;

    setTokenStatus('success',
      `<div class="user-info">
        ${user.avatar_url ? `<img class="user-avatar" src="${escapeHtml(user.avatar_url)}" alt="">` : ''}
        <span>✅ 已验证：<span class="username">@${escapeHtml(user.login)}</span></span>
        ${user.name ? `<span style="color:var(--muted)">${escapeHtml(user.name)}</span>` : ''}
      </div>`);

    await loadUserRepos();
    return true;
  } catch (err) {
    setTokenStatus('error', '❌ Token 验证失败：' + escapeHtml(err.message));
    return false;
  }
}

async function loadUserRepos() {
  const token = document.getElementById('cfgToken').value.trim();
  if (!token) return;
  try {
    const repos = await ghFetch(
      'https://api.github.com/user/repos?per_page=100&sort=updated&type=all',
      { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } }
    );
    repoList = repos.map(r => ({
      name: r.name,
      description: r.description || '',
      default_branch: r.default_branch || 'main'
    }));
    const dl = document.getElementById('repoDatalist');
    dl.innerHTML = '';
    repoList.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.name;
      if (r.description) opt.label = r.description;
      dl.appendChild(opt);
    });
    document.getElementById('repoInfo').innerHTML =
      `📋 已加载 <strong>${repoList.length}</strong> 个仓库，点击输入框选择或手动输入。`;
    document.getElementById('repoInfo').classList.add('filled');
  } catch (err) {
    document.getElementById('repoInfo').textContent = '⚠️ 加载仓库列表失败：' + err.message;
  }
}

async function updateRepoInfoAndBranches() {
  const repoName = document.getElementById('cfgRepo').value.trim();
  const owner = document.getElementById('cfgOwner').value.trim();
  const infoEl = document.getElementById('repoInfo');
  const branchSel = document.getElementById('cfgBranch');

  if (!repoName) {
    infoEl.textContent = '📋 请先验证 Token 以加载仓库列表';
    infoEl.classList.remove('filled');
    branchSel.innerHTML = '<option value="">— 请先选择仓库 —</option>';
    return;
  }

  const found = repoList.find(r => r.name === repoName);
  if (found && found.description) {
    infoEl.innerHTML = `📋 简介：${escapeHtml(found.description)}`;
    infoEl.classList.add('filled');
  } else {
    infoEl.textContent = '📋 正在加载仓库信息…';
  }

  if (!owner) {
    branchSel.innerHTML = '<option value="">— 请先填写 Owner —</option>';
    return;
  }

  branchSel.innerHTML = '<option value="">加载中…</option>';
  try {
    const branches = await ghFetch(
      `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repoName)}/branches`,
      { headers: { 'Authorization': 'Bearer ' + document.getElementById('cfgToken').value.trim(), 'Accept': 'application/vnd.github+json' } }
    );
    branchSel.innerHTML = '';
    branches.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.name;
      opt.textContent = b.name;
      branchSel.appendChild(opt);
    });
    const defaultBranch = found ? found.default_branch : (branches[0] && branches[0].name);
    if (defaultBranch && branches.some(b => b.name === defaultBranch)) {
      branchSel.value = defaultBranch;
    } else if (branches.length) {
      branchSel.value = branches[0].name;
    }
  } catch (err) {
    branchSel.innerHTML = `<option value="">⚠️ 加载失败：${escapeHtml(err.message)}</option>`;
  }
}

/* ============================================================
 *  8. 密码解密 Token
 * ============================================================ */
function setPwdStatus(type, text) {
  const el = document.getElementById('pwdStatus');
  el.className = 'pwd-status visible ' + type;
  el.textContent = text;
}
function hidePwdStatus() {
  document.getElementById('pwdStatus').classList.remove('visible');
}
function togglePwdBody() {
  const body = document.getElementById('pwdBody');
  const icon = document.getElementById('pwdToggleIcon');
  body.classList.toggle('open');
  icon.classList.toggle('open');
  if (body.classList.contains('open')) document.getElementById('pwdInput').focus();
}

function handlePwdGetToken() {
  const password = document.getElementById('pwdInput').value;
  if (!password) {
    setPwdStatus('error', '⚠️ 请输入密码');
    return;
  }
  const btn = document.getElementById('pwdGetTokenBtn');
  btn.disabled = true;
  setPwdStatus('loading', '🔐 正在解密…（共 10 轮，请稍候）');

  setTimeout(async () => {
    try {
      let token = multiDecrypt(CIPHER_TEXT, password, 10);
      token = token.trim();

      if (token && (token.startsWith('github_pat_') || token.startsWith('ghp_')) && token.length >= 40) {
        const inp = document.getElementById('cfgToken');
        inp.value = token;
        inp.type = 'text';

        setPwdStatus('success', '✅ 解密成功！Token 已填入，正在自动验证…');

        // 自动验证并加载仓库列表
        const ok = await verifyToken();
        if (ok) {
          setPwdStatus('success', '✅ Token 有效，仓库列表已加载，请选择仓库。');
        } else {
          setPwdStatus('error', '⚠️ Token 已填入，但验证失败，请检查权限。');
        }
      } else {
        setPwdStatus('error', '❌ 解密结果不是有效的 GitHub Token（前缀或长度不符），请检查密码。');
      }
    } catch (err) {
      setPwdStatus('error', '❌ 解密失败：' + (err.message || '未知错误'));
    } finally {
      btn.disabled = false;
    }
  }, 30);
}

/* ============================================================
 *  9. 收集 & 提交
 * ============================================================ */
function collectAnswers() {
  const answers = {};
  for (const q of QUESTIONS) {
    if (q.type === 'single') {
      const checked = document.querySelector(`input[name="${q.id}"]:checked`);
      if (!checked) return { error: `第 ${QUESTIONS.indexOf(q) + 1} 题未作答` };
      const opt = q.options.find(o => o.value === checked.value);
      answers[q.id] = { value: opt.value, label: opt.label };
    } else if (q.type === 'multiple') {
      const checked = document.querySelectorAll(`input[name="${q.id}"]:checked`);
      answers[q.id] = Array.from(checked).map(c => {
        const opt = q.options.find(o => o.value === c.value);
        return { value: opt.value, label: opt.label };
      });
    } else if (q.type === 'textarea') {
      const ta = document.querySelector(`[name="${q.id}"]`);
      answers[q.id] = ta ? ta.value.trim() : '';
    }
  }
  const extra = {};
  loadExtra().forEach((name, i) => {
    const inp = document.querySelector(`[data-extra-idx="${i}"]`);
    extra[name] = inp ? inp.value.trim() : '';
  });
  return { answers, extra };
}

async function handleSubmit(e) {
  e.preventDefault();

  // 优先读表单里当前的值，避免用户忘了点"保存配置"
  const cfg = {
    token: document.getElementById('cfgToken').value.trim(),
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    branch: document.getElementById('cfgBranch').value || '',
    path: document.getElementById('cfgPath').value.trim() || 'submissions',
    prefix: document.getElementById('cfgPrefix').value.trim() || 'survey'
  };

  if (!cfg.token || !cfg.owner || !cfg.repo || !cfg.branch) {
    showResult('er', '❌ 请先在顶部「GitHub 配置」面板中完整填写 Token、Owner、仓库和分支。');
    document.getElementById('configPanel').open = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const collected = collectAnswers();
  if (collected.error) {
    showResult('er', `❌ ${collected.error}`);
    return;
  }

  const now = new Date();
  const payload = {
    submittedAt: now.toISOString(),
    answers: collected.answers,
    extra: collected.extra,
    meta: {
      page: location.href,
      userAgent: navigator.userAgent,
      referrer: document.referrer || null
    }
  };

  const base64 = toBase64(JSON.stringify(payload, null, 2));
  const dir = cfg.path.replace(/^\/+|\/+$/g, '');
  const prefix = cfg.prefix.replace(/[\/\\:*?"<>|]/g, '-');
  const filename = `${prefix}-${timestamp(now)}-${Math.random().toString(36).slice(2, 8)}.json`;
  const fullPath = dir ? `${dir}/${filename}` : filename;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  showResult('pd', '⏳ 正在提交，请稍候…');

  try {
    const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${escapePath(fullPath)}`;
    const data = await ghFetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${cfg.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      body: JSON.stringify({
        message: `问卷提交 ${timestamp(now)}`,
        content: base64,
        branch: cfg.branch
      })
    });

    showResult('ok',
      `✅ 提交成功！\n` +
      `文件路径：${data.content.path}\n` +
      `提交时间：${now.toLocaleString('zh-CN')}\n` +
      `可以到 GitHub 仓库里查看结果。`
    );
    document.getElementById('surveyForm').reset();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  } catch (err) {
    let hint = '';
    if (err.status === 401) hint = '（Token 无效或已过期）';
    else if (err.status === 403) hint = '（Token 权限不足或速率受限）';
    else if (err.status === 404) hint = '（仓库/分支不存在，或 Token 无权限）';
    else if (err.status === 422) hint = '（分支不存在或文件冲突）';
    showResult('er', `❌ 提交失败：${err.message} ${hint}`);
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
 *  10. 初始化
 * ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const cfg = loadConfig();
  if (cfg.token) document.getElementById('cfgToken').value = cfg.token;
  if (cfg.owner) document.getElementById('cfgOwner').value = cfg.owner;
  if (cfg.repo) document.getElementById('cfgRepo').value = cfg.repo;
  if (cfg.branch) {
    const sel = document.getElementById('cfgBranch');
    // 如果分支下拉里还没有这个选项，先临时加上
    const opt = document.createElement('option');
    opt.value = cfg.branch;
    opt.textContent = cfg.branch;
    sel.appendChild(opt);
    sel.value = cfg.branch;
  }
  document.getElementById('cfgPath').value = cfg.path || 'submissions';
  document.getElementById('cfgPrefix').value = cfg.prefix || 'survey';

  if (!cfg.token || !cfg.owner || !cfg.repo) {
    document.getElementById('configPanel').open = true;
  }

  renderQuestions();
  renderExtra();

  /* —— 配置区 —— */
  document.getElementById('saveConfigBtn').addEventListener('click', () => {
    saveConfig({
      token: document.getElementById('cfgToken').value.trim(),
      owner: document.getElementById('cfgOwner').value.trim(),
      repo: document.getElementById('cfgRepo').value.trim(),
      branch: document.getElementById('cfgBranch').value || '',
      path: document.getElementById('cfgPath').value.trim() || 'submissions',
      prefix: document.getElementById('cfgPrefix').value.trim() || 'survey'
    });
    const s = document.getElementById('configStatus');
    s.textContent = '✓ 已保存';
    setTimeout(() => s.textContent = '', 2000);
  });

  /* —— Token 显示切换 —— */
  document.getElementById('toggleTokenVisibility').addEventListener('click', function () {
    const inp = document.getElementById('cfgToken');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    this.textContent = showing ? '👁 显示' : '🙈 隐藏';
  });

  /* —— Token 验证 —— */
  document.getElementById('btnVerifyToken').addEventListener('click', verifyToken);

  /* —— 密码解密 —— */
  document.getElementById('pwdToggleHeader').addEventListener('click', togglePwdBody);
  document.getElementById('pwdGetTokenBtn').addEventListener('click', handlePwdGetToken);
  document.getElementById('pwdInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); handlePwdGetToken(); }
  });
  document.getElementById('pwdEyeBtn').addEventListener('click', function () {
    const inp = document.getElementById('pwdInput');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    this.textContent = showing ? '👁' : '🙈';
  });
  document.getElementById('pwdClearBtn').addEventListener('click', () => {
    document.getElementById('pwdInput').value = '';
    hidePwdStatus();
    document.getElementById('pwdInput').focus();
  });

  /* —— 仓库选择后自动加载分支 —— */
  let repoTimer;
  document.getElementById('cfgRepo').addEventListener('input', () => {
    clearTimeout(repoTimer);
    repoTimer = setTimeout(updateRepoInfoAndBranches, 400);
  });
  document.getElementById('cfgRepo').addEventListener('change', updateRepoInfoAndBranches);
  document.getElementById('cfgOwner').addEventListener('change', updateRepoInfoAndBranches);

  /* —— 附加字段 —— */
  document.getElementById('addExtraBtn').addEventListener('click', () => {
    const input = document.getElementById('extraNameInput');
    const name = input.value.trim();
    if (!name) return;
    const arr = loadExtra();
    if (arr.includes(name)) { alert('该字段已存在'); return; }
    arr.push(name);
    saveExtra(arr);
    input.value = '';
    renderExtra();
  });
  document.getElementById('extraNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addExtraBtn').click(); }
  });

  /* —— 提交 —— */
  document.getElementById('surveyForm').addEventListener('submit', handleSubmit);

  /* —— 恢复已保存的 Token 时，自动验证并加载仓库列表 —— */
  if (cfg.token) {
    setTimeout(() => verifyToken(), 300);
  }
});
