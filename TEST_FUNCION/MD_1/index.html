<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>终极 MD 编辑器 · 中文输出修复</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css?v=20260819062539" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css?v=20260819062539" />
    <link rel="stylesheet" href="style.css?v=20260819062539" />
</head>

<body>

    <div class="app">
        <header class="app-header">
            <div class="logo">📝 <span>MD</span>编辑器 <small>· 中文修复</small></div>
            <div class="actions">
                <button onclick="openMathBuilder()" title="图形化公式构建器">🧮 公式构建器</button>
                <button onclick="toggleMathPanel()" title="符号面板">🔣</button>
                <button onclick="clearAll()">清空</button>
                <button class="btn-primary" onclick="exportHTML()">导出</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="group">
                <button onclick="insertWrapAtCursor('## ','\n')">H2</button>
                <button onclick="insertWrapAtCursor('### ','\n')">H3</button>
                <button onclick="insertWrapAtCursor('#### ','\n')">H4</button>
            </div>
            <div class="group">
                <button onclick="insertWrapAtCursor('**','**')"><b>B</b></button>
                <button onclick="insertWrapAtCursor('*','*')"><i>I</i></button>
                <button onclick="insertWrapAtCursor('~~','~~')"><s>S</s></button>
                <button onclick="insertWrapAtCursor('`','`')"><code>∫</code></button>
            </div>
            <div class="group">
                <button onclick="insertListAtCursor('ul')">• 列表</button>
                <button onclick="insertListAtCursor('ol')">1. 列表</button>
                <button onclick="insertWrapAtCursor('> ','\n')">" 引用</button>
            </div>
            <div class="group">
                <button onclick="insertCodeBlockAtCursor()">&lt;/&gt; 代码</button>
                <select id="codeLangSelect">
                    <option value="">自动</option>
                    <option value="javascript">JavaScript (Node.js)</option>
                    <option value="python">Python (3.8.1)</option>
                    <option value="java">Java (OpenJDK 13.0.1)</option>
                    <option value="cpp">C++ (GCC 9.2.0)</option>
                    <option value="c">C (GCC 9.2.0)</option>
                    <option value="csharp">C# (Mono 6.6.0.161)</option>
                    <option value="go">Go (1.13.5)</option>
                    <option value="rust">Rust (1.40.0)</option>
                    <option value="php">PHP (7.4.1)</option>
                    <option value="ruby">Ruby (2.7.0)</option>
                    <option value="bash">Bash (5.0.0)</option>
                    <option value="swift">Swift (5.2.3)</option>
                    <option value="kotlin">Kotlin (1.3.70)</option>
                </select>
            </div>
            <div class="group">
                <button onclick="insertMathInlineAtCursor()">∑ 行内</button>
                <button onclick="insertMathBlockAtCursor()">∑ 块级</button>
                <span class="math-templates">
                    <button onclick="quickMath('frac')">分数</button>
                    <button onclick="quickMath('sqrt')">根号</button>
                    <button onclick="quickMath('sum')">求和</button>
                    <button onclick="quickMath('int')">积分</button>
                    <button onclick="quickMath('matrix')">矩阵</button>
                </span>
            </div>
            <div class="group">
                <button onclick="insertTableAtCursor()">▦ 表格</button>
                <button onclick="insertLinkAtCursor()">🔗 链接</button>
                <button onclick="insertImageAtCursor()">🖼 图片</button>
            </div>
            <div class="group">
                <button onclick="insertHrAtCursor()">— —</button>
            </div>
        </div>

        <div class="preview-area" id="previewArea">
            <div class="markdown-body" id="preview"></div>
        </div>

        <div class="status-bar">
            <span><span class="dot"></span> 实时</span>
            <span id="statusInfo">行 1 · 字 0</span>
        </div>
    </div>

    <!-- 浮动元素 -->
    <div class="suggest-box" id="suggestBox"></div>
    <div class="math-panel" id="mathPanel"></div>
    <div class="context-menu" id="contextMenu">
        <div class="menu-item" data-action="h2?v=20260819062539">## 标题2</div>
        <div class="menu-item" data-action="h3?v=20260819062539">### 标题3</div>
        <div class="menu-item" data-action="h4?v=20260819062539">#### 标题4</div>
        <div class="menu-divider"></div>
        <div class="menu-item" data-action="list-ul?v=20260819062539">• 无序列表</div>
        <div class="menu-item" data-action="list-ol?v=20260819062539">1. 有序列表</div>
        <div class="menu-item" data-action="quote?v=20260819062539">" 引用</div>
        <div class="menu-divider"></div>
        <div class="menu-item" data-action="code-block?v=20260819062539">&lt;/&gt; 代码块</div>
        <div class="menu-item" data-action="math-inline?v=20260819062539">∑ 行内公式</div>
        <div class="menu-item" data-action="math-block?v=20260819062539">∑ 块级公式</div>
        <div class="menu-divider"></div>
        <div class="menu-item" data-action="table?v=20260819062539">▦ 表格</div>
        <div class="menu-item" data-action="link?v=20260819062539">🔗 链接</div>
        <div class="menu-item" data-action="image?v=20260819062539">🖼 图片</div>
        <div class="menu-divider"></div>
        <div class="menu-item" data-action="hr?v=20260819062539">— — 分割线</div>
        <div class="menu-divider"></div>
        <div class="menu-item" data-action="cancel-edit?v=20260819062539">✖ 取消编辑</div>
    </div>

    <!-- 公式构建器 -->
    <div class="math-builder" id="mathBuilder">
        <div class="builder-header">
            <h3>🧮 公式构建器（零 LaTeX）</h3>
            <button onclick="closeMathBuilder()"
                style="background:transparent;border:none;font-size:1.2rem;cursor:pointer;">✕</button>
        </div>
        <div class="builder-body">
            <div class="symbol-palette" id="symbolPalette"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
                <div class="formula-preview" id="formulaPreview">点击左侧符号构建公式</div>
                <div class="formula-params" id="formulaParams"></div>
                <div style="display:flex;gap:8px;justify-content:flex-end;">
                    <button class="btn-cancel" onclick="closeMathBuilder()"
                        style="padding:4px 12px;border:none;border-radius:4px;background:#eef2f6;cursor:pointer;">取消</button>
                    <button id="insertFormulaBtn" class="btn-primary"
                        style="padding:4px 16px;border:none;border-radius:4px;background:var(--accent);color:white;cursor:pointer;">插入公式</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js?v=20260819062539">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.pack.min.js?v=20260819062539">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js?v=20260819062539">
    </script>

     <script src="index.js?v=20260819062539"></script>
</body>

</html>
