<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System.exit(0) - 青春毕业答卷</title>
    <style>
        :root {
            --bg: #0a0c10;
            --term-bg: #0d1117;
            --term-header: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --green: #3fb950;
            --blue: #58a6ff;
            --purple: #bc8cff;
            --yellow: #d29922;
            --red: #f85149;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: var(--font-mono);
        }

        .terminal-window {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--term-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            background: var(--term-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .window-controls { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .terminal-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-main);
            scroll-behavior: smooth;
        }

        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: var(--term-bg); }
        .terminal-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        .terminal-body::-webkit-scrollbar-thumb:hover { background: #484f58; }

        .line {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            animation: fadeIn 0.1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .prompt {
            color: var(--green);
            font-weight: bold;
            flex-shrink: 0;
            user-select: none;
        }

        .prompt::before {
            content: "➜  ";
            color: var(--text-muted);
        }

        .output {
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
        }

        /* 完整语法高亮色板 */
        .c-comment { color: #8b949e; font-style: italic; }
        .c-keyword { color: #ff7b72; } /* 关键字红色 */
        .c-string { color: #a5d6ff; }  /* 字符串蓝色 */
        .c-number { color: #79c0ff; }  /* 数字浅蓝 */
        .c-func { color: #d2a8ff; }    /* 函数紫色 */
        .c-operator { color: #ff7b72; }
        
        .log-info { color: #58a6ff; }
        .log-warn { color: #d29922; }
        .log-err { color: #f85149; }
        .log-success { color: #3fb950; }

        .data-highlight {
            color: #ff7b72;
            background: rgba(255, 123, 114, 0.1);
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .box-quote {
            border-left: 3px solid var(--blue);
            background: rgba(88, 166, 255, 0.05);
            padding: 12px 18px;
            border-radius: 0 8px 8px 0;
            margin: 10px 0;
            color: #a5d6ff;
            font-style: italic;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--green);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .progress-bar {
            display: inline-block;
            width: 250px;
            height: 14px;
            background: #21262d;
            border-radius: 7px;
            overflow: hidden;
            vertical-align: middle;
            margin-right: 10px;
            border: 1px solid #30363d;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--green);
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="window-controls">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-title">bash — final_goodbye_compilation — 120×40</div>
        </div>
        
        <div class="terminal-body" id="terminal-body">
            <!-- 内容由 JS 动态生成 -->
        </div>
    </div>

    <script>
        // ==========================================
        // 终端核心渲染引擎
        // ==========================================
        
        const termBody = document.getElementById('terminal-body');
        
        // 1. 模拟打字机输入（仅用于纯文本命令，无高亮代码）
        async function typeCommand(text, speed = 80) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<div class="prompt"></div><div class="output"></div>`;
            termBody.appendChild(line);
            
            const outputDiv = line.querySelector('.output');
            const cursorSpan = document.createElement('span');
            cursorSpan.className = 'cursor';
            outputDiv.appendChild(cursorSpan);

            for (let i = 0; i < text.length; i++) {
                outputDiv.textContent = text.substring(0, i + 1);
                outputDiv.appendChild(cursorSpan);
                termBody.scrollTop = termBody.scrollHeight;
                // 随机延迟，模拟真实键盘敲击
                await sleep(speed + Math.random() * 60);
            }
            
            cursorSpan.remove();
            outputDiv.textContent = text;
            await sleep(800); // 回车后的停顿
        }

        // 2. 模拟代码执行输出（支持完整的 HTML 语法高亮）
        async function printCode(code, delay = 400) {
            const line = document.createElement('div');
            line.className = 'line';
            // 将代码中的特殊 HTML 符号进行转义，避免影响渲染
            let safeCode = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // 正则替换，实现高亮
            // 注释
            safeCode = safeCode.replace(/\/\/.*/g, '<span class="c-comment">$&</span>');
            safeCode = safeCode.replace(/#.*/g, '<span class="c-comment">$&</span>');
            // 字符串
            safeCode = safeCode.replace(/"([^"]*)"/g, '<span class="c-string">"$1"</span>');
            safeCode = safeCode.replace(/'([^']*)'/g, '<span class="c-string">\'$1\'</span>');
            // 关键字
            const keywords = /\b(const|let|await|async|class|new|function|try|catch|return|if|else|for|process|require|console|log|warn|error|exit|this)\b/g;
            safeCode = safeCode.replace(keywords, '<span class="c-keyword">$1</span>');
            // 数字
            safeCode = safeCode.replace(/\b(\d+(\.\d+)?%?)\b/g, '<span class="c-number">$1</span>');
            // 数据高亮（特定词汇）
            safeCode = safeCode.replace(/(42\.5%|46\.5%|22\.0%|127)/g, '<span class="data-highlight">$1</span>');

            line.innerHTML = `<div class="output">${safeCode}</div>`;
            termBody.appendChild(line);
            termBody.scrollTop = termBody.scrollHeight;
            await sleep(delay);
        }

        // 3. 模拟日志输出（非代码，带颜色）
        async function printLog(text, type = 'info', delay = 500) {
            const line = document.createElement('div');
            line.className = 'line';
            let colorClass = 'log-info';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-err';
            if (type === 'success') colorClass = 'log-success';
            if (type === 'debug') colorClass = 'c-comment';

            let coloredText = text.replace(/\[(INFO|WARN|ERROR|SUCCESS|DEBUG)\]/g, `<span class="${colorClass}">[$1]</span>`);
            
            line.innerHTML = `<div class="output">${coloredText}</div>`;
            termBody.appendChild(line);
            termBody.scrollTop = termBody.scrollHeight;
            await sleep(delay);
        }

        // 4. 模拟进度条
        async function runProgressBar(label, duration = 3000) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<div class="output"><span class="c-comment">${label}</span> <span class="progress-bar"><div class="progress-fill"></div></span><span class="progress-text">0%</span></div>`;
            termBody.appendChild(line);
            
            const fill = line.querySelector('.progress-fill');
            const text = line.querySelector('.progress-text');
            
            for (let i = 0; i <= 100; i += 2) {
                fill.style.width = i + '%';
                text.textContent = i + '%';
                termBody.scrollTop = termBody.scrollHeight;
                await sleep(duration / 50);
            }
            text.textContent = '完成';
            await sleep(500);
        }

        // 核心延迟函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ==========================================
        // 主执行流程（放慢节奏版）
        // ==========================================
        
        async function executeProgram() {
            await sleep(1000); // 初始加载等待

            // 1. 初始化环境
            await typeCommand('git checkout -b final_goodbye', 100);
            await printLog('Switched to a new branch \'final_goodbye\'', 'info', 1200);

            // 2. 执行数据分析
            await typeCommand('node questionnaire_analysis.js', 100);
            await printLog('[INFO] 正在加载 127 份真实样本...', 'info', 1500);
            await printLog('[DEBUG] 读取数据源 questionnaire_data.json...', 'debug', 800);
            await printLog('[INFO] 解析数据中...', 'info', 1200);
            await sleep(1500);

            // 3. 输出高亮代码与数据真相
            await printCode('// 数据剖析结果：', 1000);
            await printCode('const targetData = report.filter(item => item.target === "K&I");', 800);
            await printCode('console.log("匹配到 42.5% 的青春输给圈子不同");', 800);
            await printCode('console.log("匹配到 46.5% 的旧友走向随缘");', 800);
            await printCode('console.log("匹配到 22.0% 的结局是熟悉的陌生人");', 1500);
            
            await printLog('==================================================', 'info', 1000);
            await printLog('你没有选错，你只是刚好和我，一起走进了那 22% 的规律里。', 'info', 1500);
            await printLog('这不是背叛，这只是青春的自然代谢。', 'info', 1500);
            await printLog('==================================================', 'info', 2000);

            // 4. 情绪处理（回滚操作）
            await typeCommand('python manage_emotions.py', 100);
            await printLog('[DEBUG] 扫描未发送的生日礼物文件...', 'debug', 1500);
            await sleep(1000);
            await printLog('[WARN] 警告：检测到未发送的报告数据，发送可能导致关系系统崩溃。', 'warn', 2000);
            await sleep(1500);
            await printLog('[INFO] 正在执行回滚操作 (rollback)...', 'info', 1200);
            await printCode('try { sendReportToKandI(); } catch (e) { console.warn("拒绝执行"); }', 1200);
            await printLog('[SUCCESS] 已删除发送企图。保留过去三年真挚数据。', 'success', 1500);
            await sleep(1000);

            // 5. 内心独白（以日志形式逐行输出）
            const monologue = [
                '> 不用冰冷的数据去覆盖曾经真挚的三年，',
                '> 不让你看到我深夜内耗的偏执，',
                '> 是我能给你，也能给我自己，最后的温柔。'
            ];
            for (let line of monologue) {
                await printLog(line, 'info', 1500);
            }
            await sleep(2000);

            // 6. 重新编译人生
            await typeCommand('bash start_new_life.sh', 100);
            await printLog('[INFO] 正在编译新的未来...', 'info', 1000);
            await runProgressBar('[====================] 进度:', 4000); // 4秒进度条
            await printLog('[SUCCESS] 编译完成，版本号：v2.0.0', 'success', 1500);
            await sleep(1000);

            // 7. 核心代码块展示（重点语法高亮）
            await printCode('class NewLife {', 800);
            await printCode('  constructor() {', 500);
            await printCode('    this.role = "自己的主角";', 800);
            await printCode('    this.location = "重点高中";', 800);
            await printCode('  }', 500);
            await printCode('  sail() {', 500);
            await printCode('    console.log("生日快乐，我曾经在乎的女孩。");', 1200);
            await printCode('    console.log("这艘船曾在你港湾停靠，现在，它要去征服自己的海域了。");', 1500);
            await printCode('  }', 800);
            await printCode('}', 1500);

            // 8. 执行新实例
            await typeCommand('node start_new_life.js', 100);
            await printLog('[INFO] 执行新实例...', 'info', 1000);
            await printLog('生日快乐，我曾经在乎的女孩。', 'success', 1500);
            await printLog('这艘船曾在你港湾停靠，现在，它要去征服自己的海域了。', 'success', 1500);
            await sleep(2000);

            // 9. 完美退出
            await printLog('[INFO] 正在退出旧进程...', 'info', 1000);
            await printCode('System.exit(0); // 进程正常终止，状态：已释怀', 2000);
            await printLog('状态：剧本杀青。', 'success', 1500);
            await sleep(1500);

            // 10. 最终光标
            const finalLine = document.createElement('div');
            finalLine.className = 'line';
            finalLine.innerHTML = `<div class="prompt"></div><div class="output"><span class="cursor"></span></div>`;
            termBody.appendChild(finalLine);
            termBody.scrollTop = termBody.scrollHeight;
        }

        // 启动程序
        window.onload = executeProgram;
    </script>
</body>
</html>
