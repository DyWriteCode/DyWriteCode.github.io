<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepgram 实时语音转文字测试</title>
    <style>
        /* ---------- CSS 样式 ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 36px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12), 0 8px 24px rgba(0, 20, 40, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1a2b;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 15px;
            color: #4a5b6e;
            margin-bottom: 28px;
            border-left: 4px solid #4f8cff;
            padding-left: 16px;
            background: rgba(79, 140, 255, 0.06);
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        /* ---- 状态条 ---- */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f2f6fa;
            padding: 12px 18px;
            border-radius: 60px;
            margin-bottom: 28px;
            font-size: 14px;
            color: #1e2c3a;
            border: 1px solid #e2e9f0;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #b0c4d8;
            transition: background 0.25s ease, box-shadow 0.25s ease;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: #2b9c5e;
            box-shadow: 0 0 0 4px rgba(43, 156, 94, 0.2);
        }

        .status-dot.error {
            background: #d45a5a;
            box-shadow: 0 0 0 4px rgba(212, 90, 90, 0.2);
        }

        .status-text {
            font-weight: 500;
        }

        .status-hint {
            margin-left: auto;
            font-size: 13px;
            color: #6a7e94;
        }

        /* ---- 按钮 ---- */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #eef3f8;
            color: #1a2b3c;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .btn-primary {
            background: #1a2b3c;
            color: #ffffff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #0f1e2e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 43, 60, 0.25);
        }

        .btn-success {
            background: #2b9c5e;
            color: #ffffff;
        }
        .btn-success:hover:not(:disabled) {
            background: #218a50;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(43, 156, 94, 0.30);
        }

        .btn-danger {
            background: #d45a5a;
            color: #ffffff;
        }
        .btn-danger:hover:not(:disabled) {
            background: #c04a4a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 90, 90, 0.30);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ---- 转录结果 ---- */
        .transcript-area {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 24px;
            min-height: 120px;
            border: 1px solid #e2e9f0;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            margin-bottom: 8px;
        }

        .transcript-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a9eae;
            margin-bottom: 10px;
        }

        #transcript {
            font-size: 18px;
            line-height: 1.6;
            color: #0b1a2b;
            word-break: break-word;
            min-height: 60px;
        }

        #transcript .placeholder {
            color: #b0c4d8;
            font-weight: 400;
        }

        .interim {
            color: #4f8cff;
            font-weight: 400;
        }

        .footer-note {
            font-size: 13px;
            color: #7a8e9e;
            text-align: right;
            padding-right: 6px;
            margin-top: 6px;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 500px) {
            .card {
                padding: 28px 18px;
            }
            h1 {
                font-size: 22px;
            }
            .btn {
                min-width: 100px;
                font-size: 14px;
                padding: 12px 14px;
            }
            .transcript-area {
                padding: 16px 18px;
                min-height: 100px;
            }
            #transcript {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎙️ 实时转录</h1>
        <div class="subtitle">点击「开始录音」并说话，文字将实时显示</div>

        <!-- 状态 -->
        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">未连接</span>
            <span class="status-hint" id="statusHint">⚡ 准备就绪</span>
        </div>

        <!-- 按钮 -->
        <div class="btn-group">
            <button class="btn btn-success" id="btnStart">🎤 开始录音</button>
            <button class="btn btn-danger" id="btnStop" disabled>⏹ 停止</button>
        </div>

        <!-- 转录结果 -->
        <div class="transcript-area">
            <div class="transcript-label">📝 转录文字</div>
            <div id="transcript"><span class="placeholder">说话后，文字会出现在这里…</span></div>
        </div>
        <div class="footer-note" id="wordCount">0 字符</div>
    </div>

    <script>
        // ============================================================
        //  JavaScript 逻辑
        // ============================================================

        // ---------- DOM 引用 ----------
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusHint = document.getElementById('statusHint');
        const transcriptEl = document.getElementById('transcript');
        const wordCountEl = document.getElementById('wordCount');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');

        // ---------- 配置 ----------
        // ⚠️ 请替换成你自己的 Deepgram API Key
        // 可以在 https://console.deepgram.com 免费获取
        const DEEPGRAM_API_KEY = '063998309ee3b9ff33a6cb2ad09452f11052c07e';

        // WebSocket 地址（使用 v1/listen 端点）
        const WS_URL = `wss://api.deepgram.com/v1/listen?model=nova-3&language=zh&interim_results=true&punctuate=true`;

        // ---------- 状态变量 ----------
        let socket = null; // WebSocket 实例
        let mediaRecorder = null; // MediaRecorder 实例
        let stream = null; // 麦克风 MediaStream
        let isRecording = false;
        let finalTranscript = ''; // 累积的最终转录文本

        // ---------- 辅助函数 ----------
        function setStatus(state, hint = '') {
            // state: 'idle' | 'connecting' | 'connected' | 'error' | 'disconnected'
            statusDot.className = 'status-dot';
            if (state === 'connected') {
                statusDot.classList.add('connected');
                statusText.textContent = '已连接';
                statusHint.textContent = hint || '🎤 正在聆听…';
            } else if (state === 'error') {
                statusDot.classList.add('error');
                statusText.textContent = '错误';
                statusHint.textContent = hint || '⚠️ 请刷新重试';
            } else if (state === 'connecting') {
                statusText.textContent = '连接中…';
                statusHint.textContent = hint || '⏳ 正在建立连接';
            } else if (state === 'disconnected') {
                statusText.textContent = '已断开';
                statusHint.textContent = hint || '🔌 连接已关闭';
            } else {
                // idle
                statusText.textContent = '未连接';
                statusHint.textContent = hint || '⚡ 准备就绪';
            }
        }

        function updateTranscript(text, isInterim = false) {
            // 清除占位符
            if (transcriptEl.querySelector('.placeholder')) {
                transcriptEl.innerHTML = '';
            }

            if (isInterim) {
                // 临时结果：用特殊样式显示，但保留最终文本在前
                const finalText = finalTranscript ? `<span>${finalTranscript}</span>` : '';
                transcriptEl.innerHTML = `${finalText} <span class="interim">${text}</span>`;
            } else {
                // 最终结果：追加到累积文本
                if (text && !finalTranscript.includes(text)) {
                    finalTranscript = finalTranscript ? finalTranscript + ' ' + text : text;
                }
                transcriptEl.innerHTML = `<span>${finalTranscript}</span>`;
            }

            // 更新字符数
            const displayText = transcriptEl.textContent || '';
            wordCountEl.textContent = `${displayText.length} 字符`;
        }

        function resetUI() {
            if (transcriptEl.querySelector('.placeholder')) return;
            transcriptEl.innerHTML = `<span class="placeholder">说话后，文字会出现在这里…</span>`;
            finalTranscript = '';
            wordCountEl.textContent = '0 字符';
        }

        // ---------- 核心：连接 Deepgram ----------
        function connectDeepgram() {
            return new Promise((resolve, reject) => {
                try {
                    socket = new WebSocket(WS_URL, ['token', DEEPGRAM_API_KEY]);
                } catch (err) {
                    reject(new Error('无法创建 WebSocket: ' + err.message));
                    return;
                }

                setStatus('connecting', '⏳ 正在连接 Deepgram…');

                socket.onopen = () => {
                    setStatus('connected', '🎤 已连接，开始说话吧');
                    resolve();
                };

                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        // Deepgram 返回的消息结构
                        if (data.type === 'Results') {
                            const channel = data.channel;
                            if (channel && channel.alternatives && channel.alternatives.length > 0) {
                                const alt = channel.alternatives[0];
                                const transcript = alt.transcript || '';
                                // 判断是否为临时结果
                                const isFinal = data.is_final === true;
                                if (transcript) {
                                    if (isFinal) {
                                        // 最终结果：追加
                                        updateTranscript(transcript, false);
                                    } else {
                                        // 临时结果：显示为草稿
                                        updateTranscript(transcript, true);
                                    }
                                }
                            }
                        }
                    } catch (err) {
                        console.warn('解析消息失败:', err);
                    }
                };

                socket.onerror = (err) => {
                    console.error('WebSocket 错误:', err);
                    setStatus('error', '❌ 连接出错，请检查 API Key');
                    reject(new Error('WebSocket 错误'));
                };

                socket.onclose = (event) => {
                    if (isRecording) {
                        // 如果还在录音但连接断了，视为异常断开
                        setStatus('error', '⚠️ 连接意外断开');
                        stopRecording(true); // 静默停止
                    } else {
                        setStatus('disconnected', '🔌 连接已关闭');
                    }
                };
            });
        }

        // ---------- 开始录音 ----------
        async function startRecording() {
            if (isRecording) return;

            try {
                // 1. 获取麦克风权限
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                setStatus('error', '❌ 无法访问麦克风: ' + err.message);
                return;
            }

            try {
                // 2. 连接 Deepgram
                await connectDeepgram();

                // 3. 创建 MediaRecorder，以 250ms 为间隔发送数据
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus',
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(event.data);
                    }
                };

                // 每 250ms 触发一次 dataavailable
                mediaRecorder.start(250);

                isRecording = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                resetUI(); // 清空之前的转录

                setStatus('connected', '🎤 正在聆听…');

            } catch (err) {
                setStatus('error', '❌ ' + err.message);
                // 清理资源
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                if (socket) {
                    socket.close();
                    socket = null;
                }
            }
        }

        // ---------- 停止录音 ----------
        function stopRecording(silent = false) {
            if (!isRecording && !silent) return;

            isRecording = false;

            // 停止 MediaRecorder
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            mediaRecorder = null;

            // 停止麦克风
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            // 关闭 WebSocket
            if (socket) {
                socket.close();
                socket = null;
            }

            btnStart.disabled = false;
            btnStop.disabled = true;

            if (!silent) {
                setStatus('disconnected', '⏹ 已停止录音');
            }
        }

        // ---------- 事件绑定 ----------
        btnStart.addEventListener('click', startRecording);

        btnStop.addEventListener('click', () => {
            stopRecording(false);
        });

        // 页面关闭时清理资源
        window.addEventListener('beforeunload', () => {
            if (isRecording) {
                stopRecording(true);
            }
        });

        // 初始状态
        setStatus('idle', '⚡ 点击「开始录音」');
        btnStop.disabled = true;

        // 检查 API Key 是否已配置
        if (DEEPGRAM_API_KEY === 'YOUR_DEEPGRAM_API_KEY') {
            setStatus('error', '⚠️ 请先设置 Deepgram API Key');
            btnStart.disabled = true;
            statusHint.textContent = '请在代码中替换 DEEPGRAM_API_KEY';
        }
    </script>
</body>
</html>
