<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>类 Typora · 预览编辑源码（全支持）</title>

    <!-- 第三方库 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css?v=20260819064415" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css?v=20260819064415" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js?v=20260819064415">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js?v=20260819064415">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js?v=20260819064415">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js?v=20260819064415">
    </script>

    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f5f5;
            --editor-bg: #ffffff;
            --text: #2c3e50;
            --border: #e0e0e0;
            --sidebar-bg: #fafafa;
            --shadow: rgba(0, 0, 0, 0.08);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --code-bg: #f0f0f0;
            --blockquote-border: #3b82f6;
            --table-border: #d0d0d0;
            --header-color: #1a1a2e;
            --focus-highlight: rgba(59, 130, 246, 0.12);
            --status-bg: #f0f0f0;
            --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
            --sans: -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            --transition: 0.2s ease;
        }

        .dark {
            --bg: #1e1e2e;
            --editor-bg: #28283a;
            --text: #e4e4e7;
            --border: #3f3f5a;
            --sidebar-bg: #242436;
            --shadow: rgba(0, 0, 0, 0.3);
            --code-bg: #1a1a2a;
            --blockquote-border: #6b8cff;
            --table-border: #4a4a6a;
            --header-color: #f0f0f5;
            --focus-highlight: rgba(107, 140, 255, 0.15);
            --status-bg: #2a2a3e;
        }

        html,
        body {
            height: 100%;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            overflow: hidden;
        }

        ::selection {
            background: rgba(59, 130, 246, 0.3);
        }

        /* ===== 布局 ===== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            background: var(--bg);
        }

        /* ===== 顶部栏 ===== */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 44px;
            background: var(--editor-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            user-select: none;
            transition: background var(--transition), border-color var(--transition);
        }

        #topbar .brand {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.3px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #topbar .brand span {
            opacity: 0.6;
            font-weight: 400;
            font-size: 13px;
        }

        #topbar .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        #topbar .actions button {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-weight: 500;
        }

        #topbar .actions button:hover {
            background: var(--focus-highlight);
            color: var(--accent);
        }

        #topbar .actions button.active {
            background: var(--accent);
            color: #fff;
        }

        .topbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        /* ===== 主体 ===== */
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ===== 侧边栏 ===== */
        #sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, min-width 0.25s ease, background var(--transition), border-color var(--transition);
            flex-shrink: 0;
        }

        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            border-right: none;
        }

        #sidebar .sidebar-header {
            padding: 12px 16px 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            opacity: 0.7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        #sidebar .sidebar-header button {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 2px 6px;
            border-radius: 4px;
        }

        #sidebar .sidebar-header button:hover {
            opacity: 1;
            background: var(--focus-highlight);
        }

        #outline {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 16px 0;
            font-size: 14px;
        }

        #outline .outline-item {
            padding: 4px 16px 4px 20px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.1s, border-color 0.1s;
            color: var(--text);
            opacity: 0.75;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #outline .outline-item:hover {
            background: var(--focus-highlight);
            opacity: 1;
        }

        #outline .outline-item.active {
            border-left-color: var(--accent);
            opacity: 1;
            background: var(--focus-highlight);
        }

        #outline .outline-item.level-1 {
            padding-left: 20px;
            font-weight: 600;
            font-size: 15px;
        }

        #outline .outline-item.level-2 {
            padding-left: 32px;
            font-weight: 500;
        }

        #outline .outline-item.level-3 {
            padding-left: 44px;
        }

        #outline .outline-item.level-4 {
            padding-left: 56px;
            font-size: 13px;
        }

        #outline .outline-item.level-5 {
            padding-left: 68px;
            font-size: 13px;
            opacity: 0.6;
        }

        #outline .outline-item.level-6 {
            padding-left: 80px;
            font-size: 13px;
            opacity: 0.5;
        }

        /* ===== 编辑器容器 ===== */
        #editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--editor-bg);
            transition: background var(--transition);
            overflow: hidden;
            position: relative;
        }

        /* ===== 模式切换标签 ===== */
        #mode-tabs {
            display: flex;
            gap: 0;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--editor-bg);
            transition: border-color var(--transition);
        }

        #mode-tabs .tab {
            padding: 8px 16px 6px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            opacity: 0.5;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: opacity 0.15s, border-color 0.15s, color 0.15s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--sans);
        }

        #mode-tabs .tab:hover {
            opacity: 0.8;
        }

        #mode-tabs .tab.active {
            opacity: 1;
            border-bottom-color: var(--accent);
            color: var(--accent);
        }

        /* ===== 编辑/预览区域 ===== */
        #edit-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        #edit-area .pane {
            flex: 1;
            overflow: auto;
            padding: 20px 24px 40px 24px;
            transition: background var(--transition), color var(--transition);
            height: 100%;
        }

        #edit-area .pane.hidden {
            display: none;
        }

        #source-pane {
            font-family: var(--mono);
            font-size: 15px;
            line-height: 1.7;
            resize: none;
            border: none;
            outline: none;
            background: var(--editor-bg);
            color: var(--text);
            width: 100%;
            min-height: 100%;
            padding: 20px 24px 40px 24px;
            tab-size: 2;
        }

        #source-pane::placeholder {
            color: var(--text);
            opacity: 0.3;
        }

        #preview-pane {
            background: var(--editor-bg);
            color: var(--text);
            line-height: 1.8;
            font-size: 16px;
            word-wrap: break-word;
        }

        /* ===== 预览样式 (Typora 风格) ===== */
        #preview-pane h1,
        #preview-pane h2,
        #preview-pane h3,
        #preview-pane h4,
        #preview-pane h5,
        #preview-pane h6 {
            margin: 1.5em 0 0.5em 0;
            font-weight: 600;
            line-height: 1.3;
            color: var(--header-color);
            transition: color var(--transition);
        }

        #preview-pane h1 {
            font-size: 2.2em;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.3em;
        }

        #preview-pane h2 {
            font-size: 1.8em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.25em;
        }

        #preview-pane h3 {
            font-size: 1.5em;
        }

        #preview-pane h4 {
            font-size: 1.25em;
        }

        #preview-pane h5 {
            font-size: 1.1em;
        }

        #preview-pane h6 {
            font-size: 1em;
            color: var(--text);
            opacity: 0.7;
        }

        #preview-pane p {
            margin: 0.8em 0;
        }

        #preview-pane a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s;
        }

        #preview-pane a:hover {
            border-bottom-color: var(--accent);
        }

        #preview-pane code {
            font-family: var(--mono);
            background: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            transition: background var(--transition);
        }

        #preview-pane pre {
            background: var(--code-bg);
            padding: 16px 20px;
            border-radius: 8px;
            overflow: auto;
            margin: 1em 0;
            transition: background var(--transition);
        }

        #preview-pane pre code {
            background: transparent;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        #preview-pane blockquote {
            border-left: 4px solid var(--blockquote-border);
            padding: 0.5em 1.2em;
            margin: 1em 0;
            background: var(--code-bg);
            border-radius: 0 6px 6px 0;
            transition: border-color var(--transition), background var(--transition);
        }

        #preview-pane blockquote p {
            margin: 0.4em 0;
        }

        #preview-pane ul,
        #preview-pane ol {
            padding-left: 1.8em;
            margin: 0.6em 0;
        }

        #preview-pane li {
            margin: 0.2em 0;
        }

        #preview-pane li.task-list-item {
            list-style: none;
            margin-left: -1.2em;
        }

        #preview-pane li.task-list-item input[type="checkbox"] {
            margin-right: 0.5em;
            accent-color: var(--accent);
            transform: scale(1.1);
        }

        #preview-pane table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            font-size: 0.95em;
        }

        #preview-pane table th,
        #preview-pane table td {
            border: 1px solid var(--table-border);
            padding: 0.5em 0.8em;
            text-align: left;
            transition: border-color var(--transition);
        }

        #preview-pane table th {
            background: var(--code-bg);
            font-weight: 600;
        }

        #preview-pane hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 2em 0;
            opacity: 0.4;
        }

        #preview-pane img {
            max-width: 100%;
            border-radius: 6px;
            margin: 0.6em 0;
        }

        #preview-pane .footnote {
            font-size: 0.9em;
            opacity: 0.8;
        }

        #preview-pane .katex-display {
            margin: 1.2em 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        #preview-pane .mermaid {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            margin: 1em 0;
        }

        .dark #preview-pane .mermaid {
            background: #1a1a2a;
        }

        #preview-pane .yaml-frontmatter {
            background: var(--code-bg);
            padding: 12px 16px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 0.9em;
            margin: 0.8em 0;
            border: 1px solid var(--border);
        }

        /* ===== 状态栏 ===== */
        #statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 32px;
            background: var(--status-bg);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text);
            opacity: 0.7;
            flex-shrink: 0;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        #statusbar .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #statusbar .stat-item span {
            opacity: 0.6;
        }

        /* ===== 专注 / 打字机 高亮 ===== */
        .focus-mode #preview-pane p:not(.focus-line),
        .focus-mode #preview-pane h1:not(.focus-line),
        .focus-mode #preview-pane h2:not(.focus-line),
        .focus-mode #preview-pane h3:not(.focus-line),
        .focus-mode #preview-pane h4:not(.focus-line),
        .focus-mode #preview-pane h5:not(.focus-line),
        .focus-mode #preview-pane h6:not(.focus-line),
        .focus-mode #preview-pane li:not(.focus-line),
        .focus-mode #preview-pane blockquote:not(.focus-line),
        .focus-mode #preview-pane pre:not(.focus-line) {
            opacity: 0.3;
            transition: opacity 0.25s;
        }

        .focus-mode #preview-pane .focus-line {
            opacity: 1 !important;
        }

        /* ===== 打字机模式 ===== */
        .typewriter-mode #preview-pane {
            padding-top: 40vh;
            padding-bottom: 40vh;
        }

        .typewriter-mode #source-pane {
            padding-top: 40vh;
            padding-bottom: 40vh;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            #sidebar {
                width: 200px;
                min-width: 200px;
            }

            #sidebar.collapsed {
                width: 0;
                min-width: 0;
            }

            #edit-area .pane {
                padding: 12px 16px 24px 16px;
            }

            #topbar .brand span {
                display: none;
            }

            #mode-tabs {
                padding: 0 12px;
            }

            #mode-tabs .tab {
                padding: 6px 10px;
                font-size: 12px;
            }

            #statusbar {
                font-size: 11px;
                padding: 0 12px;
            }
        }

        /* ===== 按钮图标 ===== */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* ===== 导出对话框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--editor-bg);
            border-radius: 12px;
            padding: 32px 36px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
        }

        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 600;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .modal-box .modal-actions button {
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            font-family: var(--sans);
        }

        .modal-box .modal-actions button:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .modal-box .modal-actions button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .modal-box .modal-actions button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text);
            opacity: 0.4;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .modal-close:hover {
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== 通知提示 ===== */
        .toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--editor-bg);
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 编辑时源码覆盖层 ===== */
        .inline-source-edit {
            position: relative;
            width: 100%;
            min-height: 1.2em;
            border: none !important;
            outline: none !important;
            background: transparent !important;
            color: inherit !important;
            font: inherit !important;
            padding: 0 !important;
            margin: 0 !important;
            resize: none;
            overflow: hidden;
            box-shadow: none !important;
            font-family: var(--mono);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .inline-source-edit:focus {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* ===== 辅助 ===== */
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gap-2 {
            gap: 8px;
        }

        .text-muted {
            opacity: 0.5;
        }

        .w-full {
            width: 100%;
        }

        .h-full {
            height: 100%;
        }

        .relative {
            position: relative;
        }

        .overflow-hidden {
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- ===== 应用 ===== -->
    <div id="app">

        <!-- 顶部栏 -->
        <header id="topbar">
            <div class="brand">
                ✍️ Markdown <span>· 全块源码编辑</span>
            </div>
            <div class="actions">
                <button id="btnSidebar" title="切换侧边栏 (Ctrl+Shift+L)">📑</button>
                <span class="topbar-divider"></span>
                <button id="btnSource" title="源码模式 (Ctrl+/)">&lt;/&gt;</button>
                <button id="btnFocus" title="专注模式 (F8)">🎯</button>
                <button id="btnTypewriter" title="打字机模式 (F9)">⌨️</button>
                <span class="topbar-divider"></span>
                <button id="btnTheme" title="切换主题">🌓</button>
                <button id="btnExport" title="导出 (Ctrl+E)">📤</button>
            </div>
        </header>

        <!-- 主体 -->
        <div id="main">

            <!-- 侧边栏 -->
            <aside id="sidebar">
                <div class="sidebar-header">
                    <span>📋 大纲</span>
                    <button id="btnCollapseSidebar" title="收起侧边栏">✕</button>
                </div>
                <div id="outline"></div>
            </aside>

            <!-- 编辑器容器 -->
            <div id="editor-container">

                <!-- 模式切换 -->
                <div id="mode-tabs">
                    <button class="tab active" data-mode="preview">📖 预览</button>
                    <button class="tab" data-mode="split">📝 分栏</button>
                    <button class="tab" data-mode="source">📄 源码</button>
                </div>

                <!-- 编辑区域 -->
                <div id="edit-area">
                    <!-- 源码 -->
                    <textarea id="source-pane" class="pane hidden" placeholder="在此输入 Markdown ..."></textarea>
                    <!-- 预览 -->
                    <div id="preview-pane" class="pane"></div>
                </div>

                <!-- 状态栏 -->
                <div id="statusbar">
                    <div class="stat-item">
                        <span>📊</span>
                        <span id="wordCount">0 字</span>
                        <span style="opacity:0.3;margin:0 4px;">·</span>
                        <span id="charCount">0 字符</span>
                    </div>
                    <div class="stat-item">
                        <span id="modeLabel">预览模式</span>
                        <span style="opacity:0.3;margin:0 6px;">·</span>
                        <span id="themeLabel">亮色</span>
                        <span style="opacity:0.3;margin:0 6px;">·</span>
                        <span id="editHint" style="opacity:0.5;">双击块编辑源码</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 导出对话框 ===== -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <h3>📤 导出文档</h3>
            <p style="margin-bottom:12px;opacity:0.7;font-size:14px;">选择导出格式：</p>
            <div class="modal-actions">
                <button data-format="html">HTML</button>
                <button data-format="pdf">PDF (打印)</button>
                <button data-format="md">Markdown</button>
                <button data-format="txt">纯文本</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script>
        (function () {
            'use strict';

            // ============================================================
            //  1. DOM 引用
            // ============================================================
            const sourcePane = document.getElementById('source-pane');
            const previewPane = document.getElementById('preview-pane');
            const outlineEl = document.getElementById('outline');
            const wordCountEl = document.getElementById('wordCount');
            const charCountEl = document.getElementById('charCount');
            const modeLabel = document.getElementById('modeLabel');
            const themeLabel = document.getElementById('themeLabel');
            const editHint = document.getElementById('editHint');

            const btnSidebar = document.getElementById('btnSidebar');
            const btnCollapseSidebar = document.getElementById('btnCollapseSidebar');
            const btnSource = document.getElementById('btnSource');
            const btnFocus = document.getElementById('btnFocus');
            const btnTypewriter = document.getElementById('btnTypewriter');
            const btnTheme = document.getElementById('btnTheme');
            const btnExport = document.getElementById('btnExport');

            const tabs = document.querySelectorAll('#mode-tabs .tab');
            const sidebar = document.getElementById('sidebar');
            const exportModal = document.getElementById('exportModal');
            const modalClose = document.getElementById('modalClose');
            const toastEl = document.getElementById('toast');

            // ============================================================
            //  2. 状态
            // ============================================================
            const state = {
                content: '# 欢迎使用 Markdown 编辑器\n\n在这里开始写作吧！\n\n## 功能支持\n\n- **粗体** / *斜体* / ~~删除线~~\n- [链接](https://example.com)\n- 代码块：`console.log("hello")`\n- 列表项\n\n> 引用块\n\n---\n\n### 数学公式\n\n行内公式：$E = mc^2$\n\n块级公式：\n\n$$\n\\int_{-\\infty}^{\\infty} e^{-x^2} dx = \\sqrt{\\pi}\n$$\n\n### Mermaid 图表\n\n```mermaid\ngraph TD\n    A[开始] --> B{判断}\n    B -->|是| C[执行]\n    B -->|否| D[结束]\n```\n\n### 表格\n\n| 名称 | 数量 | 价格 |\n|------|------|------|\n| 苹果 | 5    | 10   |\n| 香蕉 | 3    | 6    |',
                mode: 'preview',
                focusMode: false,
                typewriterMode: false,
                dark: false,
                sidebarOpen: true,
            };

            let renderTimer = null;
            let toastTimer = null;
            let currentEditingBlock = null;

            // ============================================================
            //  3. 核心渲染
            // ============================================================
            function renderMarkdown(markdown) {
                if (!markdown) return '<p style="opacity:0.4;">开始书写你的文档 ...</p>';

                try {
                    let yamlBlock = '';
                    let body = markdown;
                    const yamlMatch = markdown.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);
                    if (yamlMatch) {
                        yamlBlock =
                            `<div class="yaml-frontmatter">📄 YAML Front Matter\n<pre>${escapeHtml(yamlMatch[1])}</pre></div>`;
                        body = markdown.replace(yamlMatch[0], '');
                    }

                    const html = marked.parse(body, {
                        gfm: true,
                        breaks: true,
                        pedantic: false,
                        sanitize: false,
                        smartLists: true,
                        smartypants: true,
                        highlight: function (code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                try {
                                    return hljs.highlight(code, { language: lang }).value;
                                } catch (_) { }
                            }
                            return code;
                        }
                    });

                    let rendered = html;
                    rendered = rendered.replace(/\$\$([\s\S]*?)\$\$/g, function (match, content) {
                        try {
                            return katex.renderToString(content.trim(), { displayMode: true, throwOnError: false });
                        } catch (_) { return match; }
                    });
                    rendered = rendered.replace(/\$([^\$\n]+?)\$/g, function (match, content) {
                        try {
                            return katex.renderToString(content.trim(), { displayMode: false, throwOnError: false });
                        } catch (_) { return match; }
                    });

                    let finalHtml = yamlBlock + rendered;
                    generateOutline(markdown);
                    updateStats(markdown);
                    return finalHtml;
                } catch (err) {
                    console.error('渲染错误:', err);
                    return `<p style="color:red;">渲染错误: ${err.message}</p>`;
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function generateOutline(markdown) {
                const lines = markdown.split('\n');
                const headings = [];
                const headingRegex = /^(#{1,6})\s+(.+)$/;
                for (let i = 0; i < lines.length; i++) {
                    const m = lines[i].match(headingRegex);
                    if (m) {
                        headings.push({ level: m[1].length, text: m[2].trim(), line: i });
                    }
                }
                if (headings.length === 0) {
                    outlineEl.innerHTML = '<div style="padding:16px;opacity:0.4;font-size:13px;">暂无标题</div>';
                    return;
                }
                let html = '';
                for (const h of headings) {
                    const cls = `outline-item level-${h.level}`;
                    html += `<div class="${cls}" data-line="${h.line}">${escapeHtml(h.text)}</div>`;
                }
                outlineEl.innerHTML = html;
                outlineEl.querySelectorAll('.outline-item').forEach(el => {
                    el.addEventListener('click', function () {
                        const line = parseInt(this.dataset.line);
                        if (!isNaN(line)) {
                            // 设置源码光标
                            const lines = sourcePane.value.split('\n');
                            let pos = 0;
                            for (let i = 0; i < line && i < lines.length; i++) {
                                pos += lines[i].length + 1;
                            }
                            sourcePane.focus();
                            sourcePane.setSelectionRange(pos, pos);
                            // 滚动预览到对应块
                            const targetBlock = previewPane.querySelector(`[data-line="${line}"]`);
                            if (targetBlock) {
                                targetBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                            outlineEl.querySelectorAll('.outline-item').forEach(x => x.classList.remove('active'));
                            this.classList.add('active');
                        }
                    });
                });
            }

            function updateStats(markdown) {
                const text = markdown.replace(/\s+/g, ' ').trim();
                const charCount = text.length;
                const wordCount = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
                wordCountEl.textContent = `${wordCount} 字`;
                charCountEl.textContent = `${charCount} 字符`;
            }

            // ============================================================
            //  4. 预览编辑 (源码内联) —— 改进匹配逻辑
            // ============================================================
            function setupEditableBlocks() {
                const blocks = previewPane.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, pre');
                const lines = sourcePane.value.split('\n');

                blocks.forEach(block => {
                    // 清除旧 data-line
                    block.dataset.line = '';

                    // 处理代码块（pre）
                    if (block.tagName === 'PRE') {
                        const codeBlock = block.querySelector('code');
                        if (!codeBlock) return;
                        const text = codeBlock.textContent;
                        // 尝试在源码中查找包含 ``` 的行，并匹配语言
                        let lang = '';
                        const langMatch = codeBlock.className.match(/language-(\w+)/);
                        if (langMatch) lang = langMatch[1];
                        // 遍历行，找到包含 ``` 的行
                        let startLine = -1;
                        let endLine = -1;
                        for (let i = 0; i < lines.length; i++) {
                            const line = lines[i];
                            if (line.trim().startsWith('```')) {
                                if (startLine === -1) {
                                    // 检查语言是否匹配
                                    const langInLine = line.replace(/```/, '').trim();
                                    if (langInLine === lang || (lang === '' && langInLine === '')) {
                                        startLine = i;
                                    }
                                } else {
                                    endLine = i;
                                    break;
                                }
                            }
                        }
                        if (startLine !== -1 && endLine !== -1) {
                            // 整个代码块从 startLine 到 endLine (包含)
                            block.dataset.line = startLine;
                            block.dataset.endLine = endLine;
                        } else {
                            // 尝试用内容匹配
                            const trimmed = text.trim();
                            for (let i = 0; i < lines.length; i++) {
                                if (lines[i].includes(trimmed)) {
                                    block.dataset.line = i;
                                    break;
                                }
                            }
                        }
                        return;
                    }

                    // 普通块
                    let rawText = block.textContent || '';
                    rawText = rawText.replace(/\s+/g, ' ').trim();
                    if (rawText === '') return;

                    // 先在源码中查找精确匹配 (整行trim后相等)
                    let matchedLine = -1;
                    for (let i = 0; i < lines.length; i++) {
                        const trimmedLine = lines[i].trim();
                        if (trimmedLine === rawText) {
                            matchedLine = i;
                            break;
                        }
                    }
                    // 如果没找到，尝试包含匹配
                    if (matchedLine === -1) {
                        for (let i = 0; i < lines.length; i++) {
                            if (lines[i].includes(rawText) && rawText.length > 3) {
                                matchedLine = i;
                                break;
                            }
                        }
                    }
                    if (matchedLine !== -1) {
                        block.dataset.line = matchedLine;
                    }
                });
            }

            // 处理双击
            function onBlockDblClick(e) {
                let target = e.target;
                // 如果点击的是 code 内部，向上找 pre
                if (target.tagName === 'CODE') {
                    target = target.closest('pre');
                }
                if (!target) return;
                const block = target.closest('p, h1, h2, h3, h4, h5, h6, li, blockquote, pre');
                if (!block) return;

                if (currentEditingBlock && currentEditingBlock !== block) {
                    saveInlineEdit(currentEditingBlock);
                }
                if (block.dataset.editing === 'true') return;

                let lineStr = block.dataset.line;
                let endLineStr = block.dataset.endLine;
                if (lineStr === undefined || lineStr === '') {
                    showToast('⚠️ 无法定位源码行，请使用源码模式编辑');
                    return;
                }
                let lineNum = parseInt(lineStr);
                let endLineNum = endLineStr ? parseInt(endLineStr) : lineNum;
                if (isNaN(lineNum) || lineNum < 0 || lineNum >= sourcePane.value.split('\n').length) {
                    showToast('⚠️ 行号无效');
                    return;
                }

                // 获取该行源码 (如果是代码块，获取多行)
                const lines = sourcePane.value.split('\n');
                let sourceLines = [];
                if (block.tagName === 'PRE' && endLineNum > lineNum) {
                    sourceLines = lines.slice(lineNum, endLineNum + 1);
                } else {
                    sourceLines = [lines[lineNum] || ''];
                }
                const sourceText = sourceLines.join('\n');

                // 保存信息
                block.dataset.oldText = block.innerText;
                block.dataset.lineNum = lineNum;
                block.dataset.endLineNum = endLineNum;

                // 创建 textarea
                const textarea = document.createElement('textarea');
                textarea.className = 'inline-source-edit';
                textarea.value = sourceText;
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';

                block.innerHTML = '';
                block.appendChild(textarea);
                block.dataset.editing = 'true';
                currentEditingBlock = block;

                textarea.focus();
                textarea.select();
                editHint.textContent = '✏️ 编辑源码 (Ctrl+Enter 保存)';
                editHint.style.opacity = '0.9';

                textarea.addEventListener('input', function () {
                    this.style.height = 'auto';
                    this.style.height = this.scrollHeight + 'px';
                });

                const saveHandler = function (e) {
                    if (e.type === 'keydown' && !(e.ctrlKey && e.key === 'Enter')) return;
                    saveInlineEdit(block);
                };
                textarea.addEventListener('keydown', saveHandler);
                textarea.addEventListener('blur', function (e) {
                    setTimeout(() => {
                        if (block.dataset.editing === 'true') {
                            saveInlineEdit(block);
                        }
                    }, 50);
                });
            }

            function saveInlineEdit(block) {
                if (!block || block.dataset.editing !== 'true') return;
                const textarea = block.querySelector('textarea');
                if (!textarea) return;
                const newContent = textarea.value;
                const lineNum = parseInt(block.dataset.lineNum);
                const endLineNum = parseInt(block.dataset.endLineNum) || lineNum;
                if (isNaN(lineNum)) return;

                let lines = sourcePane.value.split('\n');
                if (lineNum >= 0 && lineNum < lines.length) {
                    // 用新内容替换行区间
                    const newLines = newContent.split('\n');
                    lines.splice(lineNum, endLineNum - lineNum + 1, ...newLines);
                    const newSource = lines.join('\n');
                    sourcePane.value = newSource;
                } else {
                    showToast('⚠️ 行号越界');
                    block.dataset.editing = 'false';
                    currentEditingBlock = null;
                    immediateRender();
                    return;
                }

                block.dataset.editing = 'false';
                currentEditingBlock = null;
                editHint.textContent = '双击块编辑源码';
                editHint.style.opacity = '0.5';
                immediateRender();

                // 滚动到编辑位置
                setTimeout(() => {
                    const newText = newContent.trim().split('\n')[0];
                    if (newText) {
                        const blocks = previewPane.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, pre');
                        for (const b of blocks) {
                            if (b.textContent.trim().includes(newText) || newText.includes(b.textContent.trim())) {
                                b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                break;
                            }
                        }
                    }
                }, 100);
                showToast('✅ 已更新源码');
            }

            // ============================================================
            //  5. 全量渲染
            // ============================================================
            function fullRender() {
                const markdown = sourcePane.value;
                state.content = markdown;
                const html = renderMarkdown(markdown);
                previewPane.innerHTML = html;

                try {
                    mermaid.run({
                        nodes: previewPane.querySelectorAll('.mermaid, pre code.language-mermaid'),
                        suppressErrors: true,
                    });
                } catch (_) { }

                previewPane.querySelectorAll('pre code:not(.hljs)').forEach(block => {
                    hljs.highlightElement(block);
                });

                setupEditableBlocks();
                applyFocusMode();
                applyTypewriterMode();
                updateModeLabel();
            }

            function scheduleRender() {
                if (renderTimer) clearTimeout(renderTimer);
                renderTimer = setTimeout(() => {
                    fullRender();
                    renderTimer = null;
                }, 80);
            }

            function immediateRender() {
                if (renderTimer) {
                    clearTimeout(renderTimer);
                    renderTimer = null;
                }
                fullRender();
            }

            // ============================================================
            //  6. 模式切换
            // ============================================================
            function setMode(mode) {
                state.mode = mode;
                tabs.forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.mode === mode);
                });
                const sourceEl = document.getElementById('source-pane');
                const previewEl = document.getElementById('preview-pane');
                if (mode === 'source') {
                    sourceEl.classList.remove('hidden');
                    previewEl.classList.add('hidden');
                    sourceEl.style.width = '100%';
                    sourceEl.style.height = '100%';
                    sourceEl.style.resize = 'none';
                } else if (mode === 'split') {
                    sourceEl.classList.remove('hidden');
                    previewEl.classList.remove('hidden');
                    sourceEl.style.width = '50%';
                    sourceEl.style.height = '100%';
                    sourceEl.style.resize = 'horizontal';
                    const container = document.getElementById('edit-area');
                    container.style.display = 'flex';
                    container.style.flexDirection = 'row';
                    sourceEl.style.flex = 'none';
                    previewEl.style.flex = '1';
                    sourceEl.style.overflow = 'auto';
                    previewEl.style.overflow = 'auto';
                } else {
                    sourceEl.classList.add('hidden');
                    previewEl.classList.remove('hidden');
                    sourceEl.style.width = '100%';
                    sourceEl.style.height = '100%';
                    sourceEl.style.resize = 'none';
                    const container = document.getElementById('edit-area');
                    container.style.display = 'flex';
                    container.style.flexDirection = 'row';
                }
                setTimeout(() => { immediateRender(); }, 50);
                updateModeLabel();
            }

            function updateModeLabel() {
                const map = { preview: '预览模式', split: '分栏模式', source: '源码模式' };
                modeLabel.textContent = map[state.mode] || '预览模式';
            }

            // ============================================================
            //  7. 专注 & 打字机
            // ============================================================
            function applyFocusMode() {
                const container = document.getElementById('editor-container');
                if (state.focusMode) {
                    container.classList.add('focus-mode');
                } else {
                    container.classList.remove('focus-mode');
                }
                if (state.focusMode) {
                    highlightCurrentLine();
                } else {
                    previewPane.querySelectorAll('.focus-line').forEach(el => el.classList.remove('focus-line'));
                }
            }

            function applyTypewriterMode() {
                const container = document.getElementById('editor-container');
                if (state.typewriterMode) {
                    container.classList.add('typewriter-mode');
                } else {
                    container.classList.remove('typewriter-mode');
                }
            }

            function highlightCurrentLine() {
                const cursorPos = sourcePane.selectionStart;
                const text = sourcePane.value;
                const lines = text.split('\n');
                let charCount = 0;
                let lineIdx = 0;
                for (let i = 0; i < lines.length; i++) {
                    if (cursorPos >= charCount && cursorPos <= charCount + lines[i].length + 1) {
                        lineIdx = i;
                        break;
                    }
                    charCount += lines[i].length + 1;
                }
                previewPane.querySelectorAll('.focus-line').forEach(el => el.classList.remove('focus-line'));
                const previewLines = previewPane.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, pre');
                if (previewLines.length > lineIdx) {
                    previewLines[lineIdx]?.classList.add('focus-line');
                }
            }

            // ============================================================
            //  8. 主题切换
            // ============================================================
            function toggleTheme() {
                state.dark = !state.dark;
                document.documentElement.classList.toggle('dark', state.dark);
                themeLabel.textContent = state.dark ? '暗色' : '亮色';
                const hlCss = document.querySelector('link[href*="highlight.js"][href*="styles"]');
                if (hlCss) {
                    hlCss.href = state.dark ?
                        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css' :
                        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css';
                }
                setTimeout(immediateRender, 100);
            }

            // ============================================================
            //  9. 导出
            // ============================================================
            function exportDocument(format) {
                const content = sourcePane.value;
                const title = 'document';
                let blob, filename, mime;

                switch (format) {
                    case 'html': {
                        const htmlContent = renderMarkdown(content);
                        const fullHtml = `<!DOCTYPE html>
                    <html><head><meta charset="UTF-8"><title>${title}</title>
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css?v=20260819064415">
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css?v=20260819064415">
                    <style>body{max-width:900px;margin:40px auto;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.8;color:#2c3e50;} pre{background:#f5f5f5;padding:12px 16px;border-radius:6px;} blockquote{border-left:4px solid #3b82f6;padding-left:1.2em;margin-left:0;background:#f8f8f8;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #ddd;padding:6px 12px;} img{max-width:100%;}</style>
                    </head><body>${htmlContent}</body></html>`;
                        blob = new Blob([fullHtml], { type: 'text/html' });
                        filename = `${title}.html`;
                        mime = 'text/html';
                        break;
                    }
                    case 'md': {
                        blob = new Blob([content], { type: 'text/markdown' });
                        filename = `${title}.md`;
                        mime = 'text/markdown';
                        break;
                    }
                    case 'txt': {
                        const text = content.replace(/\n/g, '\r\n');
                        blob = new Blob([text], { type: 'text/plain' });
                        filename = `${title}.txt`;
                        mime = 'text/plain';
                        break;
                    }
                    case 'pdf': {
                        const originalTitle = document.title;
                        document.title = 'Markdown 导出';
                        window.print();
                        document.title = originalTitle;
                        showToast('📄 PDF 导出: 请使用 "另存为 PDF"');
                        return;
                    }
                    default: {
                        showToast('❌ 不支持的格式');
                        return;
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast(`✅ 已导出 ${format.toUpperCase()}`);
            }

            // ============================================================
            //  10. Toast
            // ============================================================
            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                    toastTimer = null;
                }, 2500);
            }

            // ============================================================
            //  11. 快捷键
            // ============================================================
            function handleKeydown(e) {
                const ctrl = e.ctrlKey || e.metaKey;
                const shift = e.shiftKey;

                if (ctrl && e.key === '/') {
                    e.preventDefault();
                    toggleSourceMode();
                    return;
                }
                if (ctrl && shift && e.key === 'l') {
                    e.preventDefault();
                    toggleSidebar();
                    return;
                }
                if (e.key === 'F8') {
                    e.preventDefault();
                    toggleFocusMode();
                    return;
                }
                if (e.key === 'F9') {
                    e.preventDefault();
                    toggleTypewriterMode();
                    return;
                }
                if (ctrl && e.key === 'e') {
                    e.preventDefault();
                    openExportModal();
                    return;
                }
                if (ctrl && e.key === 'n') {
                    e.preventDefault();
                    if (confirm('清空当前文档?')) {
                        sourcePane.value = '';
                        immediateRender();
                        showToast('📄 新建文档');
                    }
                    return;
                }
                if (ctrl && e.key === 'b') {
                    e.preventDefault();
                    wrapSelection('**', '**');
                    return;
                }
                if (ctrl && e.key === 'i') {
                    e.preventDefault();
                    wrapSelection('*', '*');
                    return;
                }
                if (ctrl && e.key >= '1' && e.key <= '6') {
                    e.preventDefault();
                    const level = parseInt(e.key);
                    wrapHeading(level);
                    return;
                }
                if (ctrl && e.key === 't') {
                    e.preventDefault();
                    insertTable();
                    return;
                }
                if (e.key === 'Escape') {
                    if (currentEditingBlock) {
                        saveInlineEdit(currentEditingBlock);
                        e.preventDefault();
                    }
                }
            }

            function toggleSourceMode() {
                if (state.mode === 'source') {
                    setMode('preview');
                } else {
                    setMode('source');
                }
                showToast(state.mode === 'source' ? '📄 源码模式' : '📖 预览模式');
            }

            function toggleSidebar() {
                state.sidebarOpen = !state.sidebarOpen;
                sidebar.classList.toggle('collapsed', !state.sidebarOpen);
                showToast(state.sidebarOpen ? '📑 侧边栏已打开' : '📑 侧边栏已收起');
            }

            function toggleFocusMode() {
                state.focusMode = !state.focusMode;
                applyFocusMode();
                showToast(state.focusMode ? '🎯 专注模式开启' : '🎯 专注模式关闭');
            }

            function toggleTypewriterMode() {
                state.typewriterMode = !state.typewriterMode;
                applyTypewriterMode();
                showToast(state.typewriterMode ? '⌨️ 打字机模式开启' : '⌨️ 打字机模式关闭');
            }

            function openExportModal() {
                exportModal.classList.add('open');
            }

            // ============================================================
            //  12. 文本操作辅助
            // ============================================================
            function wrapSelection(before, after) {
                const start = sourcePane.selectionStart;
                const end = sourcePane.selectionEnd;
                if (start === end) {
                    const placeholder = before + 'text' + after;
                    sourcePane.setRangeText(placeholder, start, end, 'end');
                    sourcePane.focus();
                    sourcePane.setSelectionRange(start + before.length, start + before.length + 4);
                } else {
                    const selected = sourcePane.value.substring(start, end);
                    sourcePane.setRangeText(before + selected + after, start, end, 'end');
                    sourcePane.focus();
                }
                scheduleRender();
            }

            function wrapHeading(level) {
                const start = sourcePane.selectionStart;
                const lineStart = sourcePane.value.lastIndexOf('\n', start - 1) + 1;
                const lineEnd = sourcePane.value.indexOf('\n', start);
                const currentLine = sourcePane.value.substring(lineStart, lineEnd === -1 ? sourcePane.value.length : lineEnd);
                const trimmed = currentLine.replace(/^#{1,6}\s*/, '');
                const newLine = '#'.repeat(level) + ' ' + trimmed;
                sourcePane.setRangeText(newLine, lineStart, lineEnd === -1 ? sourcePane.value.length : lineEnd, 'end');
                sourcePane.focus();
                scheduleRender();
            }

            function insertTable() {
                const table = '\n\n| 列1 | 列2 | 列3 |\n|------|------|------|\n| 数据 | 数据 | 数据 |\n| 数据 | 数据 | 数据 |\n\n';
                const start = sourcePane.selectionStart;
                sourcePane.setRangeText(table, start, start, 'end');
                sourcePane.focus();
                scheduleRender();
                showToast('📊 已插入表格');
            }

            // ============================================================
            //  13. 初始化
            // ============================================================
            function init() {
                sourcePane.value = state.content;
                immediateRender();
                setMode('preview');

                sourcePane.addEventListener('input', scheduleRender);
                sourcePane.addEventListener('click', () => { if (state.focusMode) highlightCurrentLine(); });
                sourcePane.addEventListener('keyup', () => { if (state.focusMode) highlightCurrentLine(); });

                document.addEventListener('keydown', handleKeydown);

                btnSidebar.addEventListener('click', toggleSidebar);
                btnCollapseSidebar.addEventListener('click', toggleSidebar);

                tabs.forEach(tab => {
                    tab.addEventListener('click', function () {
                        setMode(this.dataset.mode);
                        showToast(this.dataset.mode === 'preview' ? '📖 预览模式' :
                            this.dataset.mode === 'split' ? '📝 分栏模式' : '📄 源码模式');
                    });
                });

                btnSource.addEventListener('click', toggleSourceMode);
                btnFocus.addEventListener('click', toggleFocusMode);
                btnTypewriter.addEventListener('click', toggleTypewriterMode);
                btnTheme.addEventListener('click', toggleTheme);
                btnExport.addEventListener('click', openExportModal);

                modalClose.addEventListener('click', () => {
                    exportModal.classList.remove('open');
                });
                exportModal.addEventListener('click', (e) => {
                    if (e.target === exportModal) exportModal.classList.remove('open');
                });
                exportModal.querySelectorAll('.modal-actions button').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const format = this.dataset.format;
                        exportModal.classList.remove('open');
                        setTimeout(() => exportDocument(format), 100);
                    });
                });

                previewPane.addEventListener('dblclick', onBlockDblClick);

                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    state.dark = true;
                    document.documentElement.classList.add('dark');
                    themeLabel.textContent = '暗色';
                }

                let resizeTimer;
                window.addEventListener('resize', () => {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        if (state.mode === 'split') {
                            immediateRender();
                        }
                        resizeTimer = null;
                    }, 200);
                });

                marked.setOptions({
                    gfm: true,
                    breaks: true,
                    pedantic: false,
                    sanitize: false,
                    smartLists: true,
                    smartypants: true,
                });

                editHint.textContent = '双击块编辑源码';
                showToast('✨ 双击预览中的块（含代码块）即可编辑源码');
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>
</body>

</html>
