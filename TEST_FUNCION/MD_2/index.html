<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #333333;
            --text-secondary: #888888;
            --border: #e0e0e0;
            --hover: #f5f5f5;
            --code-bg: #f6f8fa;
            --blockquote-border: #dfe2e5;
            --header-bg: #fafafa;
            --caret: #000000;
            --selection: #b4d5fe;
            --sidebar-bg: #f8f9fa;
            --sidebar-border: #e9ecef;
            --focus-ring: #2d7aff;
            --radius: 8px;
            --font: 'Segoe UI', 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --bg: #1e1e1e;
            --text: #d4d4d4;
            --text-secondary: #888888;
            --border: #3d3d3d;
            --hover: #2d2d2d;
            --code-bg: #2d2d2d;
            --blockquote-border: #555555;
            --header-bg: #252525;
            --caret: #d4d4d4;
            --selection: #264f78;
            --sidebar-bg: #252525;
            --sidebar-border: #3d3d3d;
            --focus-ring: #4d8aff;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg);
        }

        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 18px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            height: 44px;
            user-select: none;
            transition: background var(--transition), border var(--transition);
        }

        #toolbar .left,
        #toolbar .right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toolbar .brand {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
            color: var(--text);
            opacity: 0.8;
        }

        #toolbar .brand span {
            color: var(--focus-ring);
        }

        .tb-btn {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: background var(--transition), color var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tb-btn:hover {
            background: var(--hover);
            color: var(--text);
        }

        .tb-btn.active {
            color: var(--focus-ring);
            background: rgba(45, 122, 255, 0.10);
        }

        .tb-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .tb-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--bg);
            transition: background var(--transition);
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, background var(--transition), border var(--transition);
        }

        #sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        #sidebar .s-header {
            padding: 12px 16px 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #sidebar .s-header .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 4px;
        }

        #sidebar .s-header .close-btn:hover {
            color: var(--text);
        }

        #sidebar .s-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 14px;
        }

        .outline-item {
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .outline-item:hover {
            background: var(--hover);
        }

        .outline-item.h1 {
            font-weight: 700;
            font-size: 15px;
        }

        .outline-item.h2 {
            font-weight: 600;
            font-size: 14px;
            padding-left: 18px;
        }

        .outline-item.h3 {
            font-weight: 500;
            font-size: 13px;
            padding-left: 32px;
        }

        .outline-item.h4 {
            font-weight: 400;
            font-size: 13px;
            padding-left: 46px;
        }

        .outline-item.h5 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 60px;
            opacity: 0.8;
        }

        .outline-item.h6 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 74px;
            opacity: 0.7;
        }

        .outline-item .level-badge {
            display: inline-block;
            width: 18px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 400;
        }

        #editor-wrap {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: var(--bg);
            transition: background var(--transition);
        }

        #editor {
            width: 100%;
            height: 100%;
            padding: 40px 60px 120px;
            overflow-y: auto;
            outline: none;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.8;
            word-wrap: break-word;
            transition: background var(--transition), color var(--transition);
            caret-color: var(--caret);
            tab-size: 4;
        }

        #editor:focus {
            box-shadow: none;
        }

        #editor ::selection {
            background: var(--selection);
        }

        #editor h1,
        #editor h2,
        #editor h3,
        #editor h4,
        #editor h5,
        #editor h6 {
            margin: 1.2em 0 0.4em 0;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        #editor h1 {
            font-size: 2.0em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.2em;
        }

        #editor h2 {
            font-size: 1.6em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.15em;
        }

        #editor h3 {
            font-size: 1.3em;
        }

        #editor h4 {
            font-size: 1.1em;
        }

        #editor h5 {
            font-size: 1.0em;
        }

        #editor h6 {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        #editor p {
            margin: 0.6em 0;
        }

        #editor blockquote {
            border-left: 4px solid var(--blockquote-border);
            padding-left: 1em;
            margin: 0.8em 0;
            color: var(--text-secondary);
            background: var(--code-bg);
            padding: 0.6em 1em;
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        #editor ul,
        #editor ol {
            padding-left: 1.8em;
            margin: 0.4em 0;
        }

        #editor li {
            margin: 0.2em 0;
        }

        #editor li.task-list-item {
            list-style: none;
            margin-left: -1.4em;
        }

        #editor li.task-list-item input[type="checkbox"] {
            margin-right: 0.5em;
            accent-color: var(--focus-ring);
            cursor: pointer;
        }

        #editor code {
            background: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: var(--mono);
            color: #d63384;
        }

        #editor pre {
            background: var(--code-bg);
            padding: 1em 1.2em;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 0.8em 0;
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.6;
        }

        #editor pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }

        #editor table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.8em 0;
            font-size: 14px;
        }

        #editor table th,
        #editor table td {
            border: 1px solid var(--border);
            padding: 6px 12px;
            text-align: left;
        }

        #editor table th {
            background: var(--code-bg);
            font-weight: 600;
        }

        #editor table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.02);
        }

        #editor hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 1.5em 0;
        }

        #editor img {
            max-width: 100%;
            border-radius: 4px;
            margin: 0.4em 0;
        }

        #editor a {
            color: var(--focus-ring);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border 0.15s;
        }

        #editor a:hover {
            border-bottom-color: var(--focus-ring);
        }

        #editor .math-block {
            text-align: center;
            padding: 0.6em 0;
            font-size: 1.1em;
            background: var(--code-bg);
            border-radius: var(--radius);
            margin: 0.6em 0;
        }

        #editor .math-inline {
            display: inline-block;
            padding: 0 0.1em;
        }

        #editor .mermaid-container {
            background: var(--bg);
            padding: 0.8em;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin: 0.6em 0;
            text-align: center;
        }

        #editor .mermaid-container svg {
            max-width: 100%;
        }

        #statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 18px;
            height: 30px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--header-bg);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            transition: background var(--transition), border var(--transition);
            user-select: none;
        }

        #statusbar .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #statusbar .stat-item span {
            opacity: 0.7;
        }

        #statusbar .stat-item .badge {
            background: var(--code-bg);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 11px;
            opacity: 0.8;
        }

        #editor::-webkit-scrollbar,
        .s-body::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        #editor::-webkit-scrollbar-track,
        .s-body::-webkit-scrollbar-track {
            background: transparent;
        }

        #editor::-webkit-scrollbar-thumb,
        .s-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        #editor::-webkit-scrollbar-thumb:hover,
        .s-body::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        @media (max-width: 768px) {
            #editor {
                padding: 20px 24px 80px;
                font-size: 15px;
            }

            #sidebar {
                width: 200px;
            }

            #sidebar.collapsed {
                width: 0;
            }

            #toolbar .brand {
                font-size: 13px;
            }

            .tb-btn span.label {
                display: none;
            }
        }

        @media (max-width: 480px) {
            #editor {
                padding: 16px 16px 60px;
                font-size: 14px;
            }

            #sidebar {
                width: 160px;
            }

            #toolbar {
                padding: 4px 10px;
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .tb-btn {
                padding: 2px 6px;
                font-size: 12px;
            }

            #statusbar {
                font-size: 11px;
                padding: 2px 10px;
            }
        }

        #editor.focus-mode p:not(.focus-line),
        #editor.focus-mode div:not(.focus-line),
        #editor.focus-mode h1:not(.focus-line),
        #editor.focus-mode h2:not(.focus-line),
        #editor.focus-mode h3:not(.focus-line),
        #editor.focus-mode h4:not(.focus-line),
        #editor.focus-mode h5:not(.focus-line),
        #editor.focus-mode h6:not(.focus-line),
        #editor.focus-mode blockquote:not(.focus-line),
        #editor.focus-mode ul:not(.focus-line),
        #editor.focus-mode ol:not(.focus-line),
        #editor.focus-mode pre:not(.focus-line),
        #editor.focus-mode table:not(.focus-line) {
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        #editor.focus-mode .focus-line {
            opacity: 1 !important;
        }

        #editor.typewriter-mode {
            scroll-behavior: smooth;
        }

        #editor .placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-style: italic;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="toolbar">
            <div class="left">
                <span class="brand">⌨ <span>MD</span> Editor</span>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnSidebar" title="切换侧栏 (Ctrl+Shift+L)">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 4h18v16H3V4zm2 2v12h14V6H5z" />
                    </svg>
                    <span class="label">大纲</span>
                </button>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnSource" title="源码模式 (Ctrl+/)">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 18H6V4h7v5h5v11zM8 10h8v2H8v-2zm0 4h8v2H8v-2zm0 4h5v2H8v-2z" />
                    </svg>
                    <span class="label">源码</span>
                </button>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnFocus" title="专注模式 (F8)">◎</button>
                <button class="tb-btn" id="btnTypewriter" title="打字机模式 (F9)">◉</button>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnTheme" title="切换主题">🌓</button>
            </div>
            <div class="right">
                <button class="tb-btn" id="btnExportHTML" title="导出 HTML">📄</button>
                <button class="tb-btn" id="btnExportPDF" title="导出 PDF (打印)">📎</button>
                <button class="tb-btn" id="btnClear" title="清空">🗑</button>
            </div>
        </div>
        <div id="main">
            <div id="sidebar">
                <div class="s-header">
                    <span>📑 大纲</span>
                    <button class="close-btn" id="btnSidebarClose">✕</button>
                </div>
                <div class="s-body" id="outlineTree"></div>
            </div>
            <div id="editor-wrap">
                <div id="editor" contenteditable="true" spellcheck="true">
                    <p class="placeholder">开始书写… 支持 Markdown 语法</p>
                </div>
            </div>
        </div>
        <div id="statusbar">
            <div class="stat-item">
                <span id="statWords">0 字</span>
                <span id="statLines">0 行</span>
                <span id="statMode" class="badge">编辑</span>
            </div>
            <div class="stat-item">
                <span id="statTheme">🌞</span>
            </div>
        </div>
    </div>
    <script>
        (function () {
            'use strict';
            var editor = document.getElementById('editor');
            var outlineTree = document.getElementById('outlineTree');
            var statWords = document.getElementById('statWords');
            var statLines = document.getElementById('statLines');
            var statMode = document.getElementById('statMode');
            var statTheme = document.getElementById('statTheme');
            var btnSidebar = document.getElementById('btnSidebar');
            var btnSidebarClose = document.getElementById('btnSidebarClose');
            var sidebar = document.getElementById('sidebar');
            var btnSource = document.getElementById('btnSource');
            var btnFocus = document.getElementById('btnFocus');
            var btnTypewriter = document.getElementById('btnTypewriter');
            var btnTheme = document.getElementById('btnTheme');
            var btnExportHTML = document.getElementById('btnExportHTML');
            var btnExportPDF = document.getElementById('btnExportPDF');
            var btnClear = document.getElementById('btnClear');

            var sourceMode = false;
            var focusMode = false;
            var typewriterMode = false;
            var darkTheme = false;
            var isSidebarOpen = true;
            var currentMarkdown = '';
            var renderTimer = null;
            var isRendering = false;

            var markedOptions = {
                gfm: true,
                breaks: true,
                pedantic: false,
                highlight: function (code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try { return hljs.highlight(code, { language: lang }).value; } catch (_) { }
                    }
                    return hljs.highlightAuto(code).value;
                }
            };
            marked.setOptions(markedOptions);

            var renderer = new marked.Renderer();
            var originalParagraph = renderer.paragraph;
            renderer.paragraph = function (text) {
                var blockMathRegex = /\$\$([\s\S]+?)\$\$/g;
                if (blockMathRegex.test(text)) {
                    text = text.replace(blockMathRegex, function (match, math) {
                        try {
                            return katex.renderToString(math.trim(), {
                                displayMode: true, throwOnError: false,
                                trust: true
                            });
                        } catch (_) { return match; }
                    });
                }
                var inlineMathRegex = /\$([^\$\n]+?)\$/g;
                if (inlineMathRegex.test(text)) {
                    text = text.replace(inlineMathRegex, function (match, math) {
                        try {
                            return katex.renderToString(math.trim(), {
                                displayMode: false, throwOnError: false,
                                trust: true
                            });
                        } catch (_) { return match; }
                    });
                }
                return originalParagraph.call(this, text);
            };
            var originalCode = renderer.code;
            renderer.code = function (code, lang, escaped) {
                if (lang === 'mermaid') {
                    return '<div class="mermaid-container"><div class="mermaid">' + code + '</div></div>';
                }
                return originalCode.call(this, code, lang, escaped);
            };
            renderer.table = function (header, body) {
                return '<table>' + header + body + '</table>';
            };
            var originalList = renderer.list;
            renderer.list = function (body, ordered, start) {
                if (/<input\s+type="checkbox"/.test(body)) {
                    return '<ul class="task-list">' + body + '</ul>';
                }
                return originalList.call(this, body, ordered, start);
            };
            var originalListItem = renderer.listitem;
            renderer.listitem = function (text, task, checked) {
                if (task) {
                    var checkbox = '<input type="checkbox" ' + (checked ? 'checked' : '') + ' disabled />';
                    return '<li class="task-list-item">' + checkbox + ' ' + text + '</li>';
                }
                return originalListItem.call(this, text, task, checked);
            };
            marked.use({ renderer });

            mermaid.initialize({
                startOnLoad: false,
                theme: darkTheme ? 'dark' : 'default',
                securityLevel: 'loose',
            });

            function getPlainText(html) {
                var tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || '';
            }

            function updateStats() {
                var plain = getPlainText(editor.innerHTML);
                var words = plain.replace(/\s/g, '').length;
                var lines = plain.split('\n').length;
                statWords.textContent = words + ' 字';
                statLines.textContent = lines + ' 行';
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function saveCursorPosition() {
                var sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return null;
                var range = sel.getRangeAt(0);
                var preRange = document.createRange();
                preRange.selectNodeContents(editor);
                preRange.setEnd(range.startContainer, range.startOffset);
                var startOffset = preRange.toString().length;
                var endOffset = range.collapsed ? startOffset : startOffset + range.toString().length;
                return { start: startOffset, end: endOffset };
            }

            function restoreCursorPosition(pos) {
                if (!pos) return;
                var sel = window.getSelection();
                sel.removeAllRanges();
                var charIndex = 0;
                var startNode = null,
                    startOff = 0,
                    endNode = null,
                    endOff = 0;
                var walker = document.createTreeWalker(
                    editor,
                    NodeFilter.SHOW_TEXT,
                    null,
                    false
                );
                var foundStart = false,
                    foundEnd = false;
                var node = walker.nextNode();
                while (node) {
                    var text = node.textContent;
                    var len = text.length;
                    if (!foundStart && charIndex + len >= pos.start) {
                        startNode = node;
                        startOff = pos.start - charIndex;
                        foundStart = true;
                    }
                    if (!foundEnd && charIndex + len >= pos.end) {
                        endNode = node;
                        endOff = pos.end - charIndex;
                        foundEnd = true;
                    }
                    if (foundStart && foundEnd) break;
                    charIndex += len;
                    node = walker.nextNode();
                }
                if (!startNode) startNode = editor.lastChild || editor;
                if (!endNode) endNode = startNode;
                try {
                    var range = document.createRange();
                    range.setStart(startNode, Math.min(startOff, startNode.textContent.length));
                    range.setEnd(endNode, Math.min(endOff, endNode.textContent.length));
                    sel.addRange(range);
                } catch (e) {
                    var range2 = document.createRange();
                    var last = editor.lastChild || editor;
                    range2.setStart(last, last.textContent ? last.textContent.length : 0);
                    range2.collapse(true);
                    sel.addRange(range2);
                }
            }

            function renderMarkdown(keepCursor) {
                if (isRendering) return;
                if (sourceMode) {
                    var raw = currentMarkdown || getPlainText(editor.innerHTML);
                    if (editor.innerHTML !== raw) {
                        editor.innerHTML = raw;
                    }
                    updateStats();
                    return;
                }
                isRendering = true;
                var md = currentMarkdown;
                if (!md) md = getPlainText(editor.innerHTML);
                var cursorPos = null;
                if (keepCursor !== false) {
                    cursorPos = saveCursorPosition();
                }
                var html = '';
                try {
                    html = marked.parse(md);
                } catch (e) {
                    html = '<p>⚠️ 解析错误: ' + e.message + '</p>';
                }
                if (!html.trim()) {
                    html = '<p class="placeholder">开始书写… 支持 Markdown 语法</p>';
                }
                var inputHandler = editor._inputHandler;
                if (inputHandler) {
                    editor.removeEventListener('input', inputHandler);
                }
                if (editor.innerHTML !== html) {
                    editor.innerHTML = html;
                }
                if (inputHandler) {
                    editor.addEventListener('input', inputHandler);
                }
                var mermaidElements = editor.querySelectorAll('.mermaid');
                if (mermaidElements.length > 0) {
                    mermaidElements.forEach(function (el, index) {
                        var code = el.textContent;
                        try {
                            var id = 'mermaid-' + Date.now() + '-' + index;
                            el.id = id;
                            mermaid.render(id, code).then(function (_a) {
                                var svg = _a.svg;
                                el.innerHTML = svg;
                            }).catch(function () { });
                        } catch (_) { }
                    });
                }
                if (keepCursor !== false && cursorPos) {
                    restoreCursorPosition(cursorPos);
                } else {
                    try {
                        var range = document.createRange();
                        var last = editor.lastChild || editor;
                        range.setStart(last, last.textContent ? last.textContent.length : 0);
                        range.collapse(true);
                        var sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                    } catch (_) { }
                }
                currentMarkdown = md;
                updateStats();
                updateOutline(md);
                isRendering = false;
            }

            function updateOutline(md) {
                var headingRegex = /^(#{1,6})\s+(.+)$/gm;
                var headings = [];
                var match;
                while ((match = headingRegex.exec(md)) !== null) {
                    headings.push({ level: match[1].length, text: match[2].trim() });
                }
                if (headings.length === 0) {
                    outlineTree.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;padding:8px;">无标题</div>';
                    return;
                }
                var html = '';
                headings.forEach(function (h, index) {
                    var cls = 'outline-item h' + h.level;
                    html += '<div class="' + cls + '" data-index="' + index + '">' +
                        '<span class="level-badge">H' + h.level + '</span>' +
                        escapeHtml(h.text) +
                        '</div>';
                });
                outlineTree.innerHTML = html;
                outlineTree.querySelectorAll('.outline-item').forEach(function (el) {
                    el.addEventListener('click', function () {
                        var idx = parseInt(this.dataset.index, 10);
                        if (!isNaN(idx) && idx < headings.length) {
                            var text = headings[idx].text;
                            var headers = editor.querySelectorAll('h1,h2,h3,h4,h5,h6');
                            for (var i = 0; i < headers.length; i++) {
                                var h = headers[i];
                                if (h.textContent.trim() === text) {
                                    h.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    h.style.background = 'var(--selection)';
                                    setTimeout(function () { h.style.background = ''; }, 600);
                                    break;
                                }
                            }
                        }
                    });
                });
            }

            function onEditorInput() {
                if (isRendering) return;
                if (sourceMode) {
                    currentMarkdown = editor.innerText || editor.textContent || '';
                    updateStats();
                    updateOutline(currentMarkdown);
                    return;
                }
                currentMarkdown = getPlainText(editor.innerHTML);
                updateStats();
                updateOutline(currentMarkdown);
                clearTimeout(renderTimer);
                renderTimer = setTimeout(function () {
                    renderMarkdown(true);
                    if (focusMode) updateFocusLine();
                    if (typewriterMode) scrollToCaret();
                }, 300);
            }

            function toggleSourceMode() {
                sourceMode = !sourceMode;
                if (sourceMode) {
                    var md = currentMarkdown || getPlainText(editor.innerHTML);
                    editor.innerHTML = md;
                    statMode.textContent = '源码';
                    btnSource.classList.add('active');
                } else {
                    statMode.textContent = '编辑';
                    btnSource.classList.remove('active');
                    currentMarkdown = getPlainText(editor.innerHTML);
                    renderMarkdown(true);
                }
            }

            function toggleTheme() {
                darkTheme = !darkTheme;
                document.documentElement.setAttribute('data-theme', darkTheme ? 'dark' : 'light');
                statTheme.textContent = darkTheme ? '🌙' : '🌞';
                mermaid.initialize({
                    startOnLoad: false,
                    theme: darkTheme ? 'dark' : 'default',
                    securityLevel: 'loose',
                });
                renderMarkdown(true);
            }

            function toggleFocus() {
                focusMode = !focusMode;
                editor.classList.toggle('focus-mode', focusMode);
                btnFocus.classList.toggle('active', focusMode);
                if (focusMode) updateFocusLine();
            }

            function updateFocusLine() {
                if (!focusMode) return;
                var sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    var node = sel.getRangeAt(0).startContainer;
                    while (node && node !== editor) {
                        if (node.nodeType === Node.ELEMENT_NODE) {
                            var tag = node.tagName;
                            if (['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'UL', 'OL', 'PRE', 'TABLE', 'DIV']
                                .indexOf(tag) !== -1) break;
                        }
                        node = node.parentNode;
                    }
                    editor.querySelectorAll('.focus-line').forEach(function (el) { el.classList.remove('focus-line'); });
                    if (node && node !== editor) {
                        if (node.nodeType === Node.ELEMENT_NODE) node.classList.add('focus-line');
                        else if (node.parentNode) node.parentNode.classList.add('focus-line');
                    }
                }
            }

            function toggleTypewriter() {
                typewriterMode = !typewriterMode;
                editor.classList.toggle('typewriter-mode', typewriterMode);
                btnTypewriter.classList.toggle('active', typewriterMode);
                if (typewriterMode) scrollToCaret();
            }

            function scrollToCaret() {
                if (!typewriterMode) return;
                var sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    var rect = sel.getRangeAt(0).getClientRects()[0];
                    if (rect) {
                        var editorRect = editor.getBoundingClientRect();
                        var targetY = rect.top - editorRect.top - editor.clientHeight / 2 + 40;
                        editor.scrollTop += targetY;
                    }
                }
            }

            function onEditorKeydown(e) {
                var ctrl = e.ctrlKey || e.metaKey;
                if (ctrl && e.key === '/') {
                    e.preventDefault();
                    toggleSourceMode(); return;
                }
                if (ctrl && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
                    e.preventDefault();
                    toggleSidebar(); return;
                }
                if (e.key === 'F8') {
                    e.preventDefault();
                    toggleFocus(); return;
                }
                if (e.key === 'F9') {
                    e.preventDefault();
                    toggleTypewriter(); return;
                }
                if (ctrl && e.key === 'b') {
                    e.preventDefault();
                    wrapSelection('**', '**'); return;
                }
                if (ctrl && e.key === 'i') {
                    e.preventDefault();
                    wrapSelection('*', '*'); return;
                }
                if (ctrl && e.key >= '1' && e.key <= '6') {
                    e.preventDefault();
                    insertHeading(parseInt(e.key, 10)); return;
                }
                if (ctrl && e.key === 't') {
                    e.preventDefault();
                    insertTable(); return;
                }
                if (e.key === 'Enter' && !e.shiftKey && !ctrl) {
                    setTimeout(handleListContinuation, 10);
                }
                if (e.key === 'Tab' && !e.shiftKey) {
                    e.preventDefault();
                    document.execCommand('insertText', false, '    ');
                }
            }

            function wrapSelection(prefix, suffix) {
                var sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                var range = sel.getRangeAt(0);
                if (range.collapsed) {
                    var text = prefix + suffix;
                    document.execCommand('insertText', false, text);
                    var newRange = document.createRange();
                    var node = range.startContainer;
                    var offset = range.startOffset + prefix.length;
                    newRange.setStart(node, offset);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    return;
                }
                var selectedText = range.toString();
                var wrapped = prefix + selectedText + suffix;
                range.deleteContents();
                var textNode = document.createTextNode(wrapped);
                range.insertNode(textNode);
                var newRange = document.createRange();
                newRange.setStart(textNode, prefix.length);
                newRange.setEnd(textNode, prefix.length + selectedText.length);
                sel.removeAllRanges();
                sel.addRange(newRange);
                onEditorInput();
            }

            function insertHeading(level) {
                var prefix = '#'.repeat(level) + ' ';
                document.execCommand('insertText', false, prefix);
                setTimeout(onEditorInput, 10);
            }

            function insertTable() {
                var tableMarkdown =
                    '\n            | 列1 | 列2 | 列3 |\n            |-----|-----|-----|\n            | 单元格 | 单元格 | 单元格 |\n            | 单元格 | 单元格 | 单元格 |\n            ';
                document.execCommand('insertText', false, tableMarkdown);
                setTimeout(onEditorInput, 10);
            }

            function handleListContinuation() {
                var sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                var range = sel.getRangeAt(0);
                var node = range.startContainer;
                while (node && node !== editor) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        var tag = node.tagName;
                        if (['P', 'LI', 'BLOCKQUOTE'].indexOf(tag) !== -1) break;
                    }
                    node = node.parentNode;
                }
                if (!node || node === editor) return;
                var text = node.textContent || '';
                var ulMatch = text.match(/^[\s]*[-*]\s+/);
                var olMatch = text.match(/^[\s]*(\d+)\.\s+/);
                if (ulMatch || olMatch) {
                    var stripped = text.replace(/^[\s]*[-*]\s+/, '').replace(/^[\s]*\d+\.\s+/, '').trim();
                    if (!stripped) {
                        var p = document.createElement('p');
                        p.textContent = '';
                        node.parentNode.replaceChild(p, node);
                        var newRange = document.createRange();
                        newRange.setStart(p, 0);
                        newRange.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                        renderMarkdown(true);
                        return;
                    }
                }
                var quoteMatch = text.match(/^[\s]*>\s+/);
                if (quoteMatch) {
                    var stripped2 = text.replace(/^[\s]*>\s+/, '').trim();
                    if (!stripped2) {
                        var p2 = document.createElement('p');
                        p2.textContent = '';
                        node.parentNode.replaceChild(p2, node);
                        var newRange2 = document.createRange();
                        newRange2.setStart(p2, 0);
                        newRange2.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange2);
                        renderMarkdown(true);
                        return;
                    }
                }
                var headingMatch = text.match(/^(#{1,6})\s+/);
                if (headingMatch) {
                    var p3 = document.createElement('p');
                    p3.textContent = '';
                    if (node.parentNode) {
                        node.parentNode.insertBefore(p3, node.nextSibling);
                        var newRange3 = document.createRange();
                        newRange3.setStart(p3, 0);
                        newRange3.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange3);
                        renderMarkdown(true);
                    }
                }
            }

            function toggleSidebar() {
                isSidebarOpen = !isSidebarOpen;
                sidebar.classList.toggle('collapsed', !isSidebarOpen);
            }

            function exportHTML() {
                var content = editor.innerHTML;
                var style = document.querySelector('style').innerHTML;
                var html =
                    '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>导出的文档</title><style>' +
                    style +
                    '</style><style>body{max-width:900px;margin:40px auto;padding:0 20px;}</style></head><body>' +
                    content +
                    '</body></html>';
                downloadFile(html, 'document.html', 'text/html');
            }

            function exportPDF() { window.print(); }

            function downloadFile(content, filename, mime) {
                var blob = new Blob([content], { type: mime });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function clearDocument() {
                if (confirm('确定要清空所有内容吗？')) {
                    currentMarkdown = '';
                    editor.innerHTML = '<p class="placeholder">开始书写… 支持 Markdown 语法</p>';
                    updateStats();
                    updateOutline('');
                    renderMarkdown(true);
                }
            }

            function onPaste(e) {
                var items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        var file = item.getAsFile();
                        var reader = new FileReader();
                        reader.onload = function (ev) {
                            var dataUrl = ev.target.result;
                            document.execCommand('insertText', false, '![粘贴图片](' + dataUrl + ')');
                            setTimeout(onEditorInput, 10);
                        };
                        reader.readAsDataURL(file);
                        break;
                    }
                }
            }

            function onDrop(e) {
                e.preventDefault();
                var files = e.dataTransfer.files;
                for (var i = 0; i < files.length; i++) {
                    var file = files[i];
                    if (file.type.startsWith('image/')) {
                        var reader = new FileReader();
                        reader.onload = function (ev) {
                            var dataUrl = ev.target.result;
                            document.execCommand('insertText', false, '![拖拽图片](' + dataUrl + ')');
                            setTimeout(onEditorInput, 10);
                        };
                        reader.readAsDataURL(file);
                        break;
                    }
                }
            }

            function init() {
                var initialMD =
                    '# 欢迎使用 MD Editor\n\n        这是一个 **类 Typora** 的所见即所得 Markdown 编辑器。\n\n        ## 功能特性\n\n        - 实时渲染 · 光标保持\n        - 标题 (Ctrl+1~6)\n        - **粗体** (Ctrl+B) 和 *斜体* (Ctrl+I)\n        - 有序列表 和 无序列表\n        - > 引用块\n        - ` + '`' +
                    '行内代码` 和 代码块\n\n        ```javascript\n        console.log(\'Hello, MD Editor!\');\n        ```\n\n        ## 数学公式\n\n        行内公式: $E = mc ^ 2$\n\n        块级公式: \n\n        $$\n        \\\\int_{ -\\\\infty }^ { \\\\infty } e ^ {- x ^ 2
            } dx = \\\\sqrt{ \\\\pi } \n        $$\n\n        ## 表格\n\n | 语言 | 用途 |\n | --------| ----------|\n | HTML | 结构 |\n | CSS | 样式 |\n | JavaScript | 交互 |\n\n        ## Mermaid 图表\n\n```mermaid\n        graph TD\n            A[开始] --> B{判断}\n            B -->|是| C[执行]\n            B -->|否| D[结束]\n        ```\n\n-- -\n\n ** 快捷键 **: Ctrl + / 源码切换 · Ctrl+B/I · Ctrl + 1~6 · F8 专注 · F9 打字机\n        ';
            currentMarkdown = initialMD;
            renderMarkdown(false);

            var inputHandler = onEditorInput;
            editor._inputHandler = inputHandler;
            editor.addEventListener('input', inputHandler);
            editor.addEventListener('keydown', onEditorKeydown);
            editor.addEventListener('paste', onPaste);
            editor.addEventListener('drop', onDrop);
            editor.addEventListener('dragover', function (e) { e.preventDefault(); });

            document.addEventListener('selectionchange', function () {
                if (focusMode) updateFocusLine();
                if (typewriterMode) scrollToCaret();
            });
            editor.addEventListener('scroll', function () {
                if (typewriterMode) scrollToCaret();
            });

            btnSidebar.addEventListener('click', toggleSidebar);
            btnSidebarClose.addEventListener('click', toggleSidebar);
            btnSource.addEventListener('click', toggleSourceMode);
            btnFocus.addEventListener('click', toggleFocus);
            btnTypewriter.addEventListener('click', toggleTypewriter);
            btnTheme.addEventListener('click', toggleTheme);
            btnExportHTML.addEventListener('click', exportHTML);
            btnExportPDF.addEventListener('click', exportPDF);
            btnClear.addEventListener('click', clearDocument);

            document.addEventListener('keydown', function (e) {
                var ctrl = e.ctrlKey || e.metaKey;
                if (ctrl && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
                    e.preventDefault();
                    toggleSidebar();
                }
                if (e.key === 'F8' && !ctrl) {
                    e.preventDefault();
                    toggleFocus();
                }
                if (e.key === 'F9' && !ctrl) {
                    e.preventDefault();
                    toggleTypewriter();
                }
            });

            statMode.textContent = '编辑';
            statTheme.textContent = '🌞';
            updateStats();
        }

            if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        }) ();
    </script>
</body>

</html>
