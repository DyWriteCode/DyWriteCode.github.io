    <!-- ===== 工具栏 ===== -->

        placeholder="在此输入 Markdown … 右侧实时预览&#10;支持 LaTeX 数学公式：$E = mc^2$"></textarea>
    </div>

<script>
    (function() {
        'use strict';

        // ===== DOM refs =====
        const editor = document.getElementById('mdEditor');
        const previewBody = document.getElementById('previewBody');
        const stats = document.getElementById('stats');
        const editorWrap = document.getElementById('editorWrap');
        const btnPreview = document.getElementById('btnPreview');
        const btnWrap = document.getElementById('btnWrap');
        const btnReset = document.getElementById('btnReset');
        const previewBadge = document.getElementById('previewBadge');

        // ===== 默认示例（与文档风格一致） =====
        const DEFAULT_MD = `# · AI短剧"发刀子"受欢迎程度
        ## 完整推导 · 摘要

        本推导从零开始，引入 **十二个核心变量**
        <span class="improve-tag">原著总字数</span>
        <span class="improve-tag">文本"刀子"的原始情感冲击力</span>
        <span class="improve-tag">AI 视觉化放大系数</span>
        <span class="improve-tag">时代共情系数</span>
        <span class="improve-tag">刀子时机系数</span>
        <span class="improve-tag">作者文笔系数</span>
        <span class="improve-tag">小说知名度</span>
        <span class="improve-tag">小说完结程度</span>
        <span class="improve-tag">外部红利</span>
        <span class="improve-tag">时间</span>
        <span class="improve-tag">小说题材</span>
        <span class="improve-tag">性别视角</span>
        <span class="improve-tag">风格基调系数</span>
        ，引用部分已知数据模型并做了适应性调整。

        ---

        ## 第一部分 · 变量定义

        定义目标函数 **\\(H\\)** 为 AI 短剧综合受欢迎指数。

        ### 1.1 核心自变量

        | 符号 | 含义 | 取值性质 |
        |------|------|----------|
        | \\(L\\) | AI短剧改编后的总正片时长（分钟） | \\(L > 0\\) |
        | \\(P\\) | 文本"刀子"的总情感冲击力 | \\(P > 0\\) |
        | \\(\\delta\\) | AI 视觉化放大系数 | \\(\\delta > 1\\) |
        | \\(\\xi\\) | 时代共情系数 | \\(\\xi > 0\\) |
        | \\(\\tau\\) | 刀子时机系数 | \\(0 < \\tau \\le 1\\) |
        | \\(w\\) | 作者文笔系数 | \\(w > 0\\) |
        | \\(K\\) | 小说知名度 | \\(0 \\le K \\le 1\\) |
        | \\(F\\) | 小说完结程度 | \\(0 \\le F \\le 1\\) |
        | \\(\\epsilon\\) | 外部红利 | \\(\\epsilon > -1\\) |

        ### 1.2 固定参数

        - \\(\\alpha\\) : 情感积累效率常数 \\( (2 \\sim 5)\\)
        - \\(\\beta\\) : 伤害敏感系数 \\( (1 \\sim 4)\\)
        - \\(\\lambda\\) : 损失超比例指数 \\( (1.5 \\sim 3)\\)
        - \\(\\eta_0\\) : 基准弃剧系数 \\( (0.3 \\sim 0.8)\\)
        - \\(\\kappa\\) : 社交裂变强度 \\( (0.5 \\sim 1.5)\\)
        - \\(\\nu\\) : 时长惩罚系数 \\( (0.01 \\sim 0.05)\\)
        - \\(L_0\\) : 平台最优甜区时长

        ---

        ## 第二部分 · 核心公式推导

        ### 2.1 超然折扣系数

        $$\\sigma_1 = e^{-\\lambda_1 K F}, \\quad \\sigma_2 = e^{-\\lambda_2 K F}$$

        其中 \\(\\lambda_2 > \\lambda_1\\)，共鸣防御弱，震惊防御强。

        ### 2.2 情感净动能 \\(Q\\)

        $$Q = \\alpha \\xi \\tau e^{-\\lambda_1 K F} \\ln(L+1) - \\beta \\left(\\frac{P e^{-\\lambda_2 K F}}{w \\xi}\\right)^{\\lambda}$$

        > 净动能为积累的共鸣减去伤害惩罚，是模型的核心中间变量。

        ### 2.3 完播率 \\(CR\\)

        $$CR = \\max\\left(0,\\; \\frac{1}{1 + \\exp\\left(-\\gamma_{CR} \\left( \\frac{\\xi \\tau w L}{\\eta_0 \\delta P e^{-\\lambda_2 K F}} - 1 \\right) \\right)}\\right)$$

        ### 2.4 算法热度 \\(R_{alg}\\)

        $$R_{alg} = CR^2 \\cdot \\frac{e^{\\kappa Q}}{e^{\\kappa Q} + e^{-\\kappa Q}}$$

        ### 2.5 IP 自带流量 \\(R_{ip}\\)

        $$R_{ip} = \\mu K F$$

        ### 2.6 综合受欢迎指数 \\(H\\)

        $$H = (R_{alg} + \\mu K F)(1 + \\epsilon) - \\nu (L - L_0)^2$$

        ---

        ## 第三部分 · 最终结论

        **最优策略**：选择 \\(\\xi \\tau\\) 乘积高的组合（女频 + 甜宠 + 浪漫主义），控制总时长在平台甜区 \\(L_0\\) 附近。

        > ✅ 中长篇发刀（时长落在甜区附近）是当前平台的最优策略，兼顾完播率和情感积累。

        $$\\boxed{H(t; G, S, \\psi) = \\Big[ R_{alg}^{smooth} + \\mu K(t) F \\Big] (1+\\epsilon) - \\nu (L - L_0)^2}$$

        ---

        *📐 使用 KaTeX 渲染 | 模型采用确定性计算图（DAG 思想）*
        `;

        // ===== 状态 =====
        let isPreviewOnly = false;
        let isWordWrap = true;
        let renderTimer = null;
        let currentMd = DEFAULT_MD;

        // ===== 渲染函数 =====
        function render(markdown) {
            if (!markdown || markdown.trim() === '') {
                previewBody.innerHTML =
                    `<div class="preview-empty"><strong>✨ 在左侧编辑 Markdown</strong><br />实时渲染 · 支持 LaTeX 数学公式</div>`;
                return;
            }

            try {
                // 用 marked 解析
                let html = marked.parse(markdown, {
                    mangle: false,
                    headerIds: false,
                });

                // 包装预览容器样式
                const wrapper = document.createElement('div');
                wrapper.innerHTML = html;

                // 处理数学公式：先找 $$ ... $$ 块，再找 $ ... $ 行内
                // 因为 KaTeX auto-render 会在 DOM 加载后处理，但我们需要在插入后手动触发
                // 这里我们用 marked 的自定义渲染器或后处理
                // 简单方式：使用 innerHTML 后调用 renderMathInElement
                previewBody.innerHTML = html;

                // 调用 KaTeX 自动渲染
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(previewBody, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false }
                        ],
                        throwOnError: false
                    });
                }

                // 后处理：为 .math-block 添加样式（如果 KaTeX 生成了 .katex-display）
                // 但我们的 CSS 已经支持

            } catch (e) {
                console.warn('Render error:', e);
                previewBody.innerHTML =
                    `<div class="preview-empty" style="color:#b91c1c;">⚠️ 渲染出错: ${e.message}</div>`;
            }
        }

        // ===== 更新统计 =====
        function updateStats() {
            const text = editor.value;
            const chars = text.length;
            const lines = text.split('\n').length;
            stats.textContent = `${chars} 字符 · ${lines} 行`;
        }

        // ===== 调度渲染（防抖） =====
        function scheduleRender() {
            clearTimeout(renderTimer);
            renderTimer = setTimeout(() => {
                const md = editor.value;
                currentMd = md;
                render(md);
                updateStats();
            }, 150);
        }

        // ===== 编辑器事件 =====
        editor.addEventListener('input', scheduleRender);

        // ===== 切换全屏预览 =====
        btnPreview.addEventListener('click', function() {
            isPreviewOnly = !isPreviewOnly;
            editorWrap.classList.toggle('preview-only', isPreviewOnly);
            this.classList.toggle('active', isPreviewOnly);
            previewBadge.textContent = isPreviewOnly ? '全屏' : '实时';
            if (isPreviewOnly) {
                previewBadge.style.background = '#22c55e';
                previewBadge.style.color = '#fff';
            } else {
                previewBadge.style.background = '#e6f0ff';
                previewBadge.style.color = '#1e40af';
            }
            // 重新渲染以确保显示
            render(editor.value);
        });

        // ===== 切换自动换行 =====
        btnWrap.addEventListener('click', function() {
            isWordWrap = !isWordWrap;
            editor.style.whiteSpace = isWordWrap ? 'pre-wrap' : 'pre';
            editor.style.wordWrap = isWordWrap ? 'break-word' : 'normal';
            this.classList.toggle('active', !isWordWrap);
            // 强制刷新
            const val = editor.value;
            editor.value = val;
        });
        btnWrap.classList.add('active');
        editor.style.whiteSpace = 'pre-wrap';
        editor.style.wordWrap = 'break-word';

        // ===== 重置 =====
        btnReset.addEventListener('click', function() {
            if (confirm('恢复默认示例内容？当前编辑内容将丢失。')) {
                editor.value = DEFAULT_MD;
                currentMd = DEFAULT_MD;
                render(DEFAULT_MD);
                updateStats();
                // 如果预览模式，切回普通
                if (isPreviewOnly) {
                    isPreviewOnly = false;
                    editorWrap.classList.remove('preview-only');
                    btnPreview.classList.remove('active');
                    previewBadge.textContent = '实时';
                    previewBadge.style.background = '#e6f0ff';
                    previewBadge.style.color = '#1e40af';
                }
            }
        });

        // ===== 键盘快捷键 =====
        editor.addEventListener('keydown', function(e) {
            // Ctrl+Enter 或 Cmd+Enter 切换预览
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                btnPreview.click();
            }
            // Tab 键插入 2 个空格
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                scheduleRender();
            }
        });

        // ===== 同步滚动（预览跟随编辑） =====
        // 简单实现：编辑时滚动预览到顶部？不做强制，让用户自由滚动
        // 但我们可以添加一个"滚动同步"的简单处理：当编辑滚动时，预览不自动滚动，避免干扰

        // ===== 初始化 =====
        editor.value = DEFAULT_MD;
        currentMd = DEFAULT_MD;
        render(DEFAULT_MD);
        updateStats();

        // ===== 窗口 resize 重新渲染（处理 KaTeX 布局） =====
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                render(editor.value);
            }, 300);
        });

        // ===== 额外的：点击预览区可快速聚焦编辑 =====
        previewBody.addEventListener('click', function() {
            if (!isPreviewOnly) {
                editor.focus();
            }
        });

        // ===== 导出（调试用） =====
        console.log('📝 MD 编辑器已启动 · 类似 Typora 的所见即所得');

        // ===== 注意：原始展示文本用 JavaScript 字符串处理 =====
        // 所有 Markdown 内容均通过 editor.value 获取，以字符串形式处理
        // 在渲染时使用 marked.parse 解析，避免直接输出为 HTML

    })();
</script>
</body>
</html>
