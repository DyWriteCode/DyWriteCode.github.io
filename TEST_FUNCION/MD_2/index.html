<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vditor + MathLive 公式编辑器</title>

    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/js/highlight.js/styles/github.css" />

    <!-- MathLive 样式和脚本（使用更稳定的 CDN） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive@0.105.0/dist/mathlive-fonts.css" />
    <!-- 注意：这里我们移除了静态 script，改为动态加载，避免加载失败影响页面 -->

    <style>
        /* ... 你的样式保持不变 ... */
        /* (省略，同上文) */
    </style>
</head>

<body>
    <div id="vditor"></div>

    <!-- 公式编辑器对话框 -->
    <div id="formula-dialog-overlay">
        <div id="formula-dialog">
            <h3>🧮 公式编辑器</h3>
            <p style="color:#57606a;font-size:14px;margin-bottom:12px;">点击下方区域输入公式，支持键盘和虚拟键盘操作</p>
            <div class="math-field-container">
                <math-field id="math-field"></math-field>
            </div>
            <div class="hint">💡 提示：输入 LaTeX 命令（如 \frac、\sqrt）会自动渲染，也可使用屏幕上的虚拟键盘</div>
            <div class="dialog-actions">
                <button class="btn-cancel" id="formula-cancel">取消</button>
                <button class="btn-insert" id="formula-insert">插入公式</button>
            </div>
        </div>
    </div>

    <!-- Vditor 核心 JS -->
    <script src="https://unpkg.com/vditor@3.10.9/dist/index.min.js"></script>

    <script>
        // ============================================================
        //  1. 动态加载 MathLive（避免加载失败导致全局报错）
        // ============================================================
        let mathLiveLoaded = false;
        let mathLiveLoading = false;

        function loadMathLive(callback) {
            if (typeof MathLive !== 'undefined') {
                mathLiveLoaded = true;
                callback();
                return;
            }
            if (mathLiveLoading) {
                // 如果正在加载，轮询等待
                const interval = setInterval(() => {
                    if (typeof MathLive !== 'undefined') {
                        clearInterval(interval);
                        mathLiveLoaded = true;
                        callback();
                    }
                }, 100);
                return;
            }
            mathLiveLoading = true;
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/mathlive@0.105.0/dist/mathlive.min.js';
            script.onload = () => {
                mathLiveLoaded = true;
                mathLiveLoading = false;
                callback();
            };
            script.onerror = () => {
                mathLiveLoading = false;
                alert('公式编辑器加载失败，请刷新页面重试或检查网络。');
            };
            document.head.appendChild(script);
        }

        // ============================================================
        //  2. 初始化 Vditor
        // ============================================================
        const vditor = new Vditor('vditor', {
            mode: 'ir',
            theme: 'classic',
            icon: 'ant',
            height: '100%',
            value: [
                '# 欢迎使用 Vditor + MathLive 🎉',
                '点击工具栏的 **Σ** 按钮，打开可视化公式编辑器。',
                '## 示例公式',
                '行内公式：$E = mc^2$',
                '块级公式：$$\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}$$',
                '试试用公式编辑器插入你的公式吧！'
            ].join('\n'),
            cache: { enable: true, id: 'vditor-mathlive-demo' },
            preview: {
                delay: 500,
                maxWidth: 800,
                mode: 'both',
                math: { engine: 'KaTeX' },
                hljs: { style: 'github' }
            },
            toolbar: [
                'emoji', 'headings', 'bold', 'italic', 'strike', '|',
                'line', 'quote', 'list', 'ordered-list', 'check', '|',
                'code', 'inline-code', '|',
                {
                    name: 'formula',
                    icon: 'Σ',
                    tip: '公式编辑器 (可视化)',
                    tipPosition: 's',
                    click: () => {
                        // 点击时动态加载 MathLive，加载完成后打开对话框
                        loadMathLive(() => openFormulaDialog());
                    }
                },
                '|', 'upload', 'link', 'table', '|',
                'undo', 'redo', '|',
                {
                    name: 'more',
                    toolbar: ['edit-mode', 'both', 'preview', 'fullscreen', 'outline', 'export', 'info']
                }
            ],
            counter: { enable: true, type: 'markdown' },
            upload: {
                accept: 'image/*',
                handler: (files) => {
                    const file = files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        vditor.insertValue(`![${file.name}](${e.target.result})`);
                    };
                    reader.readAsDataURL(file);
                }
            },
            outline: { enable: true, position: 'left' },
            typewriterMode: true,
            after: () => {
                console.log('✅ Vditor 已启动！');
            }
        });

        // ============================================================
        //  3. 公式对话框逻辑
        // ============================================================
        const overlay = document.getElementById('formula-dialog-overlay');
        const mathFieldElement = document.getElementById('math-field');
        let mathFieldInstance = null;

        function openFormulaDialog() {
            // 确保 MathLive 已加载（loadMathLive 已确保）
            if (typeof MathLive === 'undefined') {
                alert('MathLive 尚未加载，请稍后重试。');
                return;
            }
            overlay.classList.add('active');
            if (!mathFieldInstance) {
                mathFieldInstance = MathLive.makeMathField(mathFieldElement, {
                    virtualKeyboardMode: 'manual',
                    smartFence: true,
                });
            } else {
                mathFieldInstance.latex('');
                mathFieldInstance.focus();
            }
            setTimeout(() => mathFieldInstance?.focus(), 100);
        }

        function closeFormulaDialog() {
            overlay.classList.remove('active');
        }

        function insertFormula() {
            if (!mathFieldInstance) return;
            const latex = mathFieldInstance.latex();
            if (latex && latex.trim()) {
                vditor.insertValue(`$$${latex}$$`);
            }
            closeFormulaDialog();
        }

        document.getElementById('formula-insert').addEventListener('click', insertFormula);
        document.getElementById('formula-cancel').addEventListener('click', closeFormulaDialog);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeFormulaDialog();
        });
        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                insertFormula();
            }
            if (e.key === 'Escape') {
                closeFormulaDialog();
            }
        });

        window.vditor = vditor;
        console.log('💡 点击工具栏的 Σ 按钮打开可视化公式编辑器');
    </script>
</body>

</html>
