<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD 编辑器 · 类 Typora 预览</title>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous">
        </script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous">
        </script>
    <!-- marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f9fc;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #0b1a2f;
            line-height: 1.7;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            flex-shrink: 0;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0.6rem 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            z-index: 10;
        }

        .toolbar .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b1a2f;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .toolbar .brand span {
            color: #3b82f6;
        }

        .toolbar .actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toolbar .actions button {
            background: #f1f5f9;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .toolbar .actions button:hover {
            background: #dbeafe;
            color: #1e40af;
        }

        .toolbar .actions button.active {
            background: #3b82f6;
            color: #fff;
        }

        .toolbar .actions .sep {
            width: 1px;
            height: 24px;
            background: #e2e8f0;
        }

        .toolbar .stats {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .toolbar .mode-indicator {
            background: #e6f0ff;
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e40af;
        }

        /* ===== 主容器 ===== */
        .editor-wrap {
            flex: 1;
            overflow: hidden;
            background: #ffffff;
            margin: 0.8rem 1.2rem 1.2rem 1.2rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f6;
            position: relative;
        }

        /* ===== 视图区域（单一画布） ===== */
        .view-area {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: auto;
            background: #ffffff;
        }

        /* ===== 预览区 ===== */
        #previewBody {
            padding: 2.4rem 3rem;
            min-height: 100%;
            height: auto;
            color: #0b1a2f;
            line-height: 1.8;
            background: #ffffff;
            overflow-y: auto;
        }

        #previewBody h1 {
            font-size: 2rem;
            font-weight: 700;
            border-bottom: 3px solid #e2e8f0;
            padding-bottom: 0.6rem;
            margin-bottom: 1.6rem;
        }

        #previewBody h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-top: 2.4rem;
            margin-bottom: 1rem;
            border-left: 6px solid #3b82f6;
            padding-left: 1rem;
        }

        #previewBody h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 1.8rem;
            margin-bottom: 0.6rem;
        }

        #previewBody h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1.4rem;
            margin-bottom: 0.4rem;
        }

        #previewBody p {
            margin-bottom: 0.8rem;
        }

        #previewBody ul,
        #previewBody ol {
            padding-left: 1.8rem;
            margin-bottom: 0.8rem;
        }

        #previewBody li {
            margin-bottom: 0.2rem;
        }

        #previewBody blockquote {
            border-left: 4px solid #3b82f6;
            padding: 0.4rem 1.2rem;
            margin: 1rem 0;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            color: #1e293b;
        }

        #previewBody code {
            background: #f1f5f9;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85em;
            font-family: 'JetBrains Mono', monospace;
            color: #0b1a2f;
        }

        #previewBody pre {
            background: #f1f5f9;
            padding: 1rem 1.4rem;
            border-radius: 12px;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid #e6edf5;
        }

        #previewBody pre code {
            background: transparent;
            padding: 0;
            font-size: 0.85rem;
            color: #0b1a2f;
        }

        #previewBody table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2rem 0;
            font-size: 0.9rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        #previewBody table th {
            background: #1e293b;
            color: #fff;
            font-weight: 600;
            padding: 10px 14px;
            text-align: left;
        }

        #previewBody table td {
            padding: 10px 14px;
            border-bottom: 1px solid #e9edf2;
            vertical-align: top;
        }

        #previewBody .math-block {
            background: #f1f5f9;
            padding: 1.2rem 1.8rem;
            border-radius: 16px;
            margin: 1.2rem 0 1.6rem 0;
            overflow-x: auto;
            border: 1px solid #e6edf5;
            text-align: center;
        }

        #previewBody .note-box {
            background: #fefce8;
            border-left: 6px solid #f59e0b;
            padding: 1rem 1.6rem;
            border-radius: 12px;
            margin: 1.4rem 0;
        }

        #previewBody .hr-light {
            margin: 2rem 0;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #d1d9e6, transparent);
        }

        #previewBody .derivation-note {
            font-size: 0.95rem;
            color: #334155;
            background: #f1f5f9;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            margin: 0.6rem 0 0.2rem 0;
            border-left: 4px solid #3b82f6;
        }

        #previewBody .formula-source {
            font-size: 0.9rem;
            color: #1e40af;
            background: #e6f0ff;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 0.6rem;
        }

        #previewBody .theory-tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.05rem 0.6rem;
            border-radius: 20px;
            margin-right: 0.3rem;
        }

        #previewBody .improve-tag {
            display: inline-block;
            background: #dbeafe;
            color: #11db4d;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.05rem 0.6rem;
            border-radius: 20px;
            margin-right: 0.3rem;
        }

        #previewBody img {
            max-width: 100%;
            border-radius: 12px;
            margin: 0.8rem 0;
        }

        #previewBody .footer-meta {
            margin-top: 2.8rem;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.6rem;
        }

        #previewBody .preview-empty {
            color: #b9c7da;
            font-style: italic;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 0.95rem;
            user-select: none;
        }

        #previewBody .preview-empty strong {
            color: #94a3b8;
        }

        /* ===== 源码编辑区（textarea） ===== */
        #mdEditor {
            display: none;
            /* 默认隐藏，通过切换显示 */
            width: 100%;
            height: 100%;
            padding: 2.4rem 3rem;
            border: none;
            outline: none;
            resize: none;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.8;
            color: #0b1a2f;
            background: #fafcff;
            tab-size: 2;
            overflow: auto;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        #mdEditor:focus {
            background: #ffffff;
            box-shadow: inset 0 0 0 2px #dbeafe;
        }

        /* ===== 编辑模式时，预览区半透明以提示 ===== */
        .view-area.edit-mode #previewBody {
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .view-area.edit-mode #mdEditor {
            display: block;
        }

        .view-area.preview-mode #mdEditor {
            display: none;
        }

        .view-area.preview-mode #previewBody {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== 滚动条 ===== */
        #previewBody::-webkit-scrollbar,
        #mdEditor::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        #previewBody::-webkit-scrollbar-thumb,
        #mdEditor::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 10px;
        }

        #previewBody::-webkit-scrollbar-track,
        #mdEditor::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .editor-wrap {
                margin: 0.4rem 0.6rem 0.6rem 0.6rem;
                border-radius: 16px;
            }

            #previewBody {
                padding: 1.2rem 1.5rem;
            }

            #mdEditor {
                padding: 1.2rem 1.5rem;
                font-size: 0.85rem;
            }

            .toolbar {
                padding: 0.4rem 1rem;
            }

            .toolbar .brand {
                font-size: 0.95rem;
            }

            .toolbar .actions button {
                font-size: 0.7rem;
                padding: 0.2rem 0.7rem;
            }

            .toolbar .stats {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .toolbar .actions .sep {
                display: none;
            }

            .toolbar .actions button span {
                display: none;
            }

            .toolbar .actions button {
                padding: 0.2rem 0.5rem;
            }

            #previewBody {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            #previewBody h1 {
                font-size: 1.5rem;
            }

            #previewBody h2 {
                font-size: 1.3rem;
            }

            #mdEditor {
                padding: 0.8rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
        <div class="brand">
            📝 <span>MD</span> · 所见即所得
        </div>
        <div class="actions">
            <button id="btnEdit" class="active" title="切换到源码编辑模式">
                <span>✎</span> <span>编辑</span>
            </button>
            <button id="btnPreview" title="切换到预览模式">
                <span>👁️</span> <span>预览</span>
            </button>
            <button id="btnReset" title="恢复默认示例">
                <span>↺</span> <span>重置</span>
            </button>
            <span class="sep"></span>
            <span class="mode-indicator" id="modeIndicator">预览</span>
            <span class="stats" id="stats">0 字符 · 0 行</span>
        </div>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="editor-wrap">
        <div class="view-area preview-mode" id="viewArea">
            <!-- 预览区 -->
            <div id="previewBody">
                <div class="preview-empty">
                    <strong>✨ 在右侧编辑 Markdown</strong><br />
                    实时渲染 · 支持 LaTeX 数学公式
                </div>
            </div>
            <!-- 源码编辑区（隐藏） -->
            <textarea id="mdEditor" spellcheck="false"
                placeholder="在此输入 Markdown … 实时渲染&#10;支持 LaTeX 数学公式：$E = mc^2$"></textarea>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // ===== DOM refs =====
            const editor = document.getElementById('mdEditor');
            const previewBody = document.getElementById('previewBody');
            const stats = document.getElementById('stats');
            const viewArea = document.getElementById('viewArea');
            const btnEdit = document.getElementById('btnEdit');
            const btnPreview = document.getElementById('btnPreview');
            const btnReset = document.getElementById('btnReset');
            const modeIndicator = document.getElementById('modeIndicator');

            // ===== 默认示例（去掉每行前导空格） =====
            const DEFAULT_MD = `# · AI短剧"发刀子"受欢迎程度
## 完整推导 · 摘要

本推导从零开始，引入 **十二个核心变量**
<span class="improve-tag">原著总字数</span>
<span class="improve-tag">文本"刀子"的原始情感冲击力</span>
<span class="improve-tag">AI 视觉化放大系数</span>
<span class="improve-tag">时代共情系数</span>
<span class="improve-tag">刀子时机系数</span>
<span class="improve-tag">作者文笔系数</span>
<span class="improve-tag">小说知名度</span>
<span class="improve-tag">小说完结程度</span>
<span class="improve-tag">外部红利</span>
<span class="improve-tag">时间</span>
<span class="improve-tag">小说题材</span>
<span class="improve-tag">性别视角</span>
<span class="improve-tag">风格基调系数</span>
，引用部分已知数据模型并做了适应性调整。

---

## 第一部分 · 变量定义

定义目标函数 **\\(H\\)** 为 AI 短剧综合受欢迎指数。

### 1.1 核心自变量

| 符号 | 含义 | 取值性质 |
|------|------|----------|
| \\(L\\) | AI短剧改编后的总正片时长（分钟） | \\(L > 0\\) |
| \\(P\\) | 文本"刀子"的总情感冲击力 | \\(P > 0\\) |
| \\(\\delta\\) | AI 视觉化放大系数 | \\(\\delta > 1\\) |
| \\(\\xi\\) | 时代共情系数 | \\(\\xi > 0\\) |
| \\(\\tau\\) | 刀子时机系数 | \\(0 < \\tau \\le 1\\) |
| \\(w\\) | 作者文笔系数 | \\(w > 0\\) |
| \\(K\\) | 小说知名度 | \\(0 \\le K \\le 1\\) |
| \\(F\\) | 小说完结程度 | \\(0 \\le F \\le 1\\) |
| \\(\\epsilon\\) | 外部红利 | \\(\\epsilon > -1\\) |

### 1.2 固定参数

- \\(\\alpha\\) : 情感积累效率常数 \\( (2 \\sim 5)\\)
- \\(\\beta\\) : 伤害敏感系数 \\( (1 \\sim 4)\\)
- \\(\\lambda\\) : 损失超比例指数 \\( (1.5 \\sim 3)\\)
- \\(\\eta_0\\) : 基准弃剧系数 \\( (0.3 \\sim 0.8)\\)
- \\(\\kappa\\) : 社交裂变强度 \\( (0.5 \\sim 1.5)\\)
- \\(\\nu\\) : 时长惩罚系数 \\( (0.01 \\sim 0.05)\\)
- \\(L_0\\) : 平台最优甜区时长

---

## 第二部分 · 核心公式推导

### 2.1 超然折扣系数

$$\\sigma_1 = e^{-\\lambda_1 K F}, \\quad \\sigma_2 = e^{-\\lambda_2 K F}$$

其中 \\(\\lambda_2 > \\lambda_1\\)，共鸣防御弱，震惊防御强。

### 2.2 情感净动能 \\(Q\\)

$$Q = \\alpha \\xi \\tau e^{-\\lambda_1 K F} \\ln(L+1) - \\beta \\left(\\frac{P e^{-\\lambda_2 K F}}{w \\xi}\\right)^{\\lambda}$$

> 净动能为积累的共鸣减去伤害惩罚，是模型的核心中间变量。

### 2.3 完播率 \\(CR\\)

$$CR = \\max\\left(0,\\; \\frac{1}{1 + \\exp\\left(-\\gamma_{CR} \\left( \\frac{\\xi \\tau w L}{\\eta_0 \\delta P e^{-\\lambda_2 K F}} - 1 \\right) \\right)}\\right)$$

### 2.4 算法热度 \\(R_{alg}\\)

$$R_{alg} = CR^2 \\cdot \\frac{e^{\\kappa Q}}{e^{\\kappa Q} + e^{-\\kappa Q}}$$

### 2.5 IP 自带流量 \\(R_{ip}\\)

$$R_{ip} = \\mu K F$$

### 2.6 综合受欢迎指数 \\(H\\)

$$H = (R_{alg} + \\mu K F)(1 + \\epsilon) - \\nu (L - L_0)^2$$

---

## 第三部分 · 最终结论

**最优策略**：选择 \\(\\xi \\tau\\) 乘积高的组合（女频 + 甜宠 + 浪漫主义），控制总时长在平台甜区 \\(L_0\\) 附近。

> ✅ 中长篇发刀（时长落在甜区附近）是当前平台的最优策略，兼顾完播率和情感积累。

$$\\boxed{H(t; G, S, \\psi) = \\Big[ R_{alg}^{smooth} + \\mu K(t) F \\Big] (1+\\epsilon) - \\nu (L - L_0)^2}$$

---

*📐 使用 KaTeX 渲染 | 模型采用确定性计算图（DAG 思想）*
`;

            // ===== 状态 =====
            let currentMd = DEFAULT_MD;
            let isEditMode = false; // false=预览, true=编辑

            // ===== 渲染函数 =====
            function render(markdown) {
                if (!markdown || markdown.trim() === '') {
                    previewBody.innerHTML =
                        `<div class="preview-empty"><strong>✨ 在右侧编辑 Markdown</strong><br />实时渲染 · 支持 LaTeX 数学公式</div>`;
                    return;
                }

                try {
                    let html = marked.parse(markdown, {
                        mangle: false,
                        headerIds: false,
                    });
                    previewBody.innerHTML = html;

                    // 触发 KaTeX 渲染
                    if (typeof renderMathInElement === 'function') {
                        renderMathInElement(previewBody, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '\\[', right: '\\]', display: true },
                                { left: '$', right: '$', display: false },
                                { left: '\\(', right: '\\)', display: false }
                            ],
                            throwOnError: false
                        });
                    }
                } catch (e) {
                    console.warn('Render error:', e);
                    previewBody.innerHTML =
                        `<div class="preview-empty" style="color:#b91c1c;">⚠️ 渲染出错: ${e.message}</div>`;
                }
            }

            // ===== 更新统计 =====
            function updateStats() {
                const text = editor.value;
                const chars = text.length;
                const lines = text.split('\n').length;
                stats.textContent = `${chars} 字符 · ${lines} 行`;
            }

            // ===== 切换模式 =====
            function setMode(edit) {
                isEditMode = edit;
                if (edit) {
                    viewArea.classList.remove('preview-mode');
                    viewArea.classList.add('edit-mode');
                    btnEdit.classList.add('active');
                    btnPreview.classList.remove('active');
                    modeIndicator.textContent = '编辑';
                    modeIndicator.style.background = '#dbeafe';
                    modeIndicator.style.color = '#1e40af';
                    // 将当前预览内容同步到编辑器（源码）
                    // 但编辑器内容始终是 Markdown，不需要同步
                    editor.focus();
                } else {
                    viewArea.classList.remove('edit-mode');
                    viewArea.classList.add('preview-mode');
                    btnPreview.classList.add('active');
                    btnEdit.classList.remove('active');
                    modeIndicator.textContent = '预览';
                    modeIndicator.style.background = '#e6f0ff';
                    modeIndicator.style.color = '#1e40af';
                    // 重新渲染以确保最新
                    render(editor.value);
                    currentMd = editor.value;
                }
            }

            // ===== 编辑器输入事件 =====
            editor.addEventListener('input', function () {
                // 实时更新预览（无论模式，保持同步）
                if (!isEditMode) {
                    // 预览模式下，编辑器隐藏，但输入仍会触发，我们更新预览
                    render(this.value);
                    currentMd = this.value;
                } else {
                    // 编辑模式下，预览半透明，但我们仍可更新预览内容（但用户看不见）
                    // 为了切换后能立即看到，我们依然渲染，但预览半透明
                    render(this.value);
                    currentMd = this.value;
                }
                updateStats();
            });

            // ===== 切换按钮 =====
            btnEdit.addEventListener('click', function () {
                setMode(true);
            });
            btnPreview.addEventListener('click', function () {
                setMode(false);
            });

            // ===== 重置 =====
            btnReset.addEventListener('click', function () {
                if (confirm('恢复默认示例内容？当前编辑内容将丢失。')) {
                    editor.value = DEFAULT_MD;
                    currentMd = DEFAULT_MD;
                    render(DEFAULT_MD);
                    updateStats();
                    // 切换到预览模式
                    setMode(false);
                }
            });

            // ===== 快捷键 =====
            editor.addEventListener('keydown', function (e) {
                // Ctrl+Enter 切换预览
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (isEditMode) {
                        setMode(false);
                    } else {
                        setMode(true);
                    }
                }
                // Tab 键插入 2 个空格
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 2;
                    // 触发 input 事件
                    this.dispatchEvent(new Event('input'));
                }
            });

            // ===== 双击预览区切换编辑（方便用户） =====
            previewBody.addEventListener('dblclick', function () {
                setMode(true);
            });

            // ===== 初始化 =====
            editor.value = DEFAULT_MD;
            currentMd = DEFAULT_MD;
            render(DEFAULT_MD);
            updateStats();
            // 默认预览模式
            setMode(false);

            // ===== 窗口 resize 重新渲染（确保 KaTeX 布局） =====
            let resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (!isEditMode) {
                        render(editor.value);
                    }
                }, 300);
            });

            console.log('📝 MD 编辑器已启动 · 类 Typora 单一画布模式');
            console.log('💡 双击预览区进入编辑，Ctrl+Enter 切换预览/编辑');
        })();
    </script>
</body>

</html>
