        function generateHTMLTable() {
            if (!hotInstance) return '<table><tr><td>空表格</td></tr></table>';
            var data = hotInstance.getData();
            var settings = hotInstance.getSettings();
            var colHeaders = settings.colHeaders || [],
                rowHeaders = settings.rowHeaders || false;
            var colWidths = settings.colWidths || [],
                rowHeights = settings.rowHeights || [];
            var bgColors = {};
            var rowsCount = data.length,
                colsCount = rowsCount > 0 ? data[0]?.length || 0 : 0;
            for (var r = 0; r < rowsCount; r++) {
                for (var c = 0; c < (data[r]?.length || 0); c++) {
                    try {
                        var meta =
                            hotInstance.getCellMeta(r, c);
                        bgColors[r + ',' + c] = meta.bgColor || '#ffffff';
                    } catch (e) {
                        bgColors[r + ',' + c] =
                            '#ffffff';
                    }
                }
            }
            if (rowsCount === 0 || colsCount === 0) { return '<table style="border-collapse:collapse;width:100%;font-size:14px;"><tr><td style="border:1px solid #ccc;padding:6px 10px;">空表格</td></tr></table>'; }
            var colHeadersFull = [];
            for (var c = 0; c < colsCount; c++) { colHeadersFull.push(colHeaders[c] || String.fromCharCode(65 + c)); }
            var html = '<table style="border-collapse:collapse;width:100%;font-size:14px;">';
            if (colHeadersFull.length > 0) {
                html += '<thead><tr>';
                if (rowHeaders) {
                    html +=
                        '<th style="border:1px solid #ccc;padding:6px 10px;background:#f0f2f5;font-weight:600;text-align:center;">#</th>';
                }
                for (var c = 0; c < colHeadersFull.length; c++) {
                    var width = colWidths[c] ? 'width:' + colWidths[c] +
                        'px;' : '';
                    html += '<th style="border:1px solid #ccc;padding:6px 10px;background:#f0f2f5;font-weight:600;' +
                        width + '">' + (colHeadersFull[c] || '') + '</th>';
                }
                html += '</tr></thead>';
            }
            html += '<tbody>';
            for (var r = 0; r < rowsCount; r++) {
                var row = data[r] || [];
                var height = rowHeights[r] ? 'height:' + rowHeights[r] + 'px;' : '';
                html += '<tr>';
                if (rowHeaders) {
                    html += '<td style="border:1px solid #ccc;padding:6px 10px;background:#f9fafb;font-weight:500;text-align:center;' +
                        height + '">' + (r + 1) + '</td>';
                }
                for (var c = 0; c < Math.min(row.length, colsCount); c++) {
                    var bgKey = r + ',' + c;
                    var bg = bgColors[bgKey] || '#ffffff';
                    var bgStyle = 'background-color:' + bg + ';';
                    var width = colWidths[c] ? 'width:' + colWidths[c] + 'px;' : '';
                    var val = (row[c] !== undefined && row[c] !== null) ? String(row[c]) : '';
                    html += '<td style="border:1px solid #ccc;padding:6px 10px;' + bgStyle + width + height + '">' +
                        val + '</td>';
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            return html;
        }

        function insertTableToVditor() {
            if (!hotInstance) { showHint('请先编辑表格内容！'); return; }
            var htmlTable = generateHTMLTable();
            if (!htmlTable) { showHint('生成表格失败，请重试。'); return; }
            var escapedHtml = htmlTable.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            var htmlBlock = '<div data-type="html-block" data-block="0" class="vditor-ir__node">\n  <pre class="vditor-ir__marker--pre vditor-ir__marker"><code data-type="html-block">' +
                escapedHtml + '</code></pre>\n  <pre class="vditor-ir__preview" data-render="1">' + htmlTable +
                '</pre>\n</div>';
            if (editingTableElement) {
                var parent = editingTableElement.parentNode;
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlBlock;
                var fragment = document.createDocumentFragment();
                while (tempDiv.firstChild) { fragment.appendChild(tempDiv.firstChild); }
                parent.replaceChild(fragment, editingTableElement);
                editingTableElement = null;
                closeTableEditor();
                showHint('✅ 表格已更新');
                vditor.focus();
                return;
            }
            closeTableEditor();
            setTimeout(function () {
                var marker = tableMarkerElement;
                if (marker && marker.parentNode) {
                    var tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlBlock;
                    var fragment = document.createDocumentFragment();
                    while (tempDiv.firstChild) { fragment.appendChild(tempDiv.firstChild); }
                    marker.parentNode.replaceChild(fragment, marker);
                    tableMarkerElement = null;
                } else {
                    restoreCursorPosition();
                    var success = insertHTMLFallback(htmlBlock);
                    if (!success) { vditor.insertValue(htmlBlock); }
                }
                var editorEl = getEditorElement();
                if (editorEl) { editorEl.dispatchEvent(new Event('input', { bubbles: true, cancelable: true })); }
                setTimeout(function () {
                    try {
                        if (typeof vditor.renderPreview === 'function') vditor.renderPreview();
                        if (vditor.preview && typeof vditor.preview.render === 'function') vditor.preview.render();
                    } catch (e) { /* 忽略 */ }
                    vditor.focus();
                }, 120);
                showHint('✅ 表格已插入（单击表格可弹出编辑按钮）');
            }, 200);
        }

        function insertHTMLFallback(html) {
            try {
                if (vditor.caret && typeof vditor.caret.insertHTML === 'function') {
                    vditor.caret.insertHTML(html);
                    var editor = getEditorElement();
                    if (editor) { editor.dispatchEvent(new Event('input', { bubbles: true, cancelable: true })); }
                    return true;
                }
            } catch (e) { console.warn('caret.insertHTML 失败', e); }
            try {
                var sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) {
                    var editor = getEditorElement();
                    if (editor) {
                        var range = document.createRange();
                        range.selectNodeContents(editor);
                        range.collapse(false);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
                var success = document.execCommand('insertHTML', false, html);
                if (success) {
                    var editor = getEditorElement();
                    if (editor) { editor.dispatchEvent(new Event('input', { bubbles: true, cancelable: true })); }
                    return true;
                }
            } catch (e) { console.warn('execCommand 失败', e); }
            return false;
        }
