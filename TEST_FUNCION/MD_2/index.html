<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vditor + MathLive 公式编辑器</title>

    <!-- Vditor 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/index.css?v=20260819153153" />
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/js/highlight.js/styles/github.css?v=20260819153153" />

    <!-- MathLive 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/mathlive@0.110.0/dist/mathlive.core.css?v=20260819153153" />
    <link rel="stylesheet" href="https://unpkg.com/mathlive@0.110.0/dist/mathlive.css?v=20260819153153" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #vditor {
            height: 100vh;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }

        .vditor {
            border: none !important;
            border-radius: 0 !important;
        }

        .vditor .vditor-reset {
            font-size: 16px;
            line-height: 1.8;
        }

        /* 对话框样式 */
        #formula-dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #formula-dialog-overlay.active {
            display: flex;
        }

        #formula-dialog {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        #formula-dialog h3 {
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #1f2328;
        }

        .math-field-container {
            border: 2px solid #d0d7de;
            border-radius: 8px;
            padding: 12px;
            min-height: 80px;
            background: #fafbfc;
            transition: border-color 0.2s;
            position: relative;
        }

        .math-field-container:focus-within {
            border-color: #0969da;
        }

        /* math-field 必须显式设置尺寸 */
        math-field {
            width: 100%;
            min-height: 50px;
            font-size: 20px;
            display: block;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .dialog-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cancel {
            background: #f6f8fa;
            color: #24292f;
        }

        .btn-cancel:hover {
            background: #eaeef2;
        }

        .btn-insert {
            background: #0969da;
            color: #ffffff;
        }

        .btn-insert:hover {
            background: #0550ae;
        }

        .hint {
            font-size: 13px;
            color: #57606a;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            #vditor {
                max-width: 100%;
            }

            .vditor-reset {
                font-size: 17px !important;
                padding: 20px !important;
            }

            #formula-dialog {
                width: 95%;
                padding: 16px;
            }

            math-field {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div id="vditor"></div>

    <!-- 公式编辑器对话框 -->
    <div id="formula-dialog-overlay">
        <div id="formula-dialog">
            <h3>🧮 可视化公式编辑器</h3>
            <p style="color:#57606a;font-size:14px;margin-bottom:12px;">
                点击下方区域输入公式，支持键盘和虚拟键盘操作
            </p>
            <div class="math-field-container" id="math-field-container">
                <!-- 我们将在这里通过 JavaScript 动态创建 math-field -->
            </div>
            <div class="hint">💡 提示：输入 LaTeX 命令（如 \frac、\sqrt）会自动渲染，也可使用屏幕上的虚拟键盘</div>
            <div class="dialog-actions">
                <button class="btn-cancel" id="formula-cancel">取消</button>
                <button class="btn-insert" id="formula-insert">插入公式</button>
            </div>
        </div>
    </div>

    <!-- 加载 Vditor -->
    <script src="https://unpkg.com/vditor@3.10.9/dist/index.min.js?v=20260819153153"></script>

    <!-- 加载 MathLive -->
    <script src="https://unpkg.com/mathlive@0.110.0/dist/mathlive.min.js?v=20260819153153"></script>

    <script>
        // ============================================================
        //  1. 初始化 Vditor
        // ============================================================
        const vditor = new Vditor('vditor', {
            mode: 'ir',
            theme: 'classic',
            icon: 'ant',
            height: '100%',
            value: [
                '# 欢迎使用 Vditor + MathLive 🎉',
                '点击工具栏的 **Σ** 按钮，打开可视化公式编辑器。',
                '## 示例公式',
                '行内公式：$E = mc^2$',
                '块级公式：$$\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}$$',
                '试试用公式编辑器插入你的公式吧！'
            ].join('\n'),
            cache: { enable: true, id: 'vditor-mathlive-demo' },
            preview: {
                delay: 500,
                maxWidth: 800,
                mode: 'both',
                math: { engine: 'KaTeX' },
                hljs: { style: 'github' }
            },
            toolbar: [
                'emoji', 'headings', 'bold', 'italic', 'strike', '|',
                'line', 'quote', 'list', 'ordered-list', 'check', '|',
                'code', 'inline-code', '|',
                {
                    name: 'formula',
                    icon: 'Σ',
                    tip: '可视化公式编辑器',
                    tipPosition: 's',
                    click: () => openFormulaDialog()
                },
                '|', 'upload', 'link', 'table', '|',
                'undo', 'redo', '|',
                {
                    name: 'more',
                    toolbar: ['edit-mode', 'both', 'preview', 'fullscreen', 'outline', 'export', 'info']
                }
            ],
            counter: { enable: true, type: 'markdown' },
            upload: {
                accept: 'image/*',
                handler: (files) => {
                    const file = files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        vditor.insertValue(`![${file.name}](${e.target.result})`);
                    };
                    reader.readAsDataURL(file);
                }
            },
            outline: { enable: true, position: 'left' },
            typewriterMode: true,
            after: () => console.log('✅ Vditor 已启动！')
        });

        // ============================================================
        //  2. 公式对话框逻辑（使用 MathfieldElement 构造函数）
        // ============================================================
        const overlay = document.getElementById('formula-dialog-overlay');
        const container = document.getElementById('math-field-container');
        let mathField = null;

        // 创建 math-field 实例的函数
        function createMathField() {
            // 检查是否已存在，避免重复创建
            if (mathField) {
                // 清空并聚焦
                mathField.value = '';
                return mathField;
            }

            // 使用 MathfieldElement 构造函数创建实例
            // 注意：MathfieldElement 是 MathLive 暴露的全局类
            mathField = new MathfieldElement({
                virtualKeyboardPolicy: 'manual',   // 手动控制虚拟键盘
                smartFence: true,
            });
            // 设置样式
            mathField.style.width = '100%';
            mathField.style.minHeight = '50px';
            mathField.style.fontSize = '20px';
            // 清空初始值
            mathField.value = '';
            // 添加到容器
            container.appendChild(mathField);

            // 监听输入事件（可选）
            mathField.addEventListener('input', () => {
                // console.log('公式内容:', mathField.value);
            });

            return mathField;
        }

        function openFormulaDialog() {
            // 确保 MathLive 已加载
            if (typeof MathfieldElement === 'undefined') {
                alert('MathLive 尚未加载，请刷新页面重试。');
                return;
            }

            // 显示对话框
            overlay.classList.add('active');

            // 创建或重置 math-field
            const mf = createMathField();
            mf.value = '';          // 清空内容
            // 延迟聚焦，确保 DOM 更新
            setTimeout(() => mf.focus(), 100);
        }

        function closeFormulaDialog() {
            overlay.classList.remove('active');
        }

        function insertFormula() {
            if (!mathField) return;
            const latex = mathField.value;
            if (latex && latex.trim()) {
                // 插入块级公式
                vditor.insertValue(`$$${latex}$$`);
            }
            closeFormulaDialog();
        }

        // --- 绑定事件 ---
        document.getElementById('formula-insert').addEventListener('click', insertFormula);
        document.getElementById('formula-cancel').addEventListener('click', closeFormulaDialog);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeFormulaDialog();
        });
        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                insertFormula();
            }
            if (e.key === 'Escape') {
                closeFormulaDialog();
            }
        });

        // 暴露实例便于调试
        window.vditor = vditor;
        window.mathField = mathField;
        console.log('💡 点击工具栏的 Σ 按钮打开可视化公式编辑器');
        console.log('📖 使用 MathLive v0.110.0 的 MathfieldElement');
    </script>

</body>

</html>
