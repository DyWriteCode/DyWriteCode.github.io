<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vditor + MathLive 公式编辑器</title>

    <!-- Vditor 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/index.css?v=20260820040254" />
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/js/highlight.js/styles/github.css?v=20260820040254" />

    <!-- MathLive 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive/dist/mathlive.core.css?v=20260820040254" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive/dist/mathlive.css?v=20260820040254" />

    <style>
        /* --- 全局重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #vditor {
            height: 100vh;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }

        .vditor {
            border: none !important;
            border-radius: 0 !important;
        }

        .vditor .vditor-reset {
            font-size: 16px;
            line-height: 1.8;
        }

        /* 对话框样式 - 移动端优化 */
        #formula-dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        #formula-dialog-overlay.active {
            display: flex;
        }

        #formula-dialog {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            width: 92%;
            max-width: 600px;
            max-height: 90vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #formula-dialog h3 {
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #1f2328;
            flex-shrink: 0;
        }

        .math-field-container {
            border: 2px solid #d0d7de;
            border-radius: 8px;
            padding: 10px;
            min-height: 70px;
            background: #fafbfc;
            transition: border-color 0.2s;
            flex-shrink: 0;
        }

        .math-field-container:focus-within {
            border-color: #0969da;
        }

        math-field {
            width: 100%;
            min-height: 50px;
            font-size: 20px;
            display: block;
            touch-action: manipulation;
        }

        /* 隐藏虚拟键盘切换按钮 */
        math-field::part(virtual-keyboard-toggle) {
            display: none !important;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
            flex-shrink: 0;
        }

        .dialog-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            touch-action: manipulation;
            min-height: 44px;
        }

        .btn-cancel {
            background: #f6f8fa;
            color: #24292f;
        }

        .btn-cancel:hover {
            background: #eaeef2;
        }

        .btn-insert {
            background: #0969da;
            color: #ffffff;
        }

        .btn-insert:hover {
            background: #0550ae;
        }

        .hint {
            font-size: 13px;
            color: #57606a;
            margin-top: 8px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            #vditor {
                max-width: 100%;
            }

            .vditor-reset {
                font-size: 17px !important;
                padding: 20px !important;
            }

            #formula-dialog {
                width: 95%;
                padding: 16px;
                border-radius: 16px;
            }

            math-field {
                font-size: 18px;
                min-height: 44px;
            }

            .dialog-actions button {
                font-size: 14px;
                padding: 8px 16px;
                min-height: 40px;
            }
        }

        @media (max-width: 420px) {
            #formula-dialog {
                padding: 12px;
            }

            math-field {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div id="vditor"></div>

    <div id="formula-dialog-overlay">
        <div id="formula-dialog">
            <h3>🧮 公式编辑器</h3>
            <p style="color:#57606a;font-size:14px;margin-bottom:10px;">输入 LaTeX 命令，实时预览</p>
            <div class="math-field-container" id="math-field-container"></div>
            <div class="hint">💡 示例：\frac{1}{2} 或 \sqrt{x}</div>
            <div class="dialog-actions">
                <button class="btn-cancel" id="formula-cancel">取消</button>
                <button class="btn-insert" id="formula-insert">插入</button>
            </div>
        </div>
    </div>

    <!-- Vditor -->
    <script src="https://unpkg.com/vditor@3.10.9/dist/index.min.js?v=20260820040254"></script>

    <!-- MathLive -->
    <script src="https://cdn.jsdelivr.net/npm/mathlive?v=20260820040254"></script>

    <script>
        // ============================================================
        //  1. 等待 MathLive 加载完成
        // ============================================================
        function waitForMathLive(callback) {
            if (typeof MathfieldElement !== 'undefined') {
                callback();
                return;
            }
            const check = setInterval(() => {
                if (typeof MathfieldElement !== 'undefined') {
                    clearInterval(check);
                    callback();
                }
            }, 100);
            setTimeout(() => {
                clearInterval(check);
                console.error('MathLive 加载超时');
                alert('公式编辑器加载超时，请刷新页面重试。');
            }, 10000);
        }

        // ============================================================
        //  2. 初始化 Vditor
        // ============================================================
        const vditor = new Vditor('vditor', {
            mode: 'ir',
            theme: 'classic',
            icon: 'ant',
            height: '100%',
            value: [
                '# 欢迎使用 Vditor + MathLive 🎉',
                '点击工具栏的 **Σ** 按钮，打开可视化公式编辑器（已汉化，无虚拟键盘）。',
                '## 示例公式',
                '行内公式：$E = mc^2$',
                '块级公式：$$\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}$$',
                '试试用公式编辑器插入你的公式吧！'
            ].join('\n'),
            cache: { enable: true, id: 'vditor-mathlive-demo' },
            preview: {
                delay: 500,
                maxWidth: 800,
                mode: 'both',
                math: { engine: 'KaTeX' },
                hljs: { style: 'github' }
            },
            toolbar: [
                'emoji', 'headings', 'bold', 'italic', 'strike', '|',
                'line', 'quote', 'list', 'ordered-list', 'check', '|',
                'code', 'inline-code', '|',
                {
                    name: 'formula',
                    icon: '<span style="font-weight:bold;font-size:16px;">Σ</span>',
                    tip: '可视化公式编辑器',
                    tipPosition: 's',
                    click: () => {
                        saveCursorPosition();
                        waitForMathLive(() => {
                            openFormulaDialog();
                        });
                    }
                },
                '|', 'upload', 'link', 'table', '|',
                'undo', 'redo', '|',
                {
                    name: 'more',
                    toolbar: ['edit-mode', 'both', 'preview', 'fullscreen', 'outline', 'export', 'info']
                }
            ],
            counter: { enable: true, type: 'markdown' },
            upload: {
                accept: 'image/*',
                handler: (files) => {
                    const file = files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        vditor.insertValue(`![${file.name}](${e.target.result})`);
                    };
                    reader.readAsDataURL(file);
                }
            },
            outline: { enable: true, position: 'left' },
            typewriterMode: true,
            after: () => {
                console.log('✅ Vditor 已启动！');
                waitForMathLive(() => console.log('✅ MathLive 已就绪'));
            }
        });

        // ============================================================
        //  3. 光标位置管理
        // ============================================================
        let savedCursorRange = null;
        function saveCursorPosition() {
            try {
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0) {
                    savedCursorRange = selection.getRangeAt(0).cloneRange();
                }
            } catch (e) { console.warn('保存光标位置失败:', e); }
        }
        function restoreCursorPosition() {
            try {
                if (savedCursorRange) {
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(savedCursorRange);
                    savedCursorRange = null;
                    return true;
                }
            } catch (e) { console.warn('恢复光标位置失败:', e); }
            return false;
        }

        // ============================================================
        //  4. 公式对话框逻辑（直接在实例中配置 locale 和 virtualKeyboardPolicy）
        // ============================================================
        const overlay = document.getElementById('formula-dialog-overlay');
        const container = document.getElementById('math-field-container');
        let mathField = null;

        function createMathField() {
            if (mathField) {
                mathField.value = '';
                return mathField;
            }
            // ★ 创建实例时直接指定 locale 和 virtualKeyboardPolicy ★
            mathField = new MathfieldElement({
                locale: 'zh-CN',                // 中文界面
                virtualKeyboardPolicy: 'off',   // 关闭虚拟键盘
                smartFence: true,
            });
            mathField.style.width = '100%';
            mathField.style.minHeight = '50px';
            mathField.style.fontSize = '20px';
            mathField.value = '';
            container.appendChild(mathField);
            mathField.addEventListener('input', () => { });
            return mathField;
        }

        function openFormulaDialog() {
            overlay.classList.add('active');
            try {
                const mf = createMathField();
                mf.value = '';
                setTimeout(() => mf.focus(), 150);
            } catch (e) {
                console.error(e);
                alert('公式编辑器初始化失败，请刷新页面重试。');
            }
        }

        function closeFormulaDialog() {
            overlay.classList.remove('active');
            if (mathField) mathField.blur();
        }

        // ============================================================
        //  5. 插入公式到光标位置
        // ============================================================
        function insertFormula() {
            if (!mathField) return;
            const latex = mathField.value;
            if (latex && latex.trim()) {
                closeFormulaDialog();
                setTimeout(() => {
                    const restored = restoreCursorPosition();
                    if (!restored) {
                        const editorElement = document.querySelector('.vditor');
                        if (editorElement) {
                            editorElement.click();
                            setTimeout(() => {
                                vditor.focus();
                                vditor.insertValue(`$$${latex}$$`);
                            }, 50);
                            return;
                        }
                    }
                    vditor.focus();
                    vditor.insertValue(`$$${latex}$$`);
                }, 120);
            } else {
                closeFormulaDialog();
            }
        }

        // --- 事件绑定 ---
        document.getElementById('formula-insert').addEventListener('click', (e) => {
            e.stopPropagation();
            insertFormula();
        });
        document.getElementById('formula-cancel').addEventListener('click', (e) => {
            e.stopPropagation();
            closeFormulaDialog();
        });
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeFormulaDialog();
        });
        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                insertFormula();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                e.stopPropagation();
                closeFormulaDialog();
            }
        });

        window.vditor = vditor;
        window.mathField = mathField;
        console.log('💡 点击工具栏 Σ 打开公式编辑器（已汉化，虚拟键盘已禁用）');
    </script>

</body>

</html>
