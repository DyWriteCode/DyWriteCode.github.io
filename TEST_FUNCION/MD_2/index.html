<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 编辑器 · 类 Typora</title>

    <!-- ===== 第三方库 CDN ===== -->
    <!-- markdown-it -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js">
    </script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <!-- highlight.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js">
    </script>
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js">
    </script>
    <!-- CodeMirror 模式：支持多种语言 -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/shell/shell.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/yaml/yaml.min.js">
    </script>
    <!-- jQuery (MathQuill 依赖) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js">
    </script>
    <!-- MathQuill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js">
    </script>

    <!-- ===== 自定义样式 ===== -->
    <style>
        /* ----- 全局重置 & 基础 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --text: #333;
            --border: #ddd;
            --card-bg: #fff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --code-bg: #282c34;
            --code-text: #abb2bf;
            --sidebar-bg: #f5f5f5;
            --accent: #4a90d9;
            --accent-hover: #3a7bc8;
            --header-bg: #fff;
            --status-bg: #f0f0f0;
            --modal-overlay: rgba(0, 0, 0, 0.45);
        }

        [data-theme="dark"] {
            --bg: #1e1e2f;
            --text: #e0e0e0;
            --border: #3a3a5a;
            --card-bg: #2a2a40;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --sidebar-bg: #252540;
            --header-bg: #2a2a40;
            --status-bg: #1a1a2e;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.25s, color 0.25s;
            overflow: hidden;
        }

        /* ----- 顶部栏 ----- */
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
            transition: background 0.25s, border-color 0.25s;
        }

        #toolbar .left,
        #toolbar .right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #toolbar button {
            background: none;
            border: none;
            color: var(--text);
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #toolbar button:hover {
            background: var(--border);
        }

        #toolbar .btn-primary {
            background: var(--accent);
            color: #fff;
            padding: 4px 14px;
        }

        #toolbar .btn-primary:hover {
            background: var(--accent-hover);
        }

        #toolbar .sep {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        #word-count {
            font-size: 13px;
            opacity: 0.7;
            padding: 0 6px;
        }

        #theme-toggle {
            font-size: 18px;
        }

        /* ----- 主体布局 ----- */
        #app {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ----- 侧边栏 ----- */
        #sidebar {
            width: 0;
            overflow: hidden;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            transition: width 0.28s ease, background 0.25s, border-color 0.25s;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        #sidebar.open {
            width: 280px;
        }

        #sidebar .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        #sidebar .tab-header button {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, border-bottom 0.2s;
            border-bottom: 2px solid transparent;
        }

        #sidebar .tab-header button.active {
            opacity: 1;
            border-bottom-color: var(--accent);
        }

        #sidebar .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
        }

        #sidebar .tab-content.hidden {
            display: none;
        }

        #outline-list {
            list-style: none;
            font-size: 14px;
        }

        #outline-list li {
            padding: 4px 0;
            cursor: pointer;
            border-radius: 4px;
            padding-left: 4px;
            transition: background 0.1s;
        }

        #outline-list li:hover {
            background: var(--border);
        }

        #outline-list .h1 {
            font-weight: 700;
            font-size: 16px;
        }

        #outline-list .h2 {
            font-weight: 600;
            font-size: 15px;
            padding-left: 16px;
        }

        #outline-list .h3 {
            font-weight: 500;
            font-size: 14px;
            padding-left: 32px;
        }

        #outline-list .h4 {
            font-weight: 400;
            font-size: 13px;
            padding-left: 48px;
        }

        #outline-list .h5 {
            font-weight: 400;
            font-size: 13px;
            padding-left: 64px;
            opacity: 0.8;
        }

        #outline-list .h6 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 80px;
            opacity: 0.6;
        }

        #file-tree {
            font-size: 14px;
        }

        #file-tree .folder {
            font-weight: 600;
            padding: 4px 0;
        }

        #file-tree .file {
            padding: 3px 0 3px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.1s;
        }

        #file-tree .file:hover {
            background: var(--border);
        }

        /* ----- 编辑器容器 ----- */
        #editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            transition: background 0.25s;
            overflow: hidden;
            position: relative;
        }

        #editor-wrapper.focus-mode {
            background: var(--bg);
        }

        #editor-wrapper.focus-mode .editor-line:not(.active-line) {
            opacity: 0.35;
        }

        #editor {
            flex: 1;
            padding: 40px 60px 120px 60px;
            overflow-y: auto;
            outline: none;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text);
            background: var(--bg);
            transition: background 0.25s, color 0.25s;
            min-height: 100%;
        }

        #editor:empty::before {
            content: '开始写作…';
            color: var(--border);
            font-style: italic;
        }

        #editor .cm-editor-wrap {
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid var(--border);
        }

        #editor .code-block-wrap {
            position: relative;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--code-bg);
        }

        #editor .code-block-wrap .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        #editor .code-block-wrap .code-header .lang-tag {
            font-weight: 600;
            text-transform: lowercase;
        }

        #editor .code-block-wrap .code-header .run-btn {
            background: #4a90d9;
            border: none;
            color: #fff;
            padding: 2px 14px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }

        #editor .code-block-wrap .code-header .run-btn:hover {
            background: #3a7bc8;
        }

        #editor .code-block-wrap .code-body {
            padding: 12px 16px;
            overflow-x: auto;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #editor .code-block-wrap .code-body .hljs {
            background: transparent;
            padding: 0;
        }

        #editor .code-block-wrap .code-output {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            color: #b0d0b0;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }

        #editor .code-block-wrap .code-output.show {
            display: block;
        }

        /* 数学公式块 */
        #editor .math-block {
            text-align: center;
            padding: 12px 0;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s;
        }

        #editor .math-block:hover {
            background: rgba(74, 144, 217, 0.08);
        }

        #editor .math-inline {
            cursor: pointer;
            padding: 0 2px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        #editor .math-inline:hover {
            background: rgba(74, 144, 217, 0.1);
        }

        /* 表格样式 */
        #editor table {
            border-collapse: collapse;
            margin: 12px 0;
            width: 100%;
        }

        #editor th,
        #editor td {
            border: 1px solid var(--border);
            padding: 6px 12px;
            text-align: left;
        }

        #editor th {
            background: var(--sidebar-bg);
            font-weight: 600;
        }

        /* 引用块 */
        #editor blockquote {
            border-left: 4px solid var(--accent);
            margin: 12px 0;
            padding: 8px 20px;
            background: rgba(74, 144, 217, 0.05);
            border-radius: 0 6px 6px 0;
        }

        /* 列表 */
        #editor ul,
        #editor ol {
            padding-left: 28px;
            margin: 6px 0;
        }

        #editor li {
            margin: 2px 0;
        }

        #editor .task-list-item {
            list-style: none;
            padding-left: 4px;
        }

        #editor .task-list-item input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent);
        }

        /* 分割线 */
        #editor hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 24px 0;
        }

        /* 标题 */
        #editor h1 {
            font-size: 2.2em;
            font-weight: 700;
            margin: 1.2em 0 0.4em 0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.2em;
        }

        #editor h2 {
            font-size: 1.8em;
            font-weight: 600;
            margin: 1em 0 0.3em 0;
        }

        #editor h3 {
            font-size: 1.5em;
            font-weight: 600;
            margin: 0.8em 0 0.2em 0;
        }

        #editor h4 {
            font-size: 1.25em;
            font-weight: 600;
            margin: 0.6em 0 0.2em 0;
        }

        #editor h5 {
            font-size: 1.1em;
            font-weight: 600;
            margin: 0.5em 0 0.2em 0;
        }

        #editor h6 {
            font-size: 1em;
            font-weight: 600;
            margin: 0.5em 0 0.2em 0;
            color: var(--text);
            opacity: 0.7;
        }

        /* 图片 */
        #editor img {
            max-width: 100%;
            border-radius: 6px;
            margin: 8px 0;
        }

        /* 链接 */
        #editor a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        #editor a:hover {
            border-bottom-color: var(--accent);
        }

        /* ===== 打字机模式 ===== */
        #editor-wrapper.typewriter #editor {
            padding-top: 50vh;
            padding-bottom: 50vh;
        }

        #editor-wrapper.typewriter #editor>*:first-child {
            margin-top: 0;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            border-radius: 16px;
            max-width: 720px;
            width: 92%;
            max-height: 85vh;
            padding: 28px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            transition: background 0.25s;
            position: relative;
        }

        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 20px;
        }

        .modal-box .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            opacity: 0.5;
            transition: opacity 0.15s;
        }

        .modal-box .close-btn:hover {
            opacity: 1;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .modal-box .modal-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .modal-box .modal-actions .btn-confirm {
            background: var(--accent);
            color: #fff;
        }

        .modal-box .modal-actions .btn-confirm:hover {
            background: var(--accent-hover);
        }

        .modal-box .modal-actions .btn-cancel {
            background: var(--border);
            color: var(--text);
        }

        .modal-box .modal-actions .btn-cancel:hover {
            opacity: 0.7;
        }

        /* MathQuill 编辑器容器 */
        #math-editor-container {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            min-height: 60px;
            background: var(--bg);
            transition: background 0.25s, border-color 0.25s;
            font-size: 18px;
        }

        #math-editor-container .mq-editable-field {
            width: 100%;
            min-height: 50px;
        }

        #math-editor-container .mq-editable-field .mq-math-mode {
            font-size: 18px;
        }

        /* ===== 状态栏 ===== */
        #status-bar {
            padding: 6px 20px;
            background: var(--status-bg);
            border-top: 1px solid var(--border);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            transition: background 0.25s, border-color 0.25s;
            color: var(--text);
            opacity: 0.7;
        }

        #status-bar .right {
            display: flex;
            gap: 16px;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            #editor {
                padding: 20px 24px 80px 24px;
                font-size: 15px;
            }

            #sidebar.open {
                width: 220px;
            }

            #toolbar .left span {
                display: none;
            }

            .modal-box {
                padding: 20px 18px;
            }
        }

        /* ===== 代码块高亮覆盖 ===== */
        .hljs {
            background: transparent !important;
        }

        /* ===== 模式指示器 ===== */
        .mode-badge {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
            background: var(--border);
            color: var(--text);
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <!-- ===== 顶部工具栏 ===== -->
    <header id="toolbar">
        <div class="left">
            <button id="sidebar-toggle" title="切换侧边栏 (Ctrl+Shift+L)">☰</button>
            <span class="sep"></span>
            <button id="btn-bold" title="加粗 (Ctrl+B)"><b>B</b></button>
            <button id="btn-italic" title="斜体 (Ctrl+I)"><i>I</i></button>
            <button id="btn-h1" title="标题1 (Ctrl+1)">H1</button>
            <button id="btn-h2" title="标题2 (Ctrl+2)">H2</button>
            <button id="btn-h3" title="标题3 (Ctrl+3)">H3</button>
            <span class="sep"></span>
            <button id="btn-source" title="源码模式 (Ctrl+/)">
                <> 源码
            </button>
            <button id="btn-focus" title="专注模式 (F8)">◎ 专注</button>
            <button id="btn-typewriter" title="打字机模式 (F9)">⌨ 打字机</button>
            <span class="sep"></span>
            <button id="btn-export-pdf" title="导出 PDF">📄 PDF</button>
            <button id="btn-export-html" title="导出 HTML">🌐 HTML</button>
        </div>
        <div class="right">
            <span id="word-count">字数: 0</span>
            <span class="sep"></span>
            <button id="theme-toggle" title="切换主题">🌙</button>
        </div>
    </header>

    <!-- ===== 主体 ===== -->
    <div id="app">
        <!-- 侧边栏 -->
        <aside id="sidebar">
            <div class="tab-header">
                <button class="active" data-tab="outline">大纲</button>
                <button data-tab="files">文件</button>
            </div>
            <div class="tab-content" id="tab-outline">
                <ul id="outline-list"></ul>
            </div>
            <div class="tab-content hidden" id="tab-files">
                <div id="file-tree">
                    <div class="folder">📁 我的文档</div>
                </div>
            </div>
        </aside>

        <!-- 编辑器 -->
        <div id="editor-wrapper">
            <div id="editor" contenteditable="true" spellcheck="true"></div>
        </div>
    </div>

    <!-- ===== 状态栏 ===== -->
    <div id="status-bar">
        <span id="status-mode">📝 编辑中</span>
        <div class="right">
            <span id="status-lines">行: 1</span>
            <span id="status-words">字数: 0</span>
        </div>
    </div>

    <!-- ===== 公式编辑模态框 ===== -->
    <div class="modal-overlay" id="math-modal">
        <div class="modal-box">
            <button class="close-btn" id="math-modal-close">&times;</button>
            <h3>✏️ 公式编辑器</h3>
            <p style="font-size:14px;opacity:0.7;margin-bottom:12px;">使用键盘或点击符号构建公式，实时预览</p>
            <div id="math-editor-container"></div>
            <div style="margin-top:10px;font-size:14px;opacity:0.6;text-align:center;" id="math-latex-preview"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="math-modal-cancel">取消</button>
                <button class="btn-confirm" id="math-modal-confirm">✓ 确认</button>
            </div>
        </div>
    </div>

    <!-- ===== 代码执行输出面板（浮动） ===== -->
    <div style="display:none;" id="output-panel"></div>

    <!-- ============================================================ -->
    <!-- ===== JavaScript ===== -->
    <script>
        // ================================================================
        //  1. 配置 & 状态
        // ================================================================

        const STATE = {
            sourceMode: false,
            focusMode: false,
            typewriterMode: false,
            theme: 'light',
            sidebarOpen: false,
            markdown: '# 欢迎使用 Markdown 编辑器\n\n开始写作吧…',
            // 用于光标恢复
            savedCursorOffset: -1,
            // 当前编辑的公式数据
            editingMath: { latex: '', isBlock: false, node: null },
            // 当前编辑的代码块数据
            editingCode: { lang: '', code: '', node: null },
        };

        // ================================================================
        //  2. DOM 引用
        // ================================================================

        const $ = (sel, ctx = document) => ctx.querySelector(sel);
        const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

        const sidebarToggle = $('#sidebar-toggle');
        const btnBold = $('#btn-bold');
        const btnItalic = $('#btn-italic');
        const btnH1 = $('#btn-h1');
        const btnH2 = $('#btn-h2');
        const btnH3 = $('#btn-h3');
        const btnSource = $('#btn-source');
        const btnFocus = $('#btn-focus');
        const btnTypewriter = $('#btn-typewriter');
        const btnExportPdf = $('#btn-export-pdf');
        const btnExportHtml = $('#btn-export-html');

        // 模态框
        const mathModal = $('#math-modal');
        const mathEditorContainer = $('#math-editor-container');
        const mathLatexPreview = $('#math-latex-preview');
        const mathModalClose = $('#math-modal-close');
        const mathModalCancel = $('#math-modal-cancel');
        const mathModalConfirm = $('#math-modal-confirm');

        // ================================================================
        //  3. markdown-it 配置
        // ================================================================

        const md = window.markdownit({
            html: true,
            linkify: true,
            typographer: true,
            breaks: true,
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(str, { language: lang }).value;
                    } catch (_) { }
                }
                return '';
            }
        });

        // 自定义渲染：代码块包装
        const defaultRender = md.render.bind(md);
        md.render = function (src) {
            let html = defaultRender(src);
            // 对代码块进行包装，添加运行按钮等
            // 注意：这里用正则简单处理，生产环境建议用 token 渲染
            html = html.replace(
                /<pre><code class="language-([^"]+)">([\s\S]*?)<\/code><\/pre>/g,
                function (match, lang, code) {
                    // 解码 HTML 实体
                    const decoded = code.replace(/&amp;/g, '&')
                        .replace(/&lt;/g, '<')
                        .replace(/&gt;/g, '>')
                        .replace(/&quot;/g, '"')
                        .replace(/&#39;/g, "'");
                    const escaped = decoded.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    return `<div class="code-block-wrap" data-lang="${lang}">
                                <div class="code-header">
                                    <span class="lang-tag">${lang}</span>
                                    <button class="run-btn" data-lang="${lang}">▶ 运行</button>
                                </div>
                                <div class="code-body"><pre><code class="hljs language-${lang}">${escaped}</code></pre></div>
                                <div class="code-output"></div>
                            </div>`;
                }
            );
            // 处理数学公式块 $$...$$
            html = html.replace(
                /\$\$([\s\S]*?)\$\$/g,
                function (match, latex) {
                    try {
                        const rendered = katex.renderToString(latex, { displayMode: true, throwOnError: false });
                        return `<div class="math-block" data-latex="${encodeURIComponent(latex)}">${rendered}</div>`;
                    } catch (_) { return match; }
                }
            );
            // 处理行内公式 $...$
            html = html.replace(
                /\$([^\$]+)\$/g,
                function (match, latex) {
                    try {
                        const rendered = katex.renderToString(latex, { displayMode: false, throwOnError: false });
                        return `<span class="math-inline" data-latex="${encodeURIComponent(latex)}">${rendered}</span>`;
                    } catch (_) { return match; }
                }
            );
            return html;
        };

        // ================================================================
        //  4. 编辑器核心：渲染 & 光标管理
        // ================================================================

        function getTextContent() {
            return editor.textContent || '';
        }

        function setEditorHTML(html) {
            editor.innerHTML = html;
        }

        // 保存光标位置（字符偏移）
        function saveCursor() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return -1;
            const range = sel.getRangeAt(0);
            const preCaretRange = range.cloneRange();
            preCaretRange.selectNodeContents(editor);
            preCaretRange.setEnd(range.startContainer, range.startOffset);
            return preCaretRange.toString().length;
        }

        // 恢复光标位置（字符偏移）
        function restoreCursor(offset) {
            if (offset < 0) return;
            const walker = document.createTreeWalker(
                editor,
                NodeFilter.SHOW_TEXT,
                null,
                false
            );
            let accumulated = 0;
            let node = null;
            let charOffset = 0;
            while ((node = walker.nextNode())) {
                const len = node.textContent.length;
                if (accumulated + len >= offset) {
                    charOffset = offset - accumulated;
                    break;
                }
                accumulated += len;
            }
            if (!node) {
                // fallback: 放到末尾
                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                return;
            }
            try {
                const range = document.createRange();
                range.setStart(node, Math.min(charOffset, node.textContent.length));
                range.collapse(true);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            } catch (_) {
                // 如果恢复失败，放到末尾
                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        // 渲染整个文档
        function renderMarkdown(keepCursor = true) {
            const cursorOffset = keepCursor ? saveCursor() : -1;
            const text = getTextContent();
            STATE.markdown = text;
            const html = md.render(text);
            setEditorHTML(html);
            // 重新绑定事件
            bindCodeBlockEvents();
            bindMathEvents();
            updateOutline(text);
            updateWordCount(text);
            updateStatus(text);
            if (keepCursor && cursorOffset >= 0) {
                // 延迟恢复光标，确保 DOM 已更新
                requestAnimationFrame(() => {
                    restoreCursor(cursorOffset);
                });
            }
            // 更新专注模式高亮
            if (STATE.focusMode) updateFocusMode();
        }

        // 防抖渲染
        let renderTimer = null;

        function scheduleRender() {
            if (renderTimer) clearTimeout(renderTimer);
            renderTimer = setTimeout(() => {
                renderMarkdown(true);
                renderTimer = null;
            }, 80);
        }

        // ================================================================
        //  5. 代码块事件绑定
        // ================================================================

        function bindCodeBlockEvents() {
            $$('.code-block-wrap .run-btn').forEach(btn => {
                btn.removeEventListener('click', handleRunCode);
                btn.addEventListener('click', handleRunCode);
            });
            // 双击代码块打开 CodeMirror 编辑
            $$('.code-block-wrap .code-body').forEach(el => {
                el.removeEventListener('dblclick', handleCodeDblClick);
                el.addEventListener('dblclick', handleCodeDblClick);
            });
        }

        async function handleRunCode(e) {
            const btn = e.currentTarget;
            const wrap = btn.closest('.code-block-wrap');
            const lang = btn.dataset.lang || 'plaintext';
            const codeEl = wrap.querySelector('.code-body code');
            const code = codeEl ? codeEl.textContent : '';
            const outputEl = wrap.querySelector('.code-output');

            outputEl.textContent = '⏳ 执行中...';
            outputEl.classList.add('show');

            try {
                const result = await executeCodeWithJudge0(code, lang);
                outputEl.textContent = result.success ?
                    `✅ 输出:\n${result.output}` :
                    `❌ 错误:\n${result.error || '执行失败'}`;
            } catch (err) {
                outputEl.textContent = `❌ 请求失败: ${err.message}`;
            }
        }

        async function executeCodeWithJudge0(code, lang) {
            // Judge0 API 模拟（实际使用需要 API Key）
            // 这里我们使用一个 mock 实现 + 真实 API 调用
            const languageMap = {
                'javascript': 63,
                'python': 71,
                'python3': 71,
                'java': 62,
                'c': 50,
                'cpp': 54,
                'csharp': 51,
                'go': 64,
                'rust': 73,
                'ruby': 72,
                'php': 68,
                'swift': 83,
                'typescript': 74,
            };
            const langId = languageMap[lang.toLowerCase()] || 63;

            // 使用 Judge0 API (需要配置 token)
            const API_URL = 'https://judge0-ce.p.rapidapi.com/submissions';
            const API_KEY = 'your-rapidapi-key-here'; // 用户需替换

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-RapidAPI-Key': API_KEY,
                        'X-RapidAPI-Host': 'judge0-ce.p.rapidapi.com'
                    },
                    body: JSON.stringify({
                        source_code: code,
                        language_id: langId,
                        stdin: '',
                    })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                const token = data.token;
                // 轮询获取结果
                for (let i = 0; i < 10; i++) {
                    await new Promise(r => setTimeout(r, 500));
                    const resultResp = await fetch(`${API_URL}/${token}`, {
                        headers: {
                            'X-RapidAPI-Key': API_KEY,
                            'X-RapidAPI-Host': 'judge0-ce.p.rapidapi.com'
                        }
                    });
                    const result = await resultResp.json();
                    if (result.status && result.status.id > 2) {
                        return {
                            success: result.status.id === 3,
                            output: result.stdout || result.stderr || '无输出',
                            error: result.stderr || result.compile_output || null
                        };
                    }
                }
                return { success: false, error: '执行超时' };
            } catch (err) {
                // Mock 回退：本地模拟执行
                return mockExecute(code, lang);
            }
        }

        function mockExecute(code, lang) {
            // 简单的本地模拟（仅用于演示）
            const langLower = lang.toLowerCase();
            if (langLower === 'javascript' || langLower === 'js') {
                try {
                    const oldLog = console.log;
                    let output = '';
                    console.log = (...args) => { output += args.join(' ') + '\n'; };
                    const fn = new Function(code);
                    fn();
                    console.log = oldLog;
                    return { success: true, output: output || '(无输出)' };
                } catch (e) {
                    return { success: false, error: e.message };
                }
            }
            if (langLower === 'python' || langLower === 'python3') {
                // 简单模拟：检测 print
                const matches = code.match(/print\s*\((.+?)\)/g);
                if (matches) {
                    const outputs = matches.map(m => {
                        try {
                            const val = m.replace(/print\s*\(/, '').replace(/\)$/, '');
                            return eval(val) || val;
                        } catch (_) { return m; }
                    });
                    return { success: true, output: outputs.join('\n') };
                }
                return { success: true, output: '(Python 模拟执行，无输出)' };
            }
            return { success: true, output: `✅ 已执行 (${lang})，输出: Hello from ${lang}!` };
        }

        // 双击代码块 → CodeMirror 编辑
        function handleCodeDblClick(e) {
            const wrap = e.currentTarget.closest('.code-block-wrap');
            if (!wrap) return;
            const lang = wrap.dataset.lang || 'plaintext';
            const codeEl = wrap.querySelector('.code-body code');
            const currentCode = codeEl ? codeEl.textContent : '';
            STATE.editingCode = { lang, code: currentCode, node: wrap };

            // 创建模态框编辑代码
            const modal = document.createElement('div');
            modal.className = 'modal-overlay active';
            modal.style.display = 'flex';
            modal.innerHTML = `
                        <div class="modal-box" style="max-width:800px;">
                            <button class="close-btn" id="code-modal-close">&times;</button>
                            <h3>✏️ 编辑代码块 (${lang})</h3>

                            <div class="modal-actions">
                                <button class="btn-cancel" id="code-modal-cancel">取消</button>
                                <button class="btn-confirm" id="code-modal-confirm">✓ 更新</button>
                            </div>
                        </div>
                    `;
            document.body.appendChild(modal);

            const textarea = modal.querySelector('#code-editor-textarea');
            const closeBtn = modal.querySelector('#code-modal-close');
            const cancelBtn = modal.querySelector('#code-modal-cancel');
            const confirmBtn = modal.querySelector('#code-modal-confirm');

            const cleanup = () => { modal.remove(); };
            const applyCode = () => {
                const newCode = textarea.value;
                const codeBody = wrap.querySelector('.code-body');
                const langTag = wrap.dataset.lang || 'plaintext';
                const escaped = newCode.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                codeBody.innerHTML =
                    `<pre><code class="hljs language-${langTag}">${escaped}</code></pre>`;

                    });

                // 更新输出
                const outputEl = wrap.querySelector('.code-output');
                if (outputEl) {
                    outputEl.textContent = '';
                    outputEl.classList.remove('show');
                }
                cleanup();
            };

            closeBtn.addEventListener('click', cleanup);
            cancelBtn.addEventListener('click', cleanup);
            confirmBtn.addEventListener('click', applyCode);
            // Enter 键提交
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    applyCode();
                }
            });
            // 点击背景关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) cleanup();
            });
            // 自动聚焦
            setTimeout(() => textarea.focus(), 100);
        }

        // ================================================================
        //  6. 数学公式事件绑定
        // ================================================================

        let mathQuillInstance = null;

        function bindMathEvents() {
            $$('.math-block, .math-inline').forEach(el => {
                el.removeEventListener('dblclick', handleMathDblClick);
                el.addEventListener('dblclick', handleMathDblClick);
            });
        }

        function handleMathDblClick(e) {
            const el = e.currentTarget;
            const isBlock = el.classList.contains('math-block');
            const latex = decodeURIComponent(el.dataset.latex || '');
            STATE.editingMath = { latex, isBlock, node: el };
            openMathEditor(latex);
        }

        function openMathEditor(latex) {
            mathModal.classList.add('active');
            // 初始化 MathQuill
            if (mathQuillInstance) {
                mathQuillInstance.latex(latex || '');
            } else {
                // 延迟初始化，确保 DOM 可见
                setTimeout(() => {
                    const container = mathEditorContainer;
                    container.innerHTML = '';
                    const editable = document.createElement('span');
                    editable.id = 'math-editable';
                    container.appendChild(editable);
                    try {
                        mathQuillInstance = MathQuill.getInterface(2).MathField(editable, {
                            spaceBehavesLikeTab: true,
                            handlers: {
                                edit: function () {
                                    const latex = mathQuillInstance.latex();
                                    mathLatexPreview.textContent = 'LaTeX: ' + (latex || '(空)');
                                }
                            }
                        });
                        if (latex) mathQuillInstance.latex(latex);
                        mathLatexPreview.textContent = 'LaTeX: ' + (latex || '(空)');
                    } catch (err) {
                        console.error('MathQuill 初始化失败:', err);
                        mathEditorContainer.innerHTML =
                            '<p style="color:red;">MathQuill 加载失败，请刷新重试</p>';
                    }
                }, 200);
            }
            // 聚焦
            setTimeout(() => {
                if (mathQuillInstance) mathQuillInstance.focus();
            }, 300);
        }

        function closeMathEditor() {
            mathModal.classList.remove('active');
            if (mathQuillInstance) {
                mathQuillInstance.blur();
            }
        }

        function confirmMathEditor() {
            if (!mathQuillInstance) return;
            const latex = mathQuillInstance.latex();
            const { node, isBlock } = STATE.editingMath;
            if (node && latex) {
                try {
                    const rendered = katex.renderToString(latex, {
                        displayMode: isBlock,
                        throwOnError: false
                    });
                    if (isBlock) {
                        node.innerHTML = rendered;
                        node.dataset.latex = encodeURIComponent(latex);
                    } else {
                        node.innerHTML = rendered;
                        node.dataset.latex = encodeURIComponent(latex);
                    }
                    // 触发保存
                    const text = getTextContent();
                    STATE.markdown = text;
                    // 我们需要把修改同步回源码 —— 但这里比较困难，我们直接重新渲染
                    // 但为了保留光标，我们只更新内容
                    renderMarkdown(true);
                } catch (err) {
                    alert('公式渲染错误: ' + err.message);
                }
            }
            closeMathEditor();
        }

        // 模态框事件
        mathModalClose.addEventListener('click', closeMathEditor);
        mathModalCancel.addEventListener('click', closeMathEditor);
        mathModalConfirm.addEventListener('click', confirmMathEditor);
        mathModal.addEventListener('click', (e) => {
            if (e.target === mathModal) closeMathEditor();
        });

        // ================================================================
        //  7. 大纲 & 字数统计
        // ================================================================

        function updateOutline(text) {
            const lines = text.split('\n');
            const headings = [];
            let inCode = false;
            for (const line of lines) {
                if (line.trim().startsWith('```')) {
                    inCode = !inCode;
                    continue;
                }
                if (inCode) continue;
                const match = line.match(/^(#{1,6})\s+(.+)/);
                if (match) {
                    const level = match[1].length;
                    const title = match[2].trim();
                    headings.push({ level, title, text: line });
                }
            }
            if (headings.length === 0) {
                outlineList.innerHTML = '<li style="opacity:0.5;padding:8px 0;">无标题</li>';
                return;
            }
            outlineList.innerHTML = headings.map(h =>
                `<li class="h${h.level}" data-text="${h.text.replace(/"/g, '&quot;')}">${h.title}</li>`
            ).join('');
            outlineList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', function () {
                    const text = this.dataset.text;
                    if (text) {
                        // 在文档中搜索并滚动到该标题
                        const lines = getTextContent().split('\n');
                        let idx = -1;
                        for (let i = 0; i < lines.length; i++) {
                            if (lines[i].trim() === text.trim()) {
                                idx = i;
                                break;
                            }
                        }
                        if (idx >= 0) {
                            // 找到对应的 DOM 元素
                            const els = editor.querySelectorAll('h1,h2,h3,h4,h5,h6');
                            for (const el of els) {
                                if (el.textContent.trim() === text.trim().replace(/^#+\s*/, '')) {
                                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    // 高亮闪烁
                                    el.style.transition = 'background 0.3s';
                                    el.style.background = 'rgba(74,144,217,0.2)';
                                    setTimeout(() => { el.style.background = ''; }, 800);
                                    break;
                                }
                            }
                        }
                    }
                });
            });
        }

        function updateWordCount(text) {
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCount.textContent = `字数: ${words}`;
            statusWords.textContent = `字数: ${words}`;
        }

        function updateStatus(text) {
            const lines = text.split('\n').length;
            statusLines.textContent = `行: ${lines}`;
        }

        // ================================================================
        //  8. 专注模式 & 打字机模式
        // ================================================================

        function updateFocusMode() {
            if (!STATE.focusMode) return;
            // 获取当前光标所在行
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            let node = range.startContainer;
            // 向上找块级元素
            while (node && node !== editor) {
                if (node.nodeType === 1) {
                    const tag = node.tagName.toLowerCase();
                    if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li', 'blockquote', 'pre'].includes(tag)) {
                        break;
                    }
                }
                node = node.parentNode;
            }
            if (!node || node === editor) return;
            // 清除所有 active-line
            editor.querySelectorAll('.active-line').forEach(el => el.classList.remove('active-line'));
            if (node.nodeType === 1) {
                node.classList.add('active-line');
            } else if (node.parentNode) {
                const parent = node.parentNode;
                if (parent && parent !== editor) {
                    parent.classList.add('active-line');
                }
            }
        }

        function toggleFocusMode() {
            STATE.focusMode = !STATE.focusMode;
            wrapper.classList.toggle('focus-mode', STATE.focusMode);
            btnFocus.style.opacity = STATE.focusMode ? '1' : '0.6';
            if (STATE.focusMode) {
                updateFocusMode();
                editor.addEventListener('selectionchange', updateFocusMode);
            } else {
                editor.removeEventListener('selectionchange', updateFocusMode);
                editor.querySelectorAll('.active-line').forEach(el => el.classList.remove('active-line'));
            }
        }

        function toggleTypewriter() {
            STATE.typewriterMode = !STATE.typewriterMode;
            wrapper.classList.toggle('typewriter', STATE.typewriterMode);
            btnTypewriter.style.opacity = STATE.typewriterMode ? '1' : '0.6';
        }

        // ================================================================
        //  9. 主题切换
        // ================================================================

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
            STATE.theme = isDark ? 'light' : 'dark';
            themeToggle.textContent = isDark ? '🌙' : '☀️';
            // 更新代码高亮主题
            const hlTheme = document.querySelector('link[href*="highlight.js"][href*=".min.css"]');
            if (hlTheme) {
                hlTheme.href = isDark ?
                    'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css' :
                    'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css';
            }
        }

        // ================================================================
        //  10. 侧边栏
        // ================================================================

        function toggleSidebar() {
            STATE.sidebarOpen = !STATE.sidebarOpen;
            sidebar.classList.toggle('open', STATE.sidebarOpen);
        }

        // 侧边栏 tab 切换
        document.querySelectorAll('#sidebar .tab-header button').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('#sidebar .tab-header button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('#sidebar .tab-content').forEach(el => el.classList.add('hidden'));
                const target = document.getElementById(`tab-${tab}`);
                if (target) target.classList.remove('hidden');
            });
        });

        // ================================================================
        //  11. 快捷键
        // ================================================================

        document.addEventListener('keydown', function (e) {
            const ctrl = e.ctrlKey || e.metaKey;

            // Ctrl + 1-6 标题
            if (ctrl && e.key >= '1' && e.key <= '6') {
                e.preventDefault();
                const level = parseInt(e.key);
                const prefix = '#'.repeat(level) + ' ';
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const range = sel.getRangeAt(0);
                    const node = range.startContainer;
                    let lineNode = node;
                    while (lineNode && lineNode !== editor) {
                        if (lineNode.nodeType === 1) {
                            const tag = lineNode.tagName.toLowerCase();
                            if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li'].includes(tag)) break;
                        }
                        lineNode = lineNode.parentNode;
                    }
                    if (lineNode && lineNode !== editor) {
                        const text = lineNode.textContent || '';
                        // 移除已有的标题前缀
                        const clean = text.replace(/^#{1,6}\s*/, '');
                        lineNode.textContent = prefix + clean;
                        // 将光标移到标题后
                        const newRange = document.createRange();
                        newRange.setStart(lineNode.firstChild || lineNode, prefix.length);
                        newRange.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                        scheduleRender();
                        return;
                    }
                }
                // 如果无法获取当前行，在光标处插入
                document.execCommand('insertText', false, prefix);
                scheduleRender();
                return;
            }

            // Ctrl + B 加粗
            if (ctrl && e.key === 'b') {
                e.preventDefault();
                document.execCommand('insertText', false, '****');
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const range = sel.getRangeAt(0);
                    const text = range.startContainer.textContent || '';
                    const pos = range.startOffset;
                    if (pos >= 2 && text.substring(pos - 2, pos) === '**') {
                        // 移动光标到中间
                        const newRange = document.createRange();
                        newRange.setStart(range.startContainer, pos - 2);
                        newRange.setEnd(range.startContainer, pos);
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                    }
                }
                scheduleRender();
                return;
            }

            // Ctrl + I 斜体
            if (ctrl && e.key === 'i') {
                e.preventDefault();
                document.execCommand('insertText', false, '**');
                scheduleRender();
                return;
            }

            // Ctrl + / 源码模式
            if (ctrl && e.key === '/') {
                e.preventDefault();
                toggleSourceMode();
                return;
            }

            // F8 专注模式
            if (e.key === 'F8') {
                e.preventDefault();
                toggleFocusMode();
                return;
            }

            // F9 打字机模式
            if (e.key === 'F9') {
                e.preventDefault();
                toggleTypewriter();
                return;
            }

            // Ctrl+Shift+L 侧边栏
            if (ctrl && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
                e.preventDefault();
                toggleSidebar();
                return;
            }

            // Ctrl+S 保存 (模拟)
            if (ctrl && e.key === 's') {
                e.preventDefault();
                // 保存到 localStorage
                localStorage.setItem('md-editor-content', getTextContent());
                statusMode.textContent = '💾 已保存';
                setTimeout(() => { statusMode.textContent = '📝 编辑中'; }, 1500);
                return;
            }
        });

        // ================================================================
        //  12. 源码模式
        // ================================================================

        let sourceTextarea = null;

        function toggleSourceMode() {
            STATE.sourceMode = !STATE.sourceMode;
            btnSource.style.opacity = STATE.sourceMode ? '1' : '0.6';
            if (STATE.sourceMode) {
                // 切换到源码模式
                const text = getTextContent();
                if (!sourceTextarea) {
                    sourceTextarea = document.createElement('textarea');
                    sourceTextarea.style.cssText =
                        `width:100%;height:100%;padding:20px 40px;font-family:monospace;font-size:15px;border:none;outline:none;resize:none;background:var(--bg);color:var(--text);line-height:1.8;`;
                    sourceTextarea.id = 'source-textarea';
                    editor.parentNode.insertBefore(sourceTextarea, editor);
                }
                sourceTextarea.value = text;
                editor.style.display = 'none';
                sourceTextarea.style.display = 'block';
                sourceTextarea.focus();
                sourceTextarea.addEventListener('input', function () {
                    const val = this.value;
                    STATE.markdown = val;
                    updateWordCount(val);
                    updateStatus(val);
                    updateOutline(val);
                });
                statusMode.textContent = '🔧 源码模式';
            } else {
                // 切回预览模式
                if (sourceTextarea) {
                    const val = sourceTextarea.value;
                    STATE.markdown = val;
                    editor.style.display = '';
                    sourceTextarea.style.display = 'none';
                    // 重新渲染
                    const html = md.render(val);
                    setEditorHTML(html);
                    bindCodeBlockEvents();
                    bindMathEvents();
                    updateWordCount(val);
                    updateStatus(val);
                    updateOutline(val);
                    statusMode.textContent = '📝 编辑中';
                }
            }
        }

        // ================================================================
        //  13. 导出功能
        // ================================================================

        function exportPDF() {
            const content = getTextContent();
            const html = md.render(content);
            const printWin = window.open('', '_blank', 'width=800,height=600');
            if (!printWin) return alert('请允许弹出窗口');
            printWin.document.write(`
                        <html><head><title>导出 PDF</title>
                        <style>
                            body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.8; }
                            h1,h2,h3,h4,h5,h6 { margin: 1.2em 0 0.4em 0; }
                            code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
                            pre { background: #282c34; color: #abb2bf; padding: 16px; border-radius: 8px; overflow-x: auto; }
                            blockquote { border-left: 4px solid #4a90d9; margin: 12px 0; padding: 8px 20px; background: #f5f9ff; }
                            table { border-collapse: collapse; width: 100%; }
                            th, td { border: 1px solid #ddd; padding: 6px 12px; }
                            img { max-width: 100%; }
                        </style>
                        </head><body>${html}</body></html>
                    `);
            printWin.document.close();
            setTimeout(() => {
                printWin.print();
            }, 500);
        }

        function exportHTML() {
            const content = getTextContent();
            const html = md.render(content);
            const blob = new Blob([`
                        <!DOCTYPE html>
                        <html><head><meta charset="UTF-8"><title>导出的文档</title>
                        <style>
                            body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.8; }
                            h1,h2,h3,h4,h5,h6 { margin: 1.2em 0 0.4em 0; }
                            code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
                            pre { background: #282c34; color: #abb2bf; padding: 16px; border-radius: 8px; overflow-x: auto; }
                            blockquote { border-left: 4px solid #4a90d9; margin: 12px 0; padding: 8px 20px; background: #f5f9ff; }
                            table { border-collapse: collapse; width: 100%; }
                            th, td { border: 1px solid #ddd; padding: 6px 12px; }
                            img { max-width: 100%; }
                            .math-block { text-align: center; padding: 12px 0; }
                        </style>
                        </head><body>${html}</body></html>
                    `], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ================================================================
        //  14. 初始化
        // ================================================================

        function init() {
            // 从 localStorage 恢复内容
            const saved = localStorage.getItem('md-editor-content');
            const initial = saved || '# 欢迎使用 Markdown 编辑器\n\n这是一个 **类 Typora** 的所见即所得编辑器。\n\n- 输入 `# ` 生成标题\n- 输入 `**粗体**` 或 `*斜体*`\n- 输入 ` ```javascript ` 创建代码块\n- 输入 `$$E=mc^2$$` 渲染公式\n- 双击代码块编辑，双击公式编辑\n\n---\n\n开始创作吧！ 🚀';
            editor.textContent = initial;
            renderMarkdown(false);

            // 绑定事件
            editor.addEventListener('input', function () {
                if (STATE.sourceMode) return;
                scheduleRender();
                if (STATE.focusMode) updateFocusMode();
            });

            // 工具栏事件
            sidebarToggle.addEventListener('click', toggleSidebar);
            btnBold.addEventListener('click', () => {
                document.execCommand('insertText', false, '****');
                scheduleRender();
            });
            btnItalic.addEventListener('click', () => {
                document.execCommand('insertText', false, '**');
                scheduleRender();
            });
            btnH1.addEventListener('click', () => {
                document.execCommand('insertText', false, '# ');
                scheduleRender();
            });
            btnH2.addEventListener('click', () => {
                document.execCommand('insertText', false, '## ');
                scheduleRender();
            });
            btnH3.addEventListener('click', () => {
                document.execCommand('insertText', false, '### ');
                scheduleRender();
            });
            btnSource.addEventListener('click', toggleSourceMode);
            btnFocus.addEventListener('click', toggleFocusMode);
            btnTypewriter.addEventListener('click', toggleTypewriter);
            btnExportPdf.addEventListener('click', exportPDF);
            btnExportHtml.addEventListener('click', exportHTML);
            themeToggle.addEventListener('click', toggleTheme);

            // 加载主题偏好
            if (localStorage.getItem('md-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
                STATE.theme = 'dark';
            }

            // 加载侧边栏状态
            if (localStorage.getItem('md-sidebar') === 'open') {
                toggleSidebar();
            }

            // 窗口关闭时保存
            window.addEventListener('beforeunload', () => {
                localStorage.setItem('md-editor-content', getTextContent());
                localStorage.setItem('md-theme', STATE.theme);
                localStorage.setItem('md-sidebar', STATE.sidebarOpen ? 'open' : 'closed');
            });

            // 自动保存每30秒
            setInterval(() => {
                localStorage.setItem('md-editor-content', getTextContent());
            }, 30000);

            // 初始化状态指示
            btnFocus.style.opacity = '0.6';
            btnTypewriter.style.opacity = '0.6';
            btnSource.style.opacity = '0.6';

            // 如果支持，启用语法高亮
            if (hljs) {
                document.querySelectorAll('.code-body pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
            }

            console.log('📝 Markdown 编辑器已启动！');
            console.log('快捷键: Ctrl+B 加粗, Ctrl+I 斜体, Ctrl+1~6 标题, Ctrl+/ 源码, F8 专注, F9 打字机');
        }

        // 页面加载完成后初始化
        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

        // ================================================================
        //  15. 一些额外的 polyfill / 修复
        // ================================================================

        // 修复 MathQuill 在某些情况下的加载问题
        if (typeof MathQuill === 'undefined') {
            console.warn('MathQuill 未加载，公式编辑功能不可用');
        }

        // 确保 editor 有内容时 placeholder 隐藏
        document.addEventListener('DOMContentLoaded', function () {
            const observer = new MutationObserver(() => {
                const isEmpty = editor.textContent.trim() === '';
                editor.setAttribute('data-empty', isEmpty ? 'true' : 'false');
            });
            observer.observe(editor, { childList: true, subtree: true, characterData: true });
        });

        console.log('✅ 编辑器加载完成');
    </script>
