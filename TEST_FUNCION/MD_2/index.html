<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>类 Typora Markdown 编辑器</title>

    <!-- ====== 第三方库 CSS ====== -->
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css?v=20260819091245" />
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css?v=20260819091245" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css?v=20260819091245" />
    <!-- MathQuill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css?v=20260819091245" />

    <style>
        /* ====== 全局重置 & 主题变量 ====== */
        :root {
            --bg: #fcfcfc;
            --text: #1a1a2e;
            --border: #e8e8e8;
            --code-bg: #f5f5f5;
            --blockquote-border: #d0d0d0;
            --hover: #f0f0f0;
            --shadow: rgba(0, 0, 0, 0.08);
            --accent: #4a6cf7;
            --accent-hover: #3a5cd5;
            --sidebar-bg: #f8f9fa;
            --status-bg: #ffffff;
            --modal-overlay: rgba(0, 0, 0, 0.45);
            --code-editor-bg: #282a36;
            --output-bg: #1e1e2e;
            --output-text: #cdd6f4;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --bg: #1a1a2e;
            --text: #e0e0e0;
            --border: #2d2d44;
            --code-bg: #2a2a40;
            --blockquote-border: #4a4a6a;
            --hover: #2a2a44;
            --shadow: rgba(0, 0, 0, 0.4);
            --sidebar-bg: #16162a;
            --status-bg: #1a1a2e;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --output-bg: #0d0d1a;
            --output-text: #cdd6f4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            overflow: hidden;
        }

        /* ====== 布局 ====== */
        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ====== 侧边栏 ====== */
        #sidebar {
            width: 280px;
            min-width: 280px;
            height: 100%;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease, width 0.3s ease, min-width 0.3s ease;
            flex-shrink: 0;
            z-index: 10;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
            width: 0;
            min-width: 0;
            border-right: none;
        }

        #sidebar-header {
            padding: 18px 20px 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #sidebar-header button {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #sidebar-header button:hover {
            opacity: 1;
        }

        #sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        #outline-tree {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
        }

        #outline-tree li {
            padding: 4px 0 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #outline-tree li:hover {
            background: var(--hover);
        }

        #outline-tree li.h1 {
            font-weight: 700;
            font-size: 16px;
            padding-left: 4px;
        }

        #outline-tree li.h2 {
            font-weight: 600;
            font-size: 15px;
            padding-left: 16px;
        }

        #outline-tree li.h3 {
            font-weight: 500;
            font-size: 14px;
            padding-left: 28px;
        }

        #outline-tree li.h4 {
            font-weight: 400;
            font-size: 13px;
            padding-left: 40px;
        }

        #outline-tree li.h5 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 52px;
            opacity: 0.8;
        }

        #outline-tree li.h6 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 64px;
            opacity: 0.6;
        }

        /* ====== 主编辑区 ====== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: var(--bg);
        }

        /* ====== 工具栏 ====== */
        #toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg);
            flex-wrap: wrap;
            transition: background var(--transition);
        }

        #toolbar button {
            background: transparent;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s;
            font-family: var(--font-sans);
            font-weight: 500;
        }

        #toolbar button:hover {
            background: var(--hover);
        }

        #toolbar button.active {
            background: var(--accent);
            color: #fff;
        }

        #toolbar .sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
            flex-shrink: 0;
        }

        #toolbar .spacer {
            flex: 1;
        }

        #toolbar .theme-toggle {
            font-size: 18px;
            padding: 4px 8px;
        }

        #word-count {
            font-size: 12px;
            opacity: 0.6;
            padding: 0 8px;
            white-space: nowrap;
        }

        /* ====== 编辑器容器 ====== */
        #editor-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 40px 60px 120px;
            position: relative;
            background: var(--bg);
            transition: background var(--transition);
            scroll-behavior: smooth;
        }

        #editor-wrap.typing-mode {
            padding-top: 50vh;
        }

        #editor {
            max-width: 820px;
            margin: 0 auto;
            min-height: 100%;
            outline: none;
            font-size: 16px;
            line-height: 1.75;
            color: var(--text);
            font-family: var(--font-sans);
            word-wrap: break-word;
            transition: color var(--transition);
        }

        #editor:empty::before {
            content: '开始编写 Markdown…';
            color: var(--text);
            opacity: 0.35;
            pointer-events: none;
        }

        /* ====== 编辑器中 Markdown 渲染样式 ====== */
        #editor h1 {
            font-size: 2.2em;
            font-weight: 700;
            margin: 0.8em 0 0.4em;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.2em;
        }

        #editor h2 {
            font-size: 1.8em;
            font-weight: 700;
            margin: 0.7em 0 0.3em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.15em;
        }

        #editor h3 {
            font-size: 1.5em;
            font-weight: 600;
            margin: 0.6em 0 0.25em;
        }

        #editor h4 {
            font-size: 1.25em;
            font-weight: 600;
            margin: 0.5em 0 0.2em;
        }

        #editor h5 {
            font-size: 1.1em;
            font-weight: 600;
            margin: 0.4em 0 0.15em;
        }

        #editor h6 {
            font-size: 1em;
            font-weight: 600;
            margin: 0.3em 0 0.1em;
            opacity: 0.8;
        }

        #editor p {
            margin: 0.6em 0;
        }

        #editor ul,
        #editor ol {
            padding-left: 1.8em;
            margin: 0.4em 0;
        }

        #editor li {
            margin: 0.2em 0;
        }

        #editor li.task-item {
            list-style: none;
            padding-left: 0.2em;
        }

        #editor li.task-item input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.1);
            cursor: pointer;
            accent-color: var(--accent);
        }

        #editor blockquote {
            border-left: 4px solid var(--blockquote-border);
            padding: 0.4em 1em;
            margin: 0.6em 0;
            background: var(--code-bg);
            border-radius: 0 6px 6px 0;
            color: var(--text);
            opacity: 0.85;
        }

        #editor blockquote p {
            margin: 0.2em 0;
        }

        #editor hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 1.5em 0;
            opacity: 0.5;
        }

        #editor code {
            font-family: var(--font-mono);
            font-size: 0.9em;
            background: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            color: var(--text);
        }

        #editor pre {
            background: var(--code-bg);
            border-radius: 8px;
            padding: 16px 20px;
            overflow-x: auto;
            margin: 0.8em 0;
            position: relative;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid var(--border);
        }

        #editor pre code {
            background: none;
            padding: 0;
            font-size: inherit;
            color: inherit;
        }

        #editor .code-block-wrapper {
            position: relative;
            margin: 0.8em 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #editor .code-block-wrapper pre {
            margin: 0;
            border-radius: 0;
            border: none;
            background: var(--code-bg);
        }

        #editor .code-block-wrapper .code-lang {
            position: absolute;
            top: 6px;
            right: 12px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            pointer-events: none;
            font-family: var(--font-sans);
        }

        #editor .code-block-wrapper .run-btn {
            position: absolute;
            top: 4px;
            right: 70px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 3px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font-sans);
            z-index: 2;
        }

        #editor .code-block-wrapper .run-btn:hover {
            background: var(--accent-hover);
        }

        #editor .code-block-wrapper .run-btn.running {
            opacity: 0.6;
            pointer-events: none;
        }

        /* ====== 公式块 ====== */
        #editor .math-block {
            text-align: center;
            padding: 0.8em 0;
            margin: 0.6em 0;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            position: relative;
        }

        #editor .math-block:hover {
            background: var(--hover);
        }

        #editor .math-block .katex-display {
            margin: 0;
        }

        #editor .math-inline .katex {
            font-size: 1.05em;
        }

        /* ====== 图片 ====== */
        #editor img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.4em 0;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* ====== 链接 ====== */
        #editor a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        #editor a:hover {
            border-bottom-color: var(--accent);
        }

        /* ====== 输出面板 ====== */
        #output-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 45vh;
            background: var(--output-bg);
            color: var(--output-text);
            border-top: 2px solid var(--accent);
            padding: 12px 20px 20px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
            border-radius: 12px 12px 0 0;
        }

        #output-panel.open {
            transform: translateY(0);
        }

        #output-panel .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #a6adc8;
            font-family: var(--font-sans);
        }

        #output-panel .output-header button {
            background: none;
            border: none;
            color: #a6adc8;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }

        #output-panel .output-header button:hover {
            color: #fff;
        }

        #output-panel .output-body {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #cdd6f4;
        }

        #output-panel .output-body .error {
            color: #f38ba8;
        }

        #output-panel .output-body .success {
            color: #a6e3a1;
        }

        /* ====== 公式模态框 ====== */
        #math-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        #math-modal.open {
            display: flex;
        }

        #math-modal .modal-box {
            background: var(--bg);
            border-radius: 16px;
            padding: 30px 36px 36px;
            max-width: 700px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
        }

        #math-modal .modal-box h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #math-modal .modal-box h3 button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        #math-modal .modal-box h3 button:hover {
            opacity: 1;
        }

        #math-modal .modal-box .math-input-area {
            min-height: 60px;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin: 12px 0 16px;
            background: var(--code-bg);
            font-size: 18px;
            font-family: var(--font-mono);
            transition: border-color 0.2s;
            position: relative;
        }

        #math-modal .modal-box .math-input-area:focus-within {
            border-color: var(--accent);
        }

        #math-modal .modal-box .math-input-area .mq-editable-field {
            min-height: 40px;
            width: 100%;
        }

        #math-modal .modal-box .math-input-area .mq-editable-field .mq-math-mode {
            font-size: 18px;
        }

        #math-modal .modal-box .math-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 14px;
        }

        #math-modal .modal-box .math-toolbar button {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 14px;
            font-size: 14px;
            font-family: var(--font-sans);
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s;
        }

        #math-modal .modal-box .math-toolbar button:hover {
            background: var(--hover);
        }

        #math-modal .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        #math-modal .modal-box .modal-actions button {
            padding: 8px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font-sans);
        }

        #math-modal .modal-box .modal-actions .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        #math-modal .modal-box .modal-actions .btn-primary:hover {
            background: var(--accent-hover);
        }

        #math-modal .modal-box .modal-actions .btn-secondary {
            background: var(--code-bg);
            color: var(--text);
        }

        #math-modal .modal-box .modal-actions .btn-secondary:hover {
            background: var(--hover);
        }

        /* ====== CodeMirror 内联编辑器 ====== */
        .cm-editor-wrap {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 80;
            backdrop-filter: blur(4px);
        }

        .cm-editor-wrap.open {
            display: flex;
        }

        .cm-editor-wrap .cm-box {
            background: var(--bg);
            border-radius: 16px;
            padding: 20px 24px 24px;
            max-width: 860px;
            width: 94%;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
        }

        .cm-editor-wrap .cm-box .cm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 15px;
        }

        .cm-editor-wrap .cm-box .cm-header button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text);
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .cm-editor-wrap .cm-box .cm-header button:hover {
            opacity: 1;
        }

        .cm-editor-wrap .cm-box .cm-editor-container {
            flex: 1;
            min-height: 300px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .cm-editor-wrap .cm-box .cm-editor-container .CodeMirror {
            height: 100%;
            font-size: 14px;
            font-family: var(--font-mono);
        }

        .cm-editor-wrap .cm-box .cm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .cm-editor-wrap .cm-box .cm-actions button {
            padding: 7px 22px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font-sans);
        }

        .cm-editor-wrap .cm-box .cm-actions .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .cm-editor-wrap .cm-box .cm-actions .btn-primary:hover {
            background: var(--accent-hover);
        }

        .cm-editor-wrap .cm-box .cm-actions .btn-secondary {
            background: var(--code-bg);
            color: var(--text);
        }

        .cm-editor-wrap .cm-box .cm-actions .btn-secondary:hover {
            background: var(--hover);
        }

        /* ====== 响应式 ====== */
        @media (max-width: 768px) {
            #sidebar {
                width: 220px;
                min-width: 220px;
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 20;
                box-shadow: 4px 0 24px var(--shadow);
            }

            #sidebar.hidden {
                transform: translateX(-100%);
            }

            #editor-wrap {
                padding: 20px 20px 100px;
            }

            #editor {
                font-size: 15px;
            }

            #toolbar {
                padding: 6px 10px;
                gap: 4px;
            }

            #toolbar button {
                font-size: 12px;
                padding: 4px 8px;
            }

            #math-modal .modal-box {
                padding: 20px;
            }

            .cm-editor-wrap .cm-box {
                padding: 16px;
            }
        }

        /* ====== 滚动条美化 ====== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--blockquote-border);
        }

        /* ====== 聚焦高亮 ====== */
        #editor .focus-mode-active {
            background: var(--hover);
            border-radius: 4px;
            padding: 0 4px;
        }

        #editor .focus-mode-dim {
            opacity: 0.25;
            transition: opacity 0.4s;
        }

        /* ====== 打字机模式滚动 ====== */
        #editor-wrap.typing-mode {
            scroll-behavior: smooth;
        }

        /* ====== 源码模式 ====== */
        #editor.source-mode pre {
            background: var(--code-bg) !important;
            border: 1px solid var(--border) !important;
        }

        #editor.source-mode .code-block-wrapper {
            border: 1px solid var(--border) !important;
        }

        #editor.source-mode .math-block {
            background: var(--code-bg);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 14px;
            text-align: left;
            color: var(--text);
        }

        #editor.source-mode .math-block .katex-display {
            display: none;
        }

        #editor.source-mode .math-block::before {
            content: '$$ ' attr(data-latex) ' $$';
            white-space: pre-wrap;
            word-break: break-all;
            font-family: var(--font-mono);
            color: var(--text);
        }

        #editor.source-mode .math-inline .katex {

            font-family: var(--font-mono);
            color: var(--text);
            background: var(--code-bg);
            padding: 0 4px;
            border-radius: 3px;
        }
    </style>
</head>

    <!-- ====== 依赖库 ====== -->

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js?v=20260819091245">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js?v=20260819091245">
    </script>

    <script>
        // ======================================================================
        //  类 Typora Markdown 编辑器 —— 主脚本
        // ======================================================================

        (function () {
            'use strict';

            // ---------- DOM 引用 ----------
            const editor = document.getElementById('editor');
            const editorWrap = document.getElementById('editor-wrap');
            const outlineTree = document.getElementById('outline-tree');
            const wordCountEl = document.getElementById('word-count');
            const outputPanel = document.getElementById('output-panel');
            const outputBody = document.getElementById('output-body');
            const outputClose = document.getElementById('output-close');
            const sidebar = document.getElementById('sidebar');
            const sidebarClose = document.getElementById('sidebar-close');
            const btnSidebar = document.getElementById('btn-sidebar');
            const btnSource = document.getElementById('btn-source');
            const btnFocus = document.getElementById('btn-focus');
            const btnTypewriter = document.getElementById('btn-typewriter');
            const btnTheme = document.getElementById('btn-theme');
            const mathModal = document.getElementById('math-modal');
            const mathModalClose = document.getElementById('math-modal-close');
            const mathModalCancel = document.getElementById('math-modal-cancel');
            const mathModalOk = document.getElementById('math-modal-ok');
            const mathQuillEditor = document.getElementById('math-quill-editor');
            const cmEditorWrap = document.getElementById('cm-editor-wrap');
            const cmEditorContainer = document.getElementById('cm-editor-container');
            const cmEditorClose = document.getElementById('cm-editor-close');
            const cmEditorCancel = document.getElementById('cm-editor-cancel');
            const cmEditorOk = document.getElementById('cm-editor-ok');

            // ---------- 状态 ----------
            let sourceMode = false;
            let focusMode = false;
            let typewriterMode = false;
            let darkTheme = false;
            let isRendering = false;
            let renderTimer = null;
            let currentMathTarget = null; // 正在编辑的公式元素
            let currentCodeBlock = null; // 正在编辑的代码块元素
            let cmInstance = null; // CodeMirror 实例
            let mqInstance = null; // MathQuill 实例
            let pendingMathLatex = '';

            // ---------- 初始化 markdown-it ----------
            const md = window.markdownit({
                html: true,
                linkify: true,
                typographer: true,
                breaks: true,
                highlight: function (str, lang) {
                    // 代码块高亮由 CodeMirror 处理，此处返回原始内容
                    return '';
                }
            });

            // 自定义渲染规则：为代码块包装 div
            const defaultCodeRule = md.renderer.rules.fence;
            md.renderer.rules.fence = function (tokens, idx, options, env, self) {
                const token = tokens[idx];
                const lang = token.info ? token.info.trim() : '';
                const content = token.content;
                const escaped = self.escape ? self.escape(content) : content;
                const langLabel = lang ? `<span class="code-lang">${lang}</span>` : '';
                const runBtn =
                    `<button class="run-btn" data-lang="${lang}">▶ 运行</button>`;
                return `<div class="code-block-wrapper" data-lang="${lang}">
                            <pre><code>${escaped}</code></pre>
                            ${langLabel}
                            ${runBtn}
                        </div>`;
            };

            // ---------- KaTeX 渲染 ----------
            function renderKatex(html) {
                // 行内公式 $...$
                html = html.replace(/\$([^\$]+)\$/g, function (match, latex) {
                    try {
                        const rendered = katex.renderToString(latex, { throwOnError: false, displayMode: false });
                        return `<span class="math-inline" data-latex="${latex}">${rendered}</span>`;
                    } catch (e) {
                        return match;
                    }
                });
                // 块级公式 $$...$$
                html = html.replace(/\$\$([^\$]+)\$\$/g, function (match, latex) {
                    try {
                        const rendered = katex.renderToString(latex.trim(), {
                            throwOnError: false,
                            displayMode: true
                        });
                        return `<div class="math-block" data-latex="${latex.trim()}">${rendered}</div>`;
                    } catch (e) {
                        return match;
                    }
                });
                return html;
            }

            // ---------- 渲染主函数 ----------
            function renderEditor(restoreCursor = true) {
                if (isRendering) return;
                isRendering = true;

                try {
                    // 获取纯文本
                    const text = editor.innerText || editor.textContent || '';

                    // 如果是源码模式，直接显示纯文本（但保留换行）
                    if (sourceMode) {
                        // 源码模式：显示原始 Markdown 文本，但保留特殊元素标记
                        // 我们仍然用 markdown-it 渲染，但通过 CSS 隐藏样式
                        const rendered = md.render(text);
                        const withMath = renderKatex(rendered);
                        editor.innerHTML = withMath;
                        // 添加源码模式 class
                        editor.classList.add('source-mode');
                        updateWordCount(text);
                        updateOutline(text);
                        isRendering = false;
                        return;
                    } else {
                        editor.classList.remove('source-mode');
                    }

                    // 正常渲染
                    const rendered = md.render(text);
                    const withMath = renderKatex(rendered);

                    // 保存光标位置
                    let cursorOffset = 0;
                    let sel = window.getSelection();
                    if (restoreCursor && sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        const preCaretRange = range.cloneRange();
                        preCaretRange.selectNodeContents(editor);
                        preCaretRange.setEnd(range.startContainer, range.startOffset);
                        cursorOffset = preCaretRange.toString().length;
                    }

                    // 更新内容
                    editor.innerHTML = withMath;

                    // 恢复光标
                    if (restoreCursor) {
                        restoreCursorPosition(cursorOffset);
                    }

                    // 更新字数 & 大纲
                    updateWordCount(text);
                    updateOutline(text);

                    // 绑定代码块运行按钮
                    bindRunButtons();

                } catch (e) {
                    console.warn('Render error:', e);
                }

                isRendering = false;
            }

            // ---------- 光标恢复 ----------
            function restoreCursorPosition(offset) {
                try {
                    const editorEl = editor;
                    const children = editorEl.childNodes;
                    let charCount = 0;
                    let targetNode = null;
                    let targetOffset = 0;

                    function traverse(node) {
                        if (targetNode) return;
                        if (node.nodeType === Node.TEXT_NODE) {
                            const len = node.textContent.length;
                            if (charCount + len >= offset) {
                                targetNode = node;
                                targetOffset = offset - charCount;
                                return;
                            }
                            charCount += len;
                        } else if (node.nodeType === Node.ELEMENT_NODE) {
                            // 跳过不可见元素
                            if (node.nodeName === 'SCRIPT' || node.nodeName === 'STYLE') return;
                            for (let child of node.childNodes) {
                                traverse(child);
                                if (targetNode) return;
                            }
                        }
                    }

                    traverse(editorEl);

                    if (targetNode) {
                        const range = document.createRange();
                        range.setStart(targetNode, Math.min(targetOffset, targetNode.textContent.length));
                        range.collapse(true);
                        const sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                    } else {
                        // 兜底：移到末尾
                        const range = document.createRange();
                        range.selectNodeContents(editorEl);
                        range.collapse(false);
                        const sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                } catch (e) {
                    // 忽略
                }
            }

            // ---------- 字数统计 ----------
            function updateWordCount(text) {
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                wordCountEl.textContent = `字数: ${words}`;
            }

            // ---------- 大纲 ----------
            function updateOutline(text) {
                const lines = text.split('\n');
                const headings = [];
                for (let line of lines) {
                    const match = line.match(/^(#{1,6})\s+(.*)$/);
                    if (match) {
                        const level = match[1].length;
                        const title = match[2].trim();
                        headings.push({ level, title });
                    }
                }
                let html = '';
                for (let h of headings) {
                    const cls = 'h' + h.level;
                    html += `<li class="${cls}" data-level="${h.level}">${h.title}</li>`;
                }
                outlineTree.innerHTML = html || '<li style="opacity:0.4;font-size:13px;padding:8px 0;">暂无标题</li>';

                // 点击跳转
                outlineTree.querySelectorAll('li').forEach((el, idx) => {
                    el.addEventListener('click', function () {
                        const level = parseInt(this.dataset.level) || 1;
                        // 找到文档中对应的标题
                        const headingsInDoc = editor.querySelectorAll('h1,h2,h3,h4,h5,h6');
                        let target = null;
                        let count = 0;
                        for (let h of headingsInDoc) {
                            if (h.tagName === 'H' + level) {
                                if (count === idx) { target = h; break; }
                                count++;
                            }
                        }
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            // 高亮一下
                            target.style.transition = 'background 0.3s';
                            target.style.background = 'var(--accent)';
                            target.style.color = '#fff';
                            setTimeout(() => {
                                target.style.background = '';
                                target.style.color = '';
                            }, 600);
                        }
                    });
                });
            }

            // ---------- 代码块运行按钮绑定 ----------
            function bindRunButtons() {
                document.querySelectorAll('.code-block-wrapper .run-btn').forEach(btn => {
                    btn.removeEventListener('click', handleRunCode);
                    btn.addEventListener('click', handleRunCode);
                });
            }

            async function handleRunCode(e) {
                const btn = e.currentTarget;
                const wrapper = btn.closest('.code-block-wrapper');
                if (!wrapper) return;
                const codeEl = wrapper.querySelector('pre code');
                if (!codeEl) return;
                const code = codeEl.textContent;
                const lang = wrapper.dataset.lang || btn.dataset.lang || 'javascript';

                // 映射语言到 Judge0
                const langMap = {
                    'javascript': 'javascript',
                    'js': 'javascript',
                    'python': 'python',
                    'py': 'python',
                    'c': 'c',
                    'cpp': 'cpp',
                    'c++': 'cpp',
                    'java': 'java',
                    'go': 'go',
                    'rust': 'rust',
                    'php': 'php',
                    'ruby': 'ruby',
                    'swift': 'swift',
                    'typescript': 'typescript',
                    'ts': 'typescript',
                    'sh': 'bash',
                    'bash': 'bash',
                    'shell': 'bash',
                    'html': 'html',
                    'css': 'css'
                };
                const judgeLang = langMap[lang.toLowerCase()] || 'javascript';

                // 显示输出面板
                outputPanel.classList.add('open');
                outputBody.textContent = '⏳ 正在执行...';
                btn.classList.add('running');
                btn.textContent = '⏳';

                try {
                    const result = await executeCode(code, judgeLang);
                    outputBody.innerHTML = result.success ?
                        `<span class="success">✅ 执行成功</span>\n${result.output}` :
                        `<span class="error">❌ 执行失败</span>\n${result.output}`;
                } catch (err) {
                    outputBody.innerHTML = `<span class="error">❌ 错误: ${err.message}</span>`;
                } finally {
                    btn.classList.remove('running');
                    btn.textContent = '▶ 运行';
                }
            }

            // ---------- Judge0 API 远程执行 ----------
            async function executeCode(code, lang) {
                // 使用 Judge0 的公开 API (v1)
                const languageMap = {
                    'javascript': 63,
                    'python': 71,
                    'c': 50,
                    'cpp': 54,
                    'java': 62,
                    'go': 60,
                    'rust': 73,
                    'php': 68,
                    'ruby': 72,
                    'swift': 83,
                    'typescript': 74,
                    'bash': 46,
                    'html': 84,
                    'css': 85
                };
                const languageId = languageMap[lang] || 63;

                try {
                    // 提交代码
                    const submitRes = await fetch('https://judge0-ce.p.rapidapi.com/submissions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-RapidAPI-Key': 'YOUR_RAPIDAPI_KEY', // 需要用户替换
                            'X-RapidAPI-Host': 'judge0-ce.p.rapidapi.com'
                        },
                        body: JSON.stringify({
                            source_code: code,
                            language_id: languageId,
                            stdin: ''
                        })
                    });

                    if (!submitRes.ok) {
                        // 如果 API key 无效，模拟执行
                        return simulateExecute(code, lang);
                    }

                    const submitData = await submitRes.json();
                    const token = submitData.token;

                    // 轮询结果
                    let result = null;
                    for (let i = 0; i < 20; i++) {
                        await new Promise(r => setTimeout(r, 500));
                        const getRes = await fetch(
                            `https://judge0-ce.p.rapidapi.com/submissions/${token}?base64_encoded=false&fields=stdout,stderr,status,compile_output`,
                            {
                                headers: {
                                    'X-RapidAPI-Key': 'YOUR_RAPIDAPI_KEY',
                                    'X-RapidAPI-Host': 'judge0-ce.p.rapidapi.com'
                                }
                            }
                        );
                        if (getRes.ok) {
                            const data = await getRes.json();
                            if (data.status && data.status.id > 2) {
                                result = data;
                                break;
                            }
                        }
                    }

                    if (result) {
                        const output = result.stdout || result.stderr || result.compile_output || '无输出';
                        return {
                            success: result.status && result.status.id === 3,
                            output: output
                        };
                    } else {
                        return {
                            success: false,
                            output: '执行超时或无法获取结果'
                        };
                    }
                } catch (e) {
                    // 降级：模拟执行
                    return simulateExecute(code, lang);
                }
            }

            // ---------- 模拟执行（当 API 不可用时） ----------
            function simulateExecute(code, lang) {
                const output = [];
                output.push(`[模拟执行 - ${lang}]`);
                // 简单模拟一些常见输出
                try {
                    // 对于 JavaScript，使用 eval 安全执行（仅演示）
                    if (lang === 'javascript' || lang === 'js') {
                        const result = eval(`(function() { ${code} })()`);
                        output.push(result !== undefined ? String(result) : '执行完成 (无返回值)');
                    } else if (lang === 'python' || lang === 'py') {
                        // 简单模拟 Python 输出
                        if (code.includes('print')) {
                            const matches = code.match(/print\(['"](.*?)['"]\)/g);
                            if (matches) {
                                matches.forEach(m => {
                                    const content = m.match(/print\(['"](.*?)['"]\)/);
                                    if (content) output.push(content[1]);
                                });
                            } else {
                                output.push('(模拟 Python 执行)');
                            }
                        } else {
                            output.push('(模拟 Python 执行)');
                        }
                    } else {
                        output.push(`(模拟 ${lang} 代码执行)`);
                        output.push('提示: 配置 Judge0 API Key 以获取真实执行');
                    }
                } catch (e) {
                    output.push(`执行错误: ${e.message}`);
                }
                return {
                    success: true,
                    output: output.join('\n')
                };
            }

            // ---------- 公式编辑器 (MathQuill) ----------
            function openMathEditor(target) {
                currentMathTarget = target;
                const latex = target.dataset.latex || '';
                pendingMathLatex = latex;

                // 显示模态框
                mathModal.classList.add('open');

                // 初始化 MathQuill
                setTimeout(() => {
                    if (mqInstance) {
                        mqInstance.latex(latex);
                    } else {
                        mqInstance = window.MathQuill.getInterface(2).MathField(mathQuillEditor, {
                            spaceBehavesLikeTab: true,
                            handlers: {
                                edit: function () {
                                    pendingMathLatex = mqInstance.latex();
                                }
                            }
                        });
                        mqInstance.latex(latex);
                    }
                    mqInstance.focus();
                }, 50);
            }

            function closeMathEditor() {
                mathModal.classList.remove('open');
                currentMathTarget = null;
            }

            // ---------- CodeMirror 编辑器 ----------
            function openCodeEditor(wrapper) {
                currentCodeBlock = wrapper;
                const codeEl = wrapper.querySelector('pre code');
                if (!codeEl) return;
                const code = codeEl.textContent;
                const lang = wrapper.dataset.lang || '';

                cmEditorWrap.classList.add('open');

                // 初始化 CodeMirror
                setTimeout(() => {
                    if (cmInstance) {
                        cmInstance.setValue(code);
                        cmInstance.setOption('mode', lang || 'text/plain');
                    } else {
                        cmInstance = window.CodeMirror(cmEditorContainer, {
                            value: code,
                            mode: lang || 'text/plain',
                            theme: 'dracula',
                            lineNumbers: true,
                            autoCloseBrackets: true,
                            matchBrackets: true,
                            indentUnit: 4,
                            tabSize: 4,
                            lineWrapping: true,
                            extraKeys: {
                                'Ctrl-S': function () { updateCodeFromCM(); }
                            }
                        });
                    }
                    cmInstance.refresh();
                    cmInstance.focus();
                }, 50);
            }

            function updateCodeFromCM() {
                if (!cmInstance || !currentCodeBlock) return;
                const code = cmInstance.getValue();
                const codeEl = currentCodeBlock.querySelector('pre code');
                if (codeEl) {
                    codeEl.textContent = code;
                }
                // 更新渲染
                renderEditor(true);
            }

            function closeCodeEditor() {
                cmEditorWrap.classList.remove('open');
                currentCodeBlock = null;
            }

            // ---------- 快捷键 ----------
            document.addEventListener('keydown', function (e) {
                const ctrl = e.ctrlKey || e.metaKey;

                // Ctrl+1~6 标题
                if (ctrl && e.key >= '1' && e.key <= '6') {
                    e.preventDefault();
                    const level = parseInt(e.key);
                    const text = editor.innerText || editor.textContent || '';
                    // 在当前行插入标题
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        const node = range.startContainer;
                        // 获取当前行
                        let lineStart = node;
                        while (lineStart && lineStart.parentNode && lineStart.parentNode !== editor) {
                            lineStart = lineStart.parentNode;
                        }
                        if (lineStart && lineStart.parentNode === editor) {
                            // 找到当前行的文本
                            const lineText = lineStart.textContent || '';
                            const prefix = '#'.repeat(level) + ' ';
                            // 替换当前行
                            const newText = prefix + lineText.replace(/^#{1,6}\s*/, '');
                            lineStart.textContent = newText;
                            // 移动光标到末尾
                            const newRange = document.createRange();
                            newRange.setStart(lineStart, newText.length);
                            newRange.collapse(true);
                            const newSel = window.getSelection();
                            newSel.removeAllRanges();
                            newSel.addRange(newRange);
                            renderEditor(true);
                            return;
                        }
                    }
                    // 降级：在光标位置插入
                    document.execCommand('insertText', false, '#'.repeat(level) + ' ');
                    renderEditor(true);
                    return;
                }

                // Ctrl+B 加粗
                if (ctrl && (e.key === 'b' || e.key === 'B')) {
                    e.preventDefault();
                    document.execCommand('insertText', false, '****');
                    // 移动光标到中间
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        const node = range.startContainer;
                        const offset = range.startOffset;
                        if (node.textContent.length >= offset + 2) {
                            range.setStart(node, offset - 2);
                            range.setEnd(node, offset - 2);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                    }
                    renderEditor(true);
                    return;
                }

                // Ctrl+I 斜体
                if (ctrl && (e.key === 'i' || e.key === 'I')) {
                    e.preventDefault();
                    document.execCommand('insertText', false, '**');
                    // 移动光标到中间
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        const node = range.startContainer;
                        const offset = range.startOffset;
                        if (node.textContent.length >= offset + 2) {
                            range.setStart(node, offset - 2);
                            range.setEnd(node, offset - 2);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                    }
                    renderEditor(true);
                    return;
                }

                // Ctrl+/ 切换源码模式
                if (ctrl && e.key === '/') {
                    e.preventDefault();
                    toggleSourceMode();
                    return;
                }

                // Ctrl+Shift+L 切换侧边栏
                if (ctrl && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
                    e.preventDefault();
                    toggleSidebar();
                    return;
                }

                // F8 专注模式
                if (e.key === 'F8' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    toggleFocusMode();
                    return;
                }

                // F9 打字机模式
                if (e.key === 'F9' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    toggleTypewriterMode();
                    return;
                }
            });

            // ---------- 模式切换 ----------
            function toggleSourceMode() {
                sourceMode = !sourceMode;
                btnSource.classList.toggle('active', sourceMode);
                renderEditor(true);
            }

            function toggleFocusMode() {
                focusMode = !focusMode;
                btnFocus.classList.toggle('active', focusMode);
                editor.classList.toggle('focus-mode', focusMode);
                if (focusMode) {
                    // 高亮当前行
                    applyFocusMode();
                } else {
                    document.querySelectorAll('.focus-mode-active, .focus-mode-dim').forEach(el => {
                        el.classList.remove('focus-mode-active', 'focus-mode-dim');
                    });
                }
            }

            function applyFocusMode() {
                // 简单实现：只高亮当前段落，其他变暗
                const sel = window.getSelection();
                if (!sel || !sel.rangeCount) return;
                const node = sel.getRangeAt(0).startContainer;
                let block = node;
                while (block && block.parentNode && block.parentNode !== editor) {
                    block = block.parentNode;
                }
                if (block && block.parentNode === editor) {
                    document.querySelectorAll('#editor > *').forEach(el => {
                        el.classList.remove('focus-mode-active', 'focus-mode-dim');
                        if (el === block) {
                            el.classList.add('focus-mode-active');
                        } else {
                            el.classList.add('focus-mode-dim');
                        }
                    });
                }
            }

            function toggleTypewriterMode() {
                typewriterMode = !typewriterMode;
                btnTypewriter.classList.toggle('active', typewriterMode);
                editorWrap.classList.toggle('typing-mode', typewriterMode);
                if (typewriterMode) {
                    scrollToCaret();
                }
            }

            function scrollToCaret() {
                const sel = window.getSelection();
                if (!sel || !sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                const rect = range.getClientRects ? range.getClientRects()[0] : null;
                if (rect) {
                    const editorRect = editorWrap.getBoundingClientRect();
                    const targetY = rect.top - editorRect.top - editorWrap.clientHeight / 2 + rect.height / 2;
                    editorWrap.scrollTop = Math.max(0, targetY);
                }
            }

            function toggleSidebar() {
                sidebar.classList.toggle('hidden');
            }

            // ---------- 主题切换 ----------
            function toggleTheme() {
                darkTheme = !darkTheme;
                document.documentElement.setAttribute('data-theme', darkTheme ? 'dark' : 'light');
                btnTheme.textContent = darkTheme ? '☀️' : '🌙';
            }

            // ---------- 事件监听 ----------
            // 编辑器输入
            editor.addEventListener('input', function () {
                if (isRendering) return;
                clearTimeout(renderTimer);
                renderTimer = setTimeout(() => {
                    renderEditor(true);
                    if (focusMode) applyFocusMode();
                    if (typewriterMode) scrollToCaret();
                }, 200);
            });

            // 编辑器聚焦/失焦
            editor.addEventListener('focus', function () {
                if (focusMode) applyFocusMode();
            });

            // 双击：代码块/公式块
            editor.addEventListener('dblclick', function (e) {
                const target = e.target;

                // 检查是否点击到代码块
                const codeWrapper = target.closest('.code-block-wrapper');
                if (codeWrapper) {
                    e.preventDefault();
                    openCodeEditor(codeWrapper);
                    return;
                }

                // 检查是否点击到公式块
                const mathBlock = target.closest('.math-block');
                if (mathBlock) {
                    e.preventDefault();
                    openMathEditor(mathBlock);
                    return;
                }

                // 检查是否点击到行内公式
                const mathInline = target.closest('.math-inline');
                if (mathInline) {
                    e.preventDefault();
                    // 将行内公式转为块级公式编辑
                    const latex = mathInline.dataset.latex || '';
                    // 在当前位置插入块级公式
                    const newBlock = document.createElement('div');
                    newBlock.className = 'math-block';
                    newBlock.dataset.latex = latex;
                    try {
                        newBlock.innerHTML = katex.renderToString(latex, {
                            throwOnError: false,
                            displayMode: true
                        });
                    } catch (_) {
                        newBlock.textContent = '$$' + latex + '$$';
                    }
                    mathInline.parentNode.replaceChild(newBlock, mathInline);
                    openMathEditor(newBlock);
                    return;
                }
            });

            // ---------- 工具栏按钮 ----------
            document.getElementById('btn-h1').addEventListener('click', function () {
                document.execCommand('insertText', false, '# ');
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-h2').addEventListener('click', function () {
                document.execCommand('insertText', false, '## ');
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-h3').addEventListener('click', function () {
                document.execCommand('insertText', false, '### ');
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-bold').addEventListener('click', function () {
                document.execCommand('insertText', false, '****');
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    const node = range.startContainer;
                    const offset = range.startOffset;
                    if (node.textContent.length >= offset + 2) {
                        range.setStart(node, offset - 2);
                        range.setEnd(node, offset - 2);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-italic').addEventListener('click', function () {
                document.execCommand('insertText', false, '**');
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    const node = range.startContainer;
                    const offset = range.startOffset;
                    if (node.textContent.length >= offset + 2) {
                        range.setStart(node, offset - 2);
                        range.setEnd(node, offset - 2);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-strike').addEventListener('click', function () {
                document.execCommand('insertText', false, '~~ ~~');
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    const node = range.startContainer;
                    const offset = range.startOffset;
                    if (node.textContent.length >= offset + 2) {
                        range.setStart(node, offset - 2);
                        range.setEnd(node, offset - 2);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-code').addEventListener('click', function () {
                document.execCommand('insertText', false, '``');
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    const node = range.startContainer;
                    const offset = range.startOffset;
                    if (node.textContent.length >= offset + 2) {
                        range.setStart(node, offset - 2);
                        range.setEnd(node, offset - 2);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
                editor.focus();
                renderEditor(true);
            });
            document.getElementById('btn-link').addEventListener('click', function () {
                const url = prompt('请输入链接 URL:', 'https://');
                if (url) {
                    const text = prompt('请输入链接文字:', '链接');
                    document.execCommand('insertText', false, `[${text || '链接'}](${url})`);
                    editor.focus();
                    renderEditor(true);
                }
            });

            // 侧边栏
            btnSidebar.addEventListener('click', toggleSidebar);
            sidebarClose.addEventListener('click', toggleSidebar);

            // 源码模式
            btnSource.addEventListener('click', toggleSourceMode);

            // 专注模式
            btnFocus.addEventListener('click', toggleFocusMode);

            // 打字机模式
            btnTypewriter.addEventListener('click', toggleTypewriterMode);

            // 主题
            btnTheme.addEventListener('click', toggleTheme);

            // 输出面板关闭
            outputClose.addEventListener('click', function () {
                outputPanel.classList.remove('open');
            });

            // ---------- 公式模态框 ----------
            mathModalClose.addEventListener('click', closeMathEditor);
            mathModalCancel.addEventListener('click', closeMathEditor);
            mathModalOk.addEventListener('click', function () {
                if (mqInstance) {
                    const latex = mqInstance.latex();
                    if (currentMathTarget) {
                        currentMathTarget.dataset.latex = latex;
                        try {
                            currentMathTarget.innerHTML = katex.renderToString(latex, {
                                throwOnError: false,
                                displayMode: true
                            });
                        } catch (_) {
                            currentMathTarget.textContent = '$$' + latex + '$$';
                        }
                        // 更新编辑器内容
                        renderEditor(true);
                    }
                }
                closeMathEditor();
            });

            // 公式工具栏
            document.querySelectorAll('.math-toolbar button').forEach(btn => {
                btn.addEventListener('click', function () {
                    const cmd = this.dataset.cmd;
                    if (mqInstance) {
                        mqInstance.cmd(cmd);
                        mqInstance.focus();
                        pendingMathLatex = mqInstance.latex();
                    }
                });
            });

            // 点击模态框外部关闭
            mathModal.addEventListener('click', function (e) {
                if (e.target === this) closeMathEditor();
            });

            // ---------- CodeMirror 编辑器 ----------
            cmEditorClose.addEventListener('click', closeCodeEditor);
            cmEditorCancel.addEventListener('click', closeCodeEditor);
            cmEditorOk.addEventListener('click', function () {
                updateCodeFromCM();
                closeCodeEditor();
            });

            // 点击外部关闭
            cmEditorWrap.addEventListener('click', function (e) {
                if (e.target === this) closeCodeEditor();
            });

            // ---------- 初始化 ----------
            function init() {
                // 设置默认内容
                const defaultContent = `# 欢迎使用类 Typora 编辑器 ✨

        这是一个 **所见即所得** 的 Markdown 编辑器，支持：

        - **粗体**、*斜体*、~~删除线~~
        - \`行内代码\`
        - 列表：
          - 无序列表
          - 任务列表：
            - [x] 已完成
            - [ ] 待办
        - [链接](https://github.com)
        - 图片：![alt](https://picsum.photos/400/200)

        ---

        ### 代码块（支持远程执行）

        \`\`\`javascript
        console.log('Hello, Typora!');
        const sum = (a, b) => a + b;
        console.log('1+2=', sum(1, 2));
        \`\`\`

        ### 数学公式

        行内公式：$E=mc^2$

        块级公式：
        $$\\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$

        ---

        **快捷键**：
        - Ctrl+B / Ctrl+I : 加粗 / 斜体
        - Ctrl+1~6 : 标题
        - Ctrl+/ : 切换源码/预览
        - F8 : 专注模式
        - F9 : 打字机模式

        > 双击代码块可编辑，双击公式可可视化编辑。
        `;

                editor.textContent = defaultContent;
                renderEditor(true);

                // 绑定代码块运行按钮
                setTimeout(bindRunButtons, 100);

                // 检测主题
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    darkTheme = true;
                    document.documentElement.setAttribute('data-theme', 'dark');
                    btnTheme.textContent = '☀️';
                }
            }

            init();

            // ---------- 暴露 API 给控制台调试 ----------
            window.__editor = {
                render: renderEditor,
                toggleSource: toggleSourceMode,
                toggleFocus: toggleFocusMode,
                toggleTypewriter: toggleTypewriterMode,
                toggleTheme: toggleTheme,
                getContent: () => editor.innerText || editor.textContent || '',
                setContent: (text) => {
                    editor.textContent = text;
                    renderEditor(true);
                }
            };

            console.log('📝 类 Typora 编辑器已加载！');
            console.log('💡 提示: 双击代码块编辑，双击公式可视化编辑。');
            console.log('🔧 调试: window.__editor 包含控制方法。');

        })();
    </script>

</body>
