<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>类Typora Markdown编辑器</title>

    <!-- ========== 第三方库 CDN ========== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js">
    </script>

    <style>
        /* ============================================================
                   全局重置 & 基础样式
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --sidebar-bg: #f8f9fa;
            --sidebar-width: 260px;
            --header-height: 48px;
            --editor-padding: 40px;
            --font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            --code-font: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
            --primary-color: #4a90d9;
            --hover-bg: #f0f0f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        /* 暗色主题 */
        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --border-color: #3d3d3d;
            --sidebar-bg: #252526;
            --hover-bg: #2d2d2d;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --primary-color: #569cd6;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-family);
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* ============================================================
                   布局容器
                   ============================================================ */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-color);
        }

        /* ============================================================
                   顶部栏
                   ============================================================ */
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--header-height);
            padding: 0 16px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
            z-index: 10;
        }

        #toolbar .left,
        #toolbar .right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toolbar button {
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #toolbar button:hover {
            background: var(--hover-bg);
        }

        #toolbar .separator {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 4px;
        }

        #toolbar .brand {
            font-weight: 600;
            font-size: 15px;
            color: var(--primary-color);
            margin-right: 8px;
        }

        /* ============================================================
                   主体：侧边栏 + 编辑器
                   ============================================================ */
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* -------- 侧边栏 -------- */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: margin-left 0.25s ease;
            overflow: hidden;
        }

        #sidebar.hidden {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        #sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        #sidebar-tabs button {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s;
        }

        #sidebar-tabs button.active {
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 600;
        }

        #sidebar-tabs button:hover {
            background: var(--hover-bg);
        }

        #sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        #sidebar-content .outline-item {
            padding: 4px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sidebar-content .outline-item:hover {
            background: var(--hover-bg);
        }

        #sidebar-content .outline-item.level-1 {
            padding-left: 20px;
            font-weight: 700;
            font-size: 16px;
        }

        #sidebar-content .outline-item.level-2 {
            padding-left: 36px;
            font-weight: 600;
            font-size: 15px;
        }

        #sidebar-content .outline-item.level-3 {
            padding-left: 52px;
            font-weight: 500;
            font-size: 14px;
        }

        #sidebar-content .outline-item.level-4 {
            padding-left: 68px;
            font-size: 14px;
        }

        #sidebar-content .outline-item.level-5 {
            padding-left: 84px;
            font-size: 13px;
        }

        #sidebar-content .outline-item.level-6 {
            padding-left: 100px;
            font-size: 13px;
            color: #888;
        }

        #sidebar-content .file-item {
            padding: 4px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.1s;
        }

        #sidebar-content .file-item:hover {
            background: var(--hover-bg);
        }

        /* -------- 编辑器 -------- */
        #editor-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px var(--editor-padding) 80px var(--editor-padding);
            background: var(--bg-color);
            position: relative;
        }

        #editor-wrapper.focus-mode .editor-block:not(.active-block) {
            opacity: 0.35;
            transition: opacity 0.25s;
        }

        #editor-wrapper.focus-mode .editor-block.active-block {
            opacity: 1;
        }

        #editor {
            max-width: 900px;
            margin: 0 auto;
            min-height: 100%;
            outline: none;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-color);
            word-wrap: break-word;
        }

        /* 编辑器内部块样式 */
        #editor .editor-block {
            margin: 0 0 6px 0;
            padding: 2px 0;
            min-height: 1.6em;
            position: relative;
            border-radius: 4px;
            transition: background 0.15s;
        }

        #editor .editor-block:focus-within {
            background: rgba(74, 144, 217, 0.04);
        }

        #editor .editor-block.active-block {
            background: rgba(74, 144, 217, 0.06);
        }

        /* 标题 */
        #editor h1,
        #editor h2,
        #editor h3,
        #editor h4,
        #editor h5,
        #editor h6 {
            margin: 12px 0 4px 0;
            font-weight: 600;
            line-height: 1.4;
        }

        #editor h1 {
            font-size: 2.2em;
        }

        #editor h2 {
            font-size: 1.8em;
        }

        #editor h3 {
            font-size: 1.5em;
        }

        #editor h4 {
            font-size: 1.25em;
        }

        #editor h5 {
            font-size: 1.1em;
        }

        #editor h6 {
            font-size: 1em;
            color: #888;
        }

        /* 段落 */
        #editor p {
            margin: 0 0 6px 0;
        }

        /* 列表 */
        #editor ul,
        #editor ol {
            margin: 4px 0 6px 20px;
            padding-left: 20px;
        }

        #editor li {
            margin: 2px 0;
        }

        #editor .task-list-item {
            list-style: none;
            margin-left: -20px;
        }

        #editor .task-list-item input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }

        /* 引用 */
        #editor blockquote {
            margin: 8px 0;
            padding: 8px 16px;
            border-left: 4px solid var(--primary-color);
            background: var(--sidebar-bg);
            border-radius: 0 4px 4px 0;
            color: #666;
        }

        /* 代码块 */
        #editor pre {
            margin: 8px 0;
            padding: 12px 16px;
            background: var(--sidebar-bg);
            border-radius: 6px;
            overflow-x: auto;
            font-family: var(--code-font);
            font-size: 14px;
            line-height: 1.6;
        }

        #editor pre code {
            font-family: var(--code-font);
            font-size: 14px;
            background: transparent;
            padding: 0;
        }

        /* 行内代码 */
        #editor code {
            font-family: var(--code-font);
            font-size: 0.9em;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--sidebar-bg);
            color: var(--primary-color);
        }

        /* 表格 */
        #editor table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
            font-size: 14px;
        }

        #editor th,
        #editor td {
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            text-align: left;
        }

        #editor th {
            background: var(--sidebar-bg);
            font-weight: 600;
        }

        /* 分割线 */
        #editor hr {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 16px 0;
        }

        /* 图片 */
        #editor img {
            max-width: 100%;
            border-radius: 6px;
            margin: 8px 0;
        }

        /* 脚注 */
        #editor .footnote {
            font-size: 0.85em;
            color: #888;
        }

        /* ============================================================
                   状态栏
                   ============================================================ */
        #statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            padding: 0 16px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: #888;
            flex-shrink: 0;
            user-select: none;
        }

        #statusbar .right {
            display: flex;
            gap: 16px;
        }

        #statusbar .mode-badge {
            padding: 2px 10px;
            border-radius: 10px;
            background: var(--sidebar-bg);
            font-size: 11px;
            color: var(--text-color);
        }

        /* ============================================================
                   滚动条美化
                   ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 220px;
                --editor-padding: 16px;
            }

            #toolbar .brand {
                font-size: 13px;
            }

            #toolbar button span {
                display: none;
            }
        }

        /* ============================================================
                   源码模式
                   ============================================================ */
        #editor.source-mode .editor-block {
            font-family: var(--code-font);
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #editor.source-mode h1::before {
            content: '# ';
            color: #888;
        }

        #editor.source-mode h2::before {
            content: '## ';
            color: #888;
        }

        #editor.source-mode h3::before {
            content: '### ';
            color: #888;
        }

        #editor.source-mode h4::before {
            content: '#### ';
            color: #888;
        }

        #editor.source-mode h5::before {
            content: '##### ';
            color: #888;
        }

        #editor.source-mode h6::before {
            content: '###### ';
            color: #888;
        }

        #editor.source-mode blockquote::before {
            content: '> ';
            color: #888;
        }

        #editor.source-mode ul li::before {
            content: '- ';
            color: #888;
        }

        #editor.source-mode ol li::before {
            content: '1. ';
            color: #888;
        }

        /* ============================================================
                   打字机模式
                   ============================================================ */
        #editor-wrapper.typewriter-mode {
            padding-top: 40vh;
            padding-bottom: 40vh;
        }

        #editor-wrapper.typewriter-mode #editor {
            min-height: 20vh;
        }

        /* ============================================================
                   加载 / 空状态
                   ============================================================ */
        .empty-hint {
            color: #aaa;
            text-align: center;
            padding: 40px 0;
            font-size: 14px;
            user-select: none;
        }

        /* ============================================================
                   导出对话框（简单）
                   ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal-box {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .modal-box .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .modal-box .btn-group button {
            padding: 8px 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .modal-box .btn-group button:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .modal-box .close-btn {
            margin-top: 16px;
            padding: 6px 24px;
            background: var(--border-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-color);
            float: right;
        }

        .modal-box .close-btn:hover {
            background: #ccc;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============================================================
                   通知 Toast
                   ============================================================ */
        #toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- ============================================================
    APP
    ============================================================ -->
    <div id="app">

        <!-- ====== 顶部工具栏 ====== -->
        <div id="toolbar">
            <div class="left">
                <span class="brand">📝 MarkEdit</span>
                <span class="separator"></span>
                <button id="btn-new" title="新建 (Ctrl+N)">📄 <span>新建</span></button>
                <button id="btn-open" title="打开 (Ctrl+O)">📂 <span>打开</span></button>
                <button id="btn-save" title="保存 (Ctrl+S)">💾 <span>保存</span></button>
                <span class="separator"></span>
                <button id="btn-undo" title="撤销 (Ctrl+Z)">↩️</button>
                <button id="btn-redo" title="重做 (Ctrl+Y)">↪️</button>
                <span class="separator"></span>
                <button id="btn-source" title="源码模式 (Ctrl+/)">📄 <span>源码</span></button>
                <button id="btn-focus" title="专注模式 (F8)">🎯 <span>专注</span></button>
                <button id="btn-typewriter" title="打字机模式 (F9)">⌨️ <span>打字机</span></button>
                <span class="separator"></span>
                <button id="btn-export" title="导出">📤 <span>导出</span></button>
                <button id="btn-theme" title="切换主题">🌓</button>
            </div>
            <div class="right">
                <button id="btn-sidebar" title="切换侧边栏 (Ctrl+Shift+L)">☰</button>
            </div>
        </div>

        <!-- ====== 主体 ====== -->
        <div id="main">

            <!-- 侧边栏 -->
            <div id="sidebar">
                <div id="sidebar-tabs">
                    <button class="active" data-tab="outline">📋 大纲</button>
                    <button data-tab="files">📁 文件</button>
                </div>
                <div id="sidebar-content">
                    <!-- 由 JS 动态渲染 -->
                    <div class="empty-hint">打开或新建文档</div>
                </div>
            </div>

            <!-- 编辑器 -->
            <div id="editor-wrapper">
                <div id="editor" contenteditable="true" spellcheck="true">
                    <div class="empty-hint">✨ 开始写作吧 ...</div>
                </div>
            </div>

        </div>

        <!-- ====== 状态栏 ====== -->
        <div id="statusbar">
            <div class="left">
                <span id="status-words">0 字</span>
                <span style="margin-left:12px;">|</span>
                <span id="status-lines" style="margin-left:12px;">0 行</span>
            </div>
            <div class="right">
                <span class="mode-badge" id="status-mode">实时预览</span>
                <span id="status-theme">🌞</span>
            </div>
        </div>

    </div>

    <!-- ====== Toast ====== -->
    <div id="toast"></div>

    <!-- ============================================================
    JavaScript
    ============================================================ -->
    <script>
        (function () {
            'use strict';

            // =============================================================
            // 配置
            // =============================================================
            const CONFIG = {
                debounceRender: 150,
                maxHistory: 100,
            };

            // =============================================================
            // DOM 引用
            // =============================================================
            const editor = document.getElementById('editor');
            const editorWrapper = document.getElementById('editor-wrapper');
            const sidebar = document.getElementById('sidebar');
            const sidebarContent = document.getElementById('sidebar-content');
            const statusWords = document.getElementById('status-words');
            const statusLines = document.getElementById('status-lines');
            const statusMode = document.getElementById('status-mode');
            const statusTheme = document.getElementById('status-theme');

            const btnNew = document.getElementById('btn-new');
            const btnOpen = document.getElementById('btn-open');
            const btnSave = document.getElementById('btn-save');
            const btnUndo = document.getElementById('btn-undo');
            const btnRedo = document.getElementById('btn-redo');
            const btnSource = document.getElementById('btn-source');
            const btnFocus = document.getElementById('btn-focus');
            const btnTypewriter = document.getElementById('btn-typewriter');
            const btnExport = document.getElementById('btn-export');
            const btnTheme = document.getElementById('btn-theme');
            const btnSidebar = document.getElementById('btn-sidebar');

            // =============================================================
            // 状态
            // =============================================================
            const state = {
                content: '', // 纯文本 Markdown 源码
                html: '', // 渲染后的 HTML
                isSourceMode: false,
                isFocusMode: false,
                isTypewriterMode: false,
                isDark: false,
                sidebarVisible: true,
                currentFile: null, // File 对象或 null
                fileName: 'untitled.md',
                history: [], // 撤销历史
                historyIndex: -1,
                isRestoring: false,
                activeBlockId: null,
            };

            // =============================================================
            // 工具函数
            // =============================================================
            function getTextContent(el) {
                return el.textContent || '';
            }

            function getPlainText() {
                // 从编辑器提取纯文本（排除样式标记）
                // 使用 innerText 会丢失换行，我们手动处理
                const clone = editor.cloneNode(true);
                // 移除所有隐藏的标记
                const all = clone.querySelectorAll('*');
                for (const node of all) {
                    // 保留换行
                    if (node.tagName === 'BR') {
                        node.replaceWith('\n');
                    }
                }
                let text = clone.textContent || '';
                // 处理块级元素换行
                const blockTags = ['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'DIV', 'LI', 'BLOCKQUOTE', 'PRE'];
                for (const tag of blockTags) {
                    const els = clone.querySelectorAll(tag);
                    for (const el of els) {
                        if (el.textContent) {
                            el.textContent = el.textContent + '\n';
                        }
                    }
                }
                return clone.textContent || '';
            }

            function getEditorHTML() {
                return editor.innerHTML;
            }

            function setEditorHTML(html, keepCursor = true) {
                if (!keepCursor) {
                    editor.innerHTML = html;
                    return;
                }
                // 保存光标位置
                const sel = window.getSelection();
                let cursorOffset = 0;
                let cursorNode = null;
                if (sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    cursorNode = range.startContainer;
                    cursorOffset = range.startOffset;
                }

                editor.innerHTML = html;

                // 恢复光标（简化：尝试在第一个文本节点恢复）
                if (cursorNode) {
                    try {
                        const walker = document.createTreeWalker(
                            editor,
                            NodeFilter.SHOW_TEXT,
                            null,
                            false
                        );
                        let total = 0;
                        let found = false;
                        let node = walker.nextNode();
                        while (node) {
                            const len = node.textContent.length;
                            if (total + len > cursorOffset) {
                                const range = document.createRange();
                                range.setStart(node, cursorOffset - total);
                                range.collapse(true);
                                sel.removeAllRanges();
                                sel.addRange(range);
                                found = true;
                                break;
                            }
                            total += len;
                            node = walker.nextNode();
                        }
                        if (!found && total > 0) {
                            // 放到末尾
                            const last = editor.lastChild;
                            if (last) {
                                const range = document.createRange();
                                range.setStartAfter(last);
                                range.collapse(true);
                                sel.removeAllRanges();
                                sel.addRange(range);
                            }
                        }
                    } catch (e) {
                        // 忽略
                    }
                }
            }

            function debounce(fn, delay) {
                let timer = null;
                return function (...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            function showToast(msg, duration = 2000) {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(el._timer);
                el._timer = setTimeout(() => el.classList.remove('show'), duration);
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + 'B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
                return (bytes / 1048576).toFixed(1) + 'MB';
            }

            // =============================================================
            // Markdown 渲染引擎
            // =============================================================
            function renderMarkdown(text) {
                if (!text) return '<div class="empty-hint">✨ 开始写作吧 ...</div>';

                try {
                    // 配置 marked
                    const renderer = new marked.Renderer();

                    // 代码高亮
                    renderer.code = function (code, lang) {
                        const language = lang || 'plaintext';
                        let highlighted = code;
                        try {
                            if (typeof hljs !== 'undefined') {
                                highlighted = hljs.highlight(code, { language }).value;
                            }
                        } catch (e) {
                            // fallback
                        }
                        return `<pre><code class="language-${language}">${highlighted}</code></pre>`;
                    };

                    // 数学公式 - 用 KaTeX 渲染
                    // 我们会在渲染后额外处理

                    const html = marked.parse(text, { renderer, gfm: true, breaks: true });
                    return html;
                } catch (e) {
                    console.error('Markdown parse error:', e);
                    return `<p style="color:red;">渲染错误: ${e.message}</p>`;
                }
            }

            // 渲染后的后处理：KaTeX 和 Mermaid
            function postProcessHTML(container) {
                // KaTeX 行内和块级公式
                if (typeof katex !== 'undefined') {
                    const inline = container.querySelectorAll('.katex-inline, .math.inline');
                    for (const el of inline) {
                        try {
                            katex.render(el.textContent, el, { displayMode: false, throwOnError: false });
                        } catch (e) { /* ignore */ }
                    }
                    const block = container.querySelectorAll('.katex-display, .math.display');
                    for (const el of block) {
                        try {
                            katex.render(el.textContent, el, { displayMode: true, throwOnError: false });
                        } catch (e) { /* ignore */ }
                    }
                }

                // Mermaid
                if (typeof mermaid !== 'undefined') {
                    const diagrams = container.querySelectorAll('.mermaid');
                    for (const el of diagrams) {
                        try {
                            // 如果已经渲染过则跳过
                            if (el.querySelector('svg')) continue;
                            const id = 'mermaid-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
                            el.id = id;
                            mermaid.run({ nodes: [el] });
                        } catch (e) { /* ignore */ }
                    }
                }
            }

            // =============================================================
            // 编辑器核心
            // =============================================================
            let renderTimer = null;
            let isRendering = false;

            function fullRender(keepCursor = true) {
                if (isRendering) return;
                isRendering = true;

                try {
                    const plain = getPlainText();
                    state.content = plain;

                    // 渲染
                    let html = renderMarkdown(plain);

                    // 包装为块结构
                    // 用临时容器解析
                    const temp = document.createElement('div');
                    temp.innerHTML = html;

                    // 将每个块级元素包装为 .editor-block
                    const children = Array.from(temp.children);
                    const wrapper = document.createElement('div');
                    for (const child of children) {
                        const block = document.createElement('div');
                        block.className = 'editor-block';
                        // 保留原始元素
                        block.appendChild(child.cloneNode(true));
                        wrapper.appendChild(block);
                    }

                    // 如果没有子元素，添加空块
                    if (wrapper.children.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'editor-block';
                        empty.innerHTML = '<p><br></p>';
                        wrapper.appendChild(empty);
                    }

                    state.html = wrapper.innerHTML;

                    // 设置到编辑器
                    setEditorHTML(state.html, keepCursor);

                    // 后处理（KaTeX, Mermaid）
                    postProcessHTML(editor);

                    // 更新大纲
                    updateOutline(plain);

                    // 更新统计
                    updateStats(plain);

                    // 更新高亮
                    if (typeof hljs !== 'undefined') {
                        editor.querySelectorAll('pre code').forEach((block) => {
                            hljs.highlightElement(block);
                        });
                    }

                    // 专注模式高亮当前块
                    if (state.isFocusMode) {
                        highlightActiveBlock();
                    }

                } catch (e) {
                    console.error('Render error:', e);
                } finally {
                    isRendering = false;
                }
            }

            // 防抖渲染
            const debouncedRender = debounce(function (keepCursor = true) {
                fullRender(keepCursor);
            }, CONFIG.debounceRender);

            // 立即渲染（不防抖）
            function immediateRender(keepCursor = true) {
                clearTimeout(renderTimer);
                fullRender(keepCursor);
            }

            // =============================================================
            // 光标与块管理
            // =============================================================
            function getCurrentBlock() {
                const sel = window.getSelection();
                if (!sel.rangeCount) return null;
                const node = sel.anchorNode;
                if (!node) return null;
                let el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
                while (el && el !== editor) {
                    if (el.classList && el.classList.contains('editor-block')) {
                        return el;
                    }
                    el = el.parentElement;
                }
                return null;
            }

            function highlightActiveBlock() {
                const blocks = editor.querySelectorAll('.editor-block');
                blocks.forEach(b => b.classList.remove('active-block'));
                const active = getCurrentBlock();
                if (active) {
                    active.classList.add('active-block');
                    state.activeBlockId = active.id || '';
                }
            }

            // =============================================================
            // 大纲更新
            // =============================================================
            function updateOutline(text) {
                const lines = text.split('\n');
                const items = [];
                for (const line of lines) {
                    const match = line.match(/^(#{1,6})\s+(.+)$/);
                    if (match) {
                        const level = match[1].length;
                        const title = match[2].trim();
                        items.push({ level, title });
                    }
                }

                if (items.length === 0) {
                    sidebarContent.innerHTML = '<div class="empty-hint">📝 暂无标题</div>';
                    return;
                }

                let html = '';
                for (const item of items) {
                    const cls = `outline-item level-${item.level}`;
                    const text = item.title.replace(/\*\*|__|~~|`/g, '');
                    html += `<div class="${cls}" data-level="${item.level}">${'  '.repeat(item.level - 1)}${text}</div>`;
                }
                sidebarContent.innerHTML = html;

                // 点击跳转
                sidebarContent.querySelectorAll('.outline-item').forEach((el, idx) => {
                    el.addEventListener('click', () => {
                        // 找到对应的标题在编辑器中的位置
                        const targetText = el.textContent.trim();
                        const blocks = editor.querySelectorAll('.editor-block');
                        for (const block of blocks) {
                            const h = block.querySelector('h1,h2,h3,h4,h5,h6');
                            if (h && h.textContent.trim() === targetText) {
                                block.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                // 聚焦
                                const range = document.createRange();
                                range.selectNodeContents(block);
                                const sel = window.getSelection();
                                sel.removeAllRanges();
                                sel.addRange(range);
                                return;
                            }
                        }
                    });
                });
            }

            // =============================================================
            // 统计信息
            // =============================================================
            function updateStats(text) {
                const words = text.replace(/\s+/g, ' ').trim().split(' ').filter(w => w.length > 0).length;
                const lines = text.split('\n').filter(l => l.trim().length > 0).length;
                statusWords.textContent = `${words} 字`;
                statusLines.textContent = `${lines} 行`;
            }

            // =============================================================
            // 主题切换
            // =============================================================
            function toggleTheme() {
                state.isDark = !state.isDark;
                document.documentElement.setAttribute('data-theme', state.isDark ? 'dark' : 'light');
                statusTheme.textContent = state.isDark ? '🌙' : '🌞';
                // 更新代码高亮主题
                const hlLink = document.querySelector('link[href*="highlight.js"]');
                if (hlLink) {
                    hlLink.href = state.isDark ?
                        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css' :
                        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
                }
                showToast(state.isDark ? '暗色主题' : '亮色主题');
            }

            // =============================================================
            // 模式切换
            // =============================================================
            function toggleSourceMode() {
                state.isSourceMode = !state.isSourceMode;
                editor.classList.toggle('source-mode', state.isSourceMode);
                statusMode.textContent = state.isSourceMode ? '源码模式' : '实时预览';
                btnSource.textContent = state.isSourceMode ? '📄 预览' : '📄 源码';
                // 重新渲染以显示/隐藏标记
                if (state.isSourceMode) {
                    // 显示源码标记
                    fullRender(true);
                } else {
                    fullRender(true);
                }
                showToast(state.isSourceMode ? '切换到源码模式' : '切换到预览模式');
            }

            function toggleFocusMode() {
                state.isFocusMode = !state.isFocusMode;
                editorWrapper.classList.toggle('focus-mode', state.isFocusMode);
                btnFocus.textContent = state.isFocusMode ? '🎯 退出专注' : '🎯 专注';
                if (state.isFocusMode) {
                    highlightActiveBlock();
                    // 监听选区变化
                    document.addEventListener('selectionchange', onSelectionChange);
                } else {
                    document.removeEventListener('selectionchange', onSelectionChange);
                    editor.querySelectorAll('.editor-block').forEach(b => b.classList.remove('active-block'));
                }
                showToast(state.isFocusMode ? '专注模式已开启' : '专注模式已关闭');
            }

            function onSelectionChange() {
                if (state.isFocusMode) {
                    highlightActiveBlock();
                }
            }

            function toggleTypewriterMode() {
                state.isTypewriterMode = !state.isTypewriterMode;
                editorWrapper.classList.toggle('typewriter-mode', state.isTypewriterMode);
                btnTypewriter.textContent = state.isTypewriterMode ? '⌨️ 退出打字机' : '⌨️ 打字机';
                showToast(state.isTypewriterMode ? '打字机模式已开启' : '打字机模式已关闭');
            }

            function toggleSidebar() {
                state.sidebarVisible = !state.sidebarVisible;
                sidebar.classList.toggle('hidden', !state.sidebarVisible);
                btnSidebar.textContent = state.sidebarVisible ? '☰' : '☰';
                showToast(state.sidebarVisible ? '侧边栏已显示' : '侧边栏已隐藏');
            }

            // =============================================================
            // 文件操作
            // =============================================================
            function newFile() {
                if (state.content && !confirm('当前文档未保存，确定新建吗？')) return;
                state.content = '';
                state.currentFile = null;
                state.fileName = 'untitled.md';
                document.title = 'untitled.md - MarkEdit';
                editor.innerHTML = '<div class="empty-hint">✨ 开始写作吧 ...</div>';
                updateOutline('');
                updateStats('');
                state.history = [];
                state.historyIndex = -1;
                showToast('新建文档');
            }

            function openFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.md,.markdown,.txt';
                input.onchange = function (e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function (ev) {
                        const text = ev.target.result;
                        state.content = text;
                        state.currentFile = file;
                        state.fileName = file.name;
                        document.title = file.name + ' - MarkEdit';
                        // 直接设置内容并渲染
                        // 由于 editor 是 contenteditable，我们需要将文本放入
                        // 但为了渲染，我们使用 fullRender
                        // 先把 editor 内容清空，然后设置纯文本
                        editor.textContent = text;
                        fullRender(true);
                        showToast(`已打开: ${file.name}`);
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            function saveFile() {
                if (state.currentFile) {
                    // 如果有文件，下载更新
                    const text = getPlainText();
                    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = state.fileName;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast(`已保存: ${state.fileName}`);
                } else {
                    // 另存为
                    const text = getPlainText();
                    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = state.fileName || 'untitled.md';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('已保存');
                }
            }

            // =============================================================
            // 导出
            // =============================================================
            function showExportModal() {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                        <div class="modal-box">
                            <h3>📤 导出文档</h3>
                            <p style="color:#888;font-size:14px;margin-bottom:12px;">选择导出格式</p>
                            <div class="btn-group">
                                <button data-format="pdf">📄 PDF</button>
                                <button data-format="html">🌐 HTML</button>
                                <button data-format="txt">📃 纯文本</button>
                                <button data-format="md">📝 Markdown</button>
                            </div>
                            <button class="close-btn">取消</button>
                        </div>
                    `;
                document.body.appendChild(overlay);

                overlay.querySelector('.close-btn').addEventListener('click', () => overlay.remove());
                overlay.querySelectorAll('[data-format]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const format = btn.dataset.format;
                        exportDocument(format);
                        overlay.remove();
                    });
                });
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });
            }

            function exportDocument(format) {
                const text = getPlainText();
                const html = renderMarkdown(text);
                const fullHtml = `<!DOCTYPE html>
                        <html>
                        <head><meta charset="UTF-8"><title>${state.fileName}</title>
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
                        <style>body{max-width:900px;margin:40px auto;padding:0 20px;font-family:'Segoe UI',sans-serif;line-height:1.7;color:#333;}
                        pre{background:#f6f8fa;padding:12px 16px;border-radius:6px;overflow:auto;}
                        blockquote{border-left:4px solid #4a90d9;padding:8px 16px;background:#f8f9fa;}
                        table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ddd;padding:6px 12px;}
                        img{max-width:100%;}
                        </style>
                        </head>
                        <body>${html}</body>
                        </html>`;

                const filename = state.fileName.replace(/\.[^.]+$/, '');

                switch (format) {
                    case 'pdf':
                        // 使用 window.print()
                        const printWin = window.open('', '_blank', 'width=800,height=600');
                        if (printWin) {
                            printWin.document.write(fullHtml);
                            printWin.document.close();
                            printWin.focus();
                            printWin.print();
                        } else {
                            showToast('请允许弹出窗口以导出PDF');
                        }
                        break;
                    case 'html':
                        downloadFile(fullHtml, filename + '.html', 'text/html');
                        showToast('导出 HTML 成功');
                        break;
                    case 'txt':
                        downloadFile(text, filename + '.txt', 'text/plain');
                        showToast('导出纯文本成功');
                        break;
                    case 'md':
                        downloadFile(text, filename + '.md', 'text/markdown');
                        showToast('导出 Markdown 成功');
                        break;
                    default:
                        showToast('不支持的格式');
                }
            }

            function downloadFile(content, filename, mimeType) {
                const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            // =============================================================
            // 快捷键
            // =============================================================
            function handleKeyboard(e) {
                const ctrl = e.ctrlKey || e.metaKey;
                const shift = e.shiftKey;

                // Ctrl+N 新建
                if (ctrl && e.key === 'n') {
                    e.preventDefault();
                    newFile();
                    return;
                }
                // Ctrl+O 打开
                if (ctrl && e.key === 'o') {
                    e.preventDefault();
                    openFile();
                    return;
                }
                // Ctrl+S 保存
                if (ctrl && e.key === 's') {
                    e.preventDefault();
                    saveFile();
                    return;
                }
                // Ctrl+/ 源码模式
                if (ctrl && e.key === '/') {
                    e.preventDefault();
                    toggleSourceMode();
                    return;
                }
                // Ctrl+Shift+L 侧边栏
                if (ctrl && shift && e.key === 'L') {
                    e.preventDefault();
                    toggleSidebar();
                    return;
                }
                // F8 专注模式
                if (e.key === 'F8') {
                    e.preventDefault();
                    toggleFocusMode();
                    return;
                }
                // F9 打字机模式
                if (e.key === 'F9') {
                    e.preventDefault();
                    toggleTypewriterMode();
                    return;
                }
                // Ctrl+Z 撤销
                if (ctrl && e.key === 'z' && !shift) {
                    e.preventDefault();
                    undo();
                    return;
                }
                // Ctrl+Y 或 Ctrl+Shift+Z 重做
                if ((ctrl && e.key === 'y') || (ctrl && shift && e.key === 'Z')) {
                    e.preventDefault();
                    redo();
                    return;
                }
                // Ctrl+B 加粗
                if (ctrl && e.key === 'b') {
                    e.preventDefault();
                    wrapSelection('**', '**');
                    return;
                }
                // Ctrl+I 斜体
                if (ctrl && e.key === 'i') {
                    e.preventDefault();
                    wrapSelection('*', '*');
                    return;
                }
                // Ctrl+1-6 标题
                if (ctrl && /^[1-6]$/.test(e.key)) {
                    e.preventDefault();
                    const level = parseInt(e.key);
                    insertHeading(level);
                    return;
                }
            }

            // =============================================================
            // 文本操作工具
            // =============================================================
            function wrapSelection(before, after) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                if (range.collapsed) {
                    // 没有选中，插入标记
                    const text = before + after;
                    range.insertNode(document.createTextNode(text));
                    // 移动光标到中间
                    const node = range.startContainer;
                    const offset = range.startOffset + before.length;
                    const newRange = document.createRange();
                    newRange.setStart(node, offset);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                } else {
                    const text = range.toString();
                    range.deleteContents();
                    const wrapper = document.createElement('span');
                    wrapper.textContent = before + text + after;
                    range.insertNode(wrapper);
                    // 选择 wrapper 内的内容
                    const newRange = document.createRange();
                    newRange.selectNodeContents(wrapper);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                }
                // 触发渲染
                debouncedRender(true);
            }

            function insertHeading(level) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                const block = getCurrentBlock();
                if (block) {
                    // 在块内插入标题
                    const text = block.textContent || '';
                    const heading = document.createElement(`h${level}`);
                    heading.textContent = text || `标题 ${level}`;
                    block.innerHTML = '';
                    block.appendChild(heading);
                    // 移动光标到末尾
                    const newRange = document.createRange();
                    newRange.setStartAfter(heading);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    debouncedRender(true);
                } else {
                    // 在末尾插入
                    const h = document.createElement(`h${level}`);
                    h.textContent = `标题 ${level}`;
                    const blockDiv = document.createElement('div');
                    blockDiv.className = 'editor-block';
                    blockDiv.appendChild(h);
                    editor.appendChild(blockDiv);
                    // 移动光标
                    const newRange = document.createRange();
                    newRange.setStartAfter(h);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    debouncedRender(true);
                }
            }

            // =============================================================
            // 撤销 / 重做 (简化版)
            // =============================================================
            function pushHistory() {
                if (state.isRestoring) return;
                const content = getPlainText();
                // 如果与当前历史最后一项相同，不重复记录
                if (state.history.length > 0 && state.history[state.history.length - 1] === content) {
                    return;
                }
                // 如果当前不在历史末尾，截断
                if (state.historyIndex < state.history.length - 1) {
                    state.history = state.history.slice(0, state.historyIndex + 1);
                }
                state.history.push(content);
                if (state.history.length > CONFIG.maxHistory) {
                    state.history.shift();
                }
                state.historyIndex = state.history.length - 1;
            }

            function undo() {
                if (state.historyIndex <= 0) {
                    showToast('没有可撤销的操作');
                    return;
                }
                state.isRestoring = true;
                state.historyIndex--;
                const content = state.history[state.historyIndex];
                if (content !== undefined) {
                    editor.textContent = content;
                    fullRender(true);
                    showToast('撤销');
                }
                state.isRestoring = false;
            }

            function redo() {
                if (state.historyIndex >= state.history.length - 1) {
                    showToast('没有可重做的操作');
                    return;
                }
                state.isRestoring = true;
                state.historyIndex++;
                const content = state.history[state.historyIndex];
                if (content !== undefined) {
                    editor.textContent = content;
                    fullRender(true);
                    showToast('重做');
                }
                state.isRestoring = false;
            }

            // =============================================================
            // 编辑器事件绑定
            // =============================================================
            function onEditorInput(e) {
                if (state.isRestoring) return;
                // 记录历史
                pushHistory();
                // 触发渲染
                debouncedRender(true);
                // 更新状态
                if (state.isFocusMode) {
                    highlightActiveBlock();
                }
            }

            function onEditorKeydown(e) {
                // 处理 Tab 缩进 (列表)
                if (e.key === 'Tab') {
                    // 简单处理：插入 4 个空格
                    e.preventDefault();
                    document.execCommand('insertText', false, '    ');
                    // 触发渲染
                    debouncedRender(true);
                }
                // 处理 Enter (列表续行)
                if (e.key === 'Enter') {
                    // 延迟处理，让 contenteditable 先插入换行
                    setTimeout(() => {
                        debouncedRender(true);
                    }, 10);
                }
            }

            function onEditorBlur() {
                // 失去焦点时保存历史
                pushHistory();
            }

            // =============================================================
            // 初始化 Mermaid
            // =============================================================
            function initMermaid() {
                if (typeof mermaid !== 'undefined') {
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: state.isDark ? 'dark' : 'default',
                        securityLevel: 'loose',
                    });
                }
            }

            // =============================================================
            // 初始化
            // =============================================================
            function init() {
                // 设置初始内容
                const initialContent = `# 欢迎使用 MarkEdit

                这是一个**类 Typora** 的 Markdown 编辑器，支持所见即所得的实时渲染。

                ## 功能特性

                - **实时预览**：输入 Markdown 语法即时渲染
                - **专注模式**：按 F8 开启，高亮当前编辑行
                - **打字机模式**：按 F9 开启，编辑行始终居中
                - **源码模式**：按 Ctrl+/ 切换
                - **暗色主题**：点击工具栏 🌓 切换

                ## 代码高亮

                \`\`\`javascript
                function hello() {
                    console.log('Hello, MarkEdit!');
                }
                \`\`\`

                ## 数学公式

                行内公式：$E = mc^2$

                块级公式：
                $$\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}$$

                ## Mermaid 图表

                \`\`\`mermaid
                graph TD
                    A[开始] --> B[编辑]
                    B --> C{保存?}
                    C -->|是| D[导出]
                    C -->|否| B
                \`\`\`

                ## 表格

                | 语言   | 用途       |
                |--------|------------|
                | HTML   | 结构       |
                | CSS    | 样式       |
                | JavaScript | 交互   |

                > 开始你的创作吧！
                `;

                // 设置内容
                editor.textContent = initialContent;

                // 初始化 Mermaid
                initMermaid();

                // 首次渲染
                immediateRender(true);

                // 记录初始历史
                pushHistory();

                // 绑定事件
                editor.addEventListener('input', onEditorInput);
                editor.addEventListener('keydown', onEditorKeydown);
                editor.addEventListener('blur', onEditorBlur);
                document.addEventListener('keydown', handleKeyboard);

                // 工具栏按钮
                btnNew.addEventListener('click', newFile);
                btnOpen.addEventListener('click', openFile);
                btnSave.addEventListener('click', saveFile);
                btnUndo.addEventListener('click', undo);
                btnRedo.addEventListener('click', redo);
                btnSource.addEventListener('click', toggleSourceMode);
                btnFocus.addEventListener('click', toggleFocusMode);
                btnTypewriter.addEventListener('click', toggleTypewriterMode);
                btnExport.addEventListener('click', showExportModal);
                btnTheme.addEventListener('click', toggleTheme);
                btnSidebar.addEventListener('click', toggleSidebar);

                // 侧边栏标签切换
                document.querySelectorAll('#sidebar-tabs button').forEach(btn => {
                    btn.addEventListener('click', function () {
                        document.querySelectorAll('#sidebar-tabs button').forEach(b => b.classList.remove(
                            'active'));
                        this.classList.add('active');
                        const tab = this.dataset.tab;
                        // 简单切换显示
                        if (tab === 'outline') {
                            // 大纲已经在 updateOutline 中更新
                            const text = getPlainText();
                            updateOutline(text);
                        } else {
                            // 文件列表
                            sidebarContent.innerHTML = `
                                    <div class="file-item">📄 ${state.fileName}</div>
                                    <div style="padding:8px 16px;font-size:12px;color:#888;">
                                        当前文档: ${state.fileName}<br>
                                        字数: ${statusWords.textContent}
                                    </div>
                                    <div style="padding:8px 16px;font-size:12px;color:#888;border-top:1px solid var(--border-color);margin-top:8px;">
                                        <button id="btn-new-file" style="background:none;border:none;color:var(--primary-color);cursor:pointer;font-size:13px;">+ 新建文件</button>
                                    </div>
                                `;
                            const newBtn = document.getElementById('btn-new-file');
                            if (newBtn) newBtn.addEventListener('click', newFile);
                        }
                    });
                });

                // 默认选中大纲
                document.querySelector('#sidebar-tabs button[data-tab="outline"]')?.click();

                // 显示状态
                statusMode.textContent = '实时预览';
                statusTheme.textContent = '🌞';

                // 窗口关闭前提示
                window.addEventListener('beforeunload', function (e) {
                    if (state.history.length > 1) {
                        e.preventDefault();
                        e.returnValue = '确定要离开吗？';
                    }
                });

                // 处理粘贴图片
                editor.addEventListener('paste', function (e) {
                    const items = e.clipboardData.items;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            e.preventDefault();
                            const file = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = function (ev) {
                                const dataUrl = ev.target.result;
                                // 插入图片 Markdown
                                const imgMarkdown = `![图片](${dataUrl})`;
                                document.execCommand('insertText', false, imgMarkdown);
                                debouncedRender(true);
                            };
                            reader.readAsDataURL(file);
                            break;
                        }
                    }
                });

                // 拖拽图片
                editor.addEventListener('drop', function (e) {
                    e.preventDefault();
                    const files = e.dataTransfer.files;
                    for (const file of files) {
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = function (ev) {
                                const dataUrl = ev.target.result;
                                const imgMarkdown = `![${file.name}](${dataUrl})`;
                                document.execCommand('insertText', false, imgMarkdown);
                                debouncedRender(true);
                            };
                            reader.readAsDataURL(file);
                            break;
                        }
                    }
                });

                editor.addEventListener('dragover', function (e) {
                    e.preventDefault();
                });

                console.log('📝 MarkEdit 已初始化');
                showToast('✨ 欢迎使用 MarkEdit', 3000);
            }

            // 页面加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>

</html>
