<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Editor · 类 Typora</title>

    <!-- ===== 第三方库 ===== -->
    <!-- Marked: Markdown → HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js">
    </script>
    <!-- highlight.js: 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js">
    </script>
    <!-- KaTeX: 数学公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <!-- Mermaid: 图表 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js">
    </script>

    <style>
        /* ============================================================
                   GLOBAL RESET & TYPOGRAPHY
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #333333;
            --text-secondary: #888888;
            --border: #e0e0e0;
            --hover: #f5f5f5;
            --code-bg: #f6f8fa;
            --blockquote-border: #dfe2e5;
            --shadow: rgba(0, 0, 0, 0.08);
            --header-bg: #fafafa;
            --caret: #000000;
            --selection: #b4d5fe;
            --sidebar-bg: #f8f9fa;
            --sidebar-border: #e9ecef;
            --focus-ring: #2d7aff;
            --radius: 8px;
            --font: 'Segoe UI', 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --bg: #1e1e1e;
            --text: #d4d4d4;
            --text-secondary: #888888;
            --border: #3d3d3d;
            --hover: #2d2d2d;
            --code-bg: #2d2d2d;
            --blockquote-border: #555555;
            --shadow: rgba(0, 0, 0, 0.4);
            --header-bg: #252525;
            --caret: #d4d4d4;
            --selection: #264f78;
            --sidebar-bg: #252525;
            --sidebar-border: #3d3d3d;
            --focus-ring: #4d8aff;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
        }

        /* ============================================================
                   LAYOUT
                   ============================================================ */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg);
        }

        /* ---- 顶栏 ---- */
        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 18px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            height: 44px;
            user-select: none;
            transition: background var(--transition), border var(--transition);
        }

        #toolbar .left,
        #toolbar .right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toolbar .brand {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
            color: var(--text);
            opacity: 0.8;
        }

        #toolbar .brand span {
            color: var(--focus-ring);
        }

        .tb-btn {
            background: transparent;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: background var(--transition), color var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tb-btn:hover {
            background: var(--hover);
            color: var(--text);
        }

        .tb-btn.active {
            color: var(--focus-ring);
            background: rgba(45, 122, 255, 0.10);
        }

        .tb-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .tb-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        /* ---- 主体 (侧栏 + 编辑器) ---- */
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--bg);
            transition: background var(--transition);
        }

        /* ---- 侧栏 ---- */
        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, background var(--transition), border var(--transition);
        }

        #sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        #sidebar .s-header {
            padding: 12px 16px 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #sidebar .s-header .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 4px;
        }

        #sidebar .s-header .close-btn:hover {
            color: var(--text);
        }

        #sidebar .s-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 14px;
        }

        /* 大纲树 */
        .outline-item {
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .outline-item:hover {
            background: var(--hover);
        }

        .outline-item.h1 {
            font-weight: 700;
            font-size: 15px;
        }

        .outline-item.h2 {
            font-weight: 600;
            font-size: 14px;
            padding-left: 18px;
        }

        .outline-item.h3 {
            font-weight: 500;
            font-size: 13px;
            padding-left: 32px;
        }

        .outline-item.h4 {
            font-weight: 400;
            font-size: 13px;
            padding-left: 46px;
        }

        .outline-item.h5 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 60px;
            opacity: 0.8;
        }

        .outline-item.h6 {
            font-weight: 400;
            font-size: 12px;
            padding-left: 74px;
            opacity: 0.7;
        }

        .outline-item .level-badge {
            display: inline-block;
            width: 18px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 400;
        }

        /* ---- 编辑器容器 ---- */
        #editor-wrap {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: var(--bg);
            transition: background var(--transition);
        }

        /* ---- 编辑区域 (contenteditable) ---- */
        #editor {
            width: 100%;
            height: 100%;
            padding: 40px 60px 120px;
            overflow-y: auto;
            outline: none;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.8;
            word-wrap: break-word;
            transition: background var(--transition), color var(--transition);
            caret-color: var(--caret);
            tab-size: 4;
        }

        #editor:focus {
            box-shadow: none;
        }

        /* 选中样式 */
        #editor ::selection {
            background: var(--selection);
        }

        /* ---- 编辑器内部样式 (渲染后的 Markdown) ---- */
        #editor h1,
        #editor h2,
        #editor h3,
        #editor h4,
        #editor h5,
        #editor h6 {
            margin: 1.2em 0 0.4em 0;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        #editor h1 {
            font-size: 2.0em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.2em;
        }

        #editor h2 {
            font-size: 1.6em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.15em;
        }

        #editor h3 {
            font-size: 1.3em;
        }

        #editor h4 {
            font-size: 1.1em;
        }

        #editor h5 {
            font-size: 1.0em;
        }

        #editor h6 {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        #editor p {
            margin: 0.6em 0;
        }

        #editor blockquote {
            border-left: 4px solid var(--blockquote-border);
            padding-left: 1em;
            margin: 0.8em 0;
            color: var(--text-secondary);
            background: var(--code-bg);
            padding: 0.6em 1em;
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        #editor ul,
        #editor ol {
            padding-left: 1.8em;
            margin: 0.4em 0;
        }

        #editor li {
            margin: 0.2em 0;
        }

        #editor li.task-list-item {
            list-style: none;
            margin-left: -1.4em;
        }

        #editor li.task-list-item input[type="checkbox"] {
            margin-right: 0.5em;
            accent-color: var(--focus-ring);
            cursor: pointer;
        }

        #editor code {
            background: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: var(--mono);
            color: #d63384;
        }

        #editor pre {
            background: var(--code-bg);
            padding: 1em 1.2em;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 0.8em 0;
            border: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.6;
        }

        #editor pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }

        #editor table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.8em 0;
            font-size: 14px;
        }

        #editor table th,
        #editor table td {
            border: 1px solid var(--border);
            padding: 6px 12px;
            text-align: left;
        }

        #editor table th {
            background: var(--code-bg);
            font-weight: 600;
        }

        #editor table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.02);
        }

        #editor hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 1.5em 0;
        }

        #editor img {
            max-width: 100%;
            border-radius: 4px;
            margin: 0.4em 0;
        }

        #editor a {
            color: var(--focus-ring);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border 0.15s;
        }

        #editor a:hover {
            border-bottom-color: var(--focus-ring);
        }

        /* 数学公式块 */
        #editor .math-block {
            text-align: center;
            padding: 0.6em 0;
            font-size: 1.1em;
            background: var(--code-bg);
            border-radius: var(--radius);
            margin: 0.6em 0;
        }

        #editor .math-inline {
            display: inline-block;
            padding: 0 0.1em;
        }

        /* Mermaid 图表 */
        #editor .mermaid-container {
            background: var(--bg);
            padding: 0.8em;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin: 0.6em 0;
            text-align: center;
        }

        #editor .mermaid-container svg {
            max-width: 100%;
        }

        /* ---- 状态栏 ---- */
        #statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 18px;
            height: 30px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--header-bg);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            transition: background var(--transition), border var(--transition);
            user-select: none;
        }

        #statusbar .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #statusbar .stat-item span {
            opacity: 0.7;
        }

        #statusbar .stat-item .badge {
            background: var(--code-bg);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 11px;
            opacity: 0.8;
        }

        /* ---- 滚动条美化 ---- */
        #editor::-webkit-scrollbar,
        .s-body::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        #editor::-webkit-scrollbar-track,
        .s-body::-webkit-scrollbar-track {
            background: transparent;
        }

        #editor::-webkit-scrollbar-thumb,
        .s-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        #editor::-webkit-scrollbar-thumb:hover,
        .s-body::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* ---- 响应式 ---- */
        @media (max-width: 768px) {
            #editor {
                padding: 20px 24px 80px;
                font-size: 15px;
            }

            #sidebar {
                width: 200px;
            }

            #sidebar.collapsed {
                width: 0;
            }

            #toolbar .brand {
                font-size: 13px;
            }

            .tb-btn span.label {
                display: none;
            }
        }

        @media (max-width: 480px) {
            #editor {
                padding: 16px 16px 60px;
                font-size: 14px;
            }

            #sidebar {
                width: 160px;
            }

            #toolbar {
                padding: 4px 10px;
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .tb-btn {
                padding: 2px 6px;
                font-size: 12px;
            }

            #statusbar {
                font-size: 11px;
                padding: 2px 10px;
            }
        }

        /* ---- 专注模式 / 打字机模式 (由JS控制类) ---- */
        #editor.focus-mode p:not(.focus-line),
        #editor.focus-mode div:not(.focus-line),
        #editor.focus-mode h1:not(.focus-line),
        #editor.focus-mode h2:not(.focus-line),
        #editor.focus-mode h3:not(.focus-line),
        #editor.focus-mode h4:not(.focus-line),
        #editor.focus-mode h5:not(.focus-line),
        #editor.focus-mode h6:not(.focus-line),
        #editor.focus-mode blockquote:not(.focus-line),
        #editor.focus-mode ul:not(.focus-line),
        #editor.focus-mode ol:not(.focus-line),
        #editor.focus-mode pre:not(.focus-line),
        #editor.focus-mode table:not(.focus-line) {
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        #editor.focus-mode .focus-line {
            opacity: 1 !important;
        }

        #editor.typewriter-mode {
            scroll-behavior: smooth;
        }

        /* ---- 空状态占位 ---- */
        #editor .placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-style: italic;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="app">

        <!-- ====== 工具栏 ====== -->
        <div id="toolbar">
            <div class="left">
                <span class="brand">⌨ <span>MD</span> Editor</span>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnSidebar" title="切换侧栏 (Ctrl+Shift+L)">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 4h18v16H3V4zm2 2v12h14V6H5z" />
                    </svg>
                    <span class="label">大纲</span>
                </button>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnSource" title="源码模式 (Ctrl+/)">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 18H6V4h7v5h5v11zM8 10h8v2H8v-2zm0 4h8v2H8v-2zm0 4h5v2H8v-2z" />
                    </svg>
                    <span class="label">源码</span>
                </button>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnFocus" title="专注模式 (F8)">◎</button>
                <button class="tb-btn" id="btnTypewriter" title="打字机模式 (F9)">◉</button>
                <span class="tb-sep"></span>
                <button class="tb-btn" id="btnTheme" title="切换主题">🌓</button>
            </div>
            <div class="right">
                <button class="tb-btn" id="btnExportHTML" title="导出 HTML">📄</button>
                <button class="tb-btn" id="btnExportPDF" title="导出 PDF (打印)">📎</button>
                <button class="tb-btn" id="btnClear" title="清空">🗑</button>
            </div>
        </div>

        <!-- ====== 主体 ====== -->
        <div id="main">

            <!-- 侧栏 -->
            <div id="sidebar">
                <div class="s-header">
                    <span>📑 大纲</span>
                    <button class="close-btn" id="btnSidebarClose">✕</button>
                </div>
                <div class="s-body" id="outlineTree"></div>
            </div>

            <!-- 编辑器 -->
            <div id="editor-wrap">
                <div id="editor" contenteditable="true" spellcheck="true">
                    <p class="placeholder">开始书写… 支持 Markdown 语法</p>
                </div>
            </div>

        </div>

        <!-- ====== 状态栏 ====== -->
        <div id="statusbar">
            <div class="stat-item">
                <span id="statWords">0 字</span>
                <span id="statLines">0 行</span>
                <span id="statMode" class="badge">编辑</span>
            </div>
            <div class="stat-item">
                <span id="statTheme">🌞</span>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        //  MD Editor — 类 Typora 所见即所得
        //  技术: contenteditable + marked.js + 光标恢复 + 增量渲染
        // ================================================================

        (function () {
            'use strict';

            // ---- DOM refs ----
            const editor = document.getElementById('editor');
            const outlineTree = document.getElementById('outlineTree');
            const statWords = document.getElementById('statWords');
            const statLines = document.getElementById('statLines');
            const statMode = document.getElementById('statMode');
            const statTheme = document.getElementById('statTheme');

            const btnSidebar = document.getElementById('btnSidebar');
            const btnSidebarClose = document.getElementById('btnSidebarClose');
            const sidebar = document.getElementById('sidebar');
            const btnSource = document.getElementById('btnSource');
            const btnFocus = document.getElementById('btnFocus');
            const btnTypewriter = document.getElementById('btnTypewriter');
            const btnTheme = document.getElementById('btnTheme');
            const btnExportHTML = document.getElementById('btnExportHTML');
            const btnExportPDF = document.getElementById('btnExportPDF');
            const btnClear = document.getElementById('btnClear');

            // ---- 状态 ----
            let sourceMode = false;
            let focusMode = false;
            let typewriterMode = false;
            let darkTheme = false;
            let isSidebarOpen = true;

            // 当前文档的 Markdown 源码 (用于源码模式)
            let currentMarkdown = '';

            // 防抖计时器
            let renderTimer = null;

            // 是否正在渲染 (防止循环)
            let isRendering = false;

            // ---- 配置 marked ----
            const markedOptions = {
                gfm: true,
                breaks: true,
                pedantic: false,
                highlight: function (code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (_) { }
                    }
                    return hljs.highlightAuto(code).value;
                }
            };
            marked.setOptions(markedOptions);

            // ---- KaTeX 渲染扩展 (marked) ----
            // 自定义渲染: 处理 $$...$$ 和 $...$
            const renderer = new marked.Renderer();

            // 保存原始 paragraph 渲染
            const originalParagraph = renderer.paragraph;
            renderer.paragraph = function (text) {
                // 检测是否包含 $$ 块级公式
                const blockMathRegex = /\$\$([\s\S]+?)\$\$/g;
                if (blockMathRegex.test(text)) {
                    text = text.replace(blockMathRegex, function (match, math) {
                        try {
                            return katex.renderToString(math.trim(), {
                                displayMode: true,
                                throwOnError: false,
                                trust: true
                            });
                        } catch (_) {
                            return match;
                        }
                    });
                }
                // 检测行内公式 $...$
                const inlineMathRegex = /\$([^\$\n]+?)\$/g;
                if (inlineMathRegex.test(text)) {
                    text = text.replace(inlineMathRegex, function (match, math) {
                        try {
                            return katex.renderToString(math.trim(), {
                                displayMode: false,
                                throwOnError: false,
                                trust: true
                            });
                        } catch (_) {
                            return match;
                        }
                    });
                }
                return originalParagraph.call(this, text);
            };

            // 处理代码块中的 Mermaid
            const originalCode = renderer.code;
            renderer.code = function (code, lang, escaped) {
                if (lang === 'mermaid') {
                    return `<div class="mermaid-container"><div class="mermaid">${code}</div></div>`;
                }
                return originalCode.call(this, code, lang, escaped);
            };

            // 处理表格 (添加 class)
            const originalTable = renderer.table;
            renderer.table = function (header, body) {
                return `<table>${header}${body}</table>`;
            };

            // 任务列表
            const originalList = renderer.list;
            renderer.list = function (body, ordered, start) {
                const isTaskList = /<input\s+type="checkbox"/.test(body);
                if (isTaskList) {
                    return `<ul class="task-list">${body}</ul>`;
                }
                return originalList.call(this, body, ordered, start);
            };

            const originalListItem = renderer.listitem;
            renderer.listitem = function (text, task, checked) {
                if (task) {
                    const checkbox = `<input type="checkbox" ${checked ? 'checked' : ''} disabled />`;
                    return `<li class="task-list-item">${checkbox} ${text}</li>`;
                }
                return originalListItem.call(this, text, task, checked);
            };

            marked.use({ renderer });

            // ---- Mermaid 初始化 ----
            mermaid.initialize({
                startOnLoad: false,
                theme: darkTheme ? 'dark' : 'default',
                securityLevel: 'loose',
            });

            // ---- 工具: 获取纯文本内容 (去除 HTML 标签) ----
            function getPlainText(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || '';
            }

            // ---- 工具: 统计字数/行数 ----
            function updateStats() {
                const plain = getPlainText(editor.innerHTML);
                const words = plain.replace(/\s/g, '').length;
                const lines = plain.split('\n').length;
                statWords.textContent = words + ' 字';
                statLines.textContent = lines + ' 行';
            }

            // ---- 核心: 渲染 Markdown → HTML (保留光标) ----
            function renderMarkdown(keepCursor = true) {
                if (isRendering) return;
                if (sourceMode) {
                    // 源码模式: 显示原始 Markdown
                    const raw = currentMarkdown || getPlainText(editor.innerHTML);
                    if (editor.innerHTML !== raw) {
                        editor.innerHTML = raw;
                    }
                    updateStats();
                    return;
                }

                isRendering = true;

                // 获取当前文本内容 (如果是源码模式则用 currentMarkdown)
                let md = currentMarkdown;
                if (!md || sourceMode) {
                    md = getPlainText(editor.innerHTML);
                }

                // 保存光标位置
                let sel = null;
                let offset = 0;
                let nodePath = null;
                if (keepCursor) {
                    const selection = window.getSelection();
                    if (selection && selection.rangeCount > 0) {
                        const range = selection.getRangeAt(0);
                        const preCaretRange = range.cloneRange();
                        preCaretRange.selectNodeContents(editor);
                        preCaretRange.setEnd(range.endContainer, range.endOffset);
                        offset = preCaretRange.toString().length;
                        // 保存节点路径
                        nodePath = getNodePath(range.endContainer);
                        sel = {
                            offset: offset,
                            nodePath: nodePath,
                            startContainer: range.startContainer,
                            startOffset: range.startOffset,
                            endContainer: range.endContainer,
                            endOffset: range.endOffset,
                            collapsed: range.collapsed
                        };
                    }
                }

                // 解析 Markdown
                let html = '';
                try {
                    html = marked.parse(md);
                } catch (e) {
                    html = `<p>⚠️ 解析错误: ${e.message}</p>`;
                }

                // 如果内容为空，显示占位符
                if (!html.trim()) {
                    html = `<p class="placeholder">开始书写… 支持 Markdown 语法</p>`;
                }

                // 更新编辑器
                if (editor.innerHTML !== html) {
                    editor.innerHTML = html;
                }

                // 重新渲染 Mermaid
                const mermaidElements = editor.querySelectorAll('.mermaid');
                if (mermaidElements.length > 0) {
                    mermaidElements.forEach((el, index) => {
                        const code = el.textContent;
                        try {
                            const id = `mermaid-${Date.now()}-${index}`;
                            el.id = id;
                            mermaid.render(id, code).then(({ svg }) => {
                                el.innerHTML = svg;
                            }).catch(() => { });
                        } catch (_) { }
                    });
                }

                // 恢复光标
                if (keepCursor && sel) {
                    try {
                        restoreCursor(sel);
                    } catch (e) {
                        // 如果恢复失败，将光标放在末尾
                        try {
                            const range = document.createRange();
                            const last = editor.lastChild || editor;
                            range.setStart(last, last.textContent ? last.textContent.length : 0);
                            range.collapse(true);
                            const selection = window.getSelection();
                            selection.removeAllRanges();
                            selection.addRange(range);
                        } catch (_) { }
                    }
                } else {
                    // 没有保存光标，放到末尾
                    try {
                        const range = document.createRange();
                        const last = editor.lastChild || editor;
                        range.setStart(last, last.textContent ? last.textContent.length : 0);
                        range.collapse(true);
                        const selection = window.getSelection();
                        selection.removeAllRanges();
                        selection.addRange(range);
                    } catch (_) { }
                }

                // 更新 currentMarkdown
                currentMarkdown = md;

                // 更新统计
                updateStats();

                // 更新大纲
                updateOutline(md);

                isRendering = false;
            }

            // ---- 获取节点路径 ----
            function getNodePath(node) {
                const path = [];
                let current = node;
                while (current && current !== editor) {
                    let index = 0;
                    let sibling = current;
                    while (sibling && sibling.previousSibling) {
                        sibling = sibling.previousSibling;
                        index++;
                    }
                    path.push(index);
                    current = current.parentNode;
                }
                return path.reverse();
            }

            // ---- 根据路径恢复光标 ----
            function restoreCursor(sel) {
                if (!sel) return;
                const selection = window.getSelection();
                selection.removeAllRanges();

                // 尝试通过路径找到节点
                let node = editor;
                const path = sel.nodePath || [];
                for (let i = 0; i < path.length; i++) {
                    const idx = path[i];
                    const children = node.childNodes;
                    if (idx < children.length) {
                        node = children[idx];
                    } else {
                        // 路径失效，使用最后一个子节点
                        if (children.length > 0) {
                            node = children[children.length - 1];
                        }
                        break;
                    }
                }

                // 如果节点是文本节点，计算偏移
                let textLen = 0;
                if (node.nodeType === Node.TEXT_NODE) {
                    textLen = node.textContent.length;
                } else {
                    // 元素节点，尝试找文本
                    const textNode = node.firstChild;
                    if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                        node = textNode;
                        textLen = node.textContent.length;
                    } else {
                        // 没有文本节点，使用元素内容长度
                        textLen = node.textContent ? node.textContent.length : 0;
                    }
                }

                const offset = Math.min(sel.offset || 0, textLen);

                try {
                    const range = document.createRange();
                    range.setStart(node, offset);
                    range.collapse(true);
                    selection.addRange(range);
                } catch (e) {
                    // 降级: 放到末尾
                    const range = document.createRange();
                    const last = editor.lastChild || editor;
                    range.setStart(last, last.textContent ? last.textContent.length : 0);
                    range.collapse(true);
                    selection.addRange(range);
                }
            }

            // ---- 更新大纲 ----
            function updateOutline(md) {
                // 提取标题
                const headingRegex = /^(#{1,6})\s+(.+)$/gm;
                const headings = [];
                let match;
                while ((match = headingRegex.exec(md)) !== null) {
                    const level = match[1].length;
                    const text = match[2].trim();
                    headings.push({ level, text });
                }

                if (headings.length === 0) {
                    outlineTree.innerHTML = `<div style="color:var(--text-secondary);font-size:13px;padding:8px;">无标题</div>`;
                    return;
                }

                let html = '';
                headings.forEach((h, index) => {
                    const cls = `outline-item h${h.level}`;
                    const badge = `H${h.level}`;
                    html += `<div class="${cls}" data-index="${index}">
                                <span class="level-badge">${badge}</span>
                                ${escapeHtml(h.text)}
                            </div>`;
                });
                outlineTree.innerHTML = html;

                // 点击跳转
                outlineTree.querySelectorAll('.outline-item').forEach((el) => {
                    el.addEventListener('click', function () {
                        const idx = parseInt(this.dataset.index, 10);
                        if (!isNaN(idx) && idx < headings.length) {
                            // 在源码中查找标题位置并滚动到附近
                            const target = headings[idx];
                            const text = target.text;
                            // 简单查找: 在 editor 中找包含该文本的标题元素
                            const headers = editor.querySelectorAll('h1,h2,h3,h4,h5,h6');
                            for (const h of headers) {
                                if (h.textContent.trim() === text) {
                                    h.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    // 高亮一下
                                    h.style.transition = 'background 0.3s';
                                    h.style.background = 'var(--selection)';
                                    setTimeout(() => { h.style.background = ''; }, 600);
                                    break;
                                }
                            }
                        }
                    });
                });
            }

            // ---- 简易 HTML 转义 ----
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---- 从编辑器提取 Markdown (逆向) ----
            function extractMarkdownFromDOM() {
                // 简单实现: 从 innerHTML 提取纯文本
                // 但对于复杂内容，我们直接使用 currentMarkdown
                return currentMarkdown || getPlainText(editor.innerHTML);
            }

            // ---- 切换源码模式 ----
            function toggleSourceMode() {
                sourceMode = !sourceMode;
                if (sourceMode) {
                    // 进入源码模式: 显示原始 Markdown
                    const md = currentMarkdown || getPlainText(editor.innerHTML);
                    editor.innerHTML = md;
                    statMode.textContent = '源码';
                    btnSource.classList.add('active');
                } else {
                    // 退出源码模式: 渲染
                    statMode.textContent = '编辑';
                    btnSource.classList.remove('active');
                    // 从当前内容提取 Markdown
                    currentMarkdown = getPlainText(editor.innerHTML);
                    renderMarkdown(true);
                }
            }

            // ---- 切换主题 ----
            function toggleTheme() {
                darkTheme = !darkTheme;
                document.documentElement.setAttribute('data-theme', darkTheme ? 'dark' : 'light');
                statTheme.textContent = darkTheme ? '🌙' : '🌞';
                // 重新渲染 Mermaid 主题
                const mermaidEls = editor.querySelectorAll('.mermaid-container');
                if (mermaidEls.length > 0) {
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: darkTheme ? 'dark' : 'default',
                        securityLevel: 'loose',
                    });
                    renderMarkdown(true);
                }
            }

            // ---- 切换专注模式 ----
            function toggleFocus() {
                focusMode = !focusMode;
                editor.classList.toggle('focus-mode', focusMode);
                btnFocus.classList.toggle('active', focusMode);
                if (focusMode) {
                    // 高亮当前行
                    updateFocusLine();
                }
            }

            // ---- 更新专注模式高亮行 ----
            function updateFocusLine() {
                if (!focusMode) return;
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    let node = range.startContainer;
                    // 找到最近的块级元素
                    while (node && node !== editor) {
                        if (node.nodeType === Node.ELEMENT_NODE) {
                            const tag = node.tagName;
                            if (['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'UL', 'OL', 'PRE', 'TABLE', 'DIV']
                                .includes(tag)) {
                                break;
                            }
                        }
                        node = node.parentNode;
                    }
                    // 移除所有 focus-line
                    editor.querySelectorAll('.focus-line').forEach(el => el.classList.remove('focus-line'));
                    if (node && node !== editor) {
                        if (node.nodeType === Node.ELEMENT_NODE) {
                            node.classList.add('focus-line');
                        } else if (node.parentNode) {
                            node.parentNode.classList.add('focus-line');
                        }
                    }
                }
            }

            // ---- 切换打字机模式 ----
            function toggleTypewriter() {
                typewriterMode = !typewriterMode;
                editor.classList.toggle('typewriter-mode', typewriterMode);
                btnTypewriter.classList.toggle('active', typewriterMode);
                if (typewriterMode) {
                    scrollToCaret();
                }
            }

            // ---- 打字机滚动 ----
            function scrollToCaret() {
                if (!typewriterMode) return;
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    const rect = range.getClientRects()[0];
                    if (rect) {
                        const editorRect = editor.getBoundingClientRect();
                        const targetY = rect.top - editorRect.top - editor.clientHeight / 2 + 40;
                        editor.scrollTop += targetY;
                    }
                }
            }

            // ---- 处理输入事件 (防抖渲染) ----
            function onEditorInput() {
                if (sourceMode) {
                    // 源码模式: 更新 currentMarkdown
                    currentMarkdown = editor.innerText || editor.textContent || '';
                    updateStats();
                    updateOutline(currentMarkdown);
                    return;
                }

                // 更新 currentMarkdown
                const raw = getPlainText(editor.innerHTML);
                currentMarkdown = raw;

                // 防抖渲染
                clearTimeout(renderTimer);
                renderTimer = setTimeout(() => {
                    renderMarkdown(true);
                    if (focusMode) updateFocusLine();
                    if (typewriterMode) scrollToCaret();
                }, 200);

                // 立即更新统计和大纲 (轻量)
                updateStats();
                updateOutline(raw);
                if (focusMode) updateFocusLine();
            }

            // ---- 处理键盘事件 (快捷键) ----
            function onEditorKeydown(e) {
                const ctrl = e.ctrlKey || e.metaKey;

                // Ctrl+/ 切换源码模式
                if (ctrl && e.key === '/') {
                    e.preventDefault();
                    toggleSourceMode();
                    return;
                }

                // Ctrl+Shift+L 切换侧栏
                if (ctrl && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
                    e.preventDefault();
                    toggleSidebar();
                    return;
                }

                // F8 专注模式
                if (e.key === 'F8') {
                    e.preventDefault();
                    toggleFocus();
                    return;
                }

                // F9 打字机模式
                if (e.key === 'F9') {
                    e.preventDefault();
                    toggleTypewriter();
                    return;
                }

                // Ctrl+B 粗体
                if (ctrl && e.key === 'b') {
                    e.preventDefault();
                    wrapSelection('**', '**');
                    return;
                }

                // Ctrl+I 斜体
                if (ctrl && e.key === 'i') {
                    e.preventDefault();
                    wrapSelection('*', '*');
                    return;
                }

                // Ctrl+1~6 标题
                if (ctrl && e.key >= '1' && e.key <= '6') {
                    e.preventDefault();
                    const level = parseInt(e.key, 10);
                    insertHeading(level);
                    return;
                }

                // Ctrl+T 表格
                if (ctrl && e.key === 't') {
                    e.preventDefault();
                    insertTable();
                    return;
                }

                // Enter 键: 处理列表延续
                if (e.key === 'Enter' && !e.shiftKey && !ctrl) {
                    // 延迟处理，让浏览器先插入换行
                    setTimeout(() => {
                        handleListContinuation();
                    }, 10);
                }

                // Tab 键: 缩进列表
                if (e.key === 'Tab' && !e.shiftKey) {
                    // 简单处理: 插入 4 个空格
                    e.preventDefault();
                    document.execCommand('insertText', false, '    ');
                }
            }

            // ---- 处理列表延续 ----
            function handleListContinuation() {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                let node = range.startContainer;
                // 找到当前段落
                while (node && node !== editor) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        const tag = node.tagName;
                        if (['P', 'LI', 'BLOCKQUOTE'].includes(tag)) break;
                    }
                    node = node.parentNode;
                }
                if (!node || node === editor) return;

                const text = node.textContent || '';
                // 检测是否以列表标记开头
                const ulMatch = text.match(/^[\s]*[-*]\s+/);
                const olMatch = text.match(/^[\s]*(\d+)\.\s+/);
                if (ulMatch || olMatch) {
                    // 如果当前行只有列表标记，移除它 (结束列表)
                    const stripped = text.replace(/^[\s]*[-*]\s+/, '').replace(/^[\s]*\d+\.\s+/, '').trim();
                    if (!stripped) {
                        // 空列表项: 转换为普通段落
                        const p = document.createElement('p');
                        p.textContent = '';
                        node.parentNode.replaceChild(p, node);
                        // 将光标放入新段落
                        const newRange = document.createRange();
                        newRange.setStart(p, 0);
                        newRange.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                        renderMarkdown(true);
                        return;
                    }
                }

                // 检测引用
                const quoteMatch = text.match(/^[\s]*>\s+/);
                if (quoteMatch) {
                    const stripped = text.replace(/^[\s]*>\s+/, '').trim();
                    if (!stripped) {
                        const p = document.createElement('p');
                        p.textContent = '';
                        node.parentNode.replaceChild(p, node);
                        const newRange = document.createRange();
                        newRange.setStart(p, 0);
                        newRange.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                        renderMarkdown(true);
                        return;
                    }
                }

                // 检测标题
                const headingMatch = text.match(/^(#{1,6})\s+/);
                if (headingMatch) {
                    // 标题后按回车: 创建普通段落
                    const p = document.createElement('p');
                    p.textContent = '';
                    if (node.parentNode) {
                        node.parentNode.insertBefore(p, node.nextSibling);
                        const newRange = document.createRange();
                        newRange.setStart(p, 0);
                        newRange.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                        renderMarkdown(true);
                    }
                }
            }

            // ---- 包裹选中文本 (粗体/斜体) ----
            function wrapSelection(prefix, suffix) {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                if (range.collapsed) {
                    // 没有选中文本，插入标记并让光标在中间
                    const text = prefix + suffix;
                    document.execCommand('insertText', false, text);
                    // 移动光标到中间
                    const newRange = document.createRange();
                    const node = range.startContainer;
                    const offset = range.startOffset + prefix.length;
                    newRange.setStart(node, offset);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    return;
                }
                const text = range.toString();
                const wrapped = prefix + text + suffix;
                range.deleteContents();
                const textNode = document.createTextNode(wrapped);
                range.insertNode(textNode);
                // 选中包裹后的内容
                const newRange = document.createRange();
                newRange.setStart(textNode, prefix.length);
                newRange.setEnd(textNode, prefix.length + text.length);
                sel.removeAllRanges();
                sel.addRange(newRange);
                // 触发渲染
                onEditorInput();
            }

            // ---- 插入标题 ----
            function insertHeading(level) {
                const prefix = '#'.repeat(level) + ' ';
                document.execCommand('insertText', false, prefix);
                // 光标在空格后
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    const range = sel.getRangeAt(0);
                    const node = range.startContainer;
                    const offset = range.startOffset;
                    const newOffset = offset;
                    const newRange = document.createRange();
                    newRange.setStart(node, newOffset);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                }
                // 触发渲染
                setTimeout(() => onEditorInput(), 10);
            }

            // ---- 插入表格 ----
            function insertTable() {
                const tableMarkdown = `
            | 列1 | 列2 | 列3 |
            |-----|-----|-----|
            | 单元格 | 单元格 | 单元格 |
            | 单元格 | 单元格 | 单元格 |
            `;
                document.execCommand('insertText', false, tableMarkdown);
                setTimeout(() => onEditorInput(), 10);
            }

            // ---- 切换侧栏 ----
            function toggleSidebar() {
                isSidebarOpen = !isSidebarOpen;
                sidebar.classList.toggle('collapsed', !isSidebarOpen);
            }

            // ---- 导出 HTML ----
            function exportHTML() {
                const content = editor.innerHTML;
                const style = document.querySelector('style').innerHTML;
                const html = `<!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>导出的文档</title>
            <style>${style}</style>
            <style>body{max-width:900px;margin:40px auto;padding:0 20px;}</style>
            </head>
            <body>${content}</body>
            </html>`;
                downloadFile(html, 'document.html', 'text/html');
            }

            // ---- 导出 PDF (通过打印) ----
            function exportPDF() {
                window.print();
            }

            // ---- 下载文件 ----
            function downloadFile(content, filename, mime) {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ---- 清空文档 ----
            function clearDocument() {
                if (confirm('确定要清空所有内容吗？')) {
                    currentMarkdown = '';
                    editor.innerHTML = '<p class="placeholder">开始书写… 支持 Markdown 语法</p>';
                    updateStats();
                    updateOutline('');
                    renderMarkdown(true);
                }
            }

            // ---- 粘贴图片支持 ----
            function onPaste(e) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = function (ev) {
                            const dataUrl = ev.target.result;
                            const imgMarkdown = `![粘贴图片](${dataUrl})`;
                            document.execCommand('insertText', false, imgMarkdown);
                            setTimeout(() => onEditorInput(), 10);
                        };
                        reader.readAsDataURL(file);
                        break;
                    }
                }
            }

            // ---- 拖拽图片支持 ----
            function onDrop(e) {
                e.preventDefault();
                const files = e.dataTransfer.files;
                for (const file of files) {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function (ev) {
                            const dataUrl = ev.target.result;
                            const imgMarkdown = `![拖拽图片](${dataUrl})`;
                            document.execCommand('insertText', false, imgMarkdown);
                            setTimeout(() => onEditorInput(), 10);
                        };
                        reader.readAsDataURL(file);
                        break;
                    }
                }
            }

            // ---- 初始化 ----
            function init() {
                // 设置初始内容
                const initialMD = `# 欢迎使用 MD Editor

        这是一个 **类 Typora** 的所见即所得 Markdown 编辑器。

        ## 功能特性

        - 实时渲染 · 光标保持
        - 标题 (Ctrl+1~6)
        - **粗体** (Ctrl+B) 和 *斜体* (Ctrl+I)
        - 有序列表 和 无序列表
        - > 引用块
        - \`行内代码\` 和 代码块

        \`\`\`javascript
        console.log('Hello, MD Editor!');
        \`\`\`

        ## 数学公式

        行内公式: $E = mc^2$

        块级公式:

        $$
        \\int_{-\\infty}^{\\infty} e^{-x^2} dx = \\sqrt{\\pi}
        $$

        ## 表格

        | 语言   | 用途     |
        |--------|----------|
        | HTML   | 结构     |
        | CSS    | 样式     |
        | JavaScript | 交互 |

        ## Mermaid 图表

        \`\`\`mermaid
        graph TD
            A[开始] --> B{判断}
            B -->|是| C[执行]
            B -->|否| D[结束]
        \`\`\`

        ---

        **快捷键**: Ctrl+/ 源码切换 · Ctrl+B/I · Ctrl+1~6 · F8 专注 · F9 打字机
        `;
                currentMarkdown = initialMD;
                renderMarkdown(false);

                // 事件绑定
                editor.addEventListener('input', onEditorInput);
                editor.addEventListener('keydown', onEditorKeydown);
                editor.addEventListener('paste', onPaste);
                editor.addEventListener('drop', onDrop);
                editor.addEventListener('dragover', (e) => e.preventDefault());

                // 选区变化: 更新专注行
                document.addEventListener('selectionchange', () => {
                    if (focusMode) updateFocusLine();
                    if (typewriterMode) scrollToCaret();
                });

                // 滚动时更新打字机
                editor.addEventListener('scroll', () => {
                    if (typewriterMode) scrollToCaret();
                });

                // 按钮事件
                btnSidebar.addEventListener('click', toggleSidebar);
                btnSidebarClose.addEventListener('click', toggleSidebar);
                btnSource.addEventListener('click', toggleSourceMode);
                btnFocus.addEventListener('click', toggleFocus);
                btnTypewriter.addEventListener('click', toggleTypewriter);
                btnTheme.addEventListener('click', toggleTheme);
                btnExportHTML.addEventListener('click', exportHTML);
                btnExportPDF.addEventListener('click', exportPDF);
                btnClear.addEventListener('click', clearDocument);

                // 全局快捷键
                document.addEventListener('keydown', (e) => {
                    const ctrl = e.ctrlKey || e.metaKey;
                    if (ctrl && e.shiftKey && (e.key === 'l' || e.key === 'L')) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    if (e.key === 'F8' && !e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        toggleFocus();
                    }
                    if (e.key === 'F9' && !e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        toggleTypewriter();
                    }
                });

                // 更新状态
                statMode.textContent = '编辑';
                statTheme.textContent = '🌞';
                updateStats();

                console.log('📝 MD Editor 已启动');
            }

            // ---- 页面加载完成后初始化 ----
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>

</html>
