<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vditor - 网页版 Typora</title>

    <!-- Vditor 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/index.css?v=20260819144006" />
    <!-- 代码高亮样式（可选，Vditor 会动态加载） -->
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.9/dist/js/highlight.js/styles/github.css?v=20260819144006" />

    <style>
        /* 全局重置，模拟 Typora 的极简风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* 编辑器容器填满视口 */
        #vditor {
            height: 100vh;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
        }

        /* 覆盖 Vditor 默认样式，更接近 Typora */
        .vditor {
            border: none !important;
            border-radius: 0 !important;
        }

        .vditor .vditor-reset {
            font-size: 16px;
            line-height: 1.8;
        }

        /* Typora 风格的滚动条 */
        .vditor-reset::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .vditor-reset::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 3px;
        }

        .vditor-reset::-webkit-scrollbar-thumb:hover {
            background: #b0b8c0;
        }

        /* 标题样式更接近 Typora */
        .vditor-reset h1,
        .vditor-reset h2,
        .vditor-reset h3,
        .vditor-reset h4,
        .vditor-reset h5,
        .vditor-reset h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        .vditor-reset h1 {
            font-size: 2em;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 0.3em;
        }

        .vditor-reset h2 {
            font-size: 1.5em;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 0.3em;
        }

        .vditor-reset blockquote {
            border-left: 4px solid #dfe2e5;
            padding: 0 16px;
            color: #6a737d;
        }

        .vditor-reset code {
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 85%;
        }

        .vditor-reset pre {
            background: #f6f8fa;
            border-radius: 6px;
            padding: 16px;
            overflow: auto;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            #vditor {
                max-width: 100%;
                height: 100vh;
            }

            .vditor-reset {
                font-size: 15px;
                padding: 16px !important;
            }
        }
    </style>
</head>
<body>

    <!-- Vditor 编辑器挂载点 -->
    <div id="vditor"></div>

    <!-- Vditor 核心 JS -->
    <script src="https://unpkg.com/vditor@3.10.9/dist/index.min.js?v=20260819144006">
    </script>

    <script>
        // ============================================================
        //  初始化 Vditor，采用「即时渲染 (IR)」模式 —— 类似 Typora
        //  文档：https://github.com/Vanessa219/vditor
        // ============================================================

        const vditor = new Vditor('vditor', {

            // ---------- 核心模式 ----------
            mode: 'ir', // 'ir' = 即时渲染（类似 Typora）[reference:2]
            // 'wysiwyg' = 所见即所得（富文本）
            // 'sv' = 分屏预览

            // ---------- 外观 ----------
            theme: 'classic', // 'classic' | 'dark'
            icon: 'ant', // 'ant' | 'material'

            // ---------- 编辑器高度 ----------
            height: '100%',

            // ---------- 初始内容 ----------
            value: [
                '# 欢迎使用 Vditor 🎉',
                '',
                '这是一个**即时渲染**模式的 Markdown 编辑器，体验类似 **Typora**。',
                '',
                '## 基本语法示例',
                '',
                '- **加粗** 和 *斜体*',
                '- `行内代码`',
                '- [链接](https://github.com/Vanessa219/vditor)',
                '- ![图片](https://b3log.org/images/brand/b3log-512.png)',
                '',
                '### 代码块',
                '',
                '```javascript',
                'function hello() {',
                '  console.log("Hello, Vditor!");',
                '}',
                '```',
                '',
                '### 表格',
                '',
                '| 特性 | 支持 |',
                '|------|------|',
                '| 即时渲染 | ✅ |',
                '| 数学公式 | ✅ |',
                '| 图表 | ✅ |',
                '',
                '### 引用',
                '',
                '> 纸上得来终觉浅，绝知此事要躬行。',
                '',
                '---',
                '',
                '💡 试试在下方编辑区自由书写吧！'
            ].join('\n'),

            // ---------- 缓存（自动保存到 localStorage） ----------
            cache: {
                enable: true, // 启用本地缓存[reference:3]
                id: 'vditor-typora-demo' // 缓存 key
            },

            // ---------- 预览配置 ----------
            preview: {
                delay: 500, // 防抖延迟（毫秒）[reference:4]
                maxWidth: 800, // 预览区最大宽度[reference:5]
                mode: 'both', // 'both' 显示编辑与预览 | 'editor' 仅显示编辑器[reference:6]
                // 数学公式渲染（KaTeX 更轻量，MathJax 更完整）
                math: {
                    engine: 'KaTeX', // 'KaTeX' | 'MathJax'
                    // 可选：MathJax 宏定义
                    macros: {
                        '\\R': '\\mathbb{R}',
                        '\\N': '\\mathbb{N}'
                    }
                },
                // 代码高亮主题
                hljs: {
                    style: 'github' // 可选： 'github' | 'dracula' | 'vs2015' 等
                }
            },

            // ---------- 工具栏 ----------
            // 精简工具栏，更接近 Typora 的简洁风格[reference:7]
            toolbar: [
                'emoji',
                'headings',
                'bold',
                'italic',
                'strike',
                '|',
                'line',
                'quote',
                'list',
                'ordered-list',
                'check',
                '|',
                'code',
                'inline-code',
                '|',
                'upload',
                'link',
                'table',
                '|',
                'undo',
                'redo',
                '|',
                'edit-mode',
                'both',
                'preview',
                'fullscreen',
                'outline',
                '|',
                'export',
                'info'
            ],

            // ---------- 计数器 ----------
            counter: {
                enable: true, // 启用字数统计[reference:8]
                type: 'markdown' // 'markdown' | 'text'
            },

            // ---------- 上传（图片等） ----------
            upload: {
                // 若需上传到服务器，请配置 url 和字段名
                // url: '/api/upload',
                // fieldName: 'file',
                // 本示例使用 base64 内联（适合演示）
                linkToImgUrl: '', // 留空则粘贴链接时不自动转图片
                // 允许拖拽上传（使用 base64 编码）
                accept: 'image/*',
                // 上传前将图片转为 base64（适合演示，生产环境建议上传到服务器）
                handler: (files) => {
                    // 简单 demo：将图片转为 base64 插入
                    const file = files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imgMarkdown = `![${file.name}](${e.target.result})`;
                        vditor.insertValue(imgMarkdown);
                    };
                    reader.readAsDataURL(file);
                }
            },

            // ---------- 表情 ----------
            emoji: {
                // 默认开启，可使用 :smile: 等
            },

            // ---------- 大纲 ----------
            outline: {
                enable: true, // 启用大纲[reference:9]
                position: 'left' // 'left' | 'right'
            },

            // ---------- 打字机模式 ----------
            typewriterMode: true, // 启用打字机模式[reference:10]

            // ---------- 其他 ----------
            // 禁用默认的 XSS 过滤（若需要渲染 HTML 标签，请谨慎开启）
            // sanitize: false,

            // 自定义 CDN 地址（默认已使用 unpkg）
            // cdn: 'https://unpkg.com/vditor@3.10.9',

            // ---------- 生命周期回调 ----------
            after: () => {
                console.log('✅ Vditor 已启动！');
                // 可以在这里执行额外的初始化逻辑
            },

            // 输入事件
            input: (value) => {
                // 实时获取编辑器内容
                // console.log('内容变化:', value.substring(0, 50) + '...');
            },

            // 聚焦/失焦
            focus: () => {
                // console.log('编辑器获得焦点');
            },
            blur: () => {
                // console.log('编辑器失去焦点');
            }
        });

        // ============================================================
        //  暴露实例到全局，方便在 DevTools 中调试
        // ============================================================
        window.vditor = vditor;

        console.log('💡 提示: 在控制台中输入 vditor 可操作编辑器实例');
    </script>

</body>
</html>
