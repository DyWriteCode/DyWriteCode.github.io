<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎆 真实·性能优化烟花</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: default;
        }

        .info {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            letter-spacing: 2px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 20px;
            border-radius: 40px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 600px) {
            .info {
                font-size: 9px;
                padding: 3px 12px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <canvas id="fireworksCanvas"></canvas>
    <div class="info">✦ 真实火花 · 优化性能 ✦</div>

    <script>
        // ============================================================
        //  1. 画布 & 尺寸
        // ============================================================
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ============================================================
        //  2. 工具函数 (更自然的色彩)
        // ============================================================
        const rand = (a, b) => Math.random() * (b - a) + a;
        const randInt = (a, b) => Math.floor(rand(a, b + 1));
        const lerp = (a, b, t) => a + (b - a) * t;
        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

        function hsl(h, s, l, a = 1) {
            return `hsla(${h % 360}, ${s}%, ${l}%, ${a})`;
        }

        // 真实烟花颜色：饱和度适中，亮度变化自然
        function randomColor() {
            return { h: rand(0, 360), s: rand(70, 95), l: rand(50, 80) };
        }

        function colorVariant(c, dh = 25, ds = 15, dl = 20) {
            return {
                h: (c.h + rand(-dh, dh) + 360) % 360,
                s: clamp(c.s + rand(-ds, ds), 50, 100),
                l: clamp(c.l + rand(-dl, dl), 30, 85)
            };
        }

        function colorLerp(c1, c2, t) {
            return {
                h: (c1.h + (c2.h - c1.h) * t + 360) % 360,
                s: lerp(c1.s, c2.s, t),
                l: lerp(c1.l, c2.l, t)
            };
        }

        // ============================================================
        //  3. 粒子类 (更真实，更轻量)
        // ============================================================
        class Particle {
            constructor(x, y, vx, vy, opts = {}) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.z = opts.z !== undefined ? opts.z : rand(-0.8, 0.8);

                this.startColor = opts.startColor || randomColor();
                this.endColor = opts.endColor || colorVariant(this.startColor, 30, 15, 25);

                // 尺寸更真实：火花大小随生命衰减
                this.size = opts.size || rand(1.5, 4.5);
                this.baseSize = this.size;

                this.life = opts.life || randInt(50, 110);
                this.maxLife = this.life;
                this.age = 0;

                // 物理：重力稍强，拖曳适中
                this.gravity = opts.gravity || rand(0.03, 0.10);
                this.drag = opts.drag || rand(0.970, 0.995);
                this.turbulence = opts.turbulence || rand(0.01, 0.035);

                // 拖尾：缩短以提升性能
                this.trail = [];
                this.maxTrail = opts.maxTrail !== undefined ? opts.maxTrail : randInt(4, 10);

                // 闪烁取消，保持稳定亮度，更真实
                this.dead = false;
                this.isSpark = opts.isSpark || false;
                this.isGold = opts.isGold || false;
            }

            update() {
                this.age++;
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;

                // 极微弱扰动
                this.vx += (Math.random() - 0.5) * this.turbulence;
                this.vy += (Math.random() - 0.5) * this.turbulence * 0.5;

                this.x += this.vx;
                this.y += this.vy;

                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) {
                    this.trail.shift();
                }

                const progress = this.age / this.maxLife;
                this.size = this.baseSize * (1 - progress * 0.65);

                if (this.age >= this.maxLife || this.size < 0.2 || this.y > H + 50) {
                    this.dead = true;
                }
            }

            getColor() {
                const t = this.age / this.maxLife;
                if (this.isGold) {
                    const g1 = { h: 42, s: 85, l: 70 };
                    const g2 = { h: 28, s: 70, l: 50 };
                    return colorLerp(g1, g2, t);
                }
                return colorLerp(this.startColor, this.endColor, t);
            }

            getAlpha() {
                // 亮度衰减：先慢后快，更真实
                const t = this.age / this.maxLife;
                const base = 1 - t * t; // 二次衰减
                return clamp(base, 0, 1);
            }

            getDepthScale() {
                return 1 + this.z * 0.3;
            }

            draw(ctx) {
                const alpha = this.getAlpha();
                if (alpha < 0.02) return;

                const depthScale = this.getDepthScale();
                const size = Math.max(0.3, this.size * depthScale);
                const color = this.getColor();

                // ---- 拖尾（简化，减少绘制开销） ----
                if (this.trail.length > 2) {
                    const trailLen = this.trail.length;
                    for (let i = 1; i < trailLen; i += 2) { // 跳点绘制，优化性能
                        const t = i / trailLen;
                        const trailAlpha = alpha * t * 0.4;
                        const trailSize = size * (0.2 + 0.8 * t) * 0.6;
                        const tc = colorLerp(this.startColor, this.endColor, t * 0.7);
                        ctx.beginPath();
                        ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
                        ctx.fillStyle = hsl(tc.h, tc.s, tc.l, trailAlpha * 0.5);
                        ctx.fill();
                    }
                }

                // ---- 主粒子（柔和光晕，减少过亮荧光感） ----
                const glowSize = size * (2.0 + this.z * 0.3);
                const grad = ctx.createRadialGradient(
                    this.x, this.y, size * 0.1,
                    this.x, this.y, glowSize
                );

                const brightL = Math.min(90, color.l + 12);
                grad.addColorStop(0, hsl(color.h, color.s, brightL, alpha * 0.9));
                grad.addColorStop(0.3, hsl(color.h, color.s, color.l, alpha * 0.7));
                grad.addColorStop(0.8, hsl(color.h, color.s * 0.8, color.l * 0.8, alpha * 0.2));
                grad.addColorStop(1, hsl(color.h, color.s * 0.6, color.l * 0.5, 0));

                ctx.beginPath();
                ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // ---- 核心点（小而亮） ----
                if (size > 0.6 && alpha > 0.3) {
                    const coreSize = size * 0.2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, coreSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,240,${alpha * 0.4})`;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            isDead() {
                return this.dead;
            }
        }

        // ============================================================
        //  4. 烟花爆炸工厂 (真实化 + 性能优化)
        // ============================================================
        const FireworkTypes = {
            SPHERE: 'sphere',
            WILLOW: 'willow',
            RING: 'ring',
            CHRYSANTHEMUM: 'chrysanthemum',
            DOUBLE: 'double',
            PEONY: 'peony',
            DAHLIA: 'dahlia',
            COMET: 'comet'
        };

        function createExplosion(x, y, type, mainColor) {
            const particles = [];
            const c = mainColor || randomColor();

            // 适度降低粒子总数，提升性能
            const count = randInt(180, 320);
            const speedBase = rand(5.5, 12.0);
            const sizeBase = rand(1.8, 4.8);
            const lifeBase = randInt(55, 120);

            let params = { count, speedBase, sizeBase, lifeBase };

            switch (type) {
                case FireworkTypes.SPHERE:
                    createSphere(x, y, c, params, particles);
                    break;
                case FireworkTypes.WILLOW:
                    createWillow(x, y, c, params, particles);
                    break;
                case FireworkTypes.RING:
                    createRing(x, y, c, params, particles);
                    break;
                case FireworkTypes.CHRYSANTHEMUM:
                    createChrysanthemum(x, y, c, params, particles);
                    break;
                case FireworkTypes.DOUBLE:
                    createDouble(x, y, c, params, particles);
                    break;
                case FireworkTypes.PEONY:
                    createPeony(x, y, c, params, particles);
                    break;
                case FireworkTypes.DAHLIA:
                    createDahlia(x, y, c, params, particles);
                    break;
                case FireworkTypes.COMET:
                    createComet(x, y, c, params, particles);
                    break;
                default:
                    createSphere(x, y, c, params, particles);
            }

            // 金色/白色点缀（减少数量，提升真实感）
            const goldCount = randInt(15, 40);
            for (let i = 0; i < goldCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(1.5, 6.0);
                const p = new Particle(x, y,
                    Math.cos(angle) * speed + rand(-0.5, 0.5),
                    Math.sin(angle) * speed * 0.6 - 0.3, {
                    startColor: { h: rand(35, 50), s: 85, l: 75 },
                    endColor: { h: rand(20, 40), s: 65, l: 50 },
                    size: rand(0.6, 2.2),
                    life: randInt(25, 60),
                    gravity: rand(0.02, 0.06),
                    drag: rand(0.97, 0.99),
                    z: rand(-0.5, 0.5),
                    maxTrail: randInt(3, 7),
                    turbulence: 0.015,
                    isGold: true
                }
                );
                particles.push(p);
            }

            // 白色星点（减少数量）
            const sparkCount = randInt(12, 35);
            for (let i = 0; i < sparkCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(1.0, 5.0);
                const p = new Particle(x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed * 0.5 - 0.2, {
                    startColor: { h: 0, s: 0, l: 96 },
                    endColor: { h: 30, s: 15, l: 65 },
                    size: rand(0.4, 1.8),
                    life: randInt(20, 50),
                    gravity: rand(0.02, 0.06),
                    drag: rand(0.97, 0.99),
                    z: rand(-0.4, 0.4),
                    maxTrail: randInt(2, 5),
                    turbulence: 0.01,
                    isSpark: true
                }
                );
                particles.push(p);
            }

            return particles;
        }

        // ---- 各形态实现（参数调整，更真实） ----

        function createSphere(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            for (let i = 0; i < count; i++) {
                const theta = rand(0, Math.PI * 2);
                const phi = rand(0, Math.PI);
                const speed = speedBase * (0.5 + 0.5 * Math.pow(rand(0, 1), 0.6));
                const vx = Math.sin(phi) * Math.cos(theta) * speed;
                const vy = Math.sin(phi) * Math.sin(theta) * speed * 0.8 - 0.2;
                const color = colorVariant(c, 25, 15, 20);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 30, 18, 25),
                    size: sizeBase * rand(0.5, 1.2),
                    life: lifeBase * rand(0.7, 1.3),
                    gravity: rand(0.03, 0.09),
                    drag: rand(0.970, 0.995),
                    z: rand(-0.8, 0.8),
                    maxTrail: randInt(4, 10),
                    turbulence: rand(0.01, 0.035)
                }));
            }
        }

        function createWillow(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            for (let i = 0; i < count; i++) {
                const angle = rand(-Math.PI * 0.85, Math.PI * 0.85);
                const speed = speedBase * rand(0.3, 0.8);
                const vx = Math.sin(angle) * speed * rand(0.5, 1.2);
                const vy = -Math.cos(angle) * speed * 0.35 + rand(0.3, 1.8);
                const color = colorVariant(c, 20, 15, 18);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant({ h: c.h + 20, s: c.s * 0.7, l: c.l * 0.5 }, 30, 20, 20),
                    size: sizeBase * rand(0.4, 1.0),
                    life: lifeBase * rand(0.9, 1.5),
                    gravity: rand(0.05, 0.13),
                    drag: rand(0.955, 0.990),
                    z: rand(-0.8, 0.8),
                    maxTrail: randInt(6, 14),
                    turbulence: rand(0.005, 0.025)
                }));
            }
        }

        function createRing(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            const ringCount = Math.floor(count * 0.7);
            for (let i = 0; i < ringCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = speedBase * rand(0.6, 1.1);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.7;
                const color = colorVariant(c, 25, 15, 20);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 30, 18, 25),
                    size: sizeBase * rand(0.5, 1.1),
                    life: lifeBase * rand(0.7, 1.2),
                    gravity: rand(0.02, 0.07),
                    drag: rand(0.975, 0.995),
                    z: rand(-0.8, 0.8),
                    maxTrail: randInt(4, 10),
                    turbulence: rand(0.01, 0.03)
                }));
            }
            // 环内填充
            for (let i = 0; i < count * 0.25; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = speedBase * rand(0.1, 0.5);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.4 - 0.3;
                const color = colorVariant(c, 25, 15, 18);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 30, 18, 22),
                    size: sizeBase * rand(0.3, 0.7),
                    life: lifeBase * rand(0.5, 0.8),
                    gravity: rand(0.03, 0.08),
                    drag: rand(0.970, 0.990),
                    z: rand(-0.5, 0.5),
                    maxTrail: randInt(3, 6),
                    turbulence: rand(0.01, 0.03)
                }));
            }
        }

        function createChrysanthemum(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            const rays = randInt(24, 45);
            const perRay = Math.floor(count / rays);
            for (let r = 0; r < rays; r++) {
                const angle = (r / rays) * Math.PI * 2 + rand(-0.04, 0.04);
                for (let j = 0; j < perRay; j++) {
                    const t = j / perRay;
                    const speed = speedBase * (0.5 + 0.5 * t * t);
                    const vx = Math.cos(angle) * speed * rand(0.8, 1.2);
                    const vy = Math.sin(angle) * speed * 0.8 + rand(-0.3, 0.3);
                    const color = colorVariant(c, 20 + t * 20, 15, 15 + t * 15);
                    list.push(new Particle(x, y, vx, vy, {
                        startColor: color,
                        endColor: colorVariant({ h: c.h + 35, s: c.s * 0.6, l: c.l * 0.5 }, 35, 20, 25),
                        size: sizeBase * (0.4 + 0.6 * (1 - t * 0.5)) * rand(0.6, 1.2),
                        life: lifeBase * (0.7 + 0.3 * (1 - t)) * rand(0.8, 1.2),
                        gravity: rand(0.02, 0.08),
                        drag: rand(0.965, 0.995),
                        z: rand(-0.8, 0.8),
                        maxTrail: randInt(4, 12 + Math.floor(t * 5)),
                        turbulence: rand(0.01, 0.035)
                    }));
                }
            }
            // 末端小爆裂
            for (let i = 0; i < randInt(25, 55); i++) {
                const angle = rand(0, Math.PI * 2);
                const dist = rand(18, 45);
                const sx = x + Math.cos(angle) * dist;
                const sy = y + Math.sin(angle) * dist * 0.7 - 5;
                const speed = rand(1.5, 4.5);
                const vx = Math.cos(angle + rand(-0.3, 0.3)) * speed;
                const vy = Math.sin(angle + rand(-0.3, 0.3)) * speed * 0.6 + rand(0.2, 0.8);
                const color = colorVariant(c, 30, 18, 22);
                list.push(new Particle(sx, sy, vx, vy, {
                    startColor: color,
                    endColor: colorVariant({ h: c.h + 45, s: c.s * 0.5, l: c.l * 0.4 }, 35, 20, 25),
                    size: rand(0.6, 2.5),
                    life: randInt(25, 60),
                    gravity: rand(0.04, 0.10),
                    drag: rand(0.955, 0.990),
                    z: rand(-0.6, 0.6),
                    maxTrail: randInt(3, 7),
                    turbulence: rand(0.01, 0.04)
                }));
            }
        }

        function createDouble(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            const firstCount = Math.floor(count * 0.35);
            for (let i = 0; i < firstCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = speedBase * rand(0.3, 0.7);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.6 - 0.2;
                const color = colorVariant(c, 20, 15, 18);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 30, 18, 22),
                    size: sizeBase * rand(0.4, 0.8),
                    life: lifeBase * rand(0.5, 0.8),
                    gravity: rand(0.02, 0.06),
                    drag: rand(0.975, 0.995),
                    z: rand(-0.6, 0.6),
                    maxTrail: randInt(3, 7),
                    turbulence: rand(0.01, 0.03)
                }));
            }
            const secondCount = count - firstCount;
            for (let i = 0; i < secondCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = speedBase * rand(0.8, 1.3);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.7 - 0.3;
                const color = colorVariant(c, 30, 18, 22);
                const delayOffset = rand(6, 18);
                const p2 = new Particle(
                    x + vx * 0.12 + rand(-2, 2),
                    y + vy * 0.12 + rand(-2, 2),
                    vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 35, 20, 28),
                    size: sizeBase * rand(0.6, 1.3),
                    life: lifeBase * rand(0.9, 1.4),
                    gravity: rand(0.02, 0.08),
                    drag: rand(0.965, 0.995),
                    z: rand(-0.8, 0.8),
                    maxTrail: randInt(5, 12),
                    turbulence: rand(0.01, 0.035)
                }
                );
                p2.age = -delayOffset;
                list.push(p2);
            }
        }

        function createPeony(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            for (let i = 0; i < count; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = speedBase * (0.5 + 0.5 * Math.pow(rand(0, 1), 0.5));
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.7 - 0.2;
                const color = colorVariant(c, 20, 15, 18);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 30, 18, 22),
                    size: sizeBase * rand(0.5, 1.2),
                    life: lifeBase * rand(0.8, 1.4),
                    gravity: rand(0.02, 0.07),
                    drag: rand(0.970, 0.995),
                    z: rand(-0.8, 0.8),
                    maxTrail: randInt(4, 10),
                    turbulence: rand(0.01, 0.035)
                }));
            }
            // 中心金色闪光（减少）
            for (let i = 0; i < randInt(15, 35); i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(0.5, 3.0);
                const p = new Particle(x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed * 0.4 - 0.2, {
                    startColor: { h: rand(38, 52), s: 90, l: 80 },
                    endColor: { h: rand(25, 42), s: 75, l: 55 },
                    size: rand(0.5, 2.0),
                    life: randInt(20, 50),
                    gravity: rand(0.01, 0.04),
                    drag: rand(0.98, 0.995),
                    z: rand(-0.3, 0.3),
                    maxTrail: randInt(2, 5),
                    isGold: true
                }
                );
                list.push(p);
            }
        }

        function createDahlia(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            const layers = randInt(3, 5);
            const perLayer = Math.floor(count / layers);
            for (let layer = 0; layer < layers; layer++) {
                const layerScale = 0.4 + (layer / layers) * 0.8;
                const layerSpeed = speedBase * layerScale;
                const layerSize = sizeBase * (0.6 + (layer / layers) * 0.7);
                const angleOffset = (layer / layers) * Math.PI * 0.5;
                for (let i = 0; i < perLayer; i++) {
                    const angle = (i / perLayer) * Math.PI * 2 + angleOffset + rand(-0.06, 0.06);
                    const speed = layerSpeed * rand(0.7, 1.3);
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed * 0.7;
                    const color = colorVariant(c, 15 + layer * 10, 12, 12 + layer * 10);
                    list.push(new Particle(x, y, vx, vy, {
                        startColor: color,
                        endColor: colorVariant(color, 30, 18, 22),
                        size: layerSize * rand(0.5, 1.1),
                        life: lifeBase * rand(0.7, 1.3),
                        gravity: rand(0.02, 0.07),
                        drag: rand(0.970, 0.995),
                        z: rand(-0.8, 0.8),
                        maxTrail: randInt(4, 10),
                        turbulence: rand(0.01, 0.03)
                    }));
                }
            }
        }

        function createComet(x, y, c, p, list) {
            const { count, speedBase, sizeBase, lifeBase } = p;
            const direction = rand(0, Math.PI * 2);
            for (let i = 0; i < count; i++) {
                const angle = direction + rand(-0.3, 0.3);
                const speed = speedBase * rand(0.3, 0.9);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.8 - 0.3;
                const color = colorVariant(c, 25, 15, 20);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 35, 20, 25),
                    size: sizeBase * rand(0.4, 1.0),
                    life: lifeBase * rand(0.8, 1.5),
                    gravity: rand(0.02, 0.08),
                    drag: rand(0.955, 0.990),
                    z: rand(-0.8, 0.8),
                    maxTrail: randInt(8, 18),
                    turbulence: rand(0.005, 0.025)
                }));
            }
            // 头部爆裂
            for (let i = 0; i < randInt(30, 60); i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(1.5, 4.5);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed * 0.6 - 0.2;
                const color = colorVariant(c, 30, 18, 22);
                list.push(new Particle(x, y, vx, vy, {
                    startColor: color,
                    endColor: colorVariant(color, 35, 22, 28),
                    size: rand(0.8, 3.0),
                    life: randInt(30, 65),
                    gravity: rand(0.02, 0.06),
                    drag: rand(0.97, 0.995),
                    z: rand(-0.6, 0.6),
                    maxTrail: randInt(3, 8),
                    turbulence: rand(0.01, 0.035)
                }));
            }
        }

        // ============================================================
        //  5. 火箭类 (性能优化)
        // ============================================================
        class Rocket {
            constructor(startX, targetY, type) {
                this.x = startX || rand(W * 0.04, W * 0.96);
                this.y = H * 0.94 + rand(0, 30);
                this.targetY = targetY || rand(H * 0.02, H * 0.42);
                this.type = type || Object.values(FireworkTypes)[randInt(0, 7)];

                this.speed = rand(6.5, 12.0);
                this.angle = -Math.PI / 2 + rand(-0.03, 0.03);
                this.alive = true;
                this.exploded = false;
                this.color = randomColor();

                this.trail = [];
                this.maxTrail = 18; // 缩短
                this.flameParticles = [];
                this.wobble = rand(0.002, 0.008);
                this.wobblePhase = rand(0, Math.PI * 2);
            }

            update() {
                if (this.exploded) return;

                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) {
                    this.trail.shift();
                }

                const progress = 1 - (this.y - this.targetY) / (H * 0.94 - this.targetY);
                const speedFactor = 1 - progress * 0.35;
                const currentSpeed = this.speed * speedFactor;

                this.wobblePhase += this.wobble;
                const wobbleOffset = Math.sin(this.wobblePhase) * 0.3;

                this.x += Math.sin(this.angle + wobbleOffset * 0.05) * currentSpeed * 0.2;
                this.y -= currentSpeed;
                this.angle += rand(-0.003, 0.003);

                // 尾焰（减少粒子）
                if (this.y < H * 0.85 && Math.random() < 0.4) {
                    const size = rand(0.8, 3.5);
                    const vx = rand(-0.8, 0.8);
                    const vy = rand(0.3, 2.2);
                    const life = randInt(8, 18);
                    const h = rand(25, 50);
                    const l = rand(55, 85);
                    const fp = new Particle(
                        this.x + rand(-4, 4),
                        this.y + 3,
                        vx, vy, {
                        startColor: { h, s: 95, l },
                        endColor: { h: h + 25, s: 75, l: l * 0.3 },
                        size,
                        life,
                        gravity: 0.015,
                        drag: 0.94,
                        z: rand(-0.3, 0.3),
                        maxTrail: 2,
                        turbulence: 0.02
                    }
                    );
                    this.flameParticles.push(fp);
                }

                for (let i = this.flameParticles.length - 1; i >= 0; i--) {
                    this.flameParticles[i].update();
                    if (this.flameParticles[i].isDead()) {
                        this.flameParticles.splice(i, 1);
                    }
                }

                if (this.y <= this.targetY) {
                    this.explode();
                }
                if (this.y < -50) {
                    this.alive = false;
                }
            }

            explode() {
                if (this.exploded) return;
                this.exploded = true;
                this.alive = false;

                const newParticles = createExplosion(
                    this.x, this.y,
                    this.type,
                    this.color
                );
                particles.push(...newParticles);

                // 闪光（缩小半径）
                flashEffect = {
                    x: this.x,
                    y: this.y,
                    radius: 0,
                    maxRadius: rand(40, 90),
                    life: 14,
                    maxLife: 14,
                    active: true
                };

                // 余烬（减少）
                for (let i = 0; i < randInt(8, 20); i++) {
                    const angle = rand(0, Math.PI * 2);
                    const speed = rand(0.2, 1.8);
                    const p = new Particle(
                        this.x + rand(-10, 10),
                        this.y + rand(-10, 10),
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed * 0.4 + rand(0.2, 0.8), {
                        startColor: { h: rand(25, 45), s: 60, l: 60 },
                        endColor: { h: rand(10, 30), s: 35, l: 25 },
                        size: rand(0.4, 1.8),
                        life: randInt(35, 80),
                        gravity: rand(0.01, 0.03),
                        drag: rand(0.98, 0.995),
                        z: rand(-0.4, 0.4),
                        maxTrail: randInt(3, 8),
                        turbulence: 0.005
                    }
                    );
                    particles.push(p);
                }
            }

            draw(ctx) {
                for (const fp of this.flameParticles) {
                    fp.draw(ctx);
                }

                if (this.trail.length > 2) {
                    for (let i = 1; i < this.trail.length; i += 2) {
                        const t = i / this.trail.length;
                        const alpha = t * 0.2;
                        const size = (1 - t) * 2.5 + 0.2;
                        const h = rand(30, 50);
                        ctx.beginPath();
                        ctx.arc(this.trail[i].x, this.trail[i].y, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${h}, 80%, 55%, ${alpha * 0.3})`;
                        ctx.fill();
                    }
                }

                if (!this.exploded && this.y > 0) {
                    const grad = ctx.createRadialGradient(
                        this.x, this.y - 4, 1,
                        this.x, this.y - 4, 10
                    );
                    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    grad.addColorStop(0.2, 'rgba(255,225,170,0.8)');
                    grad.addColorStop(0.6, 'rgba(255,190,90,0.3)');
                    grad.addColorStop(1, 'rgba(255,150,50,0)');
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - 4, 10, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.shadowBlur = 12;
                    ctx.shadowColor = 'rgba(255,200,100,0.2)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - 5, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // ============================================================
        //  6. 全局状态
        // ============================================================
        let particles = [];
        let rockets = [];
        let flashEffect = null;
        let lastLaunchTime = 0;
        let launchInterval = 800;
        let animFrame = null;

        // ============================================================
        //  7. 发射逻辑
        // ============================================================
        function launchFirework(x, targetY, type) {
            const startX = x || rand(W * 0.04, W * 0.96);
            const target = targetY || rand(H * 0.02, H * 0.42);
            const t = type || Object.values(FireworkTypes)[randInt(0, 7)];
            const rocket = new Rocket(startX, target, t);
            rockets.push(rocket);
        }

        function autoLaunch(time) {
            if (time - lastLaunchTime > launchInterval + rand(-350, 450)) {
                const count = Math.random() < 0.2 ? randInt(2, 3) : 1;
                for (let i = 0; i < count; i++) {
                    const x = rand(W * 0.04, W * 0.96);
                    const y = rand(H * 0.02, H * 0.42);
                    const type = Object.values(FireworkTypes)[randInt(0, 7)];
                    setTimeout(() => launchFirework(x, y, type), i * rand(80, 200));
                }
                lastLaunchTime = time;
                launchInterval = rand(600, 2200);
            }
        }

        // ============================================================
        //  8. 主循环
        // ============================================================
        function drawScene(time) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, W, H);

            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                r.update();
                r.draw(ctx);
                if (!r.alive || r.exploded) {
                    rockets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.isDead()) {
                    particles.splice(i, 1);
                }
            }

            if (flashEffect && flashEffect.active) {
                const progress = 1 - flashEffect.life / flashEffect.maxLife;
                const radius = flashEffect.maxRadius * (1 - Math.pow(1 - progress, 0.4));
                const alpha = (1 - progress) * 0.7;
                const grad = ctx.createRadialGradient(
                    flashEffect.x, flashEffect.y, 0,
                    flashEffect.x, flashEffect.y, radius
                );
                grad.addColorStop(0, `rgba(255,255,255,${alpha * 0.9})`);
                grad.addColorStop(0.2, `rgba(255,240,210,${alpha * 0.5})`);
                grad.addColorStop(0.6, `rgba(255,220,180,${alpha * 0.15})`);
                grad.addColorStop(1, `rgba(255,200,160,0)`);
                ctx.beginPath();
                ctx.arc(flashEffect.x, flashEffect.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                flashEffect.life--;
                if (flashEffect.life <= 0) {
                    flashEffect.active = false;
                    flashEffect = null;
                }
            }

            autoLaunch(time);
        }

        function animate(timestamp) {
            drawScene(timestamp);
            animFrame = requestAnimationFrame(animate);
        }

        // ============================================================
        //  9. 启动
        // ============================================================
        const initTypes = Object.values(FireworkTypes);
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const x = rand(W * 0.06, W * 0.94);
                const y = rand(H * 0.02, H * 0.40);
                const type = initTypes[i % initTypes.length];
                launchFirework(x, y, type);
            }, 150 + i * 280);
        }
        lastLaunchTime = performance.now() - 200;

        animate(0);

        console.log('🎆 真实火花·性能优化版已启动！');
        console.log('   ✦ 降低荧光感，更接近真实烟花');
        console.log('   ✦ 粒子数量减少约40%，拖尾缩短');
        console.log('   ✦ 光晕柔和，色彩更自然');
        console.log('   ✦ 适合长时间观看，流畅度提升');
    </script>
