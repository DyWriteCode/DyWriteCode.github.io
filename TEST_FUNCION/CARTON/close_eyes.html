<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闭眼动画 - 从四周向中心闭合</title>
    <style>
        /* ----- 全局重置 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #1a1a2e;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        /* ----- 底层场景 ----- */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            color: rgba(255, 255, 255, 0.92);
            font-size: 2.6rem;
            font-weight: 700;
            text-shadow: 0 0 40px rgba(100, 120, 255, 0.35);
            user-select: none;
            z-index: 0;
            gap: 12px;
            letter-spacing: 1px;
        }

        .scene small {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.55;
            letter-spacing: 2px;
        }

        .scene .hint {
            margin-top: 28px;
            font-size: 0.85rem;
            opacity: 0.3;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* ----- Canvas 透明图层（遮罩） ----- */
        #eyeLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 10;
        }

        /* ----- 交互按钮 ----- */
        .action-btn {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 14px 40px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            user-select: none;
            display: none;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
            transform: translateX(-50%) scale(1.03);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .action-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .action-btn.show {
            display: block;
            animation: fadeInUp 0.5s ease both;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ----- 状态标签 ----- */
        .status-tag {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 15;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            transition: color 0.6s;
        }

        .status-tag.active {
            color: rgba(255, 200, 100, 0.6);
        }

        @media (max-width: 600px) {
            .scene {
                font-size: 1.6rem;
            }

            .scene small {
                font-size: 0.8rem;
            }

            .action-btn {
                padding: 12px 28px;
                font-size: 0.8rem;
                bottom: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- ====== 底层场景 ====== -->
    <div class="scene">
        <span>👁️ 闭眼 · 四周渐暗</span>
        <small>黑色从边缘向中心聚拢</small>
        <span class="hint">▼ 点击按钮或按空格键重播</span>
    </div>

    <!-- ====== Canvas 透明图层 ====== -->
    <canvas id="eyeLayer"></canvas>

    <!-- ====== 交互按钮 ====== -->
    <button class="action-btn" id="replayBtn">🌀 重新闭眼</button>

    <!-- ====== 状态标签 ====== -->
    <div class="status-tag" id="statusTag">● 睁眼</div>

    <!-- ============================================================ -->
    <!-- JavaScript 核心逻辑                                            -->
    <!-- ============================================================ -->
    <script>
        (function () {
            'use strict';

            // ----------------------------------------------------------
            // 1. DOM 引用
            // ----------------------------------------------------------
            const canvas = document.getElementById('eyeLayer');
            const ctx = canvas.getContext('2d', { alpha: true });
            const replayBtn = document.getElementById('replayBtn');
            const statusTag = document.getElementById('statusTag');

            // ----------------------------------------------------------
            // 2. Canvas 尺寸管理
            // ----------------------------------------------------------
            let width = window.innerWidth;
            let height = window.innerHeight;
            let centerX = width / 2;
            let centerY = height * 0.60;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                centerX = width / 2;
                centerY = height * 0.60;

                if (!animationRunning) {
                    if (isFullyClosed) {
                        drawClosed();
                    } else {
                        drawOpen();
                    }
                }
            }
            window.addEventListener('resize', resizeCanvas);

            // ----------------------------------------------------------
            // 3. 状态变量
            // ----------------------------------------------------------
            let isFullyClosed = false;
            let animationRunning = false;
            let animationId = null;
            let startTime = null;
            const DURATION = 2200;
            let currentProgress = 0;

            // 计算最大半径（确保覆盖屏幕）
            function getMaxR() {
                return Math.sqrt(width * width + height * height) * 0.75;
            }

            // ----------------------------------------------------------
            // 4. 核心绘制函数
            // ----------------------------------------------------------

            // 睁眼：画布完全透明
            function drawOpen() {
                ctx.clearRect(0, 0, width, height);
                currentProgress = 0;
                isFullyClosed = false;
                statusTag.textContent = '● 睁眼';
                statusTag.classList.remove('active');
            }

            // 闭眼：全黑
            function drawClosed() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);
                currentProgress = 1;
                isFullyClosed = true;
                statusTag.textContent = '● 闭眼';
                statusTag.classList.add('active');
            }

            // 绘制动画进度：p 从 0 → 1，洞从最大 → 0（四周向中心闭合）
            function drawProgress(p) {
                const progress = Math.min(Math.max(p, 0), 1);
                ctx.clearRect(0, 0, width, height);

                // 1. 先填充黑色背景
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                // 2. 计算当前洞的大小：从 maxR 到 0
                const maxR = getMaxR();
                // 为了让初始洞完全覆盖屏幕，使用 maxR * 1.25
                const maxRadius = maxR * 1.25;
                const currentRadius = maxRadius * (1 - progress);

                // 模糊程度：闭合过程中逐渐增加模糊，模拟失焦或眼皮合拢的朦胧感
                const blurAmount = 8 + 20 * progress;

                // 3. 使用 destination-out 挖洞
                ctx.save();
                ctx.globalCompositeOperation = 'destination-out';
                ctx.filter = `blur(${blurAmount}px)`;

                // 使用径向渐变让洞边缘柔化
                const grad = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, currentRadius
                );
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.65, 'rgba(255,255,255,0.95)');
                grad.addColorStop(0.92, 'rgba(255,255,255,0.4)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, currentRadius, currentRadius * 0.9, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
                ctx.filter = 'none';

                // 更新进度与状态标签
                currentProgress = progress;
                if (progress < 0.02) {
                    statusTag.textContent = '● 睁眼';
                    statusTag.classList.remove('active');
                } else if (progress < 0.35) {
                    statusTag.textContent = '◐ 边缘渐暗';
                    statusTag.classList.add('active');
                } else if (progress < 0.70) {
                    statusTag.textContent = '◑ 收缩中';
                    statusTag.classList.add('active');
                } else if (progress < 0.98) {
                    statusTag.textContent = '◑ 即将闭合';
                    statusTag.classList.add('active');
                } else {
                    statusTag.textContent = '● 闭眼';
                    statusTag.classList.add('active');
                }
            }

            // ----------------------------------------------------------
            // 5. 缓动函数 (ease-in-out)
            // ----------------------------------------------------------
            function easeInOutCubic(t) {
                return t < 0.5 ?
                    4 * t * t * t :
                    1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            // ----------------------------------------------------------
            // 6. 动画循环
            // ----------------------------------------------------------
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                let rawProgress = Math.min(elapsed / DURATION, 1);
                const eased = easeInOutCubic(rawProgress);

                drawProgress(eased);

                if (rawProgress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    drawClosed();
                    isFullyClosed = true;
                    animationRunning = false;
                    animationId = null;
                    startTime = null;
                    replayBtn.classList.add('show');
                }
            }

            // ----------------------------------------------------------
            // 7. 启动闭眼动画
            // ----------------------------------------------------------
            function startCloseEyes() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }

                animationRunning = true;
                startTime = null;
                isFullyClosed = false;

                replayBtn.classList.remove('show');

                // 从睁眼状态开始
                drawOpen();

                animationId = requestAnimationFrame(animate);
            }

            // ----------------------------------------------------------
            // 8. 重播
            // ----------------------------------------------------------
            function replay() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                animationRunning = false;
                startTime = null;

                drawOpen();
                isFullyClosed = false;
                replayBtn.classList.remove('show');

                requestAnimationFrame(() => {
                    startCloseEyes();
                });
            }

            // ----------------------------------------------------------
            // 9. 初始化
            // ----------------------------------------------------------
            function init() {
                resizeCanvas();
                drawOpen();

                // 延迟 500ms 后自动闭眼
                setTimeout(() => {
                    startCloseEyes();
                }, 500);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

            // ----------------------------------------------------------
            // 10. 事件绑定
            // ----------------------------------------------------------
            window.addEventListener('resize', resizeCanvas);

            replayBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                replay();
            });

            document.addEventListener('click', function (e) {
                if (e.target === replayBtn) return;
                if (isFullyClosed && !animationRunning) {
                    replay();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.code === 'Space' && isFullyClosed && !animationRunning) {
                    e.preventDefault();
                    replay();
                }
            });

            window.addEventListener('beforeunload', function () {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            });

            // 暴露 API
            window.__closeEyes = {
                start: startCloseEyes,
                replay: replay,
                drawOpen: drawOpen,
                drawClosed: drawClosed,
                isClosed: () => isFullyClosed,
                progress: () => currentProgress,
            };

            console.log('🌙 闭眼动画（四周向中心）已加载！');
            console.log('   • 页面加载后自动闭眼');
            console.log('   • 点击「重新闭眼」或按 空格键 重播');

        })();
    </script>

</body>

</html>
