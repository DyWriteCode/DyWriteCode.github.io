<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星河入梦 · 缓缓闭眼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
        }

        #info {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 4px;
            pointer-events: none;
            user-select: none;
            font-weight: 300;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 20;
        }

        #info.show {
            opacity: 1;
        }

        #restart-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.3s;
            z-index: 30;
        }

        #restart-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>

<body>
    <canvas id="mainCanvas"></canvas>
    <div id="info">✦ 晚安，好梦 ✦</div>
    <button id="restart-btn">重新睁开</button>

    <script>
        (function () {
            'use strict';

            // ============================================================
            // 1. Canvas 初始化
            // ============================================================
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d', { alpha: true });
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);

            // ============================================================
            // 2. 配置参数
            // ============================================================
            const CONFIG = {
                closeDuration: 6000, // 闭眼过程持续时间 (ms)
                closeDelay: 2000,    // 开始闭眼前的等待时间 (ms)
                starCount: 350,
                cloudCount: 30,
            };

            // ============================================================
            // 3. 工具函数
            // ============================================================
            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            // 缓动函数：先慢后快再慢，模拟眼皮沉重的感觉
            function easeInOutSine(t) {
                return -(Math.cos(Math.PI * t) - 1) / 2;
            }

            function smoothstep(edge0, edge1, x) {
                const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
                return t * t * (3 - 2 * t);
            }

            function hash(x, y) {
                let h = x * 374761393 + y * 668265263;
                h = (h ^ (h >> 13)) * 1274126177;
                return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
            }

            // ============================================================
            // 4. 星空系统
            // ============================================================
            const STAR_COLORS = [
                { r: 255, g: 255, b: 255 }, // 白
                { r: 200, g: 220, b: 255 }, // 蓝白
                { r: 255, g: 240, b: 200 }, // 暖白
                { r: 180, g: 200, b: 255 }, // 淡蓝
            ];
            let stars = [];

            function generateStars(w, h) {
                stars = [];
                for (let i = 0; i < CONFIG.starCount; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const size = 0.5 + Math.random() * 2.0;
                    const brightness = Math.random();
                    const speed = 0.5 + Math.random() * 1.5;
                    const phase = Math.random() * Math.PI * 2;
                    const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];

                    stars.push({ x, y, size, brightness, speed, phase, color });
                }
            }

            function drawStars(time, closeProgress) {
                // 随着闭眼，星星整体变暗
                const globalDimming = 1 - closeProgress * 0.8;

                for (const star of stars) {
                    // 闪烁逻辑
                    const flicker = Math.sin(time * star.speed + star.phase);
                    const alphaBase = 0.3 + star.brightness * 0.7;
                    const alpha = alphaBase * (0.8 + 0.2 * flicker) * globalDimming;

                    if (alpha < 0.01) continue;

                    const { x, y, size, color } = star;
                    const { r, g, b } = color;

                    // 绘制星芒 (仅较亮的星星)
                    if (star.brightness > 0.8 && size > 1.5) {
                        const glowSize = size * 3;
                        const grad = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
                        grad.addColorStop(0, `rgba(${r},${g},${b},${alpha * 0.4})`);
                        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(x, y, glowSize, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 绘制星点
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // ============================================================
            // 5. 星云/云层系统 (增加氛围感)
            // ============================================================
            let clouds = [];

            function generateClouds(w, h) {
                clouds = [];
                for (let i = 0; i < CONFIG.cloudCount; i++) {
                    clouds.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        radius: 100 + Math.random() * 300,
                        alpha: 0.02 + Math.random() * 0.04,
                        color: Math.random() > 0.5 ? '100,120,200' : '150,100,180',
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.1
                    });
                }
            }

            function drawClouds(time) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                for (const c of clouds) {
                    // 缓慢移动
                    c.x += c.vx;
                    c.y += c.vy;
                    if (c.x < -c.radius) c.x = W + c.radius;
                    if (c.x > W + c.radius) c.x = -c.radius;

                    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.radius);
                    grad.addColorStop(0, `rgba(${c.color}, ${c.alpha})`);
                    grad.addColorStop(1, `rgba(${c.color}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // ============================================================
            // 6. 场景绘制
            // ============================================================
            function drawFullScene(time) {
                // 深空背景
                const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                bgGrad.addColorStop(0, '#020205');
                bgGrad.addColorStop(1, '#0a0a15');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                drawClouds(time);
                drawStars(time, 0); // 正常亮度
            }

            // ============================================================
            // ★★★ 核心逻辑：闭眼遮罩 (Reverse Eye Mask) ★★★
            // ============================================================
            function drawEyeCloseMask(progress, time) {
                const p = Math.min(Math.max(progress, 0), 1);

                // 如果完全闭上，直接画全黑，不需要计算裁剪
                if (p >= 1) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, W, H);
                    return;
                }

                ctx.save();

                // 1. 先绘制完整的世界（在裁剪区域外也会被画，但马上会被覆盖）
                // 为了性能，其实应该只画裁剪区内的，但Canvas没有直接的"反向裁剪"，
                // 所以策略是：画全世界 -> 画一个黑色的层 -> 在这个黑色层上挖个洞(或者反过来)

                // 更好的策略：
                // 1. 绘制全世界 (drawFullScene)
                // 2. 设置裁剪区域为“眼睛看到的范围”
                // 3. 在这个裁剪区域内，什么都不做（保留刚才画的世界）
                // 4. 恢复裁剪
                // 5. 用黑色填充整个屏幕（除了刚才裁剪保留的区域？不行，fillRect会覆盖）

                // 正确的高效策略：
                // 1. 绘制全世界。
                // 2. 创建一个新的临时层或者直接操作：
                //    我们想要的是：中间亮，四周黑。
                //    使用 radial gradient 模拟眼睑闭合可能更柔和，但题目要求参考椭圆逻辑。

                // 采用“挖孔法”：
                // 1. 绘制全世界。
                // 2. 设置混合模式或路径，将非可视区域涂黑。

                // 让我们用最稳妥的 Clip 方法：
                // 先画好全世界。
                // 然后，我们要把“看不见”的地方涂黑。
                // Canvas 无法直接“反选”，所以我们需要画一个巨大的矩形，中间挖个椭圆洞。

                // 方法 B (视觉欺骗法 - 性能更好且边缘柔和):
                // 在全屏画一个径向渐变，中心透明，周围黑色。
                // 渐变的中心透明半径随着 progress 变小。

                const cx = W / 2;
                const cy = H / 2;
                const maxR = Math.max(W, H) * 0.8; // 初始最大视野

                // 当前剩余的视野半径
                // 使用 easeInOutSine 让闭合过程更有质感
                const currentR = maxR * (1 - easeInOutSine(p));

                // 绘制覆盖层
                // 我们不能简单用 clip，因为我们要保留中间，涂黑外面。
                // 我们可以画一个巨大的环形渐变，或者使用 even-odd 规则路径。

                ctx.globalCompositeOperation = 'source-over';

                // 创建路径：大矩形 减去 中间的椭圆
                ctx.beginPath();
                // 外框 (覆盖全屏)
                ctx.rect(0, 0, W, H);
                // 内框 (可视区域) - 逆时针绘制以形成空洞
                ctx.ellipse(cx, cy, currentR, currentR * 0.75, 0, 0, Math.PI * 2, true);

                // 填充黑色
                ctx.fillStyle = '#000';
                ctx.fill();

                // 为了让边缘不那么生硬，加一点模糊或者渐变过渡？
                // 简单的 fill 会有锯齿。我们可以叠加一个径向渐变来柔化边缘。

                // 柔化边缘层
                const softEdgeWidth = 50 + p * 100; // 边缘模糊带
                const grad = ctx.createRadialGradient(cx, cy, Math.max(0, currentR - softEdgeWidth), cx, cy, currentR + softEdgeWidth);
                grad.addColorStop(0, 'rgba(0,0,0,0)');       // 内部透明
                grad.addColorStop(0.5, 'rgba(0,0,0,0.5)');   // 中间半黑
                grad.addColorStop(1, 'rgba(0,0,0,1)');       // 外部全黑

                // 注意：上面的 even-odd 填充已经把外面填黑了，这里我们用 screen 或者 lighter 可能会破坏纯黑。
                // 其实上面的 even-odd 填充对于“硬边”闭眼是可以的。
                // 如果想要“肉感”的闭眼，最好是用径向渐变覆盖全屏。

                ctx.restore();

                // --- 替代方案：更柔和的渐变覆盖 (推荐) ---
                // 这种方式比 even-odd 路径更平滑，模拟眼皮合拢的光线衰减
                /*
                const gradSoft = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
                // 当 p=0, 透明半径=maxR (全可见)
                // 当 p=1, 透明半径=0 (全黑)
                const visibleRadius = maxR * (1 - easeInOutSine(p));
                
                gradSoft.addColorStop(0, 'rgba(0,0,0,0)');
                gradSoft.addColorStop(Math.min(1, visibleRadius/maxR), 'rgba(0,0,0,0)');
                gradSoft.addColorStop(Math.min(1, (visibleRadius + 100)/maxR), 'rgba(0,0,0,1)');
                gradSoft.addColorStop(1, 'rgba(0,0,0,1)');
                
                ctx.fillStyle = gradSoft;
                ctx.fillRect(0, 0, W, H);
                */

                // 为了严格遵循“参考真眼逻辑”的椭圆裁剪感，我们结合两者：
                // 使用 Path 裁剪出可视区，然后在可视区外画黑。
                // 但由于 Canvas 限制，最简单的“反向遮罩”其实是画一个全屏黑，然后用 destination-out 擦除中间？
                // 不，destination-out 会变透明，露出下面的 CSS 背景。如果 CSS 背景是黑的，那就没问题。

                // 最终决定方案：
                // 1. 保持 drawFullScene 绘制的内容。
                // 2. 创建一个全屏的黑色覆盖层。
                // 3. 使用 destination-out 在黑色覆盖层上“擦除”出一个椭圆。
                // 这样中间就透明了（露出了下面的星空），周围是黑的。

                ctx.save();
                // 这一步是关键：我们在现有的星空之上，再画一层东西
                // 我们不改变已有的星空，我们画一个“黑布”，然后把黑布中间剪个洞

                // 由于不能轻易使用 destination-out (因为它会影响下面已经画好的星空吗？不会，它影响的是当前绘图上下文的目标像素)
                // 实际上，如果我在星空上面画一个黑色矩形，然后用 destination-out 擦除中间，
                // 结果是：中间变透明（露出下面的星空？不，destination-out 是把目标像素的 Alpha 变为 0）。
                // 如果下面是星空，Alpha 变为 0 就会变成完全透明。如果 body 背景是黑的，那就对了。

                // 但是，为了保险起见（防止 body 背景不是纯黑或有其他问题），我们还是用“正向绘制黑边”的方法。

                // 让我们回到最稳健的：径向渐变覆盖。
                const eyeR = maxR * (1 - easeInOutSine(p));
                const blur = 150; // 边缘模糊度

                const overlayGrad = ctx.createRadialGradient(cx, cy, Math.max(0, eyeR - blur), cx, cy, eyeR + blur);
                overlayGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');      // 中心完全透明
                overlayGrad.addColorStop(0.8, 'rgba(0, 0, 0, 0.5)');  // 过渡
                overlayGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');      // 边缘全黑

                // 确保覆盖整个屏幕
                // 如果 eyeR + blur < maxR，外面还是会有缝隙，所以最后要补一个全黑填充，但用 clip 限制？
                // 简单点：直接画这个渐变，它覆盖了从中心到 eyeR+blur 的范围。
                // 剩下的外围区域，我们需要确保是黑的。

                ctx.fillStyle = overlayGrad;
                ctx.fillRect(0, 0, W, H);

                // 补充：如果 eyeR+blur 还没覆盖到角落，角落必须是黑的
                // 我们可以画一个巨大的圆环，或者直接判断
                if (eyeR + blur < Math.max(W, H) / 2) {
                    // 这种情况发生在闭眼快结束时，中间很小，周围很大
                    // 上面的渐变只画到了 eyeR+blur。
                    // 我们需要把 (eyeR+blur) 以外的地方也涂黑。
                    // 可以使用 even-odd 路径填充外部
                    ctx.beginPath();
                    ctx.rect(0, 0, W, H);
                    ctx.arc(cx, cy, eyeR + blur, 0, Math.PI * 2, true); // 逆时针挖洞
                    ctx.fillStyle = '#000';
                    ctx.fill();
                }

                ctx.restore();
            }

            // ============================================================
            // 7. 渲染循环
            // ============================================================
            let startTime = 0;
            let animId = null;
            let isClosed = false;

            function render(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const time = timestamp / 100;

                // 清除画布
                ctx.clearRect(0, 0, W, H);

                // 1. 绘制基础星空场景
                drawFullScene(time);

                // 2. 计算闭眼进度
                let closeProgress = 0;
                if (elapsed > CONFIG.closeDelay) {
                    const closeElapsed = elapsed - CONFIG.closeDelay;
                    closeProgress = Math.min(closeElapsed / CONFIG.closeDuration, 1);
                }

                // 3. 应用闭眼遮罩
                if (closeProgress > 0) {
                    drawEyeCloseMask(closeProgress, time);
                }

                // 4. UI 状态更新
                const infoEl = document.getElementById('info');
                if (closeProgress >= 1 && !isClosed) {
                    isClosed = true;
                    infoEl.classList.add('show');
                } else if (closeProgress < 1 && isClosed) {
                    isClosed = false;
                    infoEl.classList.remove('show');
                }

                animId = requestAnimationFrame(render);
            }

            // ============================================================
            // 8. 启动与交互
            // ============================================================
            function init() {
                resize();
                generateStars(W, H);
                generateClouds(W, H);

                // 重置状态
                startTime = 0;
                isClosed = false;
                document.getElementById('info').classList.remove('show');

                if (animId) cancelAnimationFrame(animId);
                animId = requestAnimationFrame(render);
            }

            document.getElementById('restart-btn').addEventListener('click', () => {
                init();
            });

            window.addEventListener('resize', () => {
                resize();
                generateStars(W, H);
                generateClouds(W, H);
            });

            if (document.readyState === 'complete') init();
            else window.addEventListener('load', init);

        })();
    </script>
</body>

</html>
