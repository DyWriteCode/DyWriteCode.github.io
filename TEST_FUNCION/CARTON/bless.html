<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>祝福化光 · 生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b16;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #121b2f 0%, #070a12 100%);
        }

        .hint {
            position: fixed;
            bottom: 26px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 215, 140, 0.25);
            font-size: 13px;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 100;
            font-weight: 300;
        }

        .hint span {
            display: inline-block;
            padding: 4px 20px;
            border: 1px solid rgba(255, 215, 140, 0.06);
            border-radius: 30px;
            background: rgba(8, 11, 22, 0.6);
            backdrop-filter: blur(3px);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="hint"><span>✦ 点击画面 · 重放 ✦</span></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const CFG = {
                flyDuration: 4500,
                fontSizeMin: 24,
                fontSizeMax: 30,
                textColor: '#f0f4f8',
                targetFontSize: 110,
                particleSizeMin: 2.8,
                particleSizeMax: 5.2,
                fadeStart: 0.30,
                fadeEnd: 0.68,
                particlesPerChar: 500,
                charGap: 50,
                jitterMax: 5000,
                stableParticleAlpha: 0.7,
                bgGlowAlpha: 0.5
            };

            const BASE_BLESSINGS = [
                '愿你眼中有星辰大海', '心中有繁花似锦', '前路漫漫亦灿灿', '做自己的光', '温柔且坚定',
                '未来皆可期', '感谢青春有你', '去更远的地方', '永远年轻，永远热泪盈眶', '生日快乐',
                '愿你所遇皆温柔', '岁月如歌', '前程似锦', '万事胜意', '未来可期', '平安喜乐',
                '得偿所愿', '光芒万丈', '不负韶华', '以梦为马', '乘风破浪', '星河长明',
                '万事顺遂', '人间值得', '山河无恙', '人间皆安'
            ];

            const TOTAL_PARTICLES = CFG.particlesPerChar * 4;
            let BLESSINGS = [];
            while (BLESSINGS.length < TOTAL_PARTICLES) {
                BASE_BLESSINGS.forEach(t => { if (BLESSINGS.length < TOTAL_PARTICLES) BLESSINGS.push(t); });
            }
            for (let i = BLESSINGS.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [BLESSINGS[i], BLESSINGS[j]] = [BLESSINGS[j], BLESSINGS[i]];
            }

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            let W, H, dpr;

            function resize() {
                dpr = window.devicePixelRatio || 1;
                W = window.innerWidth; H = window.innerHeight;
                canvas.width = W * dpr; canvas.height = H * dpr;
                canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', () => { resize(); initStars(); });

            const rand = (a, b) => Math.random() * (b - a) + a;
            const randInt = (a, b) => Math.floor(rand(a, b + 1));
            const lerp = (a, b, t) => a + (b - a) * t;
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
            function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
            function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

            const particleTex = (() => {
                const c = document.createElement('canvas'); const size = 28;
                c.width = size; c.height = size;
                const cx = c.getContext('2d');
                const grad = cx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.3, 'rgba(255,255,255,0.95)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                cx.fillStyle = grad; cx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); cx.fill();
                return c;
            })();

            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');

            function extractCharPixels(char, fontSize, targetCount) {
                const pad = 16; const size = fontSize + pad * 2;
                offscreen.width = size; offscreen.height = size;
                offCtx.clearRect(0, 0, size, size);
                offCtx.textAlign = 'center'; offCtx.textBaseline = 'middle';
                offCtx.font = `bold ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
                offCtx.fillStyle = '#ffffff'; offCtx.fillText(char, size / 2, size / 2);

                const imgData = offCtx.getImageData(0, 0, size, size);
                const data = imgData.data; const raw = [];
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        if (data[idx + 3] > 30) raw.push({ x: x - pad, y: y - pad, r: data[idx], g: data[idx + 1], b: data[idx + 2] });
                    }
                }
                if (raw.length > 0) {
                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    raw.forEach(p => {
                        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                    });
                    const centerX = (minX + maxX) / 2; const centerY = (minY + maxY) / 2;
                    raw.forEach(p => { p.x -= centerX; p.y -= centerY; });
                }
                if (raw.length === 0) {
                    for (let i = 0; i < targetCount; i++) raw.push({ x: rand(-fontSize / 2, fontSize / 2), y: rand(-fontSize / 2, fontSize / 2), r: 255, g: 215, b: 50 });
                }
                const result = []; const shuffled = [...raw];
                for (let i = shuffled.length - 1; i > 0; i--) { const j = randInt(0, i);[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
                for (let i = 0; i < Math.min(targetCount, shuffled.length); i++) result.push(shuffled[i]);
                while (result.length < targetCount) {
                    const p = raw[randInt(0, raw.length - 1)];
                    result.push({ x: p.x + rand(-3, 3), y: p.y + rand(-3, 3), r: p.r, g: p.g, b: p.b });
                }
                return result;
            }

            function buildTargetPositions() {
                const chars = ['生', '日', '快', '乐'];
                const fs = CFG.targetFontSize; const gap = CFG.charGap;
                const charWidth = fs * 0.62; const totalW = chars.length * charWidth + (chars.length - 1) * gap;
                const startX = (W - totalW) / 2; const centerY = H / 2;

                const allPositions = [];
                chars.forEach((ch, ci) => {
                    const px = extractCharPixels(ch, fs, CFG.particlesPerChar);
                    const cx = startX + ci * (charWidth + gap) + charWidth / 2;
                    px.forEach(p => {
                        allPositions.push({ x: cx + p.x, y: centerY + p.y, r: p.r || 255, g: p.g || 215, b: p.b || 50, group: ci });
                    });
                });
                for (let g = 0; g < 4; g++) {
                    const groupItems = allPositions.filter(p => p.group === g);
                    for (let i = groupItems.length - 1; i > 0; i--) { const j = randInt(0, i);[groupItems[i], groupItems[j]] = [groupItems[j], groupItems[i]]; }
                }
                return allPositions;
            }

            let stars = [];
            function initStars() {
                stars = [];
                for (let i = 0; i < 120; i++) {
                    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.3, 1.5), a: rand(0.12, 0.6), speed: rand(0.001, 0.005), phase: rand(0, Math.PI * 2) });
                }
            }
            initStars();
            function drawStars(time) {
                stars.forEach(s => {
                    const alpha = s.a * (0.6 + 0.4 * Math.sin(time * s.speed + s.phase));
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`; ctx.fill();
                });
            }

            function drawGlowText(text, x, y, fs, alpha = 1, blur = 30, color = 'rgba(255, 215, 0, 0.5)') {
                if (alpha < 0.05 || fs < 3) return;
                ctx.save(); ctx.globalAlpha = alpha;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `bold ${fs}px "PingFang SC","Microsoft YaHei",sans-serif`;
                ctx.shadowColor = color; ctx.shadowBlur = blur;
                ctx.fillStyle = CFG.textColor; ctx.fillText(text, x, y);
                ctx.restore();
            }

            let blessings = []; let allParticles = []; let state = 'flying';
            let flyStartTime = 0; let animTime = 0; let lastTimestamp = 0; let animationId = null;
            let targetCharPositions = [];

            function init() {
                const targetPositions = buildTargetPositions();
                const count = Math.min(BLESSINGS.length, targetPositions.length);
                const groupBaseDelay = [0, 1500, 3000, 4500];

                targetCharPositions = [];
                const fs = CFG.targetFontSize; const gap = CFG.charGap;
                const charWidth = fs * 0.62; const totalW = 4 * charWidth + 3 * gap;
                const startX = (W - totalW) / 2; const centerY = H / 2;
                ['生', '日', '快', '乐'].forEach((ch, i) => {
                    const cx = startX + i * (charWidth + gap) + charWidth / 2;
                    targetCharPositions.push({ char: ch, x: cx, y: centerY, fontSize: fs });
                });

                blessings = [];
                const groupTotal = [0, 0, 0, 0];
                const groupProgress = [0, 0, 0, 0];
                targetPositions.forEach(pos => { if (pos.group >= 0 && pos.group < 4) groupTotal[pos.group]++; });

                for (let i = 0; i < count; i++) {
                    const pos = targetPositions[i % targetPositions.length];
                    const base = groupBaseDelay[pos.group] || 0;
                    const idxInGroup = groupProgress[pos.group]++;
                    const currentGroupTotal = groupTotal[pos.group];
                    // ★★★ 核心优化：彻底移除 rand(-80, 80) 波动，改为绝对均匀排队 ★★★
                    const t = idxInGroup / currentGroupTotal;
                    const timeInGroup = t * CFG.jitterMax;
                    const startDelay = base + Math.max(0, timeInGroup);
                    blessings.push(createBlessingItem(BLESSINGS[i], i, count, pos, startDelay));
                }

                allParticles = blessings.map(b => ({
                    x: 0, y: 0, targetX: b.targetX, targetY: b.targetY, size: b.particleSize, r: b.color.r,
                    g: b.color.g, b: b.color.b, alpha: 0, progress: 0, startDelay: b.startDelay,
                    group: b.group, activated: false, done: false
                }));

                state = 'flying'; flyStartTime = 0; animTime = 0; lastTimestamp = 0;
                blessings.forEach(b => { b.progress = 0; b.done = false; b.activated = false; });
                allParticles.forEach(p => { p.alpha = 0; p.progress = 0; p.activated = false; p.done = false; });

                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(animate);
            }

            function drawParticle(p) {
                if (p.alpha < 0.01) return;
                const size = p.size;
                const cr = 255, cg = 230, cb = 180;
                ctx.save();
                ctx.globalAlpha = clamp(p.alpha * CFG.stableParticleAlpha, 0, 1);
                ctx.drawImage(particleTex, p.x - size / 2, p.y - size / 2, size, size);
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, 0.8)`;
                ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
                ctx.restore();
            }
            function drawAllParticles() { allParticles.forEach(p => drawParticle(p)); }

            function drawStableGlow() {
                const fs = CFG.targetFontSize;
                targetCharPositions.forEach(item => {
                    ctx.save();
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = `bold ${fs}px "PingFang SC","Microsoft YaHei",sans-serif`;
                    const grad = ctx.createLinearGradient(item.x - fs / 2, item.y, item.x + fs / 2, item.y);
                    grad.addColorStop(0, '#ffd700');
                    grad.addColorStop(0.5, '#ffb6c1');
                    grad.addColorStop(1, '#87ceeb');
                    ctx.shadowColor = 'rgba(255, 200, 100, 0.7)';
                    ctx.shadowBlur = 50;
                    ctx.fillStyle = grad;
                    ctx.fillText(item.char, item.x, item.y);
                    ctx.restore();
                });
            }

            function animate(timestamp) {
                const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 16.667, 3) : 1;
                lastTimestamp = timestamp; animTime += dt * 16.667;

                ctx.clearRect(0, 0, W, H);
                drawStars(animTime);

                if (state === 'flying') {
                    updateFlying(timestamp);
                } else if (state === 'stable') {
                    drawStableGlow();
                    drawAllParticles();
                }
                requestAnimationFrame(animate);
            }

            function updateFlying(timestamp) {
                if (flyStartTime === 0) flyStartTime = timestamp;
                const elapsed = timestamp - flyStartTime; let allDone = true;
                allParticles.forEach((p, idx) => {
                    const b = blessings[idx];
                    if (!p.activated && elapsed >= p.startDelay) { p.activated = true; b.activated = true; }
                    if (!p.activated) { allDone = false; return; }
                    if (p.done) return;

                    const localElapsed = elapsed - p.startDelay;
                    const eased = easeInOutCubic(clamp(localElapsed / CFG.flyDuration, 0, 1));
                    p.progress = eased; b.progress = eased;

                    const t = eased; const mt = 1 - t;
                    const cx = mt * mt * b.startX + 2 * mt * t * b.cpX + t * t * b.targetX;
                    const cy = mt * mt * b.startY + 2 * mt * t * b.cpY + t * t * b.targetY;

                    const fadeStart = CFG.fadeStart; const fadeEnd = CFG.fadeEnd;
                    let textAlpha = 1; let textScale = 1;
                    if (eased > fadeStart) {
                        const fadeProgress = (eased - fadeStart) / (fadeEnd - fadeStart);
                        textAlpha = 1 - easeOutQuad(clamp(fadeProgress, 0, 1));
                        textScale = 1 - 0.5 * easeOutQuad(clamp(fadeProgress, 0, 1));
                    }
                    const currentFs = Math.max(b.fontSize * textScale, 0.05);

                    let particleAlpha = 0;
                    if (eased > fadeStart * 0.5) {
                        particleAlpha = easeOutQuad(clamp((eased - fadeStart * 0.5) / (fadeEnd * 1.2 - fadeStart * 0.5), 0, 1));
                    }

                    const mixPos = clamp((eased - fadeStart * 0.3) / (fadeEnd * 1.4 - fadeStart * 0.3), 0, 1);
                    const posEased = easeOutQuad(mixPos);
                    p.x = lerp(cx, b.targetX, posEased);
                    p.y = lerp(cy, b.targetY, posEased);
                    p.alpha = particleAlpha;
                    p.size = b.particleSize * (0.6 + 0.4 * particleAlpha);

                    if (textAlpha > 0.08 && currentFs > 3) {
                        drawGlowText(b.text, cx, cy, currentFs, textAlpha * 0.85, 40, 'rgba(255, 215, 0, 0.5)');
                    }
                    if (p.alpha > 0.01) drawParticle(p);

                    if (eased >= 1) {
                        p.done = true; b.done = true;
                        p.x = b.targetX; p.y = b.targetY; p.alpha = 1; p.size = b.particleSize;
                    } else { allDone = false; }
                });

                if (allDone) {
                    allParticles.forEach((p, idx) => {
                        p.x = blessings[idx].targetX; p.y = blessings[idx].targetY;
                        p.alpha = 1; p.size = blessings[idx].particleSize;
                    });
                    state = 'stable';
                }
            }

            function createBlessingItem(text, index, total, targetPos, startDelay) {
                const fs = rand(CFG.fontSizeMin, CFG.fontSizeMax);
                const dirs = ['left', 'right', 'top', 'bottom']; const dir = dirs[index % dirs.length];
                const margin = 50; let sx, sy;
                switch (dir) {
                    case 'left': sx = -margin - fs * text.length * 0.35; sy = rand(H * 0.08, H * 0.92); break;
                    case 'right': sx = W + margin + fs * text.length * 0.35; sy = rand(H * 0.08, H * 0.92); break;
                    case 'top': sx = rand(W * 0.05, W * 0.95); sy = -margin - fs; break;
                    case 'bottom': sx = rand(W * 0.05, W * 0.95); sy = H + margin + fs; break;
                }
                const tx = targetPos.x; const ty = targetPos.y;
                return {
                    text, fontSize: fs, startX: sx, startY: sy, targetX: tx, targetY: ty,
                    cpX: (sx + tx) / 2 + rand(-W * 0.15, W * 0.15), cpY: (sy + ty) / 2 + rand(-H * 0.15, H * 0.15),
                    index, progress: 0, done: false, particleSize: rand(CFG.particleSizeMin, CFG.particleSizeMax),
                    color: { r: 255, g: 240, b: 200 },
                    group: targetPos.group, startDelay, activated: false
                };
            }

            canvas.addEventListener('click', init);
            window.addEventListener('resize', () => {
                resize(); initStars();
                clearTimeout(window._resizeTimer);
                window._resizeTimer = setTimeout(() => { if (state === 'stable') init(); }, 300);
            });

            init();
            console.log('✨ 祝福化光 · 生日快乐 · 已彻底消除泊松分布（绝对均匀排队入场） ✨');
        });
    </script>
</body>

</html>
