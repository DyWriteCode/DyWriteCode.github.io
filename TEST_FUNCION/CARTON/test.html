<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日蛋糕 🎂 闭眼许愿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0808;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        canvas {
            border-radius: 16px;
            box-shadow: 0 0 80px rgba(255, 150, 50, 0.12), 0 0 200px rgba(255, 100, 30, 0.06);
            max-width: 100vw;
            max-height: 100vh;
            display: block;
            background: #1a1410;
            width: auto;
            height: auto;
            position: relative;
            z-index: 1;
        }

        .info {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 200, 150, 0.15);
            font-size: 15px;
            letter-spacing: 3px;
            pointer-events: none;
            font-weight: 300;
            text-shadow: 0 0 30px rgba(255, 150, 50, 0.05);
            z-index: 10;
            transition: all 1.5s ease;
        }

        .info.active {
            color: rgba(255, 220, 180, 0.6);
            text-shadow: 0 0 40px rgba(255, 200, 100, 0.15);
        }

        .info.closed {
            color: rgba(255, 200, 150, 0.5);
            text-shadow: 0 0 60px rgba(255, 180, 100, 0.2);
            letter-spacing: 4px;
        }

        #restart-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 28px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 2px;
            transition: all 0.5s ease;
            z-index: 20;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            font-weight: 300;
        }

        #restart-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 30px rgba(255, 200, 100, 0.05);
        }

        #restart-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            .info {
                font-size: 12px;
                bottom: 20px;
                letter-spacing: 2px;
            }

            #restart-btn {
                padding: 8px 20px;
                font-size: 11px;
                bottom: 60px;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="info" id="info">✨ 许个愿吧 ✨</div>
    <button id="restart-btn">🕯️ 重新睁开</button>

    <script>
        // ============================================================
        //  配置
        // ============================================================
        const W = 800;
        const H = 600;
        const canvas = document.getElementById('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        const DESK_Y = H * 0.78;
        const DESK_H = H - DESK_Y;
        const CAKE_CX = W / 2;
        const LAYER_H = 50;
        const LAYERS = [
            { w: 180, color: '#5c3a1a' },
            { w: 140, color: '#e8a0a0' },
            { w: 100, color: '#f5ede3' },
        ];

        const CANDLE_COLORS = ['#ff4444', '#ffdd44', '#4488ff', '#44dd44', '#ff66aa'];
        const CANDLE_W = 8;
        const CANDLE_H = 25;
        const CANDLE_COUNT = 5;
        const FLAME_W = 10;
        const FLAME_H = 14;

        // ============================================================
        //  闭眼状态
        // ============================================================
        let closeState = {
            progress: 0,
            phase: 'idle',
            startTime: 0,
            isClosed: false,
            isOpening: false,
        };

        const CLOSE_DELAY = 1800;
        const CLOSE_DURATION = 4500;
        const OPEN_DURATION = 1500;

        let infoEl = document.getElementById('info');
        let restartBtn = document.getElementById('restart-btn');

        // ============================================================
        //  工具函数
        // ============================================================
        function lerp(a, b, t) { return a + (b - a) * t; }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function easeInOutSine(t) {
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function roundRect(ctx, x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function getCakeLayerY(index) {
            return DESK_Y - (index + 1) * LAYER_H;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(c => clamp(Math.round(c), 0, 255).toString(16).padStart(2, '0')).join('');
        }

        function lightenColor(hex, amount) {
            const { r, g, b } = hexToRgb(hex);
            return rgbToHex(Math.min(255, r + amount), Math.min(255, g + amount), Math.min(255, b + amount));
        }

        function darkenColor(hex, amount) {
            const { r, g, b } = hexToRgb(hex);
            return rgbToHex(Math.max(0, r - amount), Math.max(0, g - amount), Math.max(0, b - amount));
        }

        // ============================================================
        //  绘制函数（背景、桌面、蛋糕、蜡烛、火焰）
        // ============================================================
        function drawBackground() {
            const grad = ctx.createRadialGradient(CAKE_CX, DESK_Y - 60, 30, CAKE_CX, DESK_Y - 60, 450);
            grad.addColorStop(0, '#2a1e18');
            grad.addColorStop(0.4, '#1e1612');
            grad.addColorStop(0.8, '#14100d');
            grad.addColorStop(1, '#0a0808');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const grad2 = ctx.createRadialGradient(CAKE_CX, 0, 20, CAKE_CX, 0, 350);
            grad2.addColorStop(0, 'rgba(255, 180, 100, 0.04)');
            grad2.addColorStop(1, 'rgba(255, 180, 100, 0)');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, 0, W, H);

            const envGlow = ctx.createRadialGradient(CAKE_CX, DESK_Y - 40, 20, CAKE_CX, DESK_Y - 40, 400);
            envGlow.addColorStop(0, 'rgba(255, 180, 100, 0.08)');
            envGlow.addColorStop(0.5, 'rgba(255, 140, 70, 0.04)');
            envGlow.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = envGlow;
            ctx.fillRect(0, 0, W, H);
        }

        function drawDesk() {
            ctx.save();
            const shadowGrad = ctx.createLinearGradient(0, DESK_Y, 0, H);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
            shadowGrad.addColorStop(0.15, 'rgba(0,0,0,0.3)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = shadowGrad;
            ctx.fillRect(0, DESK_Y, W, DESK_H);

            const deskGrad = ctx.createLinearGradient(0, DESK_Y, 0, H);
            deskGrad.addColorStop(0, 'rgba(70, 40, 25, 0.85)');
            deskGrad.addColorStop(0.5, 'rgba(55, 32, 18, 0.90)');
            deskGrad.addColorStop(1, 'rgba(40, 22, 12, 0.95)');
            ctx.fillStyle = deskGrad;
            ctx.fillRect(0, DESK_Y, W, DESK_H);

            ctx.strokeStyle = 'rgba(90, 55, 35, 0.25)';
            ctx.lineWidth = 0.5;
            for (let y = DESK_Y + 4; y < H; y += 6) {
                const offset = Math.sin(y * 0.03) * 3 + Math.sin(y * 0.07 + 1) * 2;
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x < W; x += 2) {
                    const wave = Math.sin(x * 0.02 + y * 0.01) * 1.5 + Math.sin(x * 0.05 + y * 0.02) * 0.8;
                    ctx.lineTo(x, y + wave + offset * 0.3);
                }
                ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(120, 80, 50, 0.12)';
            ctx.lineWidth = 0.3;
            for (let y = DESK_Y + 2; y < H; y += 9) {
                const offset = Math.sin(y * 0.04 + 2) * 4;
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x < W; x += 3) {
                    const wave = Math.sin(x * 0.015 + y * 0.008) * 2 + Math.sin(x * 0.04 + y * 0.015 + 1) * 1;
                    ctx.lineTo(x, y + wave + offset * 0.2);
                }
                ctx.stroke();
            }

            const highlight = ctx.createLinearGradient(0, DESK_Y, 0, DESK_Y + 20);
            highlight.addColorStop(0, 'rgba(180, 130, 90, 0.10)');
            highlight.addColorStop(1, 'rgba(180, 130, 90, 0)');
            ctx.fillStyle = highlight;
            ctx.fillRect(0, DESK_Y, W, 20);
            ctx.restore();
        }

        function drawCandleGlow(time) {
            ctx.save();
            const glow1 = ctx.createRadialGradient(CAKE_CX, DESK_Y - 50, 20, CAKE_CX, DESK_Y - 50, 350);
            glow1.addColorStop(0, `rgba(255, 200, 120, ${0.06 + 0.02 * Math.sin(time * 0.5 + 1)})`);
            glow1.addColorStop(0.3, `rgba(255, 170, 90, ${0.04 + 0.015 * Math.sin(time * 0.4 + 2)})`);
            glow1.addColorStop(0.7, `rgba(255, 140, 70, ${0.02 + 0.01 * Math.sin(time * 0.3 + 3)})`);
            glow1.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = glow1;
            ctx.fillRect(0, 0, W, H);

            const candlePositions = getCandlePositions();
            for (let i = 0; i < candlePositions.length; i++) {
                const cx = candlePositions[i];
                const cy = DESK_Y - LAYER_H * 3 - CANDLE_H + 2;
                const pulse = 0.85 + 0.15 * Math.sin(time * 1.2 + i * 1.8);
                const radius = 60 * pulse;
                const glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, radius);
                const alpha = 0.12 + 0.06 * Math.sin(time * 0.7 + i * 1.2);
                glow.addColorStop(0, `rgba(255, 210, 140, ${alpha})`);
                glow.addColorStop(0.4, `rgba(255, 180, 100, ${alpha * 0.5})`);
                glow.addColorStop(1, 'rgba(255, 150, 80, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
            }

            const deskGlow = ctx.createRadialGradient(CAKE_CX, DESK_Y + 20, 30, CAKE_CX, DESK_Y + 20, 240);
            deskGlow.addColorStop(0, `rgba(255, 190, 110, ${0.04 + 0.02 * Math.sin(time * 0.6 + 0.5)})`);
            deskGlow.addColorStop(0.5, `rgba(255, 160, 80, ${0.02 + 0.01 * Math.sin(time * 0.5 + 1.5)})`);
            deskGlow.addColorStop(1, 'rgba(255, 130, 60, 0)');
            ctx.fillStyle = deskGlow;
            ctx.fillRect(0, DESK_Y, W, DESK_H);
            ctx.restore();
        }

        function drawCake() {
            ctx.save();
            for (let i = 1; i < LAYERS.length; i++) {
                const layer = LAYERS[i];
                const w = layer.w;
                const x = CAKE_CX - w / 2;
                const y = getCakeLayerY(i);
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 4;
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillRect(x + 4, y + 2, w - 8, 6);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }

            for (let i = 0; i < LAYERS.length; i++) {
                const layer = LAYERS[i];
                const w = layer.w;
                const x = CAKE_CX - w / 2;
                const y = getCakeLayerY(i);
                const h = LAYER_H;

                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 5;

                const grad = ctx.createLinearGradient(x, y, x + w, y);
                grad.addColorStop(0, darkenColor(layer.color, 30));
                grad.addColorStop(0.2, lightenColor(layer.color, 10));
                grad.addColorStop(0.5, layer.color);
                grad.addColorStop(0.8, darkenColor(layer.color, 15));
                grad.addColorStop(1, darkenColor(layer.color, 40));
                ctx.fillStyle = grad;
                roundRect(ctx, x, y, w, h, 5);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                const hlGrad = ctx.createLinearGradient(x, y + 3, x + w, y + 8);
                hlGrad.addColorStop(0, 'rgba(255,255,255,0)');
                hlGrad.addColorStop(0.25, `rgba(255,255,255,${i === 2 ? 0.4 : 0.2})`);
                hlGrad.addColorStop(0.75, `rgba(255,255,255,${i === 2 ? 0.3 : 0.12})`);
                hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = hlGrad;
                ctx.fillRect(x + 8, y + 3, w - 16, 6);

                const sideGrad = ctx.createLinearGradient(x + w - 10, y, x + w, y + h);
                sideGrad.addColorStop(0, 'rgba(0,0,0,0.05)');
                sideGrad.addColorStop(0.5, 'rgba(0,0,0,0.2)');
                sideGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = sideGrad;
                ctx.fillRect(x + w - 10, y, 10, h);

                const leftGrad = ctx.createLinearGradient(x, y, x + 5, y + h);
                leftGrad.addColorStop(0, 'rgba(255,255,255,0.12)');
                leftGrad.addColorStop(0.5, 'rgba(255,255,255,0.05)');
                leftGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = leftGrad;
                ctx.fillRect(x, y, 5, h);

                drawCreamPiping(i);
            }
            ctx.restore();
        }

        function drawCreamPiping(layerIndex) {
            const layer = LAYERS[layerIndex];
            const w = layer.w;
            const x = CAKE_CX - w / 2;
            const y = getCakeLayerY(layerIndex);

            let mainColor, dotColor;
            if (layerIndex === 0) {
                mainColor = 'rgba(255, 180, 170, 0.9)';
                dotColor = 'rgba(255, 210, 200, 0.7)';
            } else if (layerIndex === 1) {
                mainColor = 'rgba(255, 220, 160, 0.9)';
                dotColor = 'rgba(255, 235, 190, 0.7)';
            } else {
                mainColor = 'rgba(190, 220, 255, 0.9)';
                dotColor = 'rgba(210, 235, 255, 0.7)';
            }

            const radius = layerIndex === 0 ? 11 : (layerIndex === 1 ? 9 : 8);
            const spacing = layerIndex === 0 ? 22 : (layerIndex === 1 ? 20 : 18);
            const topY = y + 3;

            ctx.save();
            const startX = x + radius + 5;
            const endX = x + w - radius - 5;

            for (let px = startX; px < endX; px += spacing) {
                const offset = Math.sin(px * 0.5 + layerIndex * 2) * 1.5;
                const cx = px + offset;
                const cy = topY;

                ctx.beginPath();
                ctx.arc(cx, cy, radius, Math.PI, 0, false);
                ctx.strokeStyle = mainColor;
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.fillStyle = dotColor;
                ctx.beginPath();
                ctx.arc(cx - 2, cy - 2, radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            if (layerIndex === 2) {
                for (let px = x + 18; px < x + w - 18; px += 24) {
                    const cx = px + Math.sin(px * 0.5) * 3;
                    const cy = topY + 8 + Math.sin(px * 0.4 + 1) * 5;
                    ctx.fillStyle = 'rgba(255, 200, 180, 0.8)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.arc(cx - 2, cy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (layerIndex === 1) {
                for (let px = x + 14; px < x + w - 14; px += 26) {
                    const cx = px + Math.sin(px * 0.6 + 2) * 2;
                    const cy = topY + 6 + Math.sin(px * 0.5 + 1.5) * 4;
                    ctx.fillStyle = 'rgba(255, 230, 170, 0.8)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                for (let px = x + 12; px < x + w - 12; px += 28) {
                    const cx = px + Math.sin(px * 0.7 + 1) * 2;
                    const cy = topY + 5 + Math.sin(px * 0.6 + 2) * 3;
                    ctx.fillStyle = 'rgba(255, 200, 190, 0.7)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        function getCandlePositions() {
            const topW = LAYERS[2].w;
            const startX = CAKE_CX - topW / 2 + 8;
            const endX = CAKE_CX + topW / 2 - 8;
            const positions = [];
            for (let i = 0; i < CANDLE_COUNT; i++) {
                const t = (i + 0.5) / CANDLE_COUNT;
                positions.push(lerp(startX, endX, t));
            }
            return positions;
        }

        function drawCandles() {
            const positions = getCandlePositions();
            const topY = getCakeLayerY(2);
            ctx.save();

            for (let i = 0; i < positions.length; i++) {
                const cx = positions[i];
                const cy = topY;
                const color = CANDLE_COLORS[i % CANDLE_COLORS.length];

                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 2;

                const grad = ctx.createLinearGradient(cx - CANDLE_W / 2, cy, cx + CANDLE_W / 2, cy);
                grad.addColorStop(0, darkenColor(color, 25));
                grad.addColorStop(0.3, lightenColor(color, 20));
                grad.addColorStop(0.7, color);
                grad.addColorStop(1, darkenColor(color, 15));

                ctx.fillStyle = grad;
                roundRect(ctx, cx - CANDLE_W / 2, cy - CANDLE_H, CANDLE_W, CANDLE_H, 1.5);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                const hlGrad = ctx.createLinearGradient(cx - CANDLE_W / 2, cy - CANDLE_H, cx - CANDLE_W / 2 + 2.5, cy);
                hlGrad.addColorStop(0, 'rgba(255,255,255,0.2)');
                hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.35)');
                hlGrad.addColorStop(1, 'rgba(255,255,255,0.05)');
                ctx.fillStyle = hlGrad;
                ctx.fillRect(cx - CANDLE_W / 2 + 0.5, cy - CANDLE_H + 1, 2, CANDLE_H - 2);

                ctx.fillStyle = 'rgba(255, 240, 220, 0.25)';
                ctx.beginPath();
                ctx.ellipse(cx, cy - CANDLE_H + 0.5, CANDLE_W / 2 - 0.5, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(cx, cy - CANDLE_H + 1, 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 火焰绘制 —— 受闭眼影响：闭眼过程中火焰逐渐熄灭
        function drawFlames(time, closeProgress) {
            const positions = getCandlePositions();
            const topY = getCakeLayerY(2);

            const flameBrightness = 1 - closeProgress * 1.2;
            const flameAlpha = clamp(flameBrightness, 0, 1);

            ctx.save();

            for (let i = 0; i < positions.length; i++) {
                const cx = positions[i];
                const baseY = topY - CANDLE_H + 1;

                const phase = i * 1.3 + 0.7;
                const scaleX = 0.92 + 0.08 * Math.sin(time * 1.2 + phase);
                const scaleY = 0.90 + 0.10 * Math.sin(time * 1.6 + phase * 0.7);
                const offsetY = 1.2 * Math.sin(time * 2.0 + phase * 1.2);

                const flameX = cx;
                const flameY = baseY + offsetY - 2;

                if (flameAlpha > 0.02) {
                    const glowRadius = 18 * (0.92 + 0.08 * Math.sin(time * 1.0 + phase)) * (0.3 + 0.7 * flameAlpha);
                    const glow = ctx.createRadialGradient(flameX, flameY, 2, flameX, flameY, glowRadius);
                    const glowAlpha = (0.12 + 0.05 * Math.sin(time * 0.7 + phase)) * flameAlpha;
                    glow.addColorStop(0, `rgba(255, 200, 100, ${glowAlpha})`);
                    glow.addColorStop(0.5, `rgba(255, 160, 70, ${glowAlpha * 0.5})`);
                    glow.addColorStop(1, 'rgba(255, 120, 50, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(flameX, flameY, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (flameAlpha < 0.01) continue;

                ctx.save();
                ctx.translate(flameX, flameY);
                ctx.scale(scaleX, scaleY);

                const grad = ctx.createRadialGradient(0, -3, 1, 0, 0, FLAME_H * 0.6);
                const r1 = Math.round(255 * flameAlpha);
                const r2 = Math.round(221 * flameAlpha);
                const r3 = Math.round(170 * flameAlpha);
                const r4 = Math.round(119 * flameAlpha);
                const r5 = Math.round(68 * flameAlpha);

                grad.addColorStop(0, `rgba(255, 251, 230, ${flameAlpha})`);
                grad.addColorStop(0.15,
                    `rgba(255, ${Math.round(221 * flameAlpha)}, ${Math.round(68 * flameAlpha)}, ${flameAlpha})`);
                grad.addColorStop(0.4, `rgba(255, ${Math.round(170 * flameAlpha)}, 0, ${flameAlpha})`);
                grad.addColorStop(0.7, `rgba(255, ${Math.round(119 * flameAlpha)}, 0, ${flameAlpha})`);
                grad.addColorStop(1, `rgba(255, ${Math.round(68 * flameAlpha)}, 0, ${flameAlpha * 0.5})`);

                ctx.beginPath();
                const w = FLAME_W / 2;
                const h = FLAME_H / 2;
                ctx.moveTo(0, -h);
                ctx.bezierCurveTo(w * 0.8, -h * 0.4, w, -h * 0.1, w, h * 0.2);
                ctx.bezierCurveTo(w, h * 0.6, w * 0.6, h, 0, h * 0.85);
                ctx.bezierCurveTo(-w * 0.6, h, -w, h * 0.6, -w, h * 0.2);
                ctx.bezierCurveTo(-w, -h * 0.1, -w * 0.8, -h * 0.4, 0, -h);
                ctx.closePath();

                ctx.fillStyle = grad;
                ctx.fill();

                const coreGrad = ctx.createRadialGradient(0, -2, 0.5, 0, 0, FLAME_H * 0.25);
                coreGrad.addColorStop(0, `rgba(255, 255, 240, ${0.9 * flameAlpha})`);
                coreGrad.addColorStop(0.3, `rgba(255, 230, 150, ${0.6 * flameAlpha})`);
                coreGrad.addColorStop(1, `rgba(255, 200, 80, 0)`);
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.ellipse(0, -2, FLAME_W * 0.25, FLAME_H * 0.25, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                const baseGlow = ctx.createRadialGradient(cx, baseY + 1, 1, cx, baseY + 1, 12);
                const bAlpha = (0.15 + 0.08 * Math.sin(time * 0.8 + phase)) * flameAlpha;
                baseGlow.addColorStop(0, `rgba(255, 200, 100, ${bAlpha})`);
                baseGlow.addColorStop(1, 'rgba(255, 150, 70, 0)');
                ctx.fillStyle = baseGlow;
                ctx.beginPath();
                ctx.arc(cx, baseY + 1, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // ============================================================
        //  装饰：礼物堆、气球、横幅
        // ============================================================

        function drawGift(x, y, w, h, boxColor, ribbonColor, shadowOffset) {
            shadowOffset = shadowOffset || 5;
            if (!isFinite(x) || !isFinite(y) || !isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) return;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = shadowOffset;

            const gradBox = ctx.createLinearGradient(x, y, x + w, y + h);
            gradBox.addColorStop(0, lightenColor(boxColor, 25));
            gradBox.addColorStop(0.5, boxColor);
            gradBox.addColorStop(1, darkenColor(boxColor, 30));
            ctx.fillStyle = gradBox;
            roundRect(ctx, x, y, w, h, 4);
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            ctx.fillStyle = ribbonColor;
            ctx.fillRect(x + w / 2 - 3, y, 6, h);
            ctx.fillRect(x, y + h / 2 - 3, w, 6);

            ctx.beginPath();
            ctx.arc(x + w / 2 - 7, y - 3, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w / 2 + 7, y - 3, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(x + 6, y + 3, w - 12, 4);
            ctx.restore();
        }

        const giftPyramidData = (() => {
            const layerDefs = [
                { layer: 5, yBase: -160, count: 1, xStart: 140, xEnd: 170, sizeMin: 30, sizeMax: 40 },
                { layer: 4, yBase: -128, count: 2, xStart: 120, xEnd: 190, sizeMin: 34, sizeMax: 44 },
                { layer: 3, yBase: -96, count: 3, xStart: 100, xEnd: 210, sizeMin: 38, sizeMax: 48 },
                { layer: 2, yBase: -64, count: 4, xStart: 80, xEnd: 225, sizeMin: 42, sizeMax: 54 },
                { layer: 1, yBase: -32, count: 5, xStart: 60, xEnd: 240, sizeMin: 46, sizeMax: 58 },
                { layer: 0, yBase: 0, count: 6, xStart: 40, xEnd: 260, sizeMin: 50, sizeMax: 64 },
            ];

            const allGifts = [];
            const colorPalette = [
                ['#e74c3c', '#f1c40f'],
                ['#2980b9', '#ecf0f1'],
                ['#27ae60', '#f1c40f'],
                ['#f39c12', '#e74c3c'],
                ['#8e44ad', '#f1c40f'],
                ['#1abc9c', '#e67e22'],
                ['#e67e22', '#2c3e50'],
                ['#2c3e50', '#f1c40f'],
                ['#c0392b', '#ecf0f1'],
                ['#16a085', '#f39c12'],
                ['#d35400', '#f1c40f'],
                ['#9b59b6', '#ecf0f1'],
            ];

            let idx = 0;
            for (let ld of layerDefs) {
                const { layer, yBase, count, xStart, xEnd, sizeMin, sizeMax } = ld;
                const availableWidth = xEnd - xStart;

                let rawWidths = [];
                let totalRawWidth = 0;
                for (let i = 0; i < count; i++) {
                    let w = sizeMin + Math.random() * (sizeMax - sizeMin);
                    rawWidths.push(w);
                    totalRawWidth += w;
                }

                let scale = availableWidth / totalRawWidth;
                let currentX = xStart;

                for (let i = 0; i < count; i++) {
                    const w = rawWidths[i] * scale;
                    const h = w * (0.78 + Math.random() * 0.12);
                    const x = currentX;
                    const y = DESK_Y + yBase - h;

                    const ci = idx % colorPalette.length;
                    const [boxColor, ribbonColor] = colorPalette[ci];
                    const darkAmt = (5 - layer) * 2;
                    const finalColor = darkenColor(boxColor, darkAmt);
                    const shadowOff = Math.max(3, 8 - layer);

                    allGifts.push({
                        x,
                        y,
                        w,
                        h,
                        color: finalColor,
                        ribbon: ribbonColor,
                        layer: layer,
                        shadowOff: shadowOff
                    });

                    currentX += w;
                    idx++;
                }
            }

            allGifts.sort((a, b) => b.layer - a.layer);
            return allGifts;
        })();

        function drawGiftPyramid() {
            for (let g of giftPyramidData) {
                drawGift(g.x, g.y, g.w, g.h, g.color, g.ribbon, g.shadowOff);
            }
        }

        const balloons = [];
        const balloonColors = ['#ff6b81', '#ffd93d', '#6bcfff', '#a29bfe', '#ff9ff3', '#ff9f43', '#00d2d3', '#f368e0',
            '#ff6b81', '#ffd93d'
        ];
        const numBalloons = 12;

        for (let i = 0; i < numBalloons; i++) {
            balloons.push({
                x: 570 + Math.random() * 210,
                y: 210 + Math.random() * 160,
                color: balloonColors[i % balloonColors.length],
                phase: Math.random() * Math.PI * 2,
                speed: 0.4 + Math.random() * 0.3,
                swingSpeed: 0.015 + Math.random() * 0.015,
                radius: 14 + Math.floor(Math.random() * 8)
            });
        }

        function drawBalloons(time) {
            for (let b of balloons) {
                const baseX = b.x;
                const baseY = DESK_Y - 2;

                const grad = ctx.createRadialGradient(baseX, baseY, 1, baseX, baseY, 10);
                grad.addColorStop(0, b.color);
                grad.addColorStop(0.5, lightenColor(b.color, 50));
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(baseX, baseY, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = b.color;
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(baseX, baseY, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(baseX - 1.5, baseY - 1.5, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let b of balloons) {
                const floatOffset = Math.sin(time * b.speed + b.phase) * 5;
                const swingOffset = Math.sin(time * b.swingSpeed * 2 + b.phase) * 4;

                const currentX = b.x + swingOffset;
                const currentY = b.y + floatOffset;

                const baseX = b.x;
                const baseY = DESK_Y - 2;
                ctx.beginPath();
                ctx.moveTo(currentX, currentY + b.radius * 0.9);
                ctx.lineTo(baseX, baseY);
                ctx.strokeStyle = 'rgba(200,200,200,0.3)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 3;

                ctx.beginPath();
                ctx.ellipse(currentX, currentY, b.radius, b.radius * 1.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.ellipse(currentX - b.radius * 0.25, currentY - b.radius * 0.3, b.radius * 0.3, b.radius * 0.4, -0.2, 0,
                    Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(currentX, currentY + b.radius * 0.9);
                ctx.lineTo(currentX - 2, currentY + b.radius * 1.1);
                ctx.lineTo(currentX + 2, currentY + b.radius * 1.1);
                ctx.fillStyle = darkenColor(b.color, 30);
                ctx.fill();
            }
        }

        function drawBanner() {
            const bannerW = W - 20;
            const bannerH = 55;
            const bx = (W - bannerW) / 2;
            const by = 80;
            const curveDepth = 22;

            ctx.save();

            const gradient = ctx.createLinearGradient(bx, 0, bx, by + bannerH + curveDepth);
            gradient.addColorStop(0, '#e74c3c');
            gradient.addColorStop(0.5, '#c0392b');
            gradient.addColorStop(1, '#a93226');

            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 4;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.quadraticCurveTo(CAKE_CX, by + curveDepth, bx + bannerW, by);
            ctx.lineTo(bx + bannerW, by + bannerH + curveDepth);
            ctx.quadraticCurveTo(CAKE_CX, by + bannerH + curveDepth * 2, bx, by + bannerH + curveDepth);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.quadraticCurveTo(CAKE_CX, by + curveDepth, bx + bannerW, by);
            ctx.lineTo(bx + bannerW, by + bannerH + curveDepth);
            ctx.quadraticCurveTo(CAKE_CX, by + bannerH + curveDepth * 2, bx, by + bannerH + curveDepth);
            ctx.closePath();
            ctx.stroke();

            const triSize = 20;
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx - triSize, by + curveDepth / 2 + bannerH / 2);
            ctx.lineTo(bx, by + bannerH + curveDepth);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(bx + bannerW, by);
            ctx.lineTo(bx + bannerW + triSize, by + curveDepth / 2 + bannerH / 2);
            ctx.lineTo(bx + bannerW, by + bannerH + curveDepth);
            ctx.closePath();
            ctx.fill();

            const cakeX = CAKE_CX - 150;
            const cakeY = by + bannerH / 2 + curveDepth * 0.8;
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(cakeX - 12, cakeY, 24, 14);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cakeX, cakeY, 12, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(cakeX, cakeY - 3, 4, 0, Math.PI * 2);
            ctx.fill();

            const giftX = CAKE_CX + 150;
            const giftY = by + bannerH / 2 + curveDepth * 0.8;
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(giftX - 10, giftY - 14, 20, 16);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(giftX - 10, giftY - 14, 20, 16);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(giftX - 4, giftY - 14, 8, 16);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 40px "Arial", "Microsoft YaHei", sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 2;

            const text = '生日快乐';
            const chars = text.split('');
            const charWidth = 50;
            const startX = CAKE_CX - (chars.length - 1) * charWidth / 2;

            for (let i = 0; i < chars.length; i++) {
                const x = startX + i * charWidth;
                const normalizedX = (2 * (x - CAKE_CX)) / bannerW;
                const droop = curveDepth * (1 - normalizedX * normalizedX);

                const y = by + bannerH / 2 + droop;

                ctx.fillStyle = '#f1c40f';
                ctx.fillText(chars[i], x, y + 1);
                ctx.fillStyle = '#fff8e7';
                ctx.fillText(chars[i], x, y);
            }

            ctx.font = 'bold 14px "Arial", "Microsoft YaHei", sans-serif';
            const enText = 'HAPPY BIRTHDAY';
            ctx.fillStyle = '#f1c40f';
            const enY = by + bannerH + curveDepth + 3;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 2;
            ctx.fillText(enText, CAKE_CX, enY);

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
            for (let i = 0; i < 10; i++) {
                const angle = i / 10 * Math.PI * 2 + 0.3;
                const dist = 130 + Math.sin(i * 1.3) * 15;
                const sx = CAKE_CX + Math.cos(angle) * dist;
                const sy = by + bannerH / 2 + Math.sin(angle) * dist * 0.35;
                ctx.beginPath();
                for (let j = 0; j < 5; j++) {
                    const a = (j * 4 * Math.PI / 5) - Math.PI / 2;
                    const px = sx + 4 * Math.cos(a);
                    const py = sy + 4 * Math.sin(a);
                    if (j === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 8; i++) {
                const sx = bx + 40 + i * (bannerW / 8);
                const normalizedX = (2 * (sx - CAKE_CX)) / bannerW;
                const droop = curveDepth * (1 - normalizedX * normalizedX);
                ctx.beginPath();
                ctx.arc(sx, by + 12 + droop * 0.6, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // ============================================================
        //  ★★★ 闭眼遮罩 (径向渐变，洞内清晰透出蛋糕) ★★★
        // ============================================================
        function drawEyeCloseMask(progress) {
            const p = clamp(progress, 0, 1);
            if (p <= 0) return;

            const cx = W / 2;
            const cy = H / 2;
            const maxR = Math.max(W, H) * 0.9;

            const eased = easeInOutSine(p);
            const currentR = maxR * (1 - eased);

            ctx.save();

            // 径向渐变：中心透明 -> 边缘黑色
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
            const transparentR = Math.min(currentR * 1.25, maxR);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(Math.min(0.8, transparentR / maxR), 'rgba(0,0,0,0)');
            grad.addColorStop(Math.min(0.95, (transparentR + 40) / maxR), 'rgba(0,0,0,1)');
            grad.addColorStop(1, 'rgba(0,0,0,1)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 完全闭合时确保全黑
            if (p >= 1) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);
            }

            ctx.restore();

            // 闭眼过程中的微光星尘 (半闭眼到闭眼之间)
            if (p > 0.5 && p < 1) {
                const alpha = (p - 0.5) / 0.5 * 0.12;
                ctx.save();
                for (let i = 0; i < 18; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 80 + Math.random() * 350;
                    const sx = cx + Math.cos(angle) * dist;
                    const sy = cy + Math.sin(angle) * dist * 0.6;
                    const size = 0.5 + Math.random() * 1.5;
                    ctx.globalAlpha = (0.3 + Math.random() * 0.7) * alpha;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // ============================================================
        //  主循环
        // ============================================================
        let startTime = performance.now();

        function render(now) {
            const time = (now - startTime) / 1000;

            // ---- 更新闭眼状态 ----
            const elapsed = now - closeState.startTime;

            if (closeState.phase === 'idle') {
                if (elapsed > CLOSE_DELAY) {
                    closeState.phase = 'closing';
                    closeState.startTime = now;
                    infoEl.classList.add('active');
                }
            } else if (closeState.phase === 'closing') {
                const progress = (now - closeState.startTime) / CLOSE_DURATION;
                closeState.progress = clamp(progress, 0, 1);
                if (closeState.progress >= 1) {
                    closeState.phase = 'closed';
                    closeState.isClosed = true;
                    infoEl.textContent = '✨ 愿望已许 ✨';
                    infoEl.classList.remove('active');
                    infoEl.classList.add('closed');
                    restartBtn.classList.add('show');
                }
            } else if (closeState.phase === 'opening') {
                const progress = (now - closeState.startTime) / OPEN_DURATION;
                closeState.progress = clamp(1 - progress, 0, 1);
                if (closeState.progress <= 0) {
                    closeState.phase = 'idle';
                    closeState.isClosed = false;
                    closeState.isOpening = false;
                    closeState.progress = 0;
                    closeState.startTime = now;
                    infoEl.textContent = '✨ 许个愿吧 ✨';
                    infoEl.classList.remove('closed');
                    infoEl.classList.add('active');
                    restartBtn.classList.remove('show');
                }
            }

            // ---- 绘制场景 ----
            ctx.clearRect(0, 0, W, H);
            drawBackground();
            drawDesk();
            drawCandleGlow(time);
            drawCake();

            drawGiftPyramid();
            drawBalloons(time);
            drawBanner();

            drawCandles();

            // 火焰传递闭眼进度 (火焰逐渐熄灭)
            drawFlames(time, closeState.progress);

            // ---- 绘制闭眼遮罩 (覆盖在所有内容之上) ----
            drawEyeCloseMask(closeState.progress);

            requestAnimationFrame(render);
        }

        // ============================================================
        //  重新睁开
        // ============================================================
        function reopenEyes() {
            if (closeState.phase === 'closed' || closeState.phase === 'closing') {
                closeState.phase = 'opening';
                closeState.isOpening = true;
                closeState.startTime = performance.now();
                restartBtn.classList.remove('show');
                infoEl.textContent = '🌙 慢慢睁开...';
                infoEl.classList.remove('closed');
                infoEl.classList.add('active');
            }
        }

        restartBtn.addEventListener('click', reopenEyes);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                reopenEyes();
            }
        });

        // ============================================================
        //  自适应
        // ============================================================
        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = window.innerWidth - 40;
            const containerHeight = window.innerHeight - 40;
            const scale = Math.min(containerWidth / W, containerHeight / H, 1.2);
            canvas.style.width = (W * scale) + 'px';
            canvas.style.height = (H * scale) + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ============================================================
        //  启动
        // ============================================================
        closeState.startTime = performance.now();
        requestAnimationFrame(render);

        console.log('🎂 生日蛋糕 · 闭眼许愿效果 ✨');
        console.log('🕯️ 闭上眼睛许个愿吧 ... 按 R 键或点击按钮重新睁开');
    </script>
