<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎆 灵动之魂 · 拟真物理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000005;
            /* 极深空蓝黑 */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .ui {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div class="ui">✦ Sparkle & Flow ✦</div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let rockets = [];
        let particles = [];

        // 全局微风
        let wind = 0;
        let windTarget = 0;

        const CONFIG = {
            gravity: 0.03, // 轻微重力
            drag: 0.94,    // 强空气阻力 (关键：制造爆发后的悬停感)
            trailFade: 0.15, // 拖尾保留时间
            autoLaunchRate: 55
        };

        let timerTick = 0;
        let mouseX = W / 2, mouseY = H / 2;
        let isMouseDown = false;

        const rand = (a, b) => Math.random() * (b - a) + a;
        const randInt = (a, b) => Math.floor(rand(a, b + 1));
        const hsl = (h, s, l, a = 1) => `hsla(${h % 360}, ${s}%, ${l}%, ${a})`;

        /**
         * 粒子类 - 增加闪烁和双色渐变
         */
        class Particle {
            constructor(x, y, vx, vy, opts = {}) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;

                this.gravity = opts.gravity || CONFIG.gravity;
                this.drag = opts.drag || CONFIG.drag;

                // 颜色系统：主色 + 偏移色
                this.hue = opts.hue !== undefined ? opts.hue : rand(0, 360);
                this.hueOffset = opts.hueOffset || rand(-20, 20); // 边缘色偏
                this.sat = opts.sat || 100;
                this.lit = opts.lit || rand(50, 70);

                this.size = opts.size || rand(1.5, 3);
                this.life = opts.life || rand(60, 100);
                this.maxLife = this.life;

                this.isGold = opts.isGold || false;
                this.isWhite = opts.isWhite || false;

                this.trail = [];
                this.trailLength = opts.trailLength || 6;

                // 灵动关键：闪烁参数
                this.twinkleSpeed = rand(0.1, 0.3);
                this.twinklePhase = rand(0, Math.PI * 2);
                this.windSensitivity = rand(0.5, 1.5);
            }

            update() {
                this.life--;

                // 物理更新
                this.vx += (wind * this.windSensitivity) * 0.02;
                this.vy += this.gravity;

                this.vx *= this.drag;
                this.vy *= this.drag;

                this.x += this.vx;
                this.y += this.vy;

                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) this.trail.shift();

                return this.life > 0;
            }

            draw() {
                let progress = 1 - (this.life / this.maxLife);
                // 生命曲线：前快后慢，最后阶段快速消失
                let alpha = 1 - Math.pow(progress, 0.5);
                if (alpha <= 0) return;

                // 闪烁计算
                let twinkle = 0.8 + 0.2 * Math.sin(Date.now() * 0.005 * this.twinkleSpeed + this.twinklePhase);
                alpha *= twinkle;

                let currentHue = this.hue;
                let currentLit = this.lit;

                if (this.isGold) { currentHue = 45; currentLit = 70; }
                if (this.isWhite) { currentHue = 0; currentLit = 100; }

                // 1. 绘制拖尾 (使用主色)
                for (let i = 0; i < this.trail.length; i++) {
                    let t = i / this.trail.length;
                    let p = this.trail[i];
                    // 拖尾透明度非线性衰减
                    let trailAlpha = alpha * t * 0.4;
                    let trailSize = this.size * t * 0.8;

                    if (trailSize > 0.1) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, trailSize, 0, Math.PI * 2);
                        ctx.fillStyle = hsl(currentHue, this.sat, currentLit, trailAlpha);
                        ctx.fill();
                    }
                }

                // 2. 绘制主粒子 (径向渐变：中心白/亮 -> 边缘主色/暗)
                let glowSize = this.size * (2.5 + (1 - progress) * 1.5);
                let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);

                // 核心：高亮白光
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                // 中间层：主色
                grad.addColorStop(0.3, hsl(currentHue, this.sat, Math.min(90, currentLit + 30), alpha * 0.9));
                // 边缘层：偏移色 (增加色彩丰富度)
                grad.addColorStop(1, hsl(currentHue + this.hueOffset, this.sat, currentLit, 0));

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        /**
         * 火箭类
         */
        class Rocket {
            constructor(sx, sy, tx, ty) {
                this.x = sx; this.y = sy;
                this.tx = tx; this.ty = ty;

                this.distTotal = Math.hypot(tx - sx, ty - sy);
                this.distTraveled = 0;

                this.angle = Math.atan2(ty - sy, tx - sx);
                this.speed = 2;
                this.acc = 1.06;

                this.hue = rand(0, 360);
                this.type = randInt(0, 4);
            }

            update() {
                this.speed *= this.acc;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;

                this.x += vx;
                this.y += vy;
                this.distTraveled += this.speed;

                // 尾迹火星
                if (Math.random() < 0.6) {
                    particles.push(new Particle(
                        this.x, this.y,
                        rand(-0.5, 0.5), rand(0.5, 2),
                        { hue: 40, sat: 100, lit: 60, life: 15, size: 1, gravity: 0.02, drag: 0.9 }
                    ));
                }

                if (this.distTraveled >= this.distTotal * 0.95 || this.y < this.ty) {
                    this.explode();
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 80%)`;
                ctx.fill();
            }

            explode() {
                let x = this.x, y = this.y, hue = this.hue;

                // 核心填充 (高密度慢速粒子)
                for (let i = 0; i < 30; i++) {
                    let angle = rand(0, Math.PI * 2);
                    let speed = rand(0.5, 2.5);
                    particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, {
                        hue: hue, life: 50, size: 2, drag: 0.90, // 高阻力，快速悬停
                        hueOffset: 0
                    }));
                }

                // 1. 蓬松星云 (Fluffy Sphere)
                if (this.type === 0) {
                    for (let i = 0; i < 120; i++) {
                        let angle = rand(0, Math.PI * 2);
                        // 速度分布：多数中等，少数极快，少数极慢
                        let speed = rand(2, 9) * (Math.random() < 0.2 ? 1.5 : 1);
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, {
                            hue: hue + rand(-20, 20), life: rand(70, 100), size: rand(2, 4),
                            hueOffset: rand(10, 30) // 边缘色偏大
                        }));
                    }
                }

                // 2. 破碎光环 (Shattered Ring)
                else if (this.type === 1) {
                    let count = 100;
                    for (let i = 0; i < count; i++) {
                        let angle = (i / count) * Math.PI * 2;
                        // 随机断裂：跳过一些角度
                        if (Math.random() < 0.1) continue;

                        let radiusNoise = rand(0.8, 1.2);
                        let speed = 7 * radiusNoise;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, {
                            hue: hue, life: 90, size: 2.5, drag: 0.96,
                            hueOffset: -10
                        }));
                    }
                }

                // 3. 飘逸垂柳 (Weeping Willow)
                else if (this.type === 2) {
                    for (let i = 0; i < 100; i++) {
                        let angle = rand(-Math.PI * 0.9, Math.PI * 0.9);
                        let speed = rand(4, 9);
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 3, {
                            hue: hue, life: 150, size: 1.8,
                            gravity: 0.08, drag: 0.97, trailLength: 15,
                            windSensitivity: rand(1.2, 2.0), // 极易受风影响
                            isGold: Math.random() < 0.5
                        }));
                    }
                }

                // 4. 有机菊花 (Organic Ray)
                else if (this.type === 3) {
                    let rays = randInt(16, 28);
                    for (let r = 0; r < rays; r++) {
                        let angle = (r / rays) * Math.PI * 2;
                        let perRay = randInt(5, 10);
                        for (let j = 0; j < perRay; j++) {
                            let speed = 2 + j * 1.4 + rand(-0.3, 0.3);
                            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, {
                                hue: hue + j * 4, life: 100, size: 2.5, drag: 0.95, trailLength: 10
                            }));
                        }
                    }
                }

                // 5. 闪烁星尘 (Twinkle Dust)
                else {
                    for (let i = 0; i < 150; i++) {
                        let angle = rand(0, Math.PI * 2);
                        let speed = rand(1, 11);
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, {
                            hue: hue + rand(-40, 40), life: rand(60, 90), size: rand(1.5, 3.5),
                            isWhite: Math.random() < 0.3,
                            twinkleSpeed: rand(0.2, 0.8) // 快速闪烁
                        }));
                    }
                }
            }
        }

        /**
         * 主循环
         */
        function loop() {
            requestAnimationFrame(loop);

            // 动态风力
            wind += (windTarget - wind) * 0.005;
            if (Math.random() < 0.005) windTarget = rand(-1.5, 1.5);

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(0, 0, 5, ${CONFIG.trailFade})`;
            ctx.fillRect(0, 0, W, H);

            ctx.globalCompositeOperation = 'lighter';

            for (let i = rockets.length - 1; i >= 0; i--) {
                let alive = rockets[i].update();
                rockets[i].draw();
                if (!alive) rockets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let alive = particles[i].update();
                particles[i].draw();
                if (!alive) particles.splice(i, 1);
            }

            timerTick++;
            if (timerTick > CONFIG.autoLaunchRate) {
                let count = Math.random() < 0.15 ? 2 : 1;
                for (let k = 0; k < count; k++) {
                    let sx = rand(W * 0.1, W * 0.9);
                    let tx = rand(W * 0.1, W * 0.9);
                    let ty = rand(H * 0.1, H * 0.4);
                    rockets.push(new Rocket(sx, H, tx, ty));
                }
                timerTick = 0;
            }

            if (isMouseDown && timerTick % 4 === 0) {
                rockets.push(new Rocket(mouseX + rand(-20, 20), H, mouseX, mouseY));
            }
        }

        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('touchstart', e => {
            isMouseDown = true;
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => isMouseDown = false);

        loop();
    </script>
</body>

</html>
