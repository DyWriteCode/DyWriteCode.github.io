<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>星夜 · 花火</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000005;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000005;
            position: fixed;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #info {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.10);
            font-size: 12px;
            letter-spacing: 4px;
            pointer-events: none;
            user-select: none;
            font-weight: 300;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 30px rgba(0, 20, 80, 0.3);
            opacity: 0;
            transition: opacity 5s ease;
            z-index: 20;
        }

        #info.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            #info {
                font-size: 10px;
                bottom: 16px;
            }
        }
    </style>
</head>

<body>
    <canvas id="mainCanvas"></canvas>
    <div id="info">✦ 星夜 · 花火 ✦</div>

    <script>
        (function () {
            'use strict';

            // ============================================================
            // 1. Canvas 初始化
            // ============================================================
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);

            // ============================================================
            // 2. 工具函数
            // ============================================================
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
            const rand = (a, b) => Math.random() * (b - a) + a;
            const randInt = (a, b) => Math.floor(rand(a, b + 1));
            const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
            const smoothstep = (e0, e1, x) => {
                const t = clamp((x - e0) / (e1 - e0), 0, 1);
                return t * t * (3 - 2 * t);
            };

            // ============================================================
            // 3. 配置参数
            // ============================================================
            const CONFIG = {
                eyeDuration: 2200,
                starCount: 260,
                starFadeRange: 0.12,
                starRandomOffset: 0.04,
                autoLaunchRate: 48,
                maxParticles: 2800,
                gravity: 0.025,
                drag: 0.93,
                trailLength: 12,
            };

            // ============================================================
            // 4. 星空系统（来自 index1.html）
            // ============================================================
            const STAR_COLORS = [
                { r: 255, g: 255, b: 255 },
                { r: 255, g: 245, b: 235 },
                { r: 235, g: 240, b: 255 },
                { r: 255, g: 230, b: 210 },
                { r: 210, g: 220, b: 255 },
                { r: 255, g: 210, b: 180 },
            ];

            let stars = [];

            function generateStars(w, h) {
                stars = [];
                const count = CONFIG.starCount + Math.floor(Math.random() * 40);
                for (let i = 0; i < count; i++) {
                    const magnitude = Math.random();
                    const brightness = clamp(Math.pow(magnitude, 2.2), 0.05, 1.0);
                    const size = 0.3 + brightness * 2.5;
                    const isBright = brightness > 0.7 && Math.random() < 0.25;
                    const colorIdx = Math.floor(Math.random() * STAR_COLORS.length);
                    const color = STAR_COLORS[colorIdx];
                    const speed = 0.15 + Math.random() * 0.7;
                    const phase = Math.random() * Math.PI * 2;
                    const flickerAmt = 0.12 + brightness * 0.35;
                    const x = rand(10, w - 10);
                    const y = rand(10, h * 0.78);
                    const randomDelay = rand(-CONFIG.starRandomOffset, CONFIG.starRandomOffset);
                    stars.push({
                        x,
                        y,
                        size,
                        brightness,
                        baseAlpha: 0.5 + brightness * 0.5,
                        alpha: 0,
                        speed,
                        phase,
                        flickerAmt,
                        color,
                        isBright,
                        randomDelay,
                    });
                }
                stars.sort((a, b) => a.brightness - b.brightness);
            }

            function updateStars(time) {
                for (const star of stars) {
                    const flicker = Math.sin(time * star.speed + star.phase);
                    const af = 0.5 + 0.5 * flicker;
                    const mod = 1 + star.flickerAmt * (af - 0.5) * 2;
                    star.alpha = star.baseAlpha * mod;
                    star.alpha = clamp(star.alpha, 0.04, 1);
                }
            }

            function drawStars(eyeProgress, time) {
                const { starFadeRange, starRandomOffset } = CONFIG;
                const starAppearStart = 0.0;
                const starAppearEnd = 0.92;

                updateStars(time);

                for (const star of stars) {
                    const yNorm = star.y / (H * 0.78);
                    const baseThreshold = starAppearStart + (starAppearEnd - starAppearStart) * yNorm;
                    const threshold = baseThreshold + star.randomDelay;
                    const fadeEnd = threshold + starFadeRange;
                    let visibility = smoothstep(threshold, fadeEnd, eyeProgress);

                    const heightFactor = 1 - yNorm;
                    const atmosphere = 0.45 + 0.55 * heightFactor;
                    const sizeFactor = 0.55 + 0.45 * heightFactor;

                    const finalAlpha = star.alpha * visibility * atmosphere;
                    if (finalAlpha < 0.001) continue;
                    const finalSize = star.size * sizeFactor;

                    const { x, y, color, isBright } = star;
                    const { r, g, b } = color;

                    if (finalSize > 0.6 && finalAlpha > 0.015) {
                        const glowR = finalSize * (2.2 + star.brightness * 1.5);
                        const grad = ctx.createRadialGradient(x, y, 0, x, y, glowR);
                        grad.addColorStop(0, `rgba(${r},${g},${b},${finalAlpha * 0.25})`);
                        grad.addColorStop(0.5, `rgba(${r},${g},${b},${finalAlpha * 0.07})`);
                        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(x, y, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalAlpha = finalAlpha;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.beginPath();
                    ctx.arc(x, y, finalSize * 0.8, 0, Math.PI * 2);
                    ctx.fill();

                    if (isBright && finalAlpha > 0.2 && finalSize > 0.8) {
                        const len = 8 + finalSize * 3;
                        ctx.globalAlpha = finalAlpha * 0.2;
                        ctx.strokeStyle = `rgba(${r},${g},${b},${finalAlpha * 0.2})`;
                        ctx.lineWidth = 0.5;
                        for (let ang = 0; ang < Math.PI * 2; ang += Math.PI / 4) {
                            const cosA = Math.cos(ang),
                                sinA = Math.sin(ang);
                            ctx.beginPath();
                            ctx.moveTo(x + cosA * 1.2, y + sinA * 1.2);
                            ctx.lineTo(x + cosA * len, y + sinA * len);
                            ctx.stroke();
                        }
                    }
                    ctx.globalAlpha = 1;
                }
            }

            // ============================================================
            // 5. 烟花系统
            // ============================================================
            let rockets = [];
            let particles = [];
            let wind = 0;
            let windTarget = 0;
            let timerTick = 0;
            let isMouseDown = false;
            let mouseX = 0,
                mouseY = 0;

            class Particle {
                constructor(x, y, vx, vy, opts = {}) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.gravity = opts.gravity !== undefined ? opts.gravity : CONFIG.gravity;
                    this.drag = opts.drag !== undefined ? opts.drag : CONFIG.drag;
                    this.hue = opts.hue !== undefined ? opts.hue : rand(0, 360);
                    this.hueOffset = opts.hueOffset || rand(-18, 18);
                    this.sat = opts.sat || 100;
                    this.lit = opts.lit || rand(50, 72);
                    this.size = opts.size || rand(1.8, 3.2);
                    this.life = opts.life || rand(60, 100);
                    this.maxLife = this.life;
                    this.isGold = opts.isGold || false;
                    this.isWhite = opts.isWhite || false;
                    this.trail = [];
                    this.trailLength = opts.trailLength || CONFIG.trailLength;
                    this.twinkleSpeed = rand(0.08, 0.28);
                    this.twinklePhase = rand(0, Math.PI * 2);
                    this.windSensitivity = rand(0.4, 1.6);
                    this.alive = true;
                }

                update() {
                    this.life--;
                    if (this.life <= 0) { this.alive = false; return false; }

                    this.vx += (wind * this.windSensitivity) * 0.018;
                    this.vy += this.gravity;
                    this.vx *= this.drag;
                    this.vy *= this.drag;
                    this.x += this.vx;
                    this.y += this.vy;

                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.trailLength) this.trail.shift();

                    return this.alive;
                }

                draw() {
                    if (!this.alive) return;
                    const progress = 1 - (this.life / this.maxLife);
                    let alpha = 1 - Math.pow(progress, 0.45);
                    if (alpha <= 0.001) return;

                    const twinkle = 0.75 + 0.25 * Math.sin(performance.now() * 0.004 * this.twinkleSpeed + this
                        .twinklePhase);
                    alpha *= twinkle;

                    let currentHue = this.hue;
                    let currentLit = this.lit;
                    if (this.isGold) {
                        currentHue = 45;
                        currentLit = 72;
                    }
                    if (this.isWhite) {
                        currentHue = 0;
                        currentLit = 100;
                    }

                    const hsl = (h, s, l, a) => `hsla(${h % 360}, ${s}%, ${l}%, ${a})`;

                    for (let i = 0; i < this.trail.length; i++) {
                        const t = i / this.trail.length;
                        const p = this.trail[i];
                        const trailAlpha = alpha * t * 0.45;
                        const trailSize = this.size * t * 0.75;
                        if (trailSize > 0.1) {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, trailSize, 0, Math.PI * 2);
                            ctx.fillStyle = hsl(currentHue, this.sat, currentLit + 10, trailAlpha);
                            ctx.fill();
                        }
                    }

                    const glowSize = this.size * (2.2 + (1 - progress) * 1.8);
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.85})`);
                    grad.addColorStop(0.25, hsl(currentHue, this.sat, Math.min(92, currentLit + 32), alpha * 0.9));
                    grad.addColorStop(0.6, hsl(currentHue + this.hueOffset, this.sat, currentLit + 10, alpha * 0.5));
                    grad.addColorStop(1, hsl(currentHue + this.hueOffset * 1.5, this.sat, currentLit - 10, 0));

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class Rocket {
                constructor(sx, sy, tx, ty) {
                    this.x = sx;
                    this.y = sy;
                    this.tx = tx;
                    this.ty = ty;
                    this.distTotal = Math.hypot(tx - sx, ty - sy);
                    this.distTraveled = 0;
                    this.angle = Math.atan2(ty - sy, tx - sx);
                    this.speed = rand(1.8, 2.8);
                    this.acc = 1.04;
                    this.hue = rand(0, 360);
                    this.type = randInt(0, 5);
                    this.alive = true;
                    this.trailCounter = 0;
                }

                update() {
                    this.speed *= this.acc;
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed;
                    this.x += vx;
                    this.y += vy;
                    this.distTraveled += this.speed;

                    this.trailCounter++;
                    if (this.trailCounter % 2 === 0 && Math.random() < 0.7) {
                        const p = new Particle(
                            this.x + rand(-2, 2),
                            this.y + rand(-2, 2),
                            rand(-0.6, 0.6),
                            rand(0.3, 1.8), {
                            hue: 35,
                            sat: 100,
                            lit: 60,
                            life: rand(12, 22),
                            size: rand(0.8, 1.6),
                            gravity: 0.02,
                            drag: 0.88,
                            trailLength: 3,
                        }
                        );
                        if (particles.length < CONFIG.maxParticles) particles.push(p);
                    }

                    if (this.distTraveled >= this.distTotal * 0.92 || this.y < this.ty + 10) {
                        this.explode();
                        this.alive = false;
                        return false;
                    }
                    return true;
                }

                draw() {
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 85%)`;
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }

                explode() {
                    const x = this.x,
                        y = this.y,
                        hue = this.hue;
                    const type = this.type;

                    for (let i = 0; i < 25; i++) {
                        const angle = rand(0, Math.PI * 2);
                        const speed = rand(0.3, 2.0);
                        const p = new Particle(x, y,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed, {
                            hue: hue + rand(-10, 10),
                            life: rand(40, 65),
                            size: rand(1.5, 2.8),
                            drag: 0.88,
                            hueOffset: 0,
                            trailLength: 5,
                        }
                        );
                        if (particles.length < CONFIG.maxParticles) particles.push(p);
                    }

                    if (type === 0) {
                        for (let i = 0; i < 110; i++) {
                            const angle = rand(0, Math.PI * 2);
                            const speed = rand(2, 8.5) * (Math.random() < 0.15 ? 1.6 : 1);
                            const p = new Particle(x, y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed, {
                                hue: hue + rand(-22, 22),
                                life: rand(70, 110),
                                size: rand(1.8, 4),
                                hueOffset: rand(12, 30),
                                trailLength: rand(8, 14),
                            }
                            );
                            if (particles.length < CONFIG.maxParticles) particles.push(p);
                        }
                    } else if (type === 1) {
                        const count = 90;
                        for (let i = 0; i < count; i++) {
                            const angle = (i / count) * Math.PI * 2;
                            if (Math.random() < 0.12) continue;
                            const radiusNoise = rand(0.75, 1.25);
                            const speed = 6.5 * radiusNoise;
                            const p = new Particle(x, y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed, {
                                hue: hue + rand(-8, 8),
                                life: rand(75, 110),
                                size: rand(2, 3.5),
                                drag: 0.95,
                                hueOffset: -8,
                                trailLength: rand(7, 12),
                            }
                            );
                            if (particles.length < CONFIG.maxParticles) particles.push(p);
                        }
                    } else if (type === 2) {
                        for (let i = 0; i < 90; i++) {
                            const angle = rand(-Math.PI * 0.85, Math.PI * 0.85);
                            const speed = rand(3.5, 8.5);
                            const p = new Particle(x, y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed - 2.5, {
                                hue: hue + rand(-12, 12),
                                life: rand(100, 160),
                                size: rand(1.5, 2.8),
                                gravity: 0.07,
                                drag: 0.96,
                                trailLength: rand(12, 18),
                                windSensitivity: rand(1.2, 2.2),
                                isGold: Math.random() < 0.4,
                            }
                            );
                            if (particles.length < CONFIG.maxParticles) particles.push(p);
                        }
                    } else if (type === 3) {
                        const rays = randInt(18, 30);
                        for (let r = 0; r < rays; r++) {
                            const angle = (r / rays) * Math.PI * 2;
                            const perRay = randInt(5, 12);
                            for (let j = 0; j < perRay; j++) {
                                const speed = 1.8 + j * 1.3 + rand(-0.3, 0.3);
                                const p = new Particle(x, y,
                                    Math.cos(angle) * speed,
                                    Math.sin(angle) * speed, {
                                    hue: hue + j * 5 + rand(-5, 5),
                                    life: rand(80, 120),
                                    size: rand(2, 3.8),
                                    drag: 0.94,
                                    trailLength: rand(8, 14),
                                    hueOffset: rand(4, 16),
                                }
                                );
                                if (particles.length < CONFIG.maxParticles) particles.push(p);
                            }
                        }
                    } else if (type === 4) {
                        for (let i = 0; i < 140; i++) {
                            const angle = rand(0, Math.PI * 2);
                            const speed = rand(1, 10);
                            const p = new Particle(x, y,
                                Math.cos(angle) * speed,
                                Math.sin(angle) * speed, {
                                hue: hue + rand(-40, 40),
                                life: rand(55, 90),
                                size: rand(1.2, 3.2),
                                isWhite: Math.random() < 0.25,
                                twinkleSpeed: rand(0.15, 0.6),
                                trailLength: rand(5, 10),
                                hueOffset: rand(10, 30),
                            }
                            );
                            if (particles.length < CONFIG.maxParticles) particles.push(p);
                        }
                    } else {
                        for (let i = 0; i < 120; i++) {
                            const t = rand(0, Math.PI * 2);
                            const rBase = rand(3, 8);
                            const xOff = rBase * 1.2 * Math.sin(t);
                            const yOff = -rBase * 0.9 * Math.cos(t) - rBase * 0.4 * Math.sin(t) * Math.sin(t) + rBase * 0.5;
                            const speed = rand(1.5, 4.5);
                            const angle2 = Math.atan2(yOff, xOff) + rand(-0.3, 0.3);
                            const sp = speed * (0.6 + Math.random() * 0.5);
                            const p = new Particle(x, y,
                                Math.cos(angle2) * sp,
                                Math.sin(angle2) * sp - 0.5, {
                                hue: hue + rand(-20, 20),
                                life: rand(70, 110),
                                size: rand(2, 3.5),
                                drag: 0.93,
                                trailLength: rand(8, 14),
                                gravity: 0.03,
                            }
                            );
                            if (particles.length < CONFIG.maxParticles) particles.push(p);
                        }
                    }
                }
            }

            function launchFirework(targetX, targetY) {
                const sx = rand(W * 0.08, W * 0.92);
                const tx = targetX !== undefined ? targetX : rand(W * 0.08, W * 0.92);
                const ty = targetY !== undefined ? targetY : rand(H * 0.08, H * 0.42);
                const rocket = new Rocket(sx, H + rand(5, 20), tx, ty);
                rockets.push(rocket);
            }

            function updateFireworks() {
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const alive = rockets[i].update();
                    if (!alive) rockets.splice(i, 1);
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const alive = particles[i].update();
                    if (!alive) particles.splice(i, 1);
                }

                timerTick++;
                if (timerTick > CONFIG.autoLaunchRate) {
                    const count = Math.random() < 0.12 ? 2 : 1;
                    for (let k = 0; k < count; k++) {
                        launchFirework();
                    }
                    timerTick = 0;
                }

                if (isMouseDown && timerTick % 5 === 0) {
                    const tx = mouseX + rand(-30, 30);
                    const ty = mouseY + rand(-20, 20);
                    launchFirework(tx, ty);
                }

                wind += (windTarget - wind) * 0.004;
                if (Math.random() < 0.004) windTarget = rand(-1.8, 1.8);
            }

            function drawFireworks() {
                ctx.globalCompositeOperation = 'lighter';
                for (const rocket of rockets) {
                    rocket.draw();
                }
                for (const p of particles) {
                    p.draw();
                }
                ctx.globalCompositeOperation = 'source-over';
            }

            // ============================================================
            // 6. 场景绘制（星空 + 烟花）
            // ============================================================
            function drawScene(eyeProgress, time) {
                // 1. 星空背景
                drawStars(eyeProgress, time);
                // 2. 烟花上层
                drawFireworks();
            }

            // ============================================================
            // 7. 睁眼遮罩（完全复刻 index1.html 逻辑）
            // ============================================================
            function drawEyeOpenMask(eyeProgress, time) {
                const p = clamp(eyeProgress, 0, 1);
                if (p >= 1) return;

                // 1. 全黑覆盖
                ctx.fillStyle = '#000005';
                ctx.fillRect(0, 0, W, H);

                // 2. 椭圆裁剪
                const cx = W / 2;
                const cy = H * 0.68;
                const maxR = Math.max(W, H) * 0.75;
                const ratio = 0.72;
                const rx = p * maxR;
                const ry = p * maxR * ratio;

                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                ctx.clip();

                // 3. 在椭圆内部绘制场景
                drawScene(p, time);

                // 4. 椭圆边缘柔和光晕
                if (p > 0.05 && p < 0.95) {
                    const glowAlpha = 0.035 * (1 - Math.abs(p - 0.5) * 2);
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
                    grad.addColorStop(0, `rgba(255, 240, 220, 0)`);
                    grad.addColorStop(0.7, `rgba(255, 240, 220, 0)`);
                    grad.addColorStop(0.88, `rgba(180, 200, 255, ${glowAlpha * 0.6})`);
                    grad.addColorStop(1, `rgba(180, 200, 255, 0)`);
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, Math.max(W, H) * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }

                ctx.restore();

                // 5. 外部暗角
                const vignette = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, `rgba(0,0,0,${0.08 + (1 - p) * 0.12})`);
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, W, H);
            }

            // ============================================================
            // 8. 主渲染循环
            // ============================================================
            let startTime = 0;
            let animId = null;
            let eyeStartTime = 0;
            let eyeFinished = false;

            function render(timestamp) {
                if (!startTime) {
                    startTime = timestamp;
                    eyeStartTime = timestamp;
                    // 预发射烟花
                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => launchFirework(), i * 100 + 50);
                    }
                }

                const elapsed = timestamp - eyeStartTime;
                const eyeRaw = clamp(elapsed / CONFIG.eyeDuration, 0, 1);
                const eyeProgress = easeOutCubic(eyeRaw);

                if (eyeProgress >= 1 && !eyeFinished) {
                    eyeFinished = true;
                    document.getElementById('info').classList.add('show');
                }

                // 清空
                ctx.fillStyle = '#000005';
                ctx.fillRect(0, 0, W, H);

                // 更新烟花（始终运行）
                updateFireworks();

                const time = timestamp / 100;

                if (eyeProgress < 1) {
                    drawEyeOpenMask(eyeProgress, time);
                } else {
                    // 完全睁开：直接绘制完整场景
                    drawScene(eyeProgress, time);
                    // 暗角
                    const vignette = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
                    vignette.addColorStop(0, 'rgba(0,0,0,0)');
                    vignette.addColorStop(1, 'rgba(0,0,0,0.12)');
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = vignette;
                    ctx.fillRect(0, 0, W, H);
                }

                animId = requestAnimationFrame(render);
            }

            // ============================================================
            // 9. 交互事件
            // ============================================================
            function handlePointerDown(x, y) {
                isMouseDown = true;
                mouseX = x;
                mouseY = y;
                launchFirework(x + rand(-20, 20), y + rand(-20, 20));
            }

            function handlePointerUp() {
                isMouseDown = false;
            }

            function handlePointerMove(x, y) {
                mouseX = x;
                mouseY = y;
            }

            canvas.addEventListener('mousedown', e => {
                handlePointerDown(e.clientX, e.clientY);
            });
            canvas.addEventListener('mousemove', e => {
                handlePointerMove(e.clientX, e.clientY);
            });
            canvas.addEventListener('mouseup', handlePointerUp);
            canvas.addEventListener('mouseleave', handlePointerUp);

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.touches[0];
                handlePointerDown(t.clientX, t.clientY);
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0];
                handlePointerMove(t.clientX, t.clientY);
            }, { passive: false });
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                handlePointerUp();
            }, { passive: false });

            // ============================================================
            // 10. 启动
            // ============================================================
            function init() {
                resize();
                generateStars(W, H);
                for (const star of stars) {
                    star.randomDelay = rand(-CONFIG.starRandomOffset, CONFIG.starRandomOffset);
                }
                rockets = [];
                particles = [];
                wind = 0;
                windTarget = 0;
                timerTick = 0;
                startTime = 0;
                eyeStartTime = 0;
                eyeFinished = false;
                document.getElementById('info').classList.remove('show');

                if (animId) cancelAnimationFrame(animId);
                animId = requestAnimationFrame(render);
            }

            window.addEventListener('resize', () => {
                resize();
                generateStars(W, H);
            });

            if (document.readyState === 'complete') init();
            else window.addEventListener('load', init);

            console.log('✦ 星夜 · 花火 ✦ 城市逻辑已移除，仅星空+烟花');
        })();
    </script>
</body>
