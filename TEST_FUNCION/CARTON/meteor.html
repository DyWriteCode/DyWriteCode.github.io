<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>暖橙流星 · 拖尾渐变</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .info {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            letter-spacing: 3px;
            pointer-events: none;
            user-select: none;
            font-weight: 300;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 0 20px rgba(200, 100, 20, 0.15);
        }

        @media (max-width: 600px) {
            .info {
                font-size: 10px;
                bottom: 16px;
            }
        }
    </style>
</head>

<body>
    <canvas id="skyCanvas"></canvas>
    <div class="info"><span>✦</span><span> 暖 橙 流 星 </span><span>✦</span></div>
    <script>
        (function () {
            const canvas = document.getElementById('skyCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);

            function rand(min, max) { return Math.random() * (max - min) + min; }

            function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

            // ----- 头部颜色：暖橙（红+黄） -----
            // 红色分量高，绿色中等偏上，蓝色低 → 呈现橙黄/橘红
            function getHeadColor() {
                return {
                    r: rand(235, 255),      // 红
                    g: rand(120, 190),      // 绿显著提高（黄=红+绿）
                    b: rand(15, 60)         // 蓝降低
                };
            }

            // 流星参数（方向一致，体积大，拖尾长）
            const MAX_METEORS = 8;
            const ANGLE_MIN = 0.55;
            const ANGLE_MAX = 0.85;
            const SPEED_MIN = 9.0;
            const SPEED_MAX = 16.0;
            const TAIL_MIN = 180;
            const TAIL_MAX = 350;
            const LIFE_MIN = 50;
            const LIFE_MAX = 90;

            let meteors = [];
            let nextSpawnTime = 0;
            const SPAWN_INTERVAL_MIN = 400;
            const SPAWN_INTERVAL_MAX = 1200;

            function spawnMeteor() {
                if (meteors.length >= MAX_METEORS) return;
                const angle = rand(ANGLE_MIN, ANGLE_MAX);
                const speed = rand(SPEED_MIN, SPEED_MAX);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                let x, y;
                const side = rand(0, 1);
                if (side < 0.55) {
                    x = rand(-W * 0.1, W * 1.1);
                    y = rand(-80, H * 0.25);
                } else if (side < 0.8) {
                    x = rand(-120, W * 0.15);
                    y = rand(H * 0.05, H * 0.6);
                } else {
                    x = rand(W * 0.85, W + 120);
                    y = rand(H * 0.05, H * 0.5);
                }
                if (x < -50) x = rand(-30, 60);
                if (x > W + 50) x = rand(W - 60, W + 30);
                if (y < -50) y = rand(-20, 40);

                meteors.push({
                    x,
                    y,
                    vx,
                    vy,
                    tailLength: rand(TAIL_MIN, TAIL_MAX),
                    life: randInt(LIFE_MIN, LIFE_MAX),
                    maxLife: LIFE_MAX,
                    brightness: rand(0.85, 1.0),
                    headColor: getHeadColor(),
                    trailSegments: 50,
                });
            }

            function updateMeteors() {
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.vx;
                    m.y += m.vy;
                    m.life--;
                    const margin = 150;
                    if (m.life <= 0 ||
                        m.x < -margin || m.x > W + margin ||
                        m.y < -margin || m.y > H + margin) {
                        meteors.splice(i, 1);
                        continue;
                    }
                    if (m.life < m.maxLife * 0.25) {
                        const fade = m.life / (m.maxLife * 0.25);
                        m.brightness = fade * m.brightness;
                        m.brightness = Math.max(0.05, m.brightness);
                    }
                }
            }

            function lerpColor(c1, c2, t) {
                return {
                    r: c1.r + (c2.r - c1.r) * t,
                    g: c1.g + (c2.g - c1.g) * t,
                    b: c1.b + (c2.b - c1.b) * t
                };
            }

            function drawMeteor(m) {
                const { x, y, vx, vy, tailLength, life, maxLife, brightness, headColor, trailSegments } = m;
                const len = Math.sqrt(vx * vx + vy * vy);
                if (len < 0.001) return;
                const dx = vx / len;
                const dy = vy / len;

                const lifeRatio = life / maxLife;
                const currentTail = tailLength * (0.35 + 0.65 * lifeRatio);
                const segs = trailSegments;
                const baseWidth = rand(2.8, 4.6);

                const tailColor = { r: 255, g: 255, b: 255 };

                // 尾巴分段绘制
                for (let i = 0; i < segs; i++) {
                    const t = i / segs;
                    const color = lerpColor(headColor, tailColor, t);
                    const alphaFactor = Math.pow(1 - t, 1.6);
                    const alpha = alphaFactor * brightness * 0.9;
                    const width = baseWidth * (1 - t * 0.94);
                    const px = x - dx * t * currentTail;
                    const py = y - dy * t * currentTail;
                    const jitter = (1 - t) * 1.2;
                    const jx = (Math.random() - 0.5) * jitter;
                    const jy = (Math.random() - 0.5) * jitter;

                    ctx.beginPath();
                    ctx.arc(px + jx, py + jy, Math.max(0.3, width), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${color.r | 0}, ${color.g | 0}, ${color.b | 0}, ${alpha})`;
                    ctx.fill();

                    if (i < 4) {
                        ctx.shadowColor = `rgba(${color.r | 0}, ${color.g | 0}, ${color.b | 0}, ${alpha * 0.25})`;
                        ctx.shadowBlur = 18;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }

                // ----- 头部光晕（暖橙） -----
                const headRadius = baseWidth * 2.6 + 2.0;
                const grad = ctx.createRadialGradient(
                    x, y, 0,
                    x, y, headRadius * 2.8
                );
                const bright = Math.min(1, brightness * 1.15);
                // 增强头部亮度，但保持橙黄基调
                const hr = Math.min(255, headColor.r + 40);
                const hg = Math.min(255, headColor.g + 40);
                const hb = Math.min(255, headColor.b + 20);
                grad.addColorStop(0, `rgba(${hr}, ${hg}, ${hb}, ${bright})`);
                grad.addColorStop(0.2, `rgba(${headColor.r}, ${headColor.g}, ${headColor.b}, ${bright * 0.8})`);
                grad.addColorStop(0.5, `rgba(${headColor.r * 0.6}, ${headColor.g * 0.5}, ${headColor.b * 0.3}, ${bright * 0.3})`);
                grad.addColorStop(1, `rgba(${headColor.r * 0.2}, ${headColor.g * 0.15}, ${headColor.b * 0.1}, 0)`);

                ctx.shadowColor = `rgba(${headColor.r}, ${headColor.g}, ${headColor.b}, ${bright * 0.5})`;
                ctx.shadowBlur = 45;
                ctx.beginPath();
                ctx.arc(x, y, headRadius * 2.8, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;

                // 核心亮点（暖白）
                ctx.beginPath();
                ctx.arc(x, y, headRadius * 0.55, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 220, ${bright * 0.95})`;
                ctx.shadowColor = `rgba(255, 200, 150, ${bright * 0.3})`;
                ctx.shadowBlur = 30;
                ctx.fill();
                ctx.shadowBlur = 0;

                // 尾巴小点
                if (brightness > 0.4 && lifeRatio > 0.25) {
                    const count = randInt(3, 7);
                    for (let i = 0; i < count; i++) {
                        const t = rand(0.08, 0.75);
                        const color = lerpColor(headColor, tailColor, t);
                        const a = (1 - t) * brightness * 0.35 * rand(0.3, 0.9);
                        const px = x - dx * t * currentTail;
                        const py = y - dy * t * currentTail;
                        const sz = rand(0.5, 1.6) * (1 - t * 0.5);
                        ctx.beginPath();
                        ctx.arc(px + rand(-1.5, 1.5), py + rand(-1.5, 1.5), sz, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${color.r | 0}, ${color.g | 0}, ${color.b | 0}, ${a})`;
                        ctx.fill();
                    }
                }
            }

            function drawMeteors() {
                for (const m of meteors) {
                    drawMeteor(m);
                }
            }

            let lastSpawnTime = 0;

            function scheduleMeteorSpawn(timestamp) {
                if (meteors.length < MAX_METEORS) {
                    if (timestamp - lastSpawnTime > nextSpawnTime) {
                        const count = randInt(1, 2);
                        for (let i = 0; i < count; i++) {
                            if (meteors.length < MAX_METEORS) spawnMeteor();
                        }
                        lastSpawnTime = timestamp;
                        nextSpawnTime = rand(SPAWN_INTERVAL_MIN, SPAWN_INTERVAL_MAX);
                    }
                } else {
                    if (timestamp - lastSpawnTime > 3000) {
                        lastSpawnTime = timestamp;
                        nextSpawnTime = rand(500, 1500);
                    }
                }
            }

            function animate(timestamp) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                updateMeteors();
                drawMeteors();
                scheduleMeteorSpawn(timestamp);

                requestAnimationFrame(animate);
            }

            function init() {
                resize();
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => { spawnMeteor(); }, i * 300 + 150);
                }
                lastSpawnTime = performance.now();
                nextSpawnTime = rand(600, 1500);
                requestAnimationFrame(animate);
            }

            window.addEventListener('load', init);
            window.addEventListener('resize', resize);

            function spawnInteractive(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                let cx, cy;
                if (e.touches) {
                    cx = (e.touches[0].clientX - rect.left) * (W / rect.width);
                    cy = (e.touches[0].clientY - rect.top) * (H / rect.height);
                } else {
                    cx = (e.clientX - rect.left) * (W / rect.width);
                    cy = (e.clientY - rect.top) * (H / rect.height);
                }
                if (meteors.length < MAX_METEORS + 3) {
                    const angle = rand(ANGLE_MIN, ANGLE_MAX);
                    const speed = rand(SPEED_MIN, SPEED_MAX);
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    meteors.push({
                        x: cx + rand(-30, 30),
                        y: cy - rand(30, 100),
                        vx,
                        vy,
                        tailLength: rand(TAIL_MIN, TAIL_MAX),
                        life: randInt(LIFE_MIN, LIFE_MAX),
                        maxLife: LIFE_MAX,
                        brightness: rand(0.85, 1.0),
                        headColor: getHeadColor(),
                        trailSegments: 50,
                    });
                }
            }
            canvas.addEventListener('click', spawnInteractive);
            canvas.addEventListener('touchstart', spawnInteractive, { passive: false });

            console.log('🔥 暖橙流星 · 头部红+黄 · 尾部白色 · 方向一致');
        })();
    </script>
</body>

</html>
