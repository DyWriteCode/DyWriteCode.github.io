    <script>
        // =====================================================================
        // 1. 配置 Marked + Highlight
        // =====================================================================
        const hljs = window.hljs;
        const renderer = new marked.Renderer();
        renderer.code = function (code, language) {
            const lang = language || '';
            let highlighted = '';
            if (hljs && lang && hljs.getLanguage(lang)) {
                try { highlighted = hljs.highlight(code, { language: lang }).value; } catch (_) { }
            }
            if (!highlighted) {
                highlighted = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            return `<pre data-lang="${lang}" data-code="${encodeURIComponent(code)}"><button class="run-btn" onclick="runCode(this, \`${encodeURIComponent(code)}\`)">▶ 运行</button><code class="language-${lang} hljs">${highlighted}</code></pre>`;
        };
        renderer.table = function (header, body) { return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`; };

        // =====================================================================
        // 5. 渲染函数
        // =====================================================================
        function renderMarkdown(text) {
            fullMarkdown = text;
            if (!text.trim()) {
                preview.innerHTML = `<div class='empty-hint'>✨ 开始书写 Markdown …<br>支持数学 $E=mc^2$ 和代码块 \`\`\`js<br>单击任意内容开始编辑</div>`;
                updateStatus();
                allBlocks = [];
                return;
            }
            let html = '';
            try { html = marked.parse(text, markedOptions); } catch (e) {
                preview.innerHTML = `<p style="color:#ef4444;">⚠️ 渲染错误: ${e.message}</p>`;
                updateStatus();
                return;
            }
            const temp = document.createElement('div');
            temp.innerHTML = html;
            processMath(temp);
            preview.innerHTML = temp.innerHTML;
            attachClickListeners();
            updateStatus();
            allBlocks = Array.from(preview.querySelectorAll('p, h1, h2, h3, h4, h5, h6, blockquote, pre, ul, ol, table'));
            // 为每个 pre 添加语言选择器
            preview.querySelectorAll('pre').forEach(pre => {
                const lang = pre.dataset.lang || '';
                const selector = document.createElement('div');
                selector.className = 'code-lang-selector';
                selector.innerHTML = `<select onchange="changeCodeLang(this, event)"><option value="">自动</option>${getLangOptions(lang)}</select>`;
                pre.style.position = 'relative';
                pre.prepend(selector);
            });
        }

        function getLangOptions(selected) {
            const langs = Object.keys(LANGUAGE_IDS);
            return langs.map(l => `<option value="${l}" ${l === selected ? 'selected' : ''}>${l}</option>`).join('');
        }

        function changeCodeLang(select, e) {
            e.stopPropagation();
            const pre = select.closest('pre');
            if (!pre) return;
            const lang = select.value;
            const code = pre.querySelector('code');
            if (code) {
                pre.dataset.lang = lang;
                code.className = `language-${lang} hljs`;
                const text = code.textContent;
                if (hljs && lang && hljs.getLanguage(lang)) {
                    try { code.innerHTML = hljs.highlight(text, { language: lang }).value; } catch (_) { }
                }
            }
        }

        function processMath(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                let text = node.textContent;
                let newHtml = text.replace(/\$\$(.*?)\$\$/gs, (m, c) => {
                    try { return katex.renderToString(c.trim(), { displayMode: true, throwOnError: false, trust: true }); }
                    catch (_) { return m; }
                });
                newHtml = newHtml.replace(/\$(.*?)\$/gs, (m, c) => {
                    if (m.startsWith('$$')) return m;
                    try { return katex.renderToString(c.trim(), { displayMode: false, throwOnError: false, trust: true }); }
                    catch (_) { return m; }
                });
                if (newHtml !== text) {
                    const span = document.createElement('span');
                    span.innerHTML = newHtml;
                    node.parentNode.replaceChild(span, node);
                    processMath(span);
                }
                return;
            }
            if (node.nodeType === Node.ELEMENT_NODE) {
                if (node.tagName === 'CODE' || node.tagName === 'PRE' || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
                const children = Array.from(node.childNodes);
                for (const child of children) processMath(child);
            }
        }

        function handleClick(e) {
            e.stopPropagation();

            if (editingElement) {
                if (editingBlockElement !== target) saveEdit();

        // =====================================================================

        function startEdit(element) {
            if (editingElement) return;
            let textContent = element.textContent;
            let isCodeBlock = false;
            let codeLang = '';
            if (element.tagName === 'PRE') {
                const codeEl = element.querySelector('code');
                if (codeEl) textContent = codeEl.textContent;

            textarea.value = textContent;

            textarea.style.width = '100%';
            textarea.style.minHeight = Math.max(40, element.offsetHeight) + 'px';
            textarea.style.fontFamily = style.fontFamily || 'inherit';
            textarea.style.fontSize = style.fontSize || 'inherit';
            textarea.style.lineHeight = style.lineHeight || 'inherit';
            textarea.style.padding = style.padding || '8px 12px';
            textarea.style.border = '2px solid #3b82f6';
            textarea.style.borderRadius = '6px';
            textarea.style.background = '#fafcff';
            textarea.style.outline = 'none';
            textarea.style.resize = 'vertical';
            textarea.style.color = style.color || '#0b1a2f';
            textarea.spellcheck = true;

            let wrapper = document.createElement('div');
            wrapper.style.position = 'relative';
            if (isCodeBlock) {
                const selector = document.createElement('div');
                selector.className = 'code-lang-selector active';
                selector.style.position = 'absolute';
                selector.style.top = '-30px';
                selector.style.left = '0';
                selector.style.background = '#fff';
                selector.style.border = '1px solid var(--border)';
                selector.style.borderRadius = '4px 4px 0 0';
                selector.style.padding = '2px 8px';
                selector.style.zIndex = '5';
                selector.innerHTML = `<select onchange="updateEditingCodeLang(this)"><option value="">自动</option>${getLangOptions(codeLang)}</select>`;
                wrapper.appendChild(selector);
            }
            wrapper.appendChild(textarea);

            try {
                element.replaceWith(wrapper);
            } catch (e) {
                element.parentNode.insertBefore(wrapper, element);
                element.remove();
            }
            editingElement = textarea;
            textarea.focus();
            textarea.select();

            textarea.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    cancelEdit();
                } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    saveEdit();
                } else if (e.key === 'Tab' && !e.shiftKey) {
                    e.preventDefault();
                    saveEdit();
                    const idx = allBlocks.indexOf(editingBlockElement);
                    if (idx !== -1 && idx < allBlocks.length - 1) {
                        setTimeout(() => startEdit(allBlocks[idx + 1]), 10);
                    }
                } else if (e.key === 'Tab' && e.shiftKey) {
                    e.preventDefault();
                    saveEdit();
                    const idx = allBlocks.indexOf(editingBlockElement);
                    if (idx > 0) {
                        setTimeout(() => startEdit(allBlocks[idx - 1]), 10);
                    }
                }
            });

            const saveOnBlur = function (e) {
                if (editingElement && !editingElement.contains(e.target)) {
                    saveEdit();
                    document.removeEventListener('click', saveOnBlur);
                }
            };
            setTimeout(() => {
                document.addEventListener('click', saveOnBlur);
            }, 10);

            textarea.addEventListener('input', function () { checkSuggestForTextarea(textarea); });
            textarea.addEventListener('keydown', function (e) { handleSuggestKeydown(e, textarea); });
        }

        function updateEditingCodeLang(select) {
            const wrapper = select.closest('div');
            if (!wrapper) return;
            const textarea = wrapper.querySelector('textarea');
            if (textarea) textarea.dataset.editingLang = select.value;
        }

        function saveEdit() {
            if (!editingElement) return;
            const textarea = editingElement;
            const wrapper = textarea.parentNode;
            if (!wrapper || !wrapper.parentNode) {
                clearEditingState();
                return;
            }

            const newContent = textarea.value;
            const oldText = editingOldText;

            let codeLang = '';
            if (wrapper.tagName === 'DIV' && wrapper.querySelector('.code-lang-selector')) {
                const select = wrapper.querySelector('.code-lang-selector select');
                if (select) codeLang = select.value;
            }

            if (oldText && newContent !== oldText) {
                const escapedOld = oldText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escapedOld);
                if (fullMarkdown.includes(oldText)) {
                    fullMarkdown = fullMarkdown.replace(regex, newContent);
                } else {
                    fullMarkdown += '\n' + newContent;
                }
            }

            const parent = wrapper.parentNode;
            if (!parent) {
                clearEditingState();
                return;
            }

            const temp = document.createElement('div');
            temp.innerHTML = editingOriginalHTML;
            const originalElement = temp.firstElementChild;

            if (originalElement) {
                if (originalElement.tagName === 'PRE' && codeLang) {
                    originalElement.dataset.lang = codeLang;
                    const codeEl = originalElement.querySelector('code');
                    if (codeEl) {
                        codeEl.className = `language-${codeLang} hljs`;
                        if (hljs && codeLang && hljs.getLanguage(codeLang)) {
                            try {
                                codeEl.innerHTML = hljs.highlight(newContent, { language: codeLang }).value;
                            } catch (_) { }
                        }
                    }
                }
                try {
                    parent.replaceChild(originalElement, wrapper);
                } catch (e) {
                    parent.insertBefore(originalElement, wrapper);
                    wrapper.remove();
                }
            } else {
                const span = document.createElement('span');
                span.textContent = newContent;
                try {
                    parent.replaceChild(span, wrapper);
                } catch (e) {
                    parent.insertBefore(span, wrapper);
                    wrapper.remove();
                }
            }

            clearEditingState();
            renderMarkdown(fullMarkdown);
            allBlocks = Array.from(preview.querySelectorAll('p, h1, h2, h3, h4, h5, h6, blockquote, pre, ul, ol, table'));
        }

        function cancelEdit() {
            if (!editingElement) return;
            const textarea = editingElement;
            const wrapper = textarea.parentNode;
            if (!wrapper || !wrapper.parentNode) {
                clearEditingState();
                return;
            }
            const parent = wrapper.parentNode;
            const temp = document.createElement('div');
            temp.innerHTML = editingOriginalHTML;
            const originalElement = temp.firstElementChild;
            if (originalElement) {
                try {
                    parent.replaceChild(originalElement, wrapper);
                } catch (e) {
                    parent.insertBefore(originalElement, wrapper);
                    wrapper.remove();
                }
            } else {
                wrapper.remove();
            }
            clearEditingState();
        }

        function clearEditingState() {
            editingElement = null;
            editingOriginalHTML = '';
            editingOldText = '';
            editingBlockElement = null;
        }

        // =====================================================================
        // 8. 代码运行（Judge0 CE 修复版 - 使用 wait=true 一次性提交）
        // =====================================================================
        async function runCode(btn, encodedCode) {
            const code = decodeURIComponent(encodedCode);
            const pre = btn.closest('pre');
            if (!pre) return;
            const lang = pre.dataset.lang || '';

            let output = pre.querySelector('.code-output');
            if (output) output.remove();
            output = document.createElement('div');
            output.className = 'code-output';
            pre.after(output);
            output.textContent = '⏳ 提交到 Judge0 ...';

            try {
                const languageId = LANGUAGE_IDS[lang];
                if (!languageId) {
                    output.textContent = `❌ 不支持的语言: ${lang}`;
                    output.classList.add('error');
                    return;
                }

                // 使用 wait=true 直接等待执行结果，避免轮询
                const url = `https://ce.judge0.com/submissions?wait=true&base64_encoded=false`;
                const body = {
                    source_code: code,
                    language_id: languageId,
                    stdin: '',
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    // 提取服务器返回的详细错误信息
                    const errMsg = data.message || data.error || JSON.stringify(data);
                    throw new Error(`HTTP ${response.status}: ${errMsg}`);
                }

                // 检查是否包含错误字段
                if (data.error) {
                    throw new Error(data.error);
                }

                // 解析执行结果
                let outputText = '';
                if (data.stdout) {
                    outputText += data.stdout;
                }
                if (data.stderr) {
                    if (outputText) outputText += '\n--- stderr ---\n';
                    outputText += data.stderr;
                    output.classList.add('error');
                }
                if (data.compile_output) {
                    if (outputText) outputText += '\n--- compile ---\n';
                    outputText += data.compile_output;
                    output.classList.add('error');
                }
                if (data.message) {
                    if (outputText) outputText += '\n--- message ---\n';
                    outputText += data.message;
                }

                if (!outputText) {
                    const statusName = data.status ? data.status.description : 'Unknown';
                    outputText = `✅ 执行成功 (${statusName})`;
                }

                output.textContent = outputText;

            } catch (err) {
                output.textContent = '❌ 错误: ' + err.message;
                output.classList.add('error');
            }
        }

        // =====================================================================
        // 9. 补全系统
        // =====================================================================
        function checkSuggestForTextarea(textarea) {
            const pos = textarea.selectionStart;
            const text = textarea.value;
            const before = text.substring(0, pos);
            const codeInfo = getCodeBlockInfo(text, pos);
            if (codeInfo.inside) {
                showCodeSuggestForTextarea(codeInfo.lang, before, pos, textarea);
                return;
            }
            const inlineMatch = before.match(/\$([^$]*)$/);
            if (inlineMatch && !before.match(/\$\$[^$]*$/)) {
                const dollarCount = (before.match(/\$/g) || []).length;
                if (dollarCount % 2 === 1) {
                    showMathSuggestForTextarea(inlineMatch[1], pos, textarea);
                    return;
                }
            }
            const blockMatch = before.match(/\$\$([^$]*)$/);
            if (blockMatch) {
                const dollarCount = (before.match(/\$\$/g) || []).length;
                if (dollarCount % 2 === 1) {
                    showMathSuggestForTextarea(blockMatch[1], pos, textarea);
                    return;
                }
            }
            hideSuggest();
        }

        function getCodeBlockInfo(text, pos) {
            const before = text.substring(0, pos);
            const start = before.lastIndexOf('```');
            if (start === -1) return { inside: false };
            const afterStart = text.substring(start + 3);
            const end = afterStart.indexOf('```');
            if (end === -1 || end > pos - start - 3) {
                const langMatch = text.substring(start + 3, start + 3 + 20).match(/^(\w+)/);
                const lang = langMatch ? langMatch[1] : '';
                return { inside: true, lang };
            }
            return { inside: false };
        }

        function showCodeSuggestForTextarea(lang, beforeText, cursorPos, textarea) {
            const keywords = codeKeywords[lang] || codeKeywords['javascript'] || [];
            const match = beforeText.match(/\b(\w*)$/);
            const prefix = match ? match[1] : '';
            const items = keywords.filter(k => k.startsWith(prefix)).slice(0, 50).map(k => ({ label: k, type: 'code', tag: lang || 'code' }));
            if (!items.length) { hideSuggest(); return; }
            showSuggestForTextarea(items, cursorPos, textarea, 'code');
        }

        function showMathSuggestForTextarea(prefix, cursorPos, textarea) {
            const p = prefix || '';
            const items = mathSymbols.filter(s => s.sym.startsWith(p) || s.desc.includes(p)).slice(0, 45).map(s => ({ label: s.sym, desc: s.desc, type: 'math', tag: 'LaTeX' }));
            if (!items.length) { hideSuggest(); return; }
            showSuggestForTextarea(items, cursorPos, textarea, 'math');
        }

        function showSuggestForTextarea(items, cursorPos, textarea, mode) {
            suggestItems = items;
            suggestIndex = -1;
            suggestMode = mode;
            suggestActive = true;
            const rect = getCursorCoordsForTextarea(textarea);
            if (!rect) { hideSuggest(); return; }
            const box = suggestBox;
            box.innerHTML = '';
            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 's-item';
                div.dataset.index = idx;
                const labelSpan = document.createElement('span');
                labelSpan.textContent = item.label;
                div.appendChild(labelSpan);
                if (item.desc) {
                    const descSpan = document.createElement('span');
                    descSpan.className = 's-desc';
                    descSpan.textContent = item.desc;
                    div.appendChild(descSpan);
                }
                if (item.tag) {
                    const tagSpan = document.createElement('span');
                    tagSpan.className = 's-tag';
                    tagSpan.textContent = item.tag;
                    div.appendChild(tagSpan);
                }
                div.addEventListener('click', () => {
                    applySuggestForTextarea(item, textarea);
                    hideSuggest();
                });
                div.addEventListener('mouseenter', () => { suggestIndex = idx; updateSuggestHighlight(); });
                box.appendChild(div);
            });
            let top = rect.top + rect.height + 4;
            let left = rect.left;
            const boxWidth = 280;
            const boxHeight = Math.min(items.length * 32 + 8, 200);
            if (left + boxWidth > window.innerWidth - 20) left = Math.max(20, window.innerWidth - boxWidth - 20);
            if (top + boxHeight > window.innerHeight - 20) top = Math.max(20, rect.top - boxHeight - 6);
            box.style.left = left + 'px';
            box.style.top = top + 'px';
            box.style.display = 'block';
            box.style.maxHeight = Math.min(200, window.innerHeight - top - 30) + 'px';
        }

        function getCursorCoordsForTextarea(textarea) {
            const rect = textarea.getBoundingClientRect();
            const start = textarea.selectionStart;
            const text = textarea.value;
            const before = text.substring(0, start);
            const lines = before.split('\n');
            const row = lines.length - 1;
            const col = lines[row].length;
            const span = document.createElement('span');
            const style = getComputedStyle(textarea);
            span.style.cssText = `font:${style.font};font-family:${style.fontFamily};font-size:${style.fontSize};letter-spacing:${style.letterSpacing};visibility:hidden;white-space:pre;`;
            span.textContent = lines[row] || '';
            document.body.appendChild(span);
            const width = span.offsetWidth;
            document.body.removeChild(span);
            const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.6;
            const lineSpan = document.createElement('span');
            lineSpan.style.cssText = `font:${style.font};font-family:${style.fontFamily};font-size:${style.fontSize};visibility:hidden;white-space:pre-wrap;word-wrap:break-word;width:${style.width};`;
            lineSpan.textContent = lines.slice(0, -1).join('\n') + (lines.length > 1 ? '\n' : '');
            document.body.appendChild(lineSpan);
            const heightBefore = lineSpan.offsetHeight;
            document.body.removeChild(lineSpan);
            const padLeft = parseFloat(style.paddingLeft) || 0;
            const padTop = parseFloat(style.paddingTop) || 0;
            const borderLeft = parseFloat(style.borderLeftWidth) || 0;
            const scrollTop = textarea.scrollTop;
            return {
                top: rect.top + padTop + borderLeft + heightBefore - scrollTop,
                left: rect.left + padLeft + borderLeft + width,
                height: lineHeight
            };
        }

        function applySuggestForTextarea(item, textarea) {
            const pos = textarea.selectionStart;
            const text = textarea.value;
            const before = text.substring(0, pos);
            const after = text.substring(pos);
            if (suggestMode === 'code') {
                const wordMatch = before.match(/\b\w*$/);
                if (wordMatch) {
                    const start = pos - wordMatch[0].length;
                    textarea.value = text.substring(0, start) + item.label + after;
                    textarea.selectionStart = textarea.selectionEnd = start + item.label.length;
                }
            } else if (suggestMode === 'math') {
                let m = before.match(/\$([^$]*)$/);
                if (m) {
                    const start = pos - m[1].length;
                    const prefix = before.substring(0, start);
                    textarea.value = prefix + item.label + after;
                    textarea.selectionStart = textarea.selectionEnd = start + item.label.length;
                } else {
                    m = before.match(/\$\$([^$]*)$/);
                    if (m) {
                        const start = pos - m[1].length;
                        const prefix = before.substring(0, start);
                        textarea.value = prefix + item.label + after;
                        textarea.selectionStart = textarea.selectionEnd = start + item.label.length;
                    }
                }
            }
            hideSuggest();
        }

        function handleSuggestKeydown(e, textarea) {
            if (suggestActive) {
                if (e.key === 'ArrowDown') { e.preventDefault(); suggestIndex = Math.min(suggestIndex + 1, suggestItems.length - 1); updateSuggestHighlight(); return; }
                if (e.key === 'ArrowUp') { e.preventDefault(); suggestIndex = Math.max(suggestIndex - 1, 0); updateSuggestHighlight(); return; }
                if (e.key === 'Tab' || e.key === 'Enter') {
                    if (suggestIndex >= 0 && suggestIndex < suggestItems.length) {
                        e.preventDefault();
                        applySuggestForTextarea(suggestItems[suggestIndex], textarea);
                        hideSuggest();
                        return;
                    }
                }
                if (e.key === 'Escape') { e.preventDefault(); hideSuggest(); return; }
            }
        }

        function updateSuggestHighlight() {
            const items = suggestBox.querySelectorAll('.s-item');
            items.forEach((el, idx) => el.classList.toggle('active', idx === suggestIndex));
        }

        function hideSuggest() {
            suggestBox.style.display = 'none';
            suggestActive = false;
            suggestItems = [];
            suggestIndex = -1;
            suggestMode = '';
        }

        // =====================================================================
        // 10. 图形化数学构建器
        // =====================================================================
        const mathTemplates = {
            '分数': { latex: '\\frac{', params: ['分子', '分母'] },
            '根号': { latex: '\\sqrt{', params: ['被开方数'] },
            '指数': { latex: '^{', params: ['指数'] },
            '下标': { latex: '_{', params: ['下标'] },
            '积分': { latex: '\\int_{', params: ['下限', '上限', '被积表达式'] },
            '求和': { latex: '\\sum_{', params: ['下限', '上限', '求和表达式'] },
            '极限': { latex: '\\lim_{', params: ['变量', '趋向值', '表达式'] },
            '矩阵': { latex: '\\begin{bmatrix}', params: ['行数', '列数', '内容'] },
            '行列式': { latex: '\\begin{vmatrix}', params: ['行数', '列数', '内容'] },
            '方程组': { latex: '\\begin{cases}', params: ['方程列表'] },
            '向量': { latex: '\\vec{', params: ['向量名'] },
            '点积': { latex: '\\cdot', params: [] },
            '叉积': { latex: '\\times', params: [] },
            '偏导': { latex: '\\partial', params: [] },
            '梯度': { latex: '\\nabla', params: [] },
            '无穷': { latex: '\\infty', params: [] },
            '约等于': { latex: '\\approx', params: [] },
            '不等于': { latex: '\\neq', params: [] },
            '小于等于': { latex: '\\leq', params: [] },
            '大于等于': { latex: '\\geq', params: [] },
            '圆周率': { latex: '\\pi', params: [] },
            '自然对数底': { latex: 'e', params: [] },
        };

        function openMathBuilder() {
            mathBuilder.style.display = 'flex';
            const palette = document.getElementById('symbolPalette');
            palette.innerHTML = '';
            Object.keys(mathTemplates).forEach(name => {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.dataset.template = name;
                btn.addEventListener('click', () => selectMathTemplate(name));
                palette.appendChild(btn);
            });
            const first = Object.keys(mathTemplates)[0];
            if (first) selectMathTemplate(first);
        }

        function closeMathBuilder() { mathBuilder.style.display = 'none'; }

        let currentTemplate = null;

        function selectMathTemplate(name) {
            currentTemplate = name;
            const template = mathTemplates[name];
            const paramsDiv = document.getElementById('formulaParams');
            paramsDiv.innerHTML = '';
            template.params.forEach(p => {
                const label = document.createElement('label');
                label.textContent = p + ':';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = p;
                input.dataset.param = p;
                label.appendChild(input);
                paramsDiv.appendChild(label);
            });
            updateFormulaPreview();
        }

        function updateFormulaPreview() {
            if (!currentTemplate) return;
            const template = mathTemplates[currentTemplate];
            const params = template.params;
            const inputs = document.querySelectorAll('#formulaParams input');
            let latex = template.latex;
            if (params.length === 0) {
                latex = template.latex;
            } else if (params.length === 1) {
                const val = inputs[0] ? inputs[0].value || '?' : '?';
                latex = template.latex + val + '}';
            } else if (params.length === 2) {
                const val1 = inputs[0] ? inputs[0].value || '?' : '?';
                const val2 = inputs[1] ? inputs[1].value || '?' : '?';
                latex = template.latex + val1 + '}^{' + val2 + '}';
            } else if (params.length === 3) {
                const val1 = inputs[0] ? inputs[0].value || '?' : '?';
                const val2 = inputs[1] ? inputs[1].value || '?' : '?';
                const val3 = inputs[2] ? inputs[2].value || '?' : '?';
                if (template.latex.includes('int') || template.latex.includes('sum')) {
                    latex = template.latex + val1 + '}^{' + val2 + '} ' + val3;
                } else if (template.latex.includes('lim')) {
                    latex = template.latex + val1 + '\\to ' + val2 + '} ' + val3;
                } else {
                    latex = template.latex + val1 + '}^{' + val2 + '} ' + val3;
                }
            } else if (params.length >= 4) {
                const rows = parseInt(inputs[0]?.value) || 2;
                const cols = parseInt(inputs[1]?.value) || 2;
                const content = inputs[2]?.value || 'a & b ; c & d';
                const rowsData = content.split(';').map(r => r.trim().split('&').map(c => c.trim()));
                const finalRows = Math.min(rowsData.length, rows);
                const finalCols = Math.min(rowsData[0] ? rowsData[0].length : cols, cols);
                let matrixStr = '';
                for (let i = 0; i < finalRows; i++) {
                    const row = rowsData[i] || [];
                    const cells = [];
                    for (let j = 0; j < finalCols; j++) {
                        cells.push(row[j] || '0');
                    }
                    matrixStr += cells.join(' & ');
                    if (i < finalRows - 1) matrixStr += ' \\\\ ';
                }
                latex = template.latex + matrixStr + '\\end{bmatrix}';
            } else {
                latex = template.latex;
            }
            const previewDiv = document.getElementById('formulaPreview');
            try {
                const rendered = katex.renderToString(latex, { displayMode: true, throwOnError: false });
                previewDiv.innerHTML = rendered;
            } catch (e) {
                previewDiv.textContent = 'LaTeX: ' + latex + ' (渲染错误: ' + e.message + ')';
            }
            previewDiv.dataset.latex = latex;
        }

        document.addEventListener('input', function (e) {
            if (e.target.closest('#formulaParams')) updateFormulaPreview();
        });

        document.getElementById('insertFormulaBtn').addEventListener('click', function () {
            const previewDiv = document.getElementById('formulaPreview');
            const latex = previewDiv.dataset.latex || '';
            if (latex) {
                if (editingElement) {
                    insertAtCursor(editingElement, '$', '$', latex);
                } else {
                    fullMarkdown += '\n$$' + latex + '$$';
                    renderMarkdown(fullMarkdown);
                }
                closeMathBuilder();
            }
        });

        function quickMath(type) {
            const map = { 'frac': '分数', 'sqrt': '根号', 'sum': '求和', 'int': '积分', 'matrix': '矩阵' };
            const name = map[type];
            if (name) { openMathBuilder(); selectMathTemplate(name); }
        }

        // =====================================================================
        // 11. 状态更新
        // =====================================================================
        function updateStatus() {
            const lines = fullMarkdown.split('\n');
            const wordCount = fullMarkdown.replace(/\s/g, '').length;
            statusInfo.textContent = `行 ${lines.length} · 字 ${wordCount}`;
        }

        // =====================================================================
        // 12. 插入辅助函数
        // =====================================================================
        function insertAtCursor(textarea, before, after, customContent) {
            if (!textarea) {
                fullMarkdown += '\n' + before + (customContent || '') + after;
                renderMarkdown(fullMarkdown);
                return;
            }
            const pos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(pos, endPos);
            const content = customContent !== undefined ? customContent : (selected || '内容');
            const insertText = before + content + after;
            textarea.value = text.substring(0, pos) + insertText + text.substring(endPos);
            const newPos = pos + before.length + content.length;
            textarea.selectionStart = textarea.selectionEnd = newPos;
            textarea.focus();
        }

        function insertWrapAtCursor(before, after) {
            if (editingElement) insertAtCursor(editingElement, before, after);
            else { fullMarkdown += '\n' + before + '内容' + after; renderMarkdown(fullMarkdown); }
        }

        function insertListAtCursor(type) {
            if (!editingElement) { fullMarkdown += '\n' + (type === 'ul' ? '- ' : '1. ') + '列表项'; renderMarkdown(fullMarkdown); return; }
            const textarea = editingElement;
            const pos = textarea.selectionStart;
            const text = textarea.value;
            const before = text.substring(0, pos);
            const lineStart = before.lastIndexOf('\n') + 1;
            const indent = before.substring(lineStart).match(/^\s*/)[0];
            const insert = type === 'ul' ? indent + '- ' : indent + '1. ';
            textarea.value = text.substring(0, lineStart) + insert + text.substring(lineStart);
            const newPos = lineStart + insert.length;
            textarea.selectionStart = textarea.selectionEnd = newPos;
            textarea.focus();
        }

        function insertCodeBlockAtCursor() {
            const lang = document.getElementById('codeLangSelect').value || '';
            const code = lang ? '```' + lang + '\n\n```' : '```\n\n```';
            if (editingElement) {
                insertAtCursor(editingElement, code, '');
                const textarea = editingElement;
                const pos = textarea.selectionStart;
                const text = textarea.value;
                const openPos = text.lastIndexOf('```', pos);
                if (openPos !== -1) {
                    const afterOpen = text.indexOf('\n', openPos);
                    if (afterOpen !== -1) textarea.selectionStart = textarea.selectionEnd = afterOpen + 1;
                }
            } else { fullMarkdown += '\n' + code; renderMarkdown(fullMarkdown); }
        }

        function insertMathInlineAtCursor() {
            if (editingElement) insertAtCursor(editingElement, '$', '$');
            else { fullMarkdown += ' $ $ '; renderMarkdown(fullMarkdown); }
        }

        function insertMathBlockAtCursor() {
            if (editingElement) insertAtCursor(editingElement, '$$\n', '\n$$');
            else { fullMarkdown += '\n$$\n\n$$\n'; renderMarkdown(fullMarkdown); }
        }

        function insertTableAtCursor() {
            const table = '\n| 列1 | 列2 | 列3 |\n| --- | --- | --- |\n| 数据 | 数据 | 数据 |\n';
            if (editingElement) insertAtCursor(editingElement, table, '');
            else { fullMarkdown += table; renderMarkdown(fullMarkdown); }
        }

        function insertLinkAtCursor() {
            if (editingElement) insertAtCursor(editingElement, '[', '](url)');
            else { fullMarkdown += ' [链接文字](url) '; renderMarkdown(fullMarkdown); }
        }

        function insertImageAtCursor() {
            if (editingElement) insertAtCursor(editingElement, '![', '](url)');
            else { fullMarkdown += ' ![图片描述](url) '; renderMarkdown(fullMarkdown); }
        }

        function insertHrAtCursor() {
            if (editingElement) insertAtCursor(editingElement, '\n---\n', '');
            else { fullMarkdown += '\n---\n'; renderMarkdown(fullMarkdown); }
        }

        previewArea.addEventListener('contextmenu', function (e) {

        function showContextMenu(x, y) {
            const menu = contextMenu;
            menu.style.display = 'block';
            let left = x, top = y;
            if (left + 190 > window.innerWidth) left = window.innerWidth - 200;
            if (top + 300 > window.innerHeight) top = window.innerHeight - 310;
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
        }

        contextMenu.addEventListener('click', function (e) {
            const item = e.target.closest('.menu-item');
            if (!item) return;
            const action = item.dataset.action;
            contextMenu.style.display = 'none';
            if (action === 'cancel-edit') { if (editingElement) cancelEdit(); return; }
            switch (action) {
                case 'h2': insertWrapAtCursor('## ', '\n'); break;
                case 'h3': insertWrapAtCursor('### ', '\n'); break;
                case 'h4': insertWrapAtCursor('#### ', '\n'); break;
                case 'list-ul': insertListAtCursor('ul'); break;
                case 'list-ol': insertListAtCursor('ol'); break;
                case 'quote': insertWrapAtCursor('> ', '\n'); break;
                case 'code-block': insertCodeBlockAtCursor(); break;
                case 'math-inline': insertMathInlineAtCursor(); break;
                case 'math-block': insertMathBlockAtCursor(); break;
                case 'table': insertTableAtCursor(); break;
                case 'link': insertLinkAtCursor(); break;
                case 'image': insertImageAtCursor(); break;
                case 'hr': insertHrAtCursor(); break;
            }
        });

        document.addEventListener('click', function () { contextMenu.style.display = 'none'; });

        function toggleMathPanel() {
            if (mathPanel.style.display === 'grid') { mathPanel.style.display = 'none'; return; }

        function insertMathSymbol(symbol) {
            if (editingElement) {
                const textarea = editingElement;
                const pos = textarea.selectionStart;
                const text = textarea.value;
                const before = text.substring(0, pos);
                const after = text.substring(pos);
                const dollarOpen = (before.match(/\$/g) || []).length % 2 === 1;
                const blockOpen = (before.match(/\$\$/g) || []).length % 2 === 1;
                let insertStr = symbol;
                if (!dollarOpen && !blockOpen) {
                    const prevChar = before.slice(-1);
                    const nextChar = after.charAt(0);
                    if (prevChar === '\n' || prevChar === '' || nextChar === '\n' || nextChar === '') {
                        insertStr = '$$' + symbol + '$$';
                    } else {
                        insertStr = '$' + symbol + '$';
                    }
                }
                textarea.value = text.substring(0, pos) + insertStr + text.substring(pos);
                textarea.selectionStart = textarea.selectionEnd = pos + insertStr.length;
                textarea.focus();
            } else {
                fullMarkdown += ' ' + symbol + ' ';
                renderMarkdown(fullMarkdown);
            }
        }
