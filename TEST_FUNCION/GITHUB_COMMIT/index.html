<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 远程文件提交工具</title>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        :root {
            --primary: #2b6cb0;
            --primary-dark: #1a4f7a;
            --primary-light: #e8f0fe;
            --success: #38a169;
            --danger: #e53e3e;
            --gray-50: #f7fafc;
            --gray-100: #edf2f7;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e0;
            --gray-500: #718096;
            --gray-700: #2d3748;
            --gray-900: #1a202c;
            --radius: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(145deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
        }

        /* ===== 卡片容器 ===== */
        .app-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 48px 48px;
            transition: var(--transition);
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 24px 18px 28px;
            }
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--gray-100);
            padding-bottom: 20px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }

        .header .sub {
            font-size: 14px;
            color: var(--gray-500);
            font-weight: 400;
            margin-left: auto;
            background: var(--gray-100);
            padding: 4px 14px;
            border-radius: 20px;
        }

        @media (max-width: 480px) {
            .header {
                flex-wrap: wrap;
            }

            .header .sub {
                margin-left: 0;
                width: 100%;
                text-align: left;
            }
        }

        /* ===== 表单 ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label .badge {
            font-weight: 400;
            font-size: 11px;
            background: var(--gray-200);
            color: var(--gray-500);
            padding: 0 10px;
            border-radius: 12px;
            line-height: 20px;
        }

        .form-group label .required {
            color: var(--danger);
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea {
            font-family: var(--font);
            font-size: 15px;
            padding: 10px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            background: var(--gray-50);
            transition: var(--transition);
            outline: none;
            width: 100%;
            color: var(--gray-900);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
            background: #ffffff;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--gray-300);
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
            font-family: "SF Mono", "Menlo", "Monaco", monospace;
            font-size: 14px;
            tab-size: 2;
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        .form-group .hint code {
            background: var(--gray-100);
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--gray-700);
        }

        /* ===== 按钮组 ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid var(--gray-100);
        }

        .btn {
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            padding: 11px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            box-shadow: 0 4px 14px rgba(43, 108, 176, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--gray-300);
            color: var(--gray-700);
        }

        .btn-outline:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover:not(:disabled) {
            background: #2f855a;
            box-shadow: 0 4px 14px rgba(56, 161, 105, 0.3);
        }

        .btn-danger-outline {
            background: transparent;
            border: 1.5px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger-outline:hover:not(:disabled) {
            background: #fff5f5;
        }

        .btn .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-outline .spinner {
            border: 2px solid rgba(43, 108, 176, 0.2);
            border-top: 2px solid var(--primary);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 结果区域 ===== */
        .result-area {
            margin-top: 24px;
            border-radius: var(--radius);
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            transition: var(--transition);
            display: none;
        }

        .result-area.visible {
            display: block;
        }

        .result-header {
            padding: 14px 20px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--gray-200);
            background: var(--gray-100);
        }

        .result-header .status-icon {
            font-size: 18px;
        }

        .result-header .status-icon.success {
            color: var(--success);
        }

        .result-header .status-icon.error {
            color: var(--danger);
        }

        .result-header .status-icon.info {
            color: var(--primary);
        }

        .result-body {
            padding: 18px 20px 20px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--gray-700);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: "SF Mono", "Menlo", "Monaco", monospace;
            font-size: 13px;
        }

        .result-body .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .result-body .link:hover {
            text-decoration: underline;
        }

        .result-body .detail-row {
            display: flex;
            gap: 8px;
            padding: 3px 0;
        }

        .result-body .detail-row .label {
            font-weight: 600;
            color: var(--gray-500);
            min-width: 70px;
        }

        /* ===== 文件信息展示 (获取SHA时) ===== */
        .file-info-box {
            margin-top: 12px;
            padding: 14px 18px;
            background: var(--primary-light);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            font-size: 14px;
            display: none;
        }

        .file-info-box.visible {
            display: block;
        }

        .file-info-box .info-line {
            display: flex;
            gap: 12px;
            padding: 3px 0;
            flex-wrap: wrap;
        }

        .file-info-box .info-line .tag {
            font-weight: 600;
            color: var(--gray-500);
            min-width: 70px;
        }

        .file-info-box .info-line .value {
            color: var(--gray-900);
            font-family: "SF Mono", "Menlo", "Monaco", monospace;
            font-size: 13px;
            word-break: break-all;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 480px) {
            .btn {
                width: 100%;
                justify-content: center;
            }

            .actions {
                flex-direction: column;
            }

            .header h1 {
                font-size: 20px;
            }
        }

        /* ===== 滚动条美化 ===== */
        .result-body::-webkit-scrollbar {
            width: 5px;
        }

        .result-body::-webkit-scrollbar-track {
            background: var(--gray-100);
        }

        .result-body::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 8px;
        }

        .result-body::-webkit-scrollbar-thumb:hover {
            background: var(--gray-500);
        }

        /* ===== 提示徽标 ===== */
        .toast-tip {
            display: inline-block;
            font-size: 12px;
            background: #fefcbf;
            color: #975a16;
            padding: 0 10px;
            border-radius: 12px;
            line-height: 22px;
            margin-left: 6px;
        }
    </style>
</head>

<body>

    <div class="app-container" id="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-icon">📂</div>
            <h1>GitHub 文件提交</h1>
            <span class="sub">REST API v3</span>
        </header>

        <!-- 表单 -->
        <form id="githubForm" autocomplete="off">
            <div class="form-grid">

                <!-- Token -->
                <div class="form-group full-width">
                    <label>
                        🔑 Personal Access Token
                        <span class="required">*</span>
                        <span class="badge">需要 repo 或 public_repo 权限</span>
                    </label>
                    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required />
                    <div class="hint">令牌不会存储，仅用于本次请求。</div>
                </div>

                <!-- Owner -->
                <div class="form-group">
                    <label>👤 仓库所有者 <span class="required">*</span></label>
                    <input type="text" id="owner" placeholder="用户名或组织名" required />
                </div>

                <!-- Repo -->
                <div class="form-group">
                    <label>📦 仓库名称 <span class="required">*</span></label>
                    <input type="text" id="repo" placeholder="repo-name" required />
                </div>

                <!-- Path -->
                <div class="form-group full-width">
                    <label>📄 文件路径 <span class="required">*</span></label>
                    <input type="text" id="path" placeholder="src/main.js" required />
                    <div class="hint">从仓库根目录开始的完整路径，包含文件名。</div>
                </div>

                <!-- Message -->
                <div class="form-group full-width">
                    <label>✏️ 提交信息 <span class="required">*</span></label>
                    <input type="text" id="message" placeholder="feat: 添加新功能" required />
                </div>

                <!-- Content -->
                <div class="form-group full-width">
                    <label>📝 文件内容 <span class="required">*</span></label>
                    <textarea id="content" placeholder="输入文件内容…" required></textarea>
                    <div class="hint">支持文本文件（UTF‑8），如 .js / .json / .html / .css / .md 等。</div>
                </div>

                <!-- SHA (可选) -->
                <div class="form-group full-width">
                    <label>
                        🔗 文件 SHA
                        <span class="badge">更新时必填</span>
                    </label>
                    <input type="text" id="sha" placeholder="留空表示创建新文件，更新时需提供当前 SHA" />
                    <div class="hint">
                        点击下方 <strong>「获取文件信息」</strong> 可自动获取并填充。
                    </div>
                </div>

            </div>

            <!-- 文件信息展示区 -->
            <div class="file-info-box" id="fileInfoBox">
                <div style="font-weight:600;margin-bottom:6px;color:var(--gray-700);">📋 文件信息</div>
                <div class="info-line"><span class="tag">SHA</span><span class="value" id="infoSha">—</span></div>
                <div class="info-line"><span class="tag">大小</span><span class="value" id="infoSize">—</span></div>
                <div class="info-line"><span class="tag">类型</span><span class="value" id="infoType">—</span></div>
                <div class="info-line"><span class="tag">最后更新</span><span class="value" id="infoUpdated">—</span></div>
            </div>

            <!-- 操作按钮 -->
            <div class="actions">
                <button type="button" class="btn btn-outline" id="btnFetch">
                    🔍 获取文件信息
                </button>
                <button type="submit" class="btn btn-primary" id="btnSubmit">
                    🚀 提交文件
                </button>
                <button type="reset" class="btn btn-danger-outline" id="btnClear">
                    🗑️ 清空表单
                </button>
            </div>
        </form>

        <!-- 结果区域 -->
        <div class="result-area" id="resultArea">
            <div class="result-header" id="resultHeader">
                <span class="status-icon" id="resultIcon">📌</span>
                <span id="resultTitle">结果</span>
            </div>
            <div class="result-body" id="resultBody"></div>
        </div>

        <div
            style="margin-top:18px;font-size:12px;color:var(--gray-500);text-align:center;border-top:1px solid var(--gray-100);padding-top:16px;">
            💡 使用 GitHub REST API &bull; 所有请求均在前端发出 &bull; 令牌仅存在于内存中
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // ===== DOM 引用 =====
            const form = document.getElementById('githubForm');
            const tokenInput = document.getElementById('token');
            const ownerInput = document.getElementById('owner');
            const repoInput = document.getElementById('repo');
            const pathInput = document.getElementById('path');
            const messageInput = document.getElementById('message');
            const contentInput = document.getElementById('content');
            const shaInput = document.getElementById('sha');

            const btnFetch = document.getElementById('btnFetch');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnClear = document.getElementById('btnClear');

            const resultArea = document.getElementById('resultArea');
            const resultHeader = document.getElementById('resultHeader');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultBody = document.getElementById('resultBody');

            const fileInfoBox = document.getElementById('fileInfoBox');
            const infoSha = document.getElementById('infoSha');
            const infoSize = document.getElementById('infoSize');
            const infoType = document.getElementById('infoType');
            const infoUpdated = document.getElementById('infoUpdated');

            // ===== 工具函数 =====

            /** 将 UTF-8 文本转为 Base64 (GitHub API 要求) */
            function utf8ToBase64(str) {
                try {
                    // 方式1: 使用 TextEncoder (现代浏览器)
                    const encoder = new TextEncoder();
                    const bytes = encoder.encode(str);
                    let binary = '';
                    for (let i = 0; i < bytes.length; i++) {
                        binary += String.fromCharCode(bytes[i]);
                    }
                    return btoa(binary);
                } catch (_) {
                    // 降级方案
                    return btoa(unescape(encodeURIComponent(str)));
                }
            }

            /** 格式化文件大小 */
            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            /** 格式化日期 */
            function formatDate(iso) {
                if (!iso) return '—';
                try {
                    const d = new Date(iso);
                    return d.toLocaleString('zh-CN', { timeZone: 'UTC' }) + ' UTC';
                } catch (_) {
                    return iso;
                }
            }

            /** 显示结果 */
            function showResult(status, title, bodyHTML, isError = false) {
                resultArea.classList.add('visible');
                resultIcon.textContent = isError ? '❌' : (status === 'success' ? '✅' : 'ℹ️');
                resultIcon.className = 'status-icon ' + (isError ? 'error' : (status === 'success' ? 'success' : 'info'));
                resultTitle.textContent = title;
                resultBody.innerHTML = bodyHTML;
                // 滚动到结果区域
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            /** 清空结果 */
            function clearResult() {
                resultArea.classList.remove('visible');
                resultBody.innerHTML = '';
            }

            /** 设置按钮加载状态 */
            function setLoading(btn, loading) {
                if (loading) {
                    btn.disabled = true;
                    btn.dataset.originalText = btn.innerHTML;
                    btn.innerHTML = '<span class="spinner"></span> 处理中…';
                } else {
                    btn.disabled = false;
                    if (btn.dataset.originalText) {
                        btn.innerHTML = btn.dataset.originalText;
                        delete btn.dataset.originalText;
                    }
                }
            }

            /** 获取表单值（去除首尾空格） */
            function getVal(el) {
                return el.value ? el.value.trim() : '';
            }

            /** 检查必填字段 */
            function checkRequired() {
                const fields = [
                    { el: tokenInput, name: 'Token' },
                    { el: ownerInput, name: '仓库所有者' },
                    { el: repoInput, name: '仓库名称' },
                    { el: pathInput, name: '文件路径' },
                    { el: messageInput, name: '提交信息' },
                    { el: contentInput, name: '文件内容' },
                ];
                for (const f of fields) {
                    if (!getVal(f.el)) {
                        f.el.focus();
                        showResult('error', '表单不完整', `<strong>请填写「${f.name}」字段。</strong>`, true);
                        return false;
                    }
                }
                return true;
            }

            // ===== GitHub API 调用 =====

            /** 获取文件信息 (GET /repos/{owner}/{repo}/contents/{path}) */
            async function fetchFileInfo() {
                if (!checkRequired()) return;

                const token = getVal(tokenInput);
                const owner = getVal(ownerInput);
                const repo = getVal(repoInput);
                const path = getVal(pathInput);

                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;

                try {
                    setLoading(btnFetch, true);
                    clearResult();
                    fileInfoBox.classList.remove('visible');

                    const resp = await fetch(url, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                        },
                    });

                    if (!resp.ok) {
                        if (resp.status === 404) {
                            showResult('info', '文件不存在',
                                `📭 路径 <code>${path}</code> 在仓库 <strong>${owner}/${repo}</strong> 中不存在。<br>你可以直接 <strong>创建</strong> 新文件。`,
                                false
                            );
                            return;
                        }
                        const errData = await resp.json().catch(() => ({}));
                        const msg = errData.message || `HTTP ${resp.status}`;
                        showResult('error', '获取失败',
                            `<strong>${msg}</strong><br><span style="color:var(--gray-500);font-size:13px;">${url}</span>`,
                            true
                        );
                        return;
                    }

                    const data = await resp.json();

                    // 填充信息
                    infoSha.textContent = data.sha || '—';
                    infoSize.textContent = data.size !== undefined ? formatSize(data.size) : '—';
                    infoType.textContent = data.type || '—';
                    infoUpdated.textContent = formatDate(data.committer?.date || data.last_modified || '');
                    fileInfoBox.classList.add('visible');

                    // 自动填充 SHA
                    if (data.sha) {
                        shaInput.value = data.sha;
                    }

                    showResult('success', '获取成功',
                        `✅ 文件 <strong>${path}</strong> 存在，SHA 已自动填入下方。`,
                        false
                    );

                } catch (err) {
                    showResult('error', '网络错误',
                        `⚠️ ${err.message || '请求失败，请检查网络连接。'}`,
                        true
                    );
                } finally {
                    setLoading(btnFetch, false);
                }
            }

            /** 提交文件 (PUT /repos/{owner}/{repo}/contents/{path}) */
            async function submitFile(e) {
                e.preventDefault();

                if (!checkRequired()) return;

                const token = getVal(tokenInput);
                const owner = getVal(ownerInput);
                const repo = getVal(repoInput);
                const path = getVal(pathInput);
                const message = getVal(messageInput);
                const contentRaw = contentInput.value; // 保留原始换行
                const sha = getVal(shaInput) || undefined;

                // 对内容编码
                let contentBase64;
                try {
                    contentBase64 = utf8ToBase64(contentRaw);
                } catch (encErr) {
                    showResult('error', '编码失败',
                        `⚠️ 文件内容编码失败：${encErr.message || '未知错误'}`,
                        true
                    );
                    return;
                }

                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
                const payload = {
                    message: message,
                    content: contentBase64,
                    branch: 'main', // 可考虑让用户指定，这里保持简单
                };
                if (sha) {
                    payload.sha = sha;
                }

                try {
                    setLoading(btnSubmit, true);
                    clearResult();
                    fileInfoBox.classList.remove('visible');

                    const resp = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                    });

                    const data = await resp.json().catch(() => ({}));

                    if (!resp.ok) {
                        // 特殊处理 409 冲突
                        if (resp.status === 409) {
                            showResult('error', '文件已存在 (冲突)',
                                `⚠️ 文件 <strong>${path}</strong> 已存在，但未提供 SHA。<br>
                                        请先点击 <strong>「获取文件信息」</strong> 获取 SHA，然后再提交更新。`,
                                true
                            );
                            return;
                        }
                        const msg = data.message || `HTTP ${resp.status}`;
                        showResult('error', '提交失败',
                            `<strong>${msg}</strong><br><span style="color:var(--gray-500);font-size:13px;">${url}</span><br>
                                     <details style="margin-top:8px;">
                                         <summary style="cursor:pointer;color:var(--primary);">查看详情</summary>
                                         <pre style="background:var(--gray-100);padding:10px;border-radius:6px;font-size:12px;overflow:auto;">${JSON.stringify(data, null, 2)}</pre>
                                     </details>`,
                            true
                        );
                        return;
                    }

                    // 成功
                    const commitUrl = data.commit?.html_url || data.content?.html_url || '';
                    const fileUrl = data.content?.html_url || '';
                    const shaResult = data.content?.sha || data.sha || '';

                    let successHTML = `
                                ✅ 文件 <strong>${path}</strong> 已成功提交！
                                <div style="margin-top:12px;background:var(--gray-100);padding:12px 16px;border-radius:8px;">
                                    <div class="detail-row"><span class="label">SHA</span><span style="font-family:monospace;">${shaResult}</span></div>
                                    <div class="detail-row"><span class="label">提交信息</span><span>${message}</span></div>
                                </div>
                            `;
                    if (fileUrl) {
                        successHTML += `<div style="margin-top:12px;">🔗 <a href="${fileUrl}?v=20260823122343" target="_blank" class="link">查看文件 on GitHub</a></div>`;
                    }
                    if (commitUrl) {
                        successHTML += `<div style="margin-top:4px;">🔗 <a href="${commitUrl}?v=20260823122343" target="_blank" class="link">查看提交记录</a></div>`;
                    }

                    showResult('success', '提交成功', successHTML, false);

                    // 成功后清空 SHA (因为文件已更新，旧的 SHA 失效)
                    shaInput.value = '';
                    fileInfoBox.classList.remove('visible');

                } catch (err) {
                    showResult('error', '网络错误',
                        `⚠️ ${err.message || '请求失败，请检查网络连接。'}`,
                        true
                    );
                } finally {
                    setLoading(btnSubmit, false);
                }
            }

            // ===== 事件绑定 =====

            btnFetch.addEventListener('click', fetchFileInfo);

            form.addEventListener('submit', submitFile);

            btnClear.addEventListener('click', function () {
                form.reset();
                clearResult();
                fileInfoBox.classList.remove('visible');
                // 重置按钮状态
                [btnFetch, btnSubmit].forEach(b => {
                    b.disabled = false;
                    if (b.dataset.originalText) {
                        b.innerHTML = b.dataset.originalText;
                        delete b.dataset.originalText;
                    }
                });
                // 聚焦到第一个输入
                tokenInput.focus();
            });

            // 当用户修改 SHA 时，自动隐藏文件信息框（表示手动编辑）
            shaInput.addEventListener('input', function () {
                if (this.value.trim() !== '') {
                    // 如果用户手动输入 SHA，保留信息框但标记为手动
                    // 不做强制隐藏
                }
            });

            // ===== 键盘快捷键: Ctrl+Enter 提交 =====
            contentInput.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });

            // ===== 提示用户 Token 格式 =====
            tokenInput.addEventListener('blur', function () {
                const val = this.value.trim();
                if (val && !val.startsWith('ghp_') && !val.startsWith('github_pat_')) {
                    // 仅做提醒，不强制
                }
            });

            console.log('✅ GitHub 文件提交工具已加载');
            console.log('💡 使用 Ctrl+Enter 快速提交文件内容');

        })();
    </script>

</body>

</html>
