<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GitHub 文件提交（硬编码测试版）</title>
    <style>
        /* ===== 完整样式（与移动优化版一致） ===== */
        :root {
            --primary: #2b6cb0;
            --primary-dark: #1a4f7a;
            --primary-light: #e8f0fe;
            --success: #38a169;
            --danger: #e53e3e;
            --warning: #d69e2e;
            --gray-50: #f7fafc;
            --gray-100: #edf2f7;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e0;
            --gray-400: #a0aec0;
            --gray-500: #718096;
            --gray-600: #4a5568;
            --gray-700: #2d3748;
            --gray-800: #1a202c;
            --gray-900: #171923;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            --touch-size: 44px;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font);
            background: linear-gradient(145deg, #f0f4f8 0%, #dfe6ed 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px;
        }
        .app-container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 16px 28px;
            margin: 8px 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gray-100);
            padding-bottom: 14px;
            flex-wrap: wrap;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .header .sub {
            font-size: 12px;
            color: var(--gray-500);
            margin-left: auto;
            background: var(--gray-100);
            padding: 2px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .section {
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray-700);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .step-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group label .required {
            color: var(--danger);
            font-weight: 700;
        }
        .form-group label .badge {
            font-weight: 400;
            font-size: 11px;
            background: var(--gray-200);
            color: var(--gray-500);
            padding: 1px 10px;
            border-radius: 12px;
            line-height: 20px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            font-family: var(--font);
            font-size: 16px;
            padding: 10px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--gray-50);
            transition: var(--transition);
            outline: none;
            width: 100%;
            color: var(--gray-900);
            min-height: var(--touch-size);
        }
        .form-group textarea {
            min-height: 120px;
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.12);
            background: #fff;
        }
        .form-group .hint {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 2px;
        }
        .repo-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .repo-input-wrapper input {
            padding-right: 40px;
        }
        .repo-input-wrapper .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 6px 8px;
            display: none;
            line-height: 1;
            border-radius: 50%;
            min-height: 36px;
            min-width: 36px;
            touch-action: manipulation;
        }
        .repo-input-wrapper .clear-btn.visible {
            display: block;
        }
        .token-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .token-wrapper .btn-verify-wrap {
            display: flex;
            align-items: stretch;
        }
        .token-status,
        .repo-status,
        .file-status-bar {
            margin-top: 8px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .token-status.visible,
        .repo-status.visible,
        .file-status-bar.visible {
            display: flex;
        }
        .token-status.loading,
        .repo-status.loading,
        .file-status-bar.checking {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid rgba(43, 108, 176, 0.2);
        }
        .token-status.success,
        .repo-status.success,
        .file-status-bar.create {
            background: #f0fff4;
            color: #276749;
            border: 1px solid rgba(56, 161, 105, 0.2);
        }
        .token-status.error,
        .repo-status.error,
        .file-status-bar.update {
            background: #fff5f5;
            color: #9b2c2c;
            border: 1px solid rgba(229, 62, 62, 0.2);
        }
        .status-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(43, 108, 176, 0.2);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .repo-select-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .repo-select-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .repo-select-row .btn-load-wrap {
            align-self: stretch;
        }
        .repo-info-box {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 14px;
            color: var(--gray-600);
            min-height: 50px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }
        .repo-info-box .repo-desc {
            color: var(--gray-700);
            font-style: italic;
            width: 100%;
        }
        .repo-info-box .repo-desc.empty {
            color: var(--gray-400);
        }
        .repo-info-box .repo-branch-label {
            font-weight: 600;
            color: var(--gray-500);
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .repo-info-box .repo-branch-label select {
            flex: 1;
            min-height: var(--touch-size);
            padding: 6px 10px;
            font-size: 16px;
            border: 1px solid var(--gray-200);
            border-radius: 4px;
            background: #fff;
            font-family: var(--font);
        }
        .tree-browser {
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--gray-50);
            overflow: hidden;
            display: none;
        }
        .tree-browser.visible {
            display: block;
        }
        .tree-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--gray-100);
            border-bottom: 1px solid var(--gray-200);
        }
        .tree-toolbar .tree-search {
            flex: 1;
            min-height: var(--touch-size);
            font-size: 16px;
            padding: 6px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            outline: none;
            background: #fff;
            font-family: var(--font);
        }
        .tree-toolbar .tree-stats {
            font-size: 12px;
            color: var(--gray-500);
            white-space: nowrap;
        }
        .tree-toolbar .btn-collapse-all {
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            color: var(--gray-600);
            font-family: var(--font);
            min-height: var(--touch-size);
            touch-action: manipulation;
        }
        .tree-content {
            max-height: 300px;
            overflow-y: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }
        .tree-node-row {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 15px;
            color: var(--gray-700);
            transition: background 0.15s;
            gap: 8px;
            min-height: var(--touch-size);
            touch-action: manipulation;
        }
        .tree-node-row:hover {
            background: var(--primary-light);
        }
        .tree-node-row.selected {
            background: rgba(43, 108, 176, 0.12);
            color: var(--primary-dark);
            font-weight: 600;
        }
        .tree-node-row .toggle {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--gray-400);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .tree-node-row .toggle.expanded {
            transform: rotate(90deg);
        }
        .tree-node-row .toggle.hidden {
            visibility: hidden;
        }
        .tree-node-row .node-icon {
            flex-shrink: 0;
            font-size: 18px;
            width: 26px;
            text-align: center;
        }
        .tree-node-row .node-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tree-empty {
            padding: 30px 20px;
            text-align: center;
            color: var(--gray-400);
            font-size: 15px;
        }
        .path-selector {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .path-selector input {
            flex: 1;
            min-height: var(--touch-size);
        }
        .path-selector .btn-browse {
            padding: 0 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--gray-50);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-600);
            white-space: nowrap;
            font-family: var(--font);
            min-height: var(--touch-size);
            touch-action: manipulation;
        }
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            align-items: center;
            margin-top: 6px;
            font-size: 13px;
            min-height: 28px;
        }
        .breadcrumb .crumb {
            color: var(--primary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            touch-action: manipulation;
        }
        .breadcrumb .crumb.current {
            color: var(--gray-700);
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb .sep {
            color: var(--gray-400);
            font-size: 10px;
        }
        .content-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }
        .content-actions .btn-file {
            padding: 8px 18px;
            font-size: 15px;
            border: 1.5px solid var(--gray-300);
            border-radius: var(--radius-sm);
            background: var(--gray-50);
            cursor: pointer;
            font-family: var(--font);
            color: var(--gray-700);
            min-height: var(--touch-size);
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .content-actions .file-name-display {
            font-size: 14px;
            color: var(--gray-500);
            word-break: break-all;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 2px solid var(--gray-100);
        }
        .btn {
            font-family: var(--font);
            font-size: 16px;
            font-weight: 600;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--gray-100);
            color: var(--gray-700);
            min-height: var(--touch-size);
            touch-action: manipulation;
            width: 100%;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--gray-300);
            color: var(--gray-700);
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .btn-danger-outline {
            background: transparent;
            border: 1.5px solid var(--danger);
            color: var(--danger);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .result-area {
            margin-top: 16px;
            border-radius: var(--radius);
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            display: none;
        }
        .result-area.visible {
            display: block;
        }
        .result-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--gray-200);
            background: var(--gray-100);
        }
        .result-body {
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--gray-700);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: var(--mono);
            font-size: 13px;
            -webkit-overflow-scrolling: touch;
        }
        .result-body .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .result-body .detail-row {
            display: flex;
            gap: 8px;
            padding: 3px 0;
        }
        .result-body .detail-row .label {
            font-weight: 600;
            color: var(--gray-500);
            min-width: 70px;
        }
        .footer-note {
            margin-top: 16px;
            font-size: 12px;
            color: var(--gray-500);
            text-align: center;
            border-top: 1px solid var(--gray-100);
            padding-top: 12px;
        }
        .network-tip {
            background: #fefcbf;
            border: 1px solid var(--warning);
            color: #744210;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .network-tip.visible {
            display: block;
        }
        .retry-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
        }
        @media (max-width: 480px) {
            .app-container {
                padding: 16px 12px 20px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header .sub {
                font-size: 11px;
            }
            .section-title {
                font-size: 14px;
            }
            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px;
            }
            .repo-info-box {
                font-size: 13px;
                padding: 8px 12px;
            }
            .tree-node-row {
                font-size: 14px;
                padding: 6px 10px;
            }
            .btn {
                font-size: 15px;
                padding: 10px 16px;
            }
            .content-actions .btn-file {
                font-size: 14px;
                padding: 6px 14px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container" id="app">
        <header class="header">
            <div class="header-icon">📂</div>
            <h1>GitHub 文件提交</h1>
            <span class="sub">硬编码测试</span>
        </header>

        <form id="githubForm" autocomplete="off">
            <!-- Step 1: 认证 -->
            <div class="section">
                <div class="section-title"><span class="step-num">1</span> 身份认证</div>
                <div class="form-group full-width">
                    <label>🔑 Personal Access Token <span class="required">*</span> <span class="badge">硬编码占位</span></label>
                    <div class="token-wrapper">
                        <div class="form-group">
                            <!-- 硬编码 Token 占位，测试时可替换为真实 Token -->
                            <input type="password" id="token" placeholder="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" value="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" required />
                            <div class="hint">⚠️ 当前为硬编码占位 Token，请替换为真实 Token（仅测试用）</div>
                        </div>
                        <div class="btn-verify-wrap">
                            <button type="button" class="btn btn-outline" id="btnVerifyToken" style="width:100%;">🔍 验证</button>
                        </div>
                    </div>
                    <div class="token-status" id="tokenStatus">
                        <span class="status-spinner" id="tokenStatusSpinner"></span>
                        <span id="tokenStatusText">正在验证…</span>
                    </div>
                </div>
            </div>

            <!-- Step 2: 仓库 -->
            <div class="section">
                <div class="section-title"><span class="step-num">2</span> 选择仓库</div>
                <div class="repo-select-area">
                    <div class="repo-select-row">
                        <div class="form-group">
                            <label>👤 所有者 <span class="required">*</span></label>
                            <input type="text" id="owner" placeholder="用户名或组织名" required />
                            <div class="hint">验证 Token 后自动填充。</div>
                        </div>
                        <div class="form-group">
                            <label>📦 仓库名 <span class="required">*</span></label>
                            <div class="repo-input-wrapper">
                                <input type="text" id="repo" list="repoDatalist" placeholder="从列表中选择或手动输入" required autocomplete="off" />
                                <datalist id="repoDatalist"></datalist>
                                <button type="button" class="clear-btn" id="repoClearBtn" title="清空输入">✕</button>
                            </div>
                            <div class="hint">输入或选择仓库，清空输入框可查看所有仓库。</div>
                        </div>
                        <div class="btn-load-wrap">
                            <button type="button" class="btn btn-outline" id="btnLoadRepo" style="width:100%;">📡 加载仓库</button>
                        </div>
                    </div>
                    <div class="repo-info-box" id="repoInfoBox">
                        <span>📋 简介：</span>
                        <span class="repo-desc empty" id="repoDesc">请选择仓库</span>
                        <span class="repo-branch-label">
                            🌿 分支：
                            <select id="branchSelect">
                                <option value="">— 请先选择仓库 —</option>
                            </select>
                        </span>
                    </div>
                </div>
                <div class="repo-status" id="repoStatus">
                    <span class="status-spinner" id="repoStatusSpinner"></span>
                    <span id="repoStatusText">正在加载…</span>
                </div>
            </div>

            <!-- Step 3: 路径选择 -->
            <div class="section">
                <div class="section-title"><span class="step-num">3</span> 选择文件路径</div>
                <div class="tree-browser" id="treeBrowser">
                    <div class="tree-toolbar">
                        <input type="text" class="tree-search" id="treeSearch" placeholder="🔍 搜索文件或目录…" />
                        <span class="tree-stats" id="treeStats"></span>
                        <button type="button" class="btn-collapse-all" id="btnCollapseAll">收起</button>
                    </div>
                    <div class="tree-content" id="treeContent"><div class="tree-empty">请先加载仓库</div></div>
                </div>
                <div class="form-group full-width" style="margin-top:10px;">
                    <label>📄 目标文件路径 <span class="required">*</span></label>
                    <div class="path-selector">
                        <input type="text" id="path" placeholder="src/components/App.js" required />
                        <button type="button" class="btn-browse" id="btnToggleTree">📁 浏览</button>
                    </div>
                    <div class="breadcrumb" id="breadcrumb"></div>
                    <div class="file-status-bar" id="fileStatusBar">
                        <span id="fileStatusIcon"></span>
                        <span id="fileStatusText"></span>
                    </div>
                </div>
            </div>

            <!-- Step 4: 提交内容 -->
            <div class="section">
                <div class="section-title"><span class="step-num">4</span> 提交内容</div>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>✏️ 提交信息 <span class="required">*</span></label>
                        <input type="text" id="message" placeholder="feat: 添加新功能" required />
                    </div>
                    <div class="form-group full-width">
                        <label>📝 文件内容 <span class="required">*</span></label>
                        <textarea id="content" placeholder="输入文件内容… (Ctrl+Enter 快速提交)" required></textarea>
                        <div class="content-actions">
                            <button type="button" class="btn-file" id="btnSelectFile">📂 选择本地文件</button>
                            <span class="file-name-display" id="selectedFileName"></span>
                            <span class="hint" style="margin-left:auto;">支持 UTF-8 文本</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>🌿 目标分支（备用）</label>
                        <input type="text" id="branch" placeholder="自动从下拉框同步" readonly />
                        <div class="hint">实际使用上方下拉框选择的分支。</div>
                    </div>
                    <div class="form-group">
                        <label>🔗 文件 SHA <span class="badge">自动获取</span></label>
                        <input type="text" id="sha" placeholder="自动填充" />
                        <div class="hint">更新已有文件时自动获取。</div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button type="submit" class="btn btn-primary" id="btnSubmit">🚀 提交文件</button>
                <button type="button" class="btn btn-outline" id="btnAutoDetect">🔍 智能检测文件状态</button>
                <button type="reset" class="btn btn-danger-outline" id="btnClear">🗑️ 清空表单</button>
            </div>
            <div class="network-tip" id="networkTip">
                ⚠️ 网络请求异常，已自动重试 <span id="retryCount">0</span> 次。如持续失败，请检查网络连接或稍后重试。
                <button class="retry-btn" id="manualRetryBtn">🔄 手动重试</button>
            </div>
        </form>

        <!-- Result -->
        <div class="result-area" id="resultArea">
            <div class="result-header" id="resultHeader">
                <span class="status-icon" id="resultIcon">📌</span>
                <span id="resultTitle">结果</span>
            </div>
            <div class="result-body" id="resultBody"></div>
        </div>
        <div class="footer-note">💡 所有请求均在前端发出 · 令牌硬编码占位 · 自动重试最多3次</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM =====
            const $ = id => document.getElementById(id);
            const form = $('githubForm');
            const tokenInput = $('token');
            const ownerInput = $('owner');
            const repoInput = $('repo');
            const repoDatalist = $('repoDatalist');
            const repoClearBtn = $('repoClearBtn');
            const pathInput = $('path');
            const messageInput = $('message');
            const contentInput = $('content');
            const shaInput = $('sha');
            const branchInput = $('branch');
            const branchSelect = $('branchSelect');
            const btnSelectFile = $('btnSelectFile');
            const selectedFileName = $('selectedFileName');
            const btnVerifyToken = $('btnVerifyToken');
            const btnLoadRepo = $('btnLoadRepo');
            const btnSubmit = $('btnSubmit');
            const btnClear = $('btnClear');
            const btnAutoDetect = $('btnAutoDetect');
            const btnToggleTree = $('btnToggleTree');
            const btnCollapseAll = $('btnCollapseAll');
            const tokenStatus = $('tokenStatus');
            const tokenStatusSpinner = $('tokenStatusSpinner');
            const tokenStatusText = $('tokenStatusText');
            const repoStatus = $('repoStatus');
            const repoStatusSpinner = $('repoStatusSpinner');
            const repoStatusText = $('repoStatusText');
            const repoDesc = $('repoDesc');
            const treeBrowser = $('treeBrowser');
            const treeContent = $('treeContent');
            const treeSearch = $('treeSearch');
            const treeStats = $('treeStats');
            const breadcrumb = $('breadcrumb');
            const fileStatusBar = $('fileStatusBar');
            const fileStatusIcon = $('fileStatusIcon');
            const fileStatusText = $('fileStatusText');
            const resultArea = $('resultArea');
            const resultIcon = $('resultIcon');
            const resultTitle = $('resultTitle');
            const resultBody = $('resultBody');
            const networkTip = $('networkTip');
            const retryCountSpan = $('retryCount');
            const manualRetryBtn = $('manualRetryBtn');

            // ===== State =====
            let repoTree = [];
            let treeMap = {};
            let childrenMap = {};
            let repoDefaultBranch = '';
            let treeVisible = false;
            let fileExistsCache = {};
            let repoList = [];
            let currentUser = null;
            let currentRepoBranches = [];
            let lastFailedAction = null;

            // ===== 带重试的 fetch =====
            async function fetchWithRetry(url, options = {}, maxRetries = 3, timeout = 15000) {
                let lastError;
                let attempt = 0;
                while (attempt < maxRetries) {
                    attempt++;
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), timeout);
                        const response = await fetch(url, {
                            ...options,
                            signal: controller.signal,
                        });
                        clearTimeout(timeoutId);
                        if (response.status >= 500 || response.status === 0) {
                            throw new Error('Server error or network issue');
                        }
                        return response;
                    } catch (err) {
                        lastError = err;
                        if (err.name === 'AbortError') {
                            lastError = new Error('请求超时（' + timeout + 'ms）');
                            lastError.timeout = true;
                        }
                        if (attempt >= maxRetries) break;
                        const delay = Math.pow(2, attempt - 1) * 1000;
                        await new Promise(r => setTimeout(r, delay));
                    }
                }
                throw lastError;
            }

            // ===== Utilities =====
            function utf8ToBase64(str) {
                const encoder = new TextEncoder();
                const bytes = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                return btoa(binary);
            }

            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            function getVal(el) { return el.value ? el.value.trim() : ''; }

            function setLoading(btn, loading) {
                if (loading) {
                    btn.disabled = true;
                    btn.dataset.originalText = btn.innerHTML;
                    btn.innerHTML = '<span class="spinner"></span> 处理中…';
                } else {
                    btn.disabled = false;
                    if (btn.dataset.originalText) {
                        btn.innerHTML = btn.dataset.originalText;
                        delete btn.dataset.originalText;
                    }
                }
            }

            function showResult(status, title, bodyHTML, isError) {
                resultArea.classList.add('visible');
                resultIcon.textContent = isError ? '❌' : (status === 'success' ? '✅' : 'ℹ️');
                resultIcon.className = 'status-icon ' + (isError ? 'error' : (status === 'success' ? 'success' : 'info'));
                resultTitle.textContent = title;
                resultBody.innerHTML = bodyHTML;
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                networkTip.classList.remove('visible');
            }

            function clearResult() {
                resultArea.classList.remove('visible');
                resultBody.innerHTML = '';
                networkTip.classList.remove('visible');
            }

            function showTokenStatus(type, text, userInfo) {
                tokenStatus.className = 'token-status visible ' + type;
                tokenStatusSpinner.style.display = type === 'loading' ? 'inline-block' : 'none';
                if (type === 'success' && userInfo) {
                    const avatarHtml = userInfo.avatar_url ?
                        '<span class="user-avatar"><img src="' + userInfo.avatar_url + '" alt="avatar" style="width:28px;height:28px;border-radius:50%;" /></span>' :
                        '';
                    tokenStatusText.innerHTML =
                        '<span class="token-user-info" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                        avatarHtml +
                        '<span class="username" style="font-weight:700;">@' + escapeHtml(userInfo.login) + '</span>' +
                        (userInfo.name ? '<span style="color:var(--gray-500);">' + escapeHtml(userInfo.name) + '</span>' :
                            '') +
                        '<span class="repo-count" style="font-size:12px;color:var(--gray-500);background:var(--gray-100);padding:1px 10px;border-radius:12px;">📦 ' +
                        (userInfo.public_repos || 0) + ' 个仓库</span>' +
                        '</span>' +
                        (text ? '<span style="margin-left:auto;color:var(--gray-500);font-size:12px;">' + text + '</span>' :
                            '');
                } else {
                    tokenStatusText.textContent = text || '';
                }
            }

            function hideTokenStatus() { tokenStatus.classList.remove('visible'); }

            function showRepoStatus(type, text) {
                repoStatus.className = 'repo-status visible ' + type;
                repoStatusText.textContent = text;
                repoStatusSpinner.style.display = type === 'loading' ? 'inline-block' : 'none';
            }

            function hideRepoStatus() { repoStatus.classList.remove('visible'); }

            function showFileStatus(type, icon, text) {
                fileStatusBar.className = 'file-status-bar visible ' + type;
                fileStatusIcon.textContent = icon;
                fileStatusText.innerHTML = text;
            }

            function hideFileStatus() { fileStatusBar.classList.remove('visible'); }

            function apiHeaders() {
                return {
                    'Authorization': 'Bearer ' + getVal(tokenInput),
                    'Accept': 'application/vnd.github.v3+json',
                };
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function getFileIcon(name, type) {
                if (type === 'tree') return '📁';
                const ext = name.split('.').pop().toLowerCase();
                const icons = {
                    js: '🟨',
                    ts: '🔷',
                    jsx: '⚛️',
                    tsx: '⚛️',
                    html: '🌐',
                    css: '🎨',
                    scss: '🎨',
                    less: '🎨',
                    json: '📋',
                    xml: '📋',
                    yaml: '📋',
                    yml: '📋',
                    toml: '📋',
                    md: '📝',
                    txt: '📄',
                    csv: '📊',
                    py: '🐍',
                    rb: '💎',
                    go: '🔵',
                    rs: '🦀',
                    java: '☕',
                    php: '🐘',
                    c: '🔧',
                    cpp: '🔧',
                    h: '🔧',
                    sh: '⚙️',
                    bash: '⚙️',
                    zsh: '⚙️',
                    svg: '🖼️',
                    png: '🖼️',
                    jpg: '🖼️',
                    gif: '🖼️',
                    ico: '🖼️',
                    lock: '🔒',
                    gitignore: '🙈',
                    env: '🔐',
                };
                return icons[ext] || '📄';
            }

            function highlightText(text, filter) {
                if (!filter) return escapeHtml(text);
                const idx = text.toLowerCase().indexOf(filter.toLowerCase());
                if (idx === -1) return escapeHtml(text);
                return escapeHtml(text.substring(0, idx)) +
                    '<span class="highlight">' + escapeHtml(text.substring(idx, idx + filter.length)) + '</span>' +
                    escapeHtml(text.substring(idx + filter.length));
            }

            // ===== Tree functions =====
            function buildTree(flatTree) {
                treeMap = {};
                childrenMap = {};
                flatTree.sort((a, b) => {
                    const aIsDir = a.type === 'tree' ? 0 : 1;
                    const bIsDir = b.type === 'tree' ? 0 : 1;
                    if (aIsDir !== bIsDir) return aIsDir - bIsDir;
                    return a.path.localeCompare(b.path);
                });
                for (const node of flatTree) {
                    treeMap[node.path] = node;
                    const parts = node.path.split('/');
                    const parentPath = parts.slice(0, -1).join('/');
                    if (!childrenMap[parentPath]) childrenMap[parentPath] = [];
                    childrenMap[parentPath].push(node);
                }
            }

            function renderTree(filter) {
                const f = (filter || '').toLowerCase().trim();
                treeContent.innerHTML = '';
                let filteredPaths = repoTree;
                if (f) filteredPaths = repoTree.filter(n => n.path.toLowerCase().includes(f));
                if (filteredPaths.length === 0) {
                    treeContent.innerHTML = '<div class="tree-empty">' + (f ? '没有匹配的文件' : '仓库为空') + '</div>';
                    treeStats.textContent = '0 项';
                    return;
                }
                const rootChildren = childrenMap[''] || [];
                if (rootChildren.length === 0 && !f) {
                    treeContent.innerHTML = '<div class="tree-empty">仓库为空</div>';
                    treeStats.textContent = '0 项';
                    return;
                }
                if (f) {
                    renderFlatList(filteredPaths, f);
                } else {
                    const fragment = document.createDocumentFragment();
                    for (const child of rootChildren) fragment.appendChild(createTreeNode(child, 0));
                    treeContent.appendChild(fragment);
                }
                const dirCount = repoTree.filter(n => n.type === 'tree').length;
                const fileCount = repoTree.filter(n => n.type === 'blob').length;
                treeStats.textContent = dirCount + ' 目录, ' + fileCount + ' 文件';
            }

            function renderFlatList(nodes, filter) {
                const fragment = document.createDocumentFragment();
                for (const node of nodes) {
                    const row = document.createElement('div');
                    row.className = 'tree-node-row';
                    row.style.paddingLeft = '14px';
                    const icon = getFileIcon(node.path.split('/').pop(), node.type);
                    row.innerHTML =
                        '<span class="node-icon">' + icon + '</span>' +
                        '<span class="node-name">' + highlightText(node.path, filter) + '</span>';
                    row.addEventListener('click', function() { selectPath(node.path, node); });
                    fragment.appendChild(row);
                }
                treeContent.appendChild(fragment);
            }

            function createTreeNode(node, depth) {
                const container = document.createElement('div');
                container.className = 'tree-node';
                const name = node.path.split('/').pop();
                const isDir = node.type === 'tree';
                const hasChildren = childrenMap[node.path] && childrenMap[node.path].length > 0;
                const icon = getFileIcon(name, node.type);
                const row = document.createElement('div');
                row.className = 'tree-node-row';
                row.style.paddingLeft = (14 + depth * 20) + 'px';
                row.dataset.path = node.path;
                let toggleClass = 'toggle';
                if (!isDir) toggleClass += ' hidden';
                row.innerHTML =
                    '<span class="' + toggleClass + '">▶</span>' +
                    '<span class="node-icon">' + icon + '</span>' +
                    '<span class="node-name">' + escapeHtml(name) + '</span>' +
                    (isDir && hasChildren ? '<span class="node-meta">' + childrenMap[node.path].length + '</span>' : '');
                const childContainer = document.createElement('div');
                childContainer.className = 'tree-children';
                if (isDir && hasChildren) {
                    for (const child of childrenMap[node.path]) {
                        childContainer.appendChild(createTreeNode(child, depth + 1));
                    }
                }
                row.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isDir) {
                        const toggle = row.querySelector('.toggle');
                        const isExpanded = childContainer.classList.contains('expanded');
                        if (isExpanded) {
                            childContainer.classList.remove('expanded');
                            toggle.classList.remove('expanded');
                        } else {
                            childContainer.classList.add('expanded');
                            toggle.classList.add('expanded');
                        }
                        selectPath(node.path + '/', node);
                    } else {
                        selectPath(node.path, node);
                    }
                });
                container.appendChild(row);
                container.appendChild(childContainer);
                return container;
            }

            function selectPath(path, node) {
                pathInput.value = path;
                updateBreadcrumb(path);
                treeContent.querySelectorAll('.tree-node-row.selected').forEach(el => el.classList.remove('selected'));
                const rows = treeContent.querySelectorAll('.tree-node-row');
                rows.forEach(r => {
                    if (r.dataset.path === path || (node && node.type === 'tree' && r.dataset.path === path)) {
                        r.classList.add('selected');
                    }
                });
                autoDetectFile(path);
            }

            function updateBreadcrumb(path) {
                breadcrumb.innerHTML = '';
                if (!path) return;
                const parts = path.split('/').filter(Boolean);
                let accumulated = '';
                const rootCrumb = document.createElement('span');
                rootCrumb.className = 'crumb';
                rootCrumb.textContent = '📁 ' + (getVal(repoInput) || 'repo');
                rootCrumb.addEventListener('click', function() {
                    pathInput.value = '';
                    updateBreadcrumb('');
                    hideFileStatus();
                });
                breadcrumb.appendChild(rootCrumb);
                for (let i = 0; i < parts.length; i++) {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '›';
                    breadcrumb.appendChild(sep);
                    accumulated += (accumulated ? '/' : '') + parts[i];
                    const crumb = document.createElement('span');
                    const isLast = (i === parts.length - 1);
                    if (isLast && !path.endsWith('/')) {
                        crumb.className = 'crumb current';
                    } else {
                        crumb.className = 'crumb';
                        const targetPath = accumulated + (isLast && path.endsWith('/') ? '/' : '');
                        crumb.addEventListener('click', function() {
                            if (isLast && path.endsWith('/')) {
                                pathInput.value = accumulated + '/';
                            } else {
                                pathInput.value = accumulated;
                            }
                            updateBreadcrumb(pathInput.value);
                            autoDetectFile(pathInput.value);
                        });
                    }
                    crumb.textContent = parts[i];
                    breadcrumb.appendChild(crumb);
                }
            }

            // ===== Auto detect with retry =====
            async function autoDetectFile(path) {
                if (!path || path.endsWith('/')) {
                    hideFileStatus();
                    shaInput.value = '';
                    return;
                }
                const token = getVal(tokenInput);
                const owner = getVal(ownerInput);
                const repo = getVal(repoInput);
                if (!token || !owner || !repo) return;
                const branch = getVal(branchSelect) || repoDefaultBranch;
                if (!branch) return;
                if (fileExistsCache[path] !== undefined) {
                    const cached = fileExistsCache[path];
                    if (cached.exists) {
                        showFileStatus('update', '🔄',
                            '文件已存在 · SHA: <code>' + cached.sha.substring(0, 10) + '…</code> · 大小: ' + formatSize(
                            cached.size) + ' · 将执行 <strong>更新</strong> 操作');
                        shaInput.value = cached.sha;
                    } else {
                        showFileStatus('create', '✨', '文件不存在 · 将执行 <strong>创建</strong> 新文件操作');
                        shaInput.value = '';
                    }
                    return;
                }
                showFileStatus('checking', '⏳', '正在检测文件状态…');
                try {
                    const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + encodeURIComponent(
                        path) + '?ref=' + encodeURIComponent(branch);
                    const resp = await fetchWithRetry(url, { headers: apiHeaders() }, 2, 10000);
                    if (resp.ok) {
                        const data = await resp.json();
                        fileExistsCache[path] = { exists: true, sha: data.sha, size: data.size };
                        showFileStatus('update', '🔄',
                            '文件已存在 · SHA: <code>' + data.sha.substring(0, 10) + '…</code> · 大小: ' + formatSize(
                            data.size) + ' · 将执行 <strong>更新</strong> 操作');
                        shaInput.value = data.sha;
                    } else if (resp.status === 404) {
                        fileExistsCache[path] = { exists: false, sha: '', size: 0 };
                        showFileStatus('create', '✨', '文件不存在 · 将执行 <strong>创建</strong> 新文件操作');
                        shaInput.value = '';
                    } else {
                        hideFileStatus();
                    }
                } catch (err) {
                    if (err.timeout) {
                        showFileStatus('checking', '⏰', '检测超时，请检查网络');
                        networkTip.classList.add('visible');
                        retryCountSpan.textContent = '3';
                        lastFailedAction = () => autoDetectFile(path);
                    } else {
                        hideFileStatus();
                    }
                }
            }

            // ===== Token 验证 =====
            async function verifyToken(showStatus = true) {
                const token = getVal(tokenInput);
                if (!token) {
                    if (showStatus) showTokenStatus('error', '⚠️ 请先输入 Personal Access Token');
                    return false;
                }
                if (showStatus) showTokenStatus('loading', '正在验证 Token…');
                try {
                    const resp = await fetchWithRetry('https://api.github.com/user', {
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Accept': 'application/vnd.github.v3+json',
                        }
                    }, 3, 10000);
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        if (showStatus) showTokenStatus('error', '❌ Token 无效: ' + (err.message || 'HTTP ' + resp.status));
                        return false;
                    }
                    const user = await resp.json();
                    currentUser = user;
                    ownerInput.value = user.login;
                    if (showStatus) {
                        showTokenStatus('success', '验证成功', {
                            login: user.login,
                            name: user.name || '',
                            avatar_url: user.avatar_url || '',
                            public_repos: user.public_repos || 0,
                        });
                    }
                    await fetchUserRepos(showStatus);
                    return true;
                } catch (err) {
                    if (err.timeout) {
                        if (showStatus) showTokenStatus('error', '⏰ 验证超时，请检查网络');
                        networkTip.classList.add('visible');
                        retryCountSpan.textContent = '3';
                        lastFailedAction = () => verifyToken(showStatus);
                    } else {
                        if (showStatus) showTokenStatus('error', '❌ 网络错误: ' + (err.message || '请求失败'));
                    }
                    return false;
                }
            }

            async function fetchUserRepos(showStatus = true) {
                const token = getVal(tokenInput);
                if (!token) return;
                try {
                    const resp = await fetchWithRetry('https://api.github.com/user/repos?per_page=100&sort=updated&type=all', {
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Accept': 'application/vnd.github.v3+json',
                        }
                    }, 3, 12000);
                    if (!resp.ok) {
                        if (showStatus) showTokenStatus('error', '❌ 获取仓库列表失败: HTTP ' + resp.status);
                        return;
                    }
                    const repos = await resp.json();
                    repoList = repos.map(r => ({
                        name: r.name,
                        description: r.description || '',
                        default_branch: r.default_branch || 'main',
                    }));
                    repoDatalist.innerHTML = '';
                    for (const repo of repoList) {
                        const opt = document.createElement('option');
                        opt.value = repo.name;
                        repoDatalist.appendChild(opt);
                    }
                    if (showStatus) {
                        const user = currentUser;
                        if (user && tokenStatus.classList.contains('visible')) {
                            showTokenStatus('success', '已加载 ' + repoList.length + ' 个仓库', {
                                login: user.login,
                                name: user.name || '',
                                avatar_url: user.avatar_url || '',
                                public_repos: user.public_repos || 0,
                            });
                        }
                    }
                    branchSelect.innerHTML = '<option value="">— 请选择仓库 —</option>';
                    repoDesc.textContent = '请选择仓库';
                    repoDesc.className = 'repo-desc empty';
                } catch (err) {
                    if (err.timeout) {
                        if (showStatus) showTokenStatus('error', '⏰ 获取仓库列表超时，请检查网络');
                        networkTip.classList.add('visible');
                        retryCountSpan.textContent = '3';
                        lastFailedAction = () => fetchUserRepos(showStatus);
                    } else {
                        if (showStatus) showTokenStatus('error', '❌ 获取仓库列表失败: ' + (err.message || '请求失败'));
                    }
                }
            }

            // ===== 更新仓库信息及分支 =====
            function updateRepoInfo(repoName) {
                const found = repoList.find(r => r.name === repoName);
                if (found) {
                    repoDesc.textContent = found.description || '（无简介）';
                    repoDesc.className = 'repo-desc';
                    loadBranches(repoName);
                } else {
                    repoDesc.textContent = '未找到仓库信息';
                    repoDesc.className = 'repo-desc empty';
                    branchSelect.innerHTML = '<option value="">— 请选择仓库 —</option>';
                }
            }

            async function loadBranches(repoName) {
                const token = getVal(tokenInput);
                const owner = getVal(ownerInput);
                if (!token || !owner || !repoName) {
                    branchSelect.innerHTML = '<option value="">— 请先选择仓库 —</option>';
                    return;
                }
                try {
                    const resp = await fetchWithRetry('https://api.github.com/repos/' + owner + '/' + repoName + '/branches', {
                        headers: apiHeaders()
                    }, 2, 10000);
                    if (!resp.ok) {
                        branchSelect.innerHTML = '<option value="">— 获取分支失败 —</option>';
                        return;
                    }
                    const branches = await resp.json();
                    currentRepoBranches = branches.map(b => b.name);
                    branchSelect.innerHTML = '';
                    for (const b of currentRepoBranches) {
                        const opt = document.createElement('option');
                        opt.value = b;
                        opt.textContent = b;
                        branchSelect.appendChild(opt);
                    }
                    const found = repoList.find(r => r.name === repoName);
                    const defaultBranch = found ? found.default_branch : (currentRepoBranches.length > 0 ? currentRepoBranches[0] :
                        '');
                    if (defaultBranch && currentRepoBranches.includes(defaultBranch)) {
                        branchSelect.value = defaultBranch;
                    } else if (currentRepoBranches.length > 0) {
                        branchSelect.value = currentRepoBranches[0];
                    }
                    branchInput.value = branchSelect.value;
                } catch (err) {
                    if (err.timeout) {
                        branchSelect.innerHTML = '<option value="">— 加载分支超时 —</option>';
                        networkTip.classList.add('visible');
                        retryCountSpan.textContent = '2';
                        lastFailedAction = () => loadBranches(repoName);
                    } else {
                        branchSelect.innerHTML = '<option value="">— 加载分支失败 —</option>';
                    }
                }
            }

            // ===== Load Repository =====
            async function loadRepo() {
                const token = getVal(tokenInput);
                const owner = getVal(ownerInput);
                const repo = getVal(repoInput);
                if (!token || !owner || !repo) {
                    showResult('error', '信息不完整', '请填写 Token、仓库所有者和仓库名称。', true);
                    return;
                }
                setLoading(btnLoadRepo, true);
                showRepoStatus('loading', '正在获取仓库信息…');
                clearResult();
                fileExistsCache = {};
                try {
                    const repoUrl = 'https://api.github.com/repos/' + owner + '/' + repo;
                    const repoResp = await fetchWithRetry(repoUrl, { headers: apiHeaders() }, 3, 12000);
                    if (!repoResp.ok) {
                        const err = await repoResp.json().catch(() => ({}));
                        showRepoStatus('error', '获取仓库失败: ' + (err.message || 'HTTP ' + repoResp.status));
                        treeBrowser.classList.remove('visible');
                        setLoading(btnLoadRepo, false);
                        return;
                    }
                    const repoData = await repoResp.json();
                    repoDefaultBranch = repoData.default_branch || 'main';
                    if (!branchSelect.value) branchSelect.value = repoDefaultBranch;
                    branchInput.value = branchSelect.value;

                    showRepoStatus('loading', '正在获取目录结构 (' + branchSelect.value + ')…');
                    const treeUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/' + encodeURIComponent(
                        branchSelect.value) + '?recursive=1';
                    const treeResp = await fetchWithRetry(treeUrl, { headers: apiHeaders() }, 3, 15000);
                    if (!treeResp.ok) {
                        const err = await treeResp.json().catch(() => ({}));
                        showRepoStatus('error', '获取目录失败: ' + (err.message || 'HTTP ' + treeResp.status));
                        setLoading(btnLoadRepo, false);
                        return;
                    }
                    const treeData = await treeResp.json();
                    repoTree = treeData.tree || [];
                    repoTree = repoTree.filter(n => n.type === 'tree' || n.type === 'blob');
                    buildTree(repoTree);

                    showRepoStatus('success',
                        '✅ ' + owner + '/' + repo + ' · 分支: ' + branchSelect.value +
                        ' · ' + repoTree.filter(n => n.type === 'tree').length + ' 目录, ' +
                        repoTree.filter(n => n.type === 'blob').length + ' 文件');

                    treeBrowser.classList.add('visible');
                    treeVisible = true;
                    btnToggleTree.textContent = '📁 收起';
                    renderTree('');
                    treeSearch.value = '';
                } catch (err) {
                    if (err.timeout) {
                        showRepoStatus('error', '⏰ 请求超时，请检查网络');
                        networkTip.classList.add('visible');
                        retryCountSpan.textContent = '3';
                        lastFailedAction = loadRepo;
                    } else {
                        showRepoStatus('error', '网络错误: ' + (err.message || '请求失败'));
                    }
                } finally {
                    setLoading(btnLoadRepo, false);
                }
            }

            // ===== Submit file =====
            async function submitFile(e) {
                e.preventDefault();
                const token = getVal(tokenInput);
                const owner = getVal(ownerInput);
                const repo = getVal(repoInput);
                let path = getVal(pathInput);
                const message = getVal(messageInput);
                const contentRaw = contentInput.value;
                let sha = getVal(shaInput) || undefined;
                const branch = getVal(branchSelect) || repoDefaultBranch;

                const fields = [
                    { val: token, name: 'Token' },
                    { val: owner, name: '仓库所有者' },
                    { val: repo, name: '仓库名称' },
                    { val: path, name: '文件路径' },
                    { val: message, name: '提交信息' },
                    { val: contentRaw, name: '文件内容' },
                ];
                for (const f of fields) {
                    if (!f.val) {
                        showResult('error', '表单不完整', '<strong>请填写「' + f.name + '」字段。</strong>', true);
                        return;
                    }
                }
                if (!branch) {
                    showResult('error', '分支未选择', '请从分支下拉框中选择一个分支。', true);
                    return;
                }
                path = path.replace(/\/+$/, '');

                if (!sha) {
                    try {
                        const checkUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' +
                            encodeURIComponent(path) + '?ref=' + encodeURIComponent(branch);
                        const checkResp = await fetchWithRetry(checkUrl, { headers: apiHeaders() }, 2, 10000);
                        if (checkResp.ok) {
                            const checkData = await checkResp.json();
                            sha = checkData.sha;
                            shaInput.value = sha;
                        }
                    } catch (_) { /* ignore */ }
                }

                let contentBase64;
                try {
                    contentBase64 = utf8ToBase64(contentRaw);
                } catch (encErr) {
                    showResult('error', '编码失败', '⚠️ 文件内容编码失败：' + (encErr.message || '未知错误'), true);
                    return;
                }

                const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + encodeURIComponent(path);
                const payload = {
                    message: message,
                    content: contentBase64,
                    branch: branch,
                };
                if (sha) payload.sha = sha;

                try {
                    setLoading(btnSubmit, true);
                    clearResult();
                    const resp = await fetchWithRetry(url, {
                        method: 'PUT',
                        headers: Object.assign(apiHeaders(), { 'Content-Type': 'application/json' }),
                        body: JSON.stringify(payload),
                    }, 3, 15000);
                    const data = await resp.json().catch(() => ({}));

                    if (!resp.ok) {
                        if (resp.status === 409) {
                            showResult('error', '文件冲突',
                                '⚠️ 文件 <strong>' + path + '</strong> 已存在，但未提供正确的 SHA。<br>已尝试自动获取，请重试或手动填写 SHA。',
                                true);
                            return;
                        }
                        if (resp.status === 403) {
                            showResult('error', '权限不足',
                                '❌ 令牌缺少对仓库内容的写入权限，请检查 Token 是否包含 <code>contents</code> 读写权限。', true);
                            return;
                        }
                        if (resp.status === 422) {
                            showResult('error', '验证失败',
                                '<strong>' + (data.message || '请求参数有误') + '</strong><br>' +
                                '<details style="margin-top:8px;"><summary style="cursor:pointer;color:var(--primary);">查看详情</summary>' +
                                '<pre style="background:var(--gray-100);padding:10px;border-radius:6px;font-size:12px;overflow:auto;margin-top:6px;">' +
                                escapeHtml(JSON.stringify(data, null, 2)) + '</pre></details>', true);
                            return;
                        }
                        showResult('error', '提交失败',
                            '<strong>' + (data.message || 'HTTP ' + resp.status) + '</strong><br>' +
                            '<details style="margin-top:8px;"><summary style="cursor:pointer;color:var(--primary);">查看详情</summary>' +
                            '<pre style="background:var(--gray-100);padding:10px;border-radius:6px;font-size:12px;overflow:auto;margin-top:6px;">' +
                            escapeHtml(JSON.stringify(data, null, 2)) + '</pre></details>', true);
                        return;
                    }

                    const commitUrl = data.commit && data.commit.html_url || '';
                    const fileUrl = data.content && data.content.html_url || '';
                    const shaResult = (data.content && data.content.sha) || '';
                    const isUpdate = !!sha;
                    let successHTML =
                        '✅ 文件 <strong>' + path + '</strong> 已成功' + (isUpdate ? '更新' : '创建') + '！' +
                        '<div style="margin-top:12px;background:var(--gray-100);padding:12px 16px;border-radius:8px;">' +
                        '<div class="detail-row"><span class="label">SHA</span><span style="font-family:monospace;">' +
                        shaResult + '</span></div>' +
                        '<div class="detail-row"><span class="label">提交信息</span><span>' + escapeHtml(message) +
                        '</span></div>' +
                        '<div class="detail-row"><span class="label">分支</span><span>' + escapeHtml(branch) +
                        '</span></div>' +
                        '<div class="detail-row"><span class="label">操作</span><span>' + (isUpdate ? '更新文件' :
                            '创建新文件') + '</span></div>' +
                        '</div>';
                    if (fileUrl) successHTML += '<div style="margin-top:12px;">🔗 <a href="' + fileUrl +
                        '" target="_blank" class="link">查看文件 on GitHub</a></div>';
                    if (commitUrl) successHTML += '<div style="margin-top:4px;">🔗 <a href="' + commitUrl +
                        '" target="_blank" class="link">查看提交记录</a></div>';
                    showResult('success', '提交成功', successHTML, false);
                    delete fileExistsCache[path];
                    shaInput.value = '';
                    hideFileStatus();
                } catch (err) {
                    if (err.timeout) {
                        showResult('error', '提交超时',
                            '⏰ 请求超时，请检查网络连接。已自动重试，如仍失败，请稍后再试。', true);
                        networkTip.classList.add('visible');
                        retryCountSpan.textContent = '3';
                        lastFailedAction = () => submitFile(e);
                    } else {
                        showResult('error', '网络错误', '⚠️ ' + (err.message || '请求失败，请检查网络连接。'), true);
                    }
                } finally {
                    setLoading(btnSubmit, false);
                }
            }

            // ===== 本地文件读取 =====
            function handleFileSelect() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.js,.ts,.jsx,.tsx,.html,.css,.scss,.less,.json,.xml,.yaml,.yml,.toml,.md,.txt,.py,.rb,.go,.rs,.java,.php,.c,.cpp,.h,.sh,.bash,.zsh,.gitignore,.env,.lock,.svg,.png,.jpg,.gif,.ico';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const text = ev.target.result;
                            contentInput.value = text;
                            const fileName = file.name;
                            const currentPath = getVal(pathInput);
                            if (!currentPath || !currentPath.includes('/')) {
                                pathInput.value = fileName;
                            } else {
                                const dir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                                pathInput.value = dir + fileName;
                            }
                            selectedFileName.textContent = '📎 ' + fileName;
                            pathInput.dispatchEvent(new Event('input'));
                        } catch (err) {
                            showResult('error', '读取文件失败', '⚠️ 无法读取文件内容：' + (err.message || '未知错误'), true);
                        }
                    };
                    reader.onerror = function() {
                        showResult('error', '读取文件失败', '⚠️ 文件读取出错，请重试。', true);
                    };
                    reader.readAsText(file, 'UTF-8');
                };
                input.click();
            }

            // ===== Event Bindings =====
            btnVerifyToken.addEventListener('click', function() { verifyToken(true); });
            let tokenVerifyTimer;
            tokenInput.addEventListener('blur', function() {
                clearTimeout(tokenVerifyTimer);
                tokenVerifyTimer = setTimeout(function() {
                    const token = getVal(tokenInput);
                    if (token) verifyToken(true);
                }, 300);
            });
            tokenInput.addEventListener('input', function() { hideTokenStatus(); });

            let repoInfoTimer;
            repoInput.addEventListener('input', function() {
                clearTimeout(repoInfoTimer);
                const val = getVal(repoInput);
                if (val) repoClearBtn.classList.add('visible');
                else repoClearBtn.classList.remove('visible');
                if (val) {
                    repoInfoTimer = setTimeout(function() { updateRepoInfo(val); }, 400);
                } else {
                    repoDesc.textContent = '请选择仓库';
                    repoDesc.className = 'repo-desc empty';
                    branchSelect.innerHTML = '<option value="">— 请选择仓库 —</option>';
                }
            });
            repoClearBtn.addEventListener('click', function() {
                repoInput.value = '';
                repoClearBtn.classList.remove('visible');
                repoDesc.textContent = '请选择仓库';
                repoDesc.className = 'repo-desc empty';
                branchSelect.innerHTML = '<option value="">— 请选择仓库 —</option>';
                repoInput.focus();
                repoInput.dispatchEvent(new Event('input'));
            });
            repoInput.addEventListener('focus', function() { this.select(); });

            branchSelect.addEventListener('change', function() {
                branchInput.value = branchSelect.value;
                if (repoTree.length > 0) loadRepo();
                fileExistsCache = {};
                hideFileStatus();
            });

            btnSelectFile.addEventListener('click', handleFileSelect);
            btnLoadRepo.addEventListener('click', loadRepo);
            ownerInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    repoInput.focus(); } });
            repoInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    loadRepo(); } });
            form.addEventListener('submit', submitFile);

            btnClear.addEventListener('click', function() {
                setTimeout(function() {
                    clearResult();
                    hideRepoStatus();
                    hideTokenStatus();
                    hideFileStatus();
                    treeBrowser.classList.remove('visible');
                    treeVisible = false;
                    btnToggleTree.textContent = '📁 浏览';
                    breadcrumb.innerHTML = '';
                    repoTree = [];
                    treeMap = {};
                    childrenMap = {};
                    repoDefaultBranch = '';
                    fileExistsCache = {};
                    repoList = [];
                    repoDatalist.innerHTML = '';
                    shaInput.value = '';
                    branchSelect.innerHTML = '<option value="">— 请选择仓库 —</option>';
                    branchInput.value = '';
                    repoDesc.textContent = '请选择仓库';
                    repoDesc.className = 'repo-desc empty';
                    currentUser = null;
                    repoInput.value = '';
                    repoClearBtn.classList.remove('visible');
                    contentInput.value = '';
                    selectedFileName.textContent = '';
                    pathInput.value = '';
                    networkTip.classList.remove('visible');
                    lastFailedAction = null;
                    tokenInput.focus();
                }, 10);
            });

            btnToggleTree.addEventListener('click', function() {
                if (treeVisible) {
                    treeBrowser.classList.remove('visible');
                    treeVisible = false;
                    btnToggleTree.textContent = '📁 浏览';
                } else {
                    if (repoTree.length > 0) {
                        treeBrowser.classList.add('visible');
                        treeVisible = true;
                        btnToggleTree.textContent = '📁 收起';
                    } else {
                        showResult('info', '提示', '请先点击「加载仓库」获取目录结构。', false);
                    }
                }
            });

            btnCollapseAll.addEventListener('click', function() {
                treeContent.querySelectorAll('.tree-children.expanded').forEach(el => el.classList.remove('expanded'));
                treeContent.querySelectorAll('.toggle.expanded').forEach(el => el.classList.remove('expanded'));
            });

            let searchTimer;
            treeSearch.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function() { renderTree(treeSearch.value); }, 250);
            });

            let pathTimer;
            pathInput.addEventListener('input', function() {
                clearTimeout(pathTimer);
                updateBreadcrumb(pathInput.value);
                pathTimer = setTimeout(function() { autoDetectFile(pathInput.value.trim()); }, 600);
            });

            btnAutoDetect.addEventListener('click', function() {
                const path = getVal(pathInput);
                if (!path) {
                    showResult('error', '请先填写路径', '请在路径输入框中填写或选择文件路径。', true);
                    return;
                }
                autoDetectFile(path);
            });

            contentInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });

            manualRetryBtn.addEventListener('click', function() {
                if (lastFailedAction) {
                    networkTip.classList.remove('visible');
                    lastFailedAction();
                } else {
                    networkTip.classList.remove('visible');
                }
            });

            // 初始自动验证（硬编码 Token 会立即触发）
            if (getVal(tokenInput)) {
                setTimeout(function() { verifyToken(true); }, 500);
            }

            console.log('✅ GitHub 文件提交工具（硬编码测试版）已加载');
            console.log('⚠️ 请确认 Token 已替换为真实令牌，测试完成后请移除硬编码。');

        })();
    </script>

</body>
