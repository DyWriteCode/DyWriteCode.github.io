<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judge0 代码执行器</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f6f8fa;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 30px 32px 40px;
            transition: box-shadow 0.2s;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: -0.3px;
            color: #0d1117;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subhead {
            color: #57606a;
            font-size: 14px;
            margin: 0 0 24px 0;
            border-left: 3px solid #d0d7de;
            padding-left: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 16px;
            margin-bottom: 18px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 180px;
            min-width: 140px;
        }

        .field label {
            font-size: 13px;
            font-weight: 500;
            color: #24292f;
            letter-spacing: 0.3px;
        }

        .field select,
        .field input {
            padding: 9px 12px;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            font-size: 14px;
            background: #fafbfc;
            transition: 0.15s;
            font-family: inherit;
        }

        .field select:focus,
        .field input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
            background: white;
        }

        .field select {
            cursor: pointer;
        }

        .code-area {
            margin: 6px 0 16px 0;
        }

        .code-area textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px 18px;
            border: 1px solid #d0d7de;
            border-radius: 14px;
            font-size: 14px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
            background: #fafbfc;
            resize: vertical;
            line-height: 1.6;
            transition: 0.15s;
            color: #1f2328;
        }

        .code-area textarea:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
            background: white;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            align-items: center;
            margin: 8px 0 18px 0;
        }

        .btn {
            background: #0969da;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            padding: 10px 32px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(9, 105, 218, 0.2);
        }

        .btn:hover {
            background: #0550ae;
            transform: scale(1.01);
            box-shadow: 0 4px 12px rgba(9, 105, 218, 0.25);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            transform: none;
        }

        .status-badge {
            font-size: 13px;
            color: #57606a;
            background: #f0f2f4;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-block;
        }

        .result-area {
            margin-top: 6px;
            border-top: 1px solid #eaeef2;
            padding-top: 18px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .result-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #24292f;
            margin: 0;
        }

        .result-output {
            background: #0d1117;
            color: #e6edf3;
            border-radius: 14px;
            padding: 18px 20px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
            font-size: 13.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 80px;
            max-height: 400px;
            overflow: auto;
            margin: 0;
            border: 1px solid #30363d;
        }

        .result-output .placeholder {
            color: #8b949e;
            font-style: italic;
        }

        .result-output .error {
            color: #f85149;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            margin-top: 10px;
            font-size: 13px;
            color: #57606a;
        }

        .result-meta span {
            background: #f0f2f4;
            padding: 2px 12px;
            border-radius: 40px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
            text-align: right;
            border-top: 1px solid #eaeef2;
            padding-top: 16px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }

            .toolbar {
                flex-direction: column;
                gap: 10px;
            }

            .field {
                flex: 1 1 auto;
                min-width: unset;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>⚡ 代码执行器</h1>
        <div class="subhead">基于 Judge0 CE 公共 API · 支持 60+ 种语言[reference:2]</div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="field">
                <label for="languageSelect">语言</label>
                <select id="languageSelect">
                    <option value="71">Python (3.8.1)</option>
                    <option value="63">JavaScript (Node.js 12.14.0)</option>
                    <option value="46">Bash (5.0.0)</option>
                    <option value="50">C (GCC 9.2.0)</option>
                    <option value="54">C++ (GCC 9.2.0)</option>
                    <option value="62">Java (OpenJDK 13.0.1)</option>
                    <option value="72">Ruby (2.7.0)</option>
                    <option value="73">Rust (1.40.0)</option>
                    <option value="74">TypeScript (3.7.4)</option>
                    <option value="68">PHP (7.4.1)</option>
                    <option value="60">Go (1.13.5)</option>
                </select>
            </div>
            <div class="field">
                <label for="stdinInput">标准输入 (stdin)</label>
                <input id="stdinInput" type="text" placeholder="可选，如：5" />
            </div>
        </div>

        <!-- 代码编辑区 -->
        <div class="code-area">
            <textarea id="codeInput" spellcheck="false" placeholder="在此粘贴或编写代码 ...">print("Hello, Judge0!")</textarea>
        </div>

        <!-- 操作按钮 -->
        <div class="action-row">
            <button class="btn" id="runBtn">
                <span id="runLabel">▶ 运行</span>
                <span id="runSpinner" class="spinner" style="display:none;"></span>
            </button>
            <span class="status-badge" id="statusBadge">就绪</span>
        </div>

        <!-- 结果区域 -->
        <div class="result-area">
            <div class="result-header">
                <h3>📤 输出</h3>
            </div>
            <pre class="result-output" id="outputDisplay"><span class="placeholder">运行代码后，结果将显示在这里</span></pre>
            <div class="result-meta" id="metaDisplay">
                <span>⏱ 时间: —</span>
                <span>🧠 内存: —</span>
                <span>📊 状态: —</span>
            </div>
        </div>

        <div class="footer-note">
            使用 Judge0 CE · 公开实例无需认证[reference:3] · 代码在沙箱中安全执行[reference:4]
        </div>
    </div>

    <script>
        (function () {
            // DOM 引用
            const codeInput = document.getElementById('codeInput');
            const languageSelect = document.getElementById('languageSelect');
            const stdinInput = document.getElementById('stdinInput');
            const runBtn = document.getElementById('runBtn');
            const runLabel = document.getElementById('runLabel');
            const runSpinner = document.getElementById('runSpinner');
            const statusBadge = document.getElementById('statusBadge');
            const outputDisplay = document.getElementById('outputDisplay');
            const metaDisplay = document.getElementById('metaDisplay');

            // Judge0 CE 公共 API 地址[reference:5][reference:6]
            const API_BASE = 'https://ce.judge0.com';

            /**
             * 更新状态徽章
             */
            function setStatus(text, isError = false) {
                statusBadge.textContent = text;
                statusBadge.style.color = isError ? '#cf222e' : '#57606a';
                statusBadge.style.background = isError ? '#ffebe9' : '#f0f2f4';
            }

            /**
             * 显示输出结果
             */
            function renderResult(data) {
                // 提取关键字段
                const stdout = data.stdout || '';
                const stderr = data.stderr || '';
                const compileOutput = data.compile_output || '';
                const message = data.message || '';
                const status = data.status || {};
                const statusDesc = status.description || '未知';
                const time = data.time !== undefined && data.time !== null ? parseFloat(data.time).toFixed(3) : '—';
                const memory = data.memory !== undefined && data.memory !== null ? Math.round(parseFloat(data.memory)) : '—';

                // 组装输出文本（优先级：stderr > compile_output > stdout > 占位）
                let outputText = '';
                let isError = false;

                if (stderr && stderr.trim() !== '') {
                    outputText = stderr;
                    isError = true;
                } else if (compileOutput && compileOutput.trim() !== '') {
                    outputText = compileOutput;
                    isError = true;
                } else if (stdout && stdout.trim() !== '') {
                    outputText = stdout;
                } else if (message && message.trim() !== '') {
                    outputText = message;
                    isError = true;
                } else {
                    outputText = '（无输出）';
                }

                // 渲染输出
                if (isError) {
                    outputDisplay.innerHTML = `<span class="error">${escapeHtml(outputText)}</span>`;
                } else {
                    outputDisplay.textContent = outputText;
                }

                // 渲染元数据
                metaDisplay.innerHTML = `
                <span>⏱ 时间: ${time} s</span>
                <span>🧠 内存: ${memory} KB</span>
                <span>📊 状态: ${escapeHtml(statusDesc)}</span>
            `;

                // 状态徽章
                const statusId = status.id;
                if (statusId === 3) {
                    setStatus('✅ 执行成功');
                } else if (statusId === 4 || statusId === 5 || statusId === 6) {
                    setStatus('⚠️ 运行时错误', true);
                } else if (statusId === 11 || statusId === 12) {
                    setStatus('❌ 编译错误', true);
                } else if (statusId === 13 || statusId === 14) {
                    setStatus('⏳ 超时', true);
                } else if (statusId === 15 || statusId === 16) {
                    setStatus('💥 内存超限', true);
                } else if (statusId) {
                    setStatus(`📌 ${escapeHtml(statusDesc)}`, statusId !== 3);
                } else {
                    setStatus('✅ 完成');
                }
            }

            /**
             * 简单的转义，防止 XSS
             */
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            /**
             * 显示错误信息
             */
            function showError(msg) {
                outputDisplay.innerHTML = `<span class="error">❌ ${escapeHtml(msg)}</span>`;
                metaDisplay.innerHTML = `
                <span>⏱ 时间: —</span>
                <span>🧠 内存: —</span>
                <span>📊 状态: 错误</span>
            `;
                setStatus('❌ 错误', true);
            }

            /**
             * 执行代码的主流程
             */
            async function runCode() {
                const sourceCode = codeInput.value.trim();
                if (!sourceCode) {
                    showError('请先输入要执行的代码');
                    return;
                }

                const languageId = parseInt(languageSelect.value, 10);
                const stdin = stdinInput.value || '';

                // UI 状态: 加载中
                runBtn.disabled = true;
                runLabel.textContent = '执行中';
                runSpinner.style.display = 'inline-block';
                setStatus('⏳ 提交中 ...');
                outputDisplay.innerHTML = '<span class="placeholder">⏳ 正在执行，请稍候...</span>';
                metaDisplay.innerHTML = `
                <span>⏱ 时间: —</span>
                <span>🧠 内存: —</span>
                <span>📊 状态: 执行中</span>
            `;

                try {
                    // 1. 创建提交 (使用 wait=true 同步等待结果)[reference:7][reference:8]
                    const submitPayload = {
                        language_id: languageId,
                        source_code: sourceCode,
                        stdin: stdin,
                        // 可选: 设置合理的资源限制[reference:9]
                        cpu_time_limit: 5,
                        memory_limit: 256000, // 256 MB
                    };

                    const submitUrl = `${API_BASE}/submissions?base64_encoded=false&wait=true`;

                    const submitResp = await fetch(submitUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(submitPayload),
                    });

                    if (!submitResp.ok) {
                        let errMsg = `API 请求失败 (HTTP ${submitResp.status})`;
                        try {
                            const errJson = await submitResp.json();
                            if (errJson && errJson.error) {
                                errMsg = errJson.error;
                            } else if (errJson && typeof errJson === 'object') {
                                errMsg = JSON.stringify(errJson);
                            }
                        } catch (_) { /* ignore */ }
                        throw new Error(errMsg);
                    }

                    const result = await submitResp.json();

                    // 2. 检查结果中是否有错误标记
                    if (result.error) {
                        throw new Error(result.error);
                    }

                    // 3. 渲染结果
                    renderResult(result);

                    // 如果 status 不存在或 id 不是 3 (Accepted)，但至少我们有输出
                    if (!result.status || result.status.id !== 3) {
                        // 但 renderResult 已经处理了状态显示
                    }

                    setStatus('✅ 完成');

                } catch (err) {
                    console.error('执行出错:', err);
                    showError(err.message || '未知错误，请查看控制台');
                } finally {
                    // 恢复 UI 状态
                    runBtn.disabled = false;
                    runLabel.textContent = '▶ 运行';
                    runSpinner.style.display = 'none';
                    // 如果状态还是 "提交中" 或 "执行中"，重置为就绪
                    if (statusBadge.textContent === '⏳ 提交中 ...' || statusBadge.textContent === '⏳ 执行中') {
                        setStatus('就绪');
                    }
                }
            }

            // ---------- 事件绑定 ----------
            runBtn.addEventListener('click', runCode);

            // Ctrl+Enter 快捷键运行
            codeInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    runBtn.click();
                }
            });

            // 初始示例代码
            // (已经写在 textarea 里了)

            // 页面加载完成后，设置默认状态
            setStatus('就绪');
            // 如果 textarea 有内容，显示一个友好的提示
            if (codeInput.value.trim()) {
                // 不做特殊处理
            }

            console.log('🚀 Judge0 代码执行器已加载');
            console.log(`📡 API 端点: ${API_BASE}`);
            console.log('💡 提示: 按 Ctrl+Enter 快速运行');
        })();
    </script>

</body>

</html>
