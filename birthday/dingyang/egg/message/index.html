        /* ===== 涟漪容器（与网站一致） ===== */
        .ripple-container {

        .ripple {

        /* ===== 解码计数徽章 ===== */

    <script>
        (function () {
            'use strict';

            // ===== DOM 引用 =====
            const codeInput = document.getElementById('codeInput');
            const decodeBtn = document.getElementById('decodeBtn');
            const resetBtn = document.getElementById('resetBtn');
            const autoBtn = document.getElementById('autoBtn');
            const resultText = document.getElementById('resultText');
            const resultMeta = document.getElementById('resultMeta');
            const stepBadge = document.getElementById('stepBadge');
            const statusMsg = document.getElementById('statusMsg');
            const isBase64Badge = document.getElementById('isBase64Badge');

            // ===== 状态 =====
            let stepCount = 0;
            let isAutoRunning = false;
            let autoTimer = null;

            // ===== 工具函数 =====

            // 判断一个字符串是否是有效的 Base64（宽松检测）
            function isBase64(str) {
                if (!str || str.trim() === '') return false;
                // 移除空白字符后检测
                const clean = str.replace(/\s/g, '');
                // Base64 字符集：A-Z a-z 0-9 + / = 
                // 长度必须是 4 的倍数（末尾可以有 =）
                const base64Regex = /^[A-Za-z0-9+/]*={0,2}$/;
                if (!base64Regex.test(clean)) return false;
                // 长度必须是 4 的倍数
                if (clean.length % 4 !== 0) return false;
                // 尝试解码，如果成功则认为是 Base64
                try {
                    const decoded = atob(clean);
                    // 如果解码结果包含不可打印字符，可能不是文本 Base64
                    // 但很多情况下是有效的，所以只做基本检查
                    return true;
                } catch (_) {
                    return false;
                }
            }

            // 安全的 Base64 解码
            function safeDecode(str) {
                try {
                    // 移除空白字符
                    const clean = str.replace(/\s/g, '');
                    return atob(clean);
                } catch (_) {
                    return null;
                }
            }

            // 更新界面
            function updateUI(text, meta) {
                if (text === null || text === undefined) {
                    resultText.textContent = '❌ 解码失败，请检查输入是否为有效的 Base64。';
                    resultText.className = 'result-text';
                    isBase64Badge.textContent = '无效';
                    isBase64Badge.className = 'badge';
                    return;
                }

                const displayText = text || '（空字符串）';
                resultText.textContent = displayText;
                resultText.className = 'result-text';

                // 检测是否还是 Base64
                const stillBase64 = isBase64(text);
                isBase64Badge.textContent = stillBase64 ? '🔁 Base64' : '📝 文本';
                isBase64Badge.className = 'badge' + (stillBase64 ? ' active' : '');

                if (meta) {
                    resultMeta.textContent = meta;
                }
            }

            // 执行一次解码
            function performDecode() {
                const input = codeInput.value;
                if (!input || input.trim() === '') {
                    statusMsg.textContent = '⚠️ 请输入要解码的内容。';
                    return false;
                }

                // 检查是否是 Base64
                if (!isBase64(input)) {
                    statusMsg.textContent = '⚠️ 当前内容不是有效的 Base64 编码。';
                    // 但仍然尝试解码
                    const decoded = safeDecode(input);
                    if (decoded !== null) {
                        // 虽然格式不完全匹配，但 atob 成功了
                        codeInput.value = decoded;
                        stepCount++;
                        stepBadge.textContent = '第 ' + stepCount + ' 层';
                        updateUI(decoded, '解码成功（第 ' + stepCount + ' 层）');
                        statusMsg.textContent = '✅ 解码成功！';
                        return true;
                    }
                    return false;
                }

                // 执行解码
                const decoded = safeDecode(input);
                if (decoded === null) {
                    statusMsg.textContent = '❌ 解码失败，数据可能已损坏。';
                    return false;
                }

                // 更新
                codeInput.value = decoded;
                stepCount++;
                stepBadge.textContent = '第 ' + stepCount + ' 层';
                updateUI(decoded, '解码成功（第 ' + stepCount + ' 层）');
                statusMsg.textContent = '✅ 解码成功！' + (isBase64(decoded) ? ' 继续解码可深入。' : ' 已解码为最终文本。');
                return true;
            }

            // 重置
            function resetAll() {
                if (autoTimer) {
                    clearTimeout(autoTimer);
                    autoTimer = null;
                    isAutoRunning = false;
                }
                const initial = 'Vm10YWEyUXhSblJWV0dSUVZteGFVMVpyV21GVU1WWnlXa1UxVUZWVU1Eaz0=';
                codeInput.value = initial;
                stepCount = 0;
                stepBadge.textContent = '第 0 层';
                updateUI(null, '已重置');
                resultText.textContent = '点击「解码」开始';
                resultText.className = 'result-text empty';
                isBase64Badge.textContent = 'Base64';
                isBase64Badge.className = 'badge active';
                statusMsg.textContent = '已重置，准备就绪。';
            }

            // 自动解码
            function autoDecode() {
                if (isAutoRunning) {
                    // 如果正在运行，停止
                    if (autoTimer) {
                        clearTimeout(autoTimer);
                        autoTimer = null;
                    }
                    isAutoRunning = false;
                    statusMsg.textContent = '⏹ 自动解码已停止。';
                    autoBtn.textContent = '⚡ 自动解码';
                    return;
                }

                isAutoRunning = true;
                autoBtn.textContent = '⏹ 停止';
                statusMsg.textContent = '⏳ 自动解码中…';

                function step() {
                    if (!isAutoRunning) {
                        autoBtn.textContent = '⚡ 自动解码';
                        return;
                    }

                    const current = codeInput.value;
                    if (!current || current.trim() === '') {
                        statusMsg.textContent = '✅ 自动解码完成（内容为空）。';
                        isAutoRunning = false;
                        autoBtn.textContent = '⚡ 自动解码';
                        return;
                    }

                    // 检查是否还是 Base64
                    if (!isBase64(current)) {
                        statusMsg.textContent = '✅ 自动解码完成（已转为普通文本）。';
                        isAutoRunning = false;
                        autoBtn.textContent = '⚡ 自动解码';
                        return;
                    }

                    // 执行解码
                    const decoded = safeDecode(current);
                    if (decoded === null) {
                        statusMsg.textContent = '⚠️ 自动解码停止（解码失败）。';
                        isAutoRunning = false;
                        autoBtn.textContent = '⚡ 自动解码';
                        return;
                    }

                    codeInput.value = decoded;
                    stepCount++;
                    stepBadge.textContent = '第 ' + stepCount + ' 层';
                    updateUI(decoded, '自动解码（第 ' + stepCount + ' 层）');

                    // 检查解码后是否还是 Base64
                    if (isBase64(decoded)) {
                        // 继续
                        autoTimer = setTimeout(step, 400);
                    } else {
                        statusMsg.textContent = '✅ 自动解码完成（共 ' + stepCount + ' 层）。';
                        isAutoRunning = false;
                        autoBtn.textContent = '⚡ 自动解码';
                    }
                }

                // 启动第一步
                autoTimer = setTimeout(step, 300);
            }

            // 复制结果
            function copyResult() {
                const text = resultText.textContent;
                if (!text || text === '点击「解码」开始' || text === '（空字符串）') {
                    statusMsg.textContent = '⚠️ 没有可复制的内容。';
                    return;
                }
                navigator.clipboard.writeText(text).then(() => {
                    statusMsg.textContent = '📋 已复制到剪贴板！';
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    statusMsg.textContent = '📋 已复制到剪贴板！';
                });
            }

            // ===== 涟漪特效 =====
            function setupRipple() {
                const container = document.getElementById('rippleContainer');
                if (!container) return;

                const colors = [
                    'radial-gradient(circle, #a08a70, #6a5a42, #a08a70 100%)',
                ];

                document.addEventListener('click', function (e) {
                    const ripple = document.createElement('div');
                    ripple.className = 'ripple';
                    const x = e.clientX;
                    const y = e.clientY;
                    const size = 30 + Math.random() * 50;
                    ripple.style.width = size + 'px';
                    ripple.style.height = size + 'px';
                    ripple.style.left = (x - size / 2) + 'px';
                    ripple.style.top = (y - size / 2) + 'px';
                    ripple.style.background = colors[0];
                    container.appendChild(ripple);
                    ripple.addEventListener('animationend', function () {
                        ripple.remove();
                    });
                });
            }

            // ===== 初始化 =====
            function init() {
                // 设置初始值
                const initial = 'Vm10YWEyUXhSblJWV0dSUVZteGFVMVpyV21GVU1WWnlXa1UxVUZWVU1Eaz0=';
                codeInput.value = initial;
                stepCount = 0;
                stepBadge.textContent = '第 0 层';
                updateUI(null, '等待操作');
                resultText.textContent = '点击「解码」开始';
                resultText.className = 'result-text empty';
                isBase64Badge.textContent = 'Base64';
                isBase64Badge.className = 'badge active';
                statusMsg.textContent = '';

                // 绑定事件
                decodeBtn.addEventListener('click', function () {
                    if (isAutoRunning) {
                        // 如果自动解码正在运行，先停止
                        if (autoTimer) {
                            clearTimeout(autoTimer);
                            autoTimer = null;
                        }
                        isAutoRunning = false;
                        autoBtn.textContent = '⚡ 自动解码';
                    }
                    performDecode();
                });

                resetBtn.addEventListener('click', resetAll);

                autoBtn.addEventListener('click', autoDecode);

                // 回车键快捷解码（在 textarea 中按 Ctrl+Enter 或 Cmd+Enter）
                codeInput.addEventListener('keydown', function (e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        decodeBtn.click();
                    }
                });

                // 设置涟漪
                setupRipple();

                // 暴露函数到全局，供 HTML onclick 使用
                window.resetAll = resetAll;
                window.copyResult = copyResult;
            }

            // 页面加载完成后初始化
            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>
</body>

</html>
