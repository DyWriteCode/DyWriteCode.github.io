<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>星河入梦 · 花火 · 许愿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Georgia', 'Arial', 'Microsoft YaHei', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            cursor: default;
        }

        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000000 100%);
            transition: opacity 1.2s ease;
            user-select: none;
            pointer-events: auto;
        }

        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #startOverlay .title {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 10px;
            color: rgba(255, 215, 140, 0.85);
            text-shadow: 0 0 60px rgba(255, 200, 100, 0.25);
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }

        #startOverlay .sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 6px;
            margin-bottom: 50px;
            font-weight: 300;
        }

        #startBtn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 140, 0.3);
            color: rgba(255, 215, 140, 0.9);
            padding: 16px 52px;
            border-radius: 50px;
            font-size: 1.3rem;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.5s ease;
            backdrop-filter: blur(8px);
            font-family: 'Georgia', serif;
            box-shadow: 0 0 40px rgba(255, 200, 100, 0.05);
            min-width: 200px;
            text-align: center;
        }

        #startBtn:hover:not(:disabled) {
            background: rgba(255, 215, 140, 0.12);
            border-color: rgba(255, 215, 140, 0.6);
            box-shadow: 0 0 60px rgba(255, 200, 100, 0.15);
            transform: scale(1.02);
        }

        #startBtn:active:not(:disabled) {
            transform: scale(0.96);
        }

        #startBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #startOverlay .hint {
            margin-top: 30px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
        }

        #info {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 13px;
            letter-spacing: 4px;
            pointer-events: none;
            user-select: none;
            font-weight: 300;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 30px rgba(0, 20, 80, 0.3);
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 20;
        }

        #info.show {
            opacity: 1;
        }

        #info.fireworks {
            color: rgba(255, 255, 255, 0.30);
            text-shadow: 0 0 40px rgba(200, 150, 255, 0.15);
        }

        .status-tip {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 140, 0.85);
            font-size: 16px;
            letter-spacing: 4px;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.8s ease;
            font-weight: 300;
            text-shadow: 0 0 40px rgba(255, 200, 100, 0.3);
            white-space: nowrap;
            font-family: 'Georgia', serif;
        }

        .status-tip.show {
            opacity: 1;
        }

        #sound-toggle {
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.4s ease;
            font-family: 'Georgia', serif;
            user-select: none;
            opacity: 0;
            pointer-events: none;
        }

        #sound-toggle.show {
            opacity: 1;
            pointer-events: auto;
        }

        #sound-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.25);
        }

        @media (max-width:600px) {
            #info {
                font-size: 10px;
                bottom: 16px;
            }

            .status-tip {
                font-size: 13px;
                top: 20px;
            }

            #sound-toggle {
                font-size: 10px;
                padding: 6px 14px;
                bottom: 62px;
            }

            #startOverlay .title {
                font-size: 2.0rem;
                letter-spacing: 6px;
            }

            #startBtn {
                padding: 14px 32px;
                font-size: 1.0rem;
                min-width: 160px;
            }
        }
    </style>
</head>

<body>
    <canvas id="mainCanvas"></canvas>

    <div id="startOverlay">
        <div class="title">✦ 星河入梦 ✦</div>
        <div class="sub">花火 · 许愿 · 祝福</div>
        <button id="startBtn">开 始</button>
        <div class="hint">点击按钮，开启听觉之旅</div>
    </div>

    <div id="info">✦ 华灯 · 陨星 · 星河 ✦</div>
    <div class="status-tip" id="statusTip"></div>
    <button id="sound-toggle">🔇 音效已静音</button>

    <script>
        // ================================================================
        // sound-configurator.js (完整内联 v1.2.0 — 支持 ignoreEndTime)
        // ================================================================
        (function (global) {
            'use strict';

            const DEFAULT_CONFIG = {
                sounds: {
                    heartbeat: {
                        url: "https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/heart.mp3",
                        start: 0.0,
                        end: 2.0,
                        volume: 1
                    },
                    city: {
                        url: 'https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/city.mp3',
                        start: 0.0,
                        end: 6.0,
                        volume: 1
                    },
                    space: {
                        url: 'https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/space.mp3',
                        start: 0.0,
                        end: 4.0,
                        volume: 1
                    },
                    meteor: {
                        url: 'https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/meteor.mp3',
                        start: 0.0,
                        end: 3.5,
                    },
                    firework_launch: {
                        url: 'https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/firework_go.mp3',
                        start: 0.0,
                        end: 1.8,
                    },
                    firework_explode: {
                        url: 'https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/firework_boom.mp3',
                        start: 0.0,
                        end: 2.5,
                    },
                    birthday: {
                        url: 'https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io/TEST_FUNCION/AUDIO/birthday.mp3',
                        start: 0.0,
                        end: 12.0,
                    },
                },
                meteor: {
                    panStart: -0.8,
                    panEnd: 0.8,
                    volumeStart: 0.5,
                    volumeEnd: 0.2,
                    duration: 3.5,
                },
                firework: {
                    launchDuration: 1.5,
                    explodeDelay: 0.6,
                    panSpread: 0.6,
                },
            };

            // ============================================================
            // AudioEngine — 增加 ignoreEndTime 参数
            // ============================================================
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.buffers = {};
                    this.activeSources = new Map();
                    this.sourceIdCounter = 0;
                    this.isPreloading = false;
                    this._muted = false;
                }

                getContext() {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    return this.ctx;
                }

                async preloadAll(soundConfigs) {
                    this.isPreloading = true;
                    const entries = Object.entries(soundConfigs);
                    await Promise.all(entries.map(([key, cfg]) => {
                        if (cfg.url) {
                            return this.loadSound(key, cfg.url).catch(err => {
                                console.warn(`预加载 ${key} 失败，使用合成后备音`, err);
                                return null;
                            });
                        }
                        return Promise.resolve();
                    }));
                    this.isPreloading = false;
                    console.log('✅ 所有音频预加载完成');
                }

                async loadSound(key, url) {
                    if (this.buffers[key]) return this.buffers[key];
                    try {
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                        const arrayBuffer = await resp.arrayBuffer();
                        const ctx = this.getContext();
                        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                        this.buffers[key] = audioBuffer;
                        return audioBuffer;
                    } catch (err) {
                        console.warn(`⚠️ 加载音频 "${key}" 失败 (${url})，使用合成音代替`, err);
                        const synth = this._synthesizeFallback(key);
                        this.buffers[key] = synth;
                        return synth;
                    }
                }

                // ----- 合成后备音 (包含生日快乐) -----
                _synthesizeFallback(key) {
                    const ctx = this.getContext();
                    const sr = ctx.sampleRate;
                    const synths = {
                        birthday: () => {
                            const dur = 12.0;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            const freq = {
                                C4: 261.63,
                                D4: 293.66,
                                E4: 329.63,
                                F4: 349.23,
                                G4: 392.00,
                                A4: 440.00,
                                B4: 493.88,
                                C5: 523.25,
                                D5: 587.33,
                                E5: 659.25,
                                F5: 698.46,
                                G5: 783.99,
                                A5: 880.00,
                                B5: 987.77
                            };
                            const melody = [
                                ['G4', 0.30, 0.7],
                                ['G4', 0.30, 0.7],
                                ['A4', 0.30, 0.7],
                                ['G4', 0.30, 0.7],
                                ['C5', 0.40, 0.75],
                                ['B4', 0.40, 0.7],
                                ['G4', 0.30, 0.7],
                                ['G4', 0.30, 0.7],
                                ['A4', 0.30, 0.7],
                                ['G4', 0.30, 0.7],
                                ['D5', 0.40, 0.75],
                                ['C5', 0.40, 0.7],
                                ['G4', 0.30, 0.7],
                                ['G4', 0.30, 0.7],
                                ['G4', 0.30, 0.7],
                                ['E5', 0.30, 0.75],
                                ['C5', 0.40, 0.75],
                                ['B4', 0.40, 0.7],
                                ['A4', 0.40, 0.7],
                                ['F5', 0.30, 0.75],
                                ['F5', 0.30, 0.75],
                                ['E5', 0.30, 0.75],
                                ['C5', 0.40, 0.75],
                                ['D5', 0.40, 0.75],
                                ['C5', 0.50, 0.7]
                            ];
                            let currentTime = 0;
                            const gap = 0.015;
                            for (const [note, duration, volume] of melody) {
                                const f = freq[note] || 440;
                                const start = currentTime;
                                const end = start + duration;
                                const samplesStart = Math.floor(start * sr);
                                const samplesEnd = Math.floor(end * sr);
                                for (let i = samplesStart; i < Math.min(samplesEnd, d.length); i++) {
                                    const t = (i / sr) - start;
                                    let env = 1;
                                    if (t < 0.02) env = t / 0.02;
                                    else if (t > duration - 0.02) env = (duration - t) / 0.02;
                                    const val = Math.sin(2 * Math.PI * f * t) * 0.6 +
                                        Math.sin(2 * Math.PI * f * 2 * t) * 0.1 +
                                        Math.sin(2 * Math.PI * f * 3 * t) * 0.05;
                                    d[i] += val * env * volume * 0.7;
                                }
                                currentTime = end + gap;
                            }
                            let max = 0;
                            for (let i = 0; i < d.length; i++)
                                if (Math.abs(d[i]) > max) max = Math.abs(d[i]);
                            if (max > 0.01)
                                for (let i = 0; i < d.length; i++) d[i] /= max * 1.05;
                            return buf;
                        },
                        heartbeat: () => {
                            const dur = 2.0;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) {
                                const t = i / sr;
                                let env = 0;
                                if (t < 0.15) env = Math.sin(t / 0.15 * Math.PI) * 0.8;
                                else if (t < 0.3) env = Math.sin((t - 0.15) / 0.15 * Math.PI) * 0.4;
                                else if (t > 1.0 && t < 1.15) env = Math.sin((t - 1.0) / 0.15 * Math.PI) * 0.7;
                                else if (t > 1.15 && t < 1.3) env = Math.sin((t - 1.15) / 0.15 * Math.PI) * 0.3;
                                const freq = 60 + 30 * Math.sin(t * 8);
                                d[i] = Math.sin(2 * Math.PI * freq * t) * env * 0.5;
                            }
                            return buf;
                        },
                        city: () => {
                            const dur = 6.0;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) {
                                const t = i / sr;
                                const noise = (Math.random() * 2 - 1) * 0.3;
                                const hum = Math.sin(2 * Math.PI * 120 * t) * 0.1;
                                const ring = Math.sin(2 * Math.PI * 800 * t) * Math.exp(-t * 0.5) * 0.05;
                                const spike = (Math.random() > 0.995) ? (Math.random() * 2 - 1) * 0.2 : 0;
                                const env = Math.exp(-t * 0.08) * 0.8 + 0.2;
                                d[i] = (noise + hum + ring + spike) * env * 0.6;
                            }
                            return buf;
                        },
                        space: () => {
                            const dur = 4.0;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) {
                                const t = i / sr;
                                const freq = 80 + 40 * Math.sin(t * 0.5);
                                const v = Math.sin(2 * Math.PI * freq * t) * 0.3 +
                                    Math.sin(2 * Math.PI * (freq * 1.5) * t) * 0.1;
                                d[i] = v * Math.exp(-t * 0.05) * 0.6;
                            }
                            return buf;
                        },
                        meteor: () => {
                            const dur = 3.5;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) {
                                const t = i / sr;
                                const freq = 800 - t * 200 + Math.sin(t * 30) * 50;
                                const env = Math.exp(-t * 1.2) * 0.7 + 0.1;
                                const noise = (Math.random() * 2 - 1) * 0.15 * env;
                                const tone = Math.sin(2 * Math.PI * freq * t) * env * 0.5;
                                d[i] = (tone + noise) * 0.5;
                            }
                            return buf;
                        },
                        firework_launch: () => {
                            const dur = 1.8;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) {
                                const t = i / sr;
                                const freq = 150 + t * 600;
                                const env = Math.sin(t / dur * Math.PI) * 0.8;
                                const noise = (Math.random() * 2 - 1) * 0.2 * env;
                                const tone = Math.sin(2 * Math.PI * freq * t) * env * 0.5;
                                d[i] = (tone + noise) * 0.5;
                            }
                            return buf;
                        },
                        firework_explode: () => {
                            const dur = 2.5;
                            const buf = ctx.createBuffer(1, sr * dur, sr);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) {
                                const t = i / sr;
                                const env = Math.exp(-t * 1.8) * 0.9;
                                const noise = (Math.random() * 2 - 1) * 0.6 * env;
                                const low = Math.sin(2 * Math.PI * 80 * t) * env * 0.3;
                                const mid = Math.sin(2 * Math.PI * 300 * t) * Math.exp(-t * 2.5) * 0.2;
                                d[i] = (noise + low + mid) * 0.6;
                            }
                            return buf;
                        },
                    };
                    const gen = synths[key] || (() => {
                        const dur = 2.0;
                        const buf = ctx.createBuffer(1, sr * dur, sr);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) {
                            const t = i / sr;
                            d[i] = Math.sin(2 * Math.PI * 440 * t) * Math.exp(-t * 0.5) * 0.3;
                        }
                        return buf;
                    });
                    return gen();
                }

                // ----- playSound 增加 ignoreEndTime 参数 -----
                async playSound(key, startTime, endTime, volume = 0.8, pan = 0, loop = false, ignoreEndTime = false) {
                    if (this._muted) return null;
                    const buffer = await this.loadSound(key, key);
                    if (!buffer) return null;
                    const ctx = this.getContext();
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    const gainNode = ctx.createGain();
                    gainNode.gain.value = Math.min(1, Math.max(0, volume));
                    const panner = ctx.createStereoPanner();
                    panner.pan.value = Math.min(1, Math.max(-1, pan));
                    source.connect(gainNode);
                    gainNode.connect(panner);
                    panner.connect(ctx.destination);

                    const actualStart = Math.min(Math.max(0, startTime || 0), buffer.duration - 0.05);
                    const actualEnd = ignoreEndTime ?
                        buffer.duration :
                        Math.min(Math.max(actualStart + 0.05, endTime || buffer.duration), buffer.duration);
                    const duration = actualEnd - actualStart;

                    if (loop) {
                        source.loop = true;
                        source.loopStart = actualStart;
                        source.loopEnd = actualEnd;
                    }
                    source.start(0, actualStart, loop ? undefined : duration);

                    const id = ++this.sourceIdCounter;
                    const entry = {
                        id,
                        key,
                        source,
                        gainNode,
                        panner,
                        isPlaying: true,
                        loop: loop,
                        stop: () => {
                            try { source.stop(); } catch (_) { }
                            entry.isPlaying = false;
                            this.activeSources.delete(id);
                        },
                    };
                    this.activeSources.set(id, entry);
                    source.onended = () => {
                        if (!loop) {
                            entry.isPlaying = false;
                            this.activeSources.delete(id);
                        }
                    };
                    return entry;
                }

                stopSound(id) {
                    const entry = this.activeSources.get(id);
                    if (entry) {
                        entry.stop();
                        this.activeSources.delete(id);
                        return true;
                    }
                    return false;
                }

                stopAll() {
                    for (const [id, entry] of this.activeSources) {
                        entry.stop();
                    }
                    this.activeSources.clear();
                }

                setVolume(id, vol) {
                    const entry = this.activeSources.get(id);
                    if (entry) {
                        entry.gainNode.gain.value = Math.min(1, Math.max(0, vol));
                    }
                }

                setPan(id, pan) {
                    const entry = this.activeSources.get(id);
                    if (entry) {
                        entry.panner.pan.value = Math.min(1, Math.max(-1, pan));
                    }
                }

                isPlaying(id) {
                    const entry = this.activeSources.get(id);
                    return entry ? entry.isPlaying : false;
                }

                setMuted(muted) {
                    this._muted = muted;
                    if (muted) this.stopAll();
                }

                isMuted() { return this._muted; }
            }

            // ============================================================
            // MeteorManager / FireworkManager (保持不变)
            // ============================================================
            class MeteorManager {
                constructor(engine, config) {
                    this.engine = engine;
                    this.config = config;
                    this.meteors = [];
                    this.idCounter = 0;
                    this.onUpdate = null;
                    this.animFrame = null;
                    this.isRunning = false;
                }

                async addMeteor(panStart, panEnd, volStart, volEnd, duration) {
                    const cfg = this.config.meteor;
                    const startPan = panStart ?? cfg.panStart;
                    const endPan = panEnd ?? cfg.panEnd;
                    const startVol = volStart ?? cfg.volumeStart;
                    const endVol = volEnd ?? cfg.volumeEnd;
                    const dur = Math.min(duration ?? cfg.duration, this.config.sounds.meteor.end - this.config.sounds
                        .meteor.start || 3.5);
                    const id = ++this.idCounter;
                    const meteor = {
                        id,
                        panStart: startPan,
                        panEnd: endPan,
                        volStart: startVol,
                        volEnd: endVol,
                        duration: dur,
                        elapsed: 0,
                        isPlaying: false,
                        sourceId: null,
                        progress: 0,
                        active: true,
                    };
                    this.meteors.push(meteor);
                    this._startAnimation();
                    this._updateUI();
                    return meteor;
                }

                async playMeteor(meteor) {
                    if (meteor.isPlaying || this.engine.isMuted()) return;
                    const cfg = this.config.sounds.meteor;
                    const entry = await this.engine.playSound(
                        'meteor',
                        cfg.start,
                        cfg.end,
                        meteor.volStart,
                        meteor.panStart,
                        false, // 不循环
                        true // ★ ignoreEndTime = true，播放完整音频
                    );
                    if (entry) {
                        meteor.sourceId = entry.id;
                        meteor.isPlaying = true;
                        meteor.elapsed = 0;
                        meteor.progress = 0;
                        this._updateUI();
                    }
                }

                stopMeteor(meteor) {
                    if (meteor.sourceId) {
                        this.engine.stopSound(meteor.sourceId);
                        meteor.sourceId = null;
                    }
                    meteor.isPlaying = false;
                    this._updateUI();
                }

                removeMeteor(meteor) {
                    this.stopMeteor(meteor);
                    meteor.active = false;
                    this.meteors = this.meteors.filter(m => m !== meteor);
                    if (this.meteors.length === 0) this._stopAnimation();
                    this._updateUI();
                }

                clearAll() {
                    for (const m of this.meteors) this.stopMeteor(m);
                    this.meteors = [];
                    this._stopAnimation();
                    this._updateUI();
                }

                _startAnimation() {
                    if (this.isRunning) return;
                    this.isRunning = true;
                    const step = () => {
                        if (!this.isRunning) return;
                        let hasActive = false;
                        for (const m of this.meteors) {

                    this._updateUI();

                        const vol = 0.4 + launchProgress * 0.5;
                        const pan = Math.sin(launchProgress * 3) * 0.2;
                        if (fw.launchId) {
                            this.engine.setVolume(fw.launchId, Math.min(1, vol));
                            this.engine.setPan(fw.launchId, pan);

                    const timeoutId = setTimeout(async () => {
                        if (!fw.active || !fw.isPlaying || this.engine.isMuted()) return;
                        if (fw.launchId) {
                            this.engine.stopSound(fw.launchId);
                            fw.launchId = null;

                        const pan = (Math.random() * 2 - 1) * panSpread;

                            explodeCfg.end,
                            0.9,
                            pan,
                            false,
                            false
                        );

                        if (explodeEntry) {
                            const checkDone = () => {
                                if (!fw.active || this.engine.isMuted()) return;
                                if (!this.engine.isPlaying(explodeEntry.id)) {
                                    fw.isPlaying = false;
                                    fw.phase = 'done';
                                    this._updateUI();
                                } else {
                                    setTimeout(checkDone, 200);
                                }
                            };
                            setTimeout(checkDone, 100);
                        } else {
                            fw.isPlaying = false;
                            fw.phase = 'done';
                            this._updateUI();
                        }
                    }, delay * 1000);

                    this.timeouts.push(timeoutId);
                    fw._cleanup = () => {
                        clearInterval(launchInterval);
                        clearTimeout(timeoutId);
                        if (fw.launchId) this.engine.stopSound(fw.launchId);
                        if (fw.explodeId) this.engine.stopSound(fw.explodeId);
                        fw.launchId = null;
                        fw.explodeId = null;
                        fw.isPlaying = false;
                    };

                    fw.isPlaying = false;
                    fw.phase = 'idle';

                    if (brightness > 0.7) colorIdx = Math.floor(Math.random() * 3);
                    else if (brightness > 0.4) colorIdx = 3 + Math.floor(Math.random() * 2);
                    else colorIdx = Math.floor(Math.random() * CITY_STAR_COLORS.length);
                    const color = CITY_STAR_COLORS[colorIdx % CITY_STAR_COLORS.length];
                    const speed = speedMin + Math.random() * (speedMax - speedMin);
                    const phase = Math.random() * Math.PI * 2;
                    const flickerAmt = amplitudeMin + brightness * (amplitudeMax - amplitudeMin);
                    const x = Math.random() * (W - 20) + 10;
                    const y = Math.random() * (H * 0.75) + 10;
                    const randomDelay = (Math.random() - 0.5) * CONFIG.starAppear.randomOffset * 2;
                    cityStars.push({
                        x,
                        y,
                        size,
                        brightness,
                        baseAlpha: 0.6 + brightness * 0.4,
                        alpha: 0,
                        speed,
                        phase,
                        flickerAmt,
                        color,
                        isBright,
                        randomDelay
                    });
                }
            }
            generateCityStars();

            function updateCityStars(time) {
                for (const star of cityStars) {
                    const flicker = Math.sin(time * star.speed + star.phase);
                    const af = 0.5 + 0.5 * flicker;
                    const mod = 1 + star.flickerAmt * (af - 0.5) * 2;
                    star.alpha = star.baseAlpha * mod;
                    star.alpha = clamp(star.alpha, 0.05, 1);
                }
            }

            function drawCityStars(time, liftProgress, vp, alphaMul) {
                const { start, end, fadeRange, atmosphereStrength } = CONFIG.starAppear;
                if (liftProgress < start - fadeRange * 0.5) return;
                updateCityStars(time);
                const sorted = [...cityStars].sort((a, b) => b.brightness - a.brightness);
                const scale = vp ? vp.scale : 1.0;
                const ox = vp ? (W / 2 - vp.cx) * scale + W / 2 : W / 2;
                const oy = vp ? (H / 2 - vp.cy) * scale + H / 2 : H / 2;
                const alphaMult = (alphaMul !== undefined) ? alphaMul : 1.0;
                for (const star of sorted) {
                    const yNorm = star.y / (H * 0.75);
                    const baseThreshold = start + (end - start) * yNorm;
                    const threshold = clamp(baseThreshold + star.randomDelay, start - 0.05, end + 0.05);
                    const fadeEnd2 = threshold + fadeRange;
                    let visibility = smoothstep(threshold, fadeEnd2, liftProgress);
                    if (liftProgress > end + fadeRange) visibility = 1;
                    const heightFactor = 1 - yNorm;
                    const atmosphere = (1 - atmosphereStrength) + atmosphereStrength * heightFactor;
                    const sizeFactor = 0.6 + 0.4 * heightFactor;
                    const finalAlpha = star.alpha * visibility * atmosphere * alphaMult;
                    if (finalAlpha < 0.001) continue;
                    const px = (star.x - W / 2) * scale + ox;
                    const py = (star.y - H / 2) * scale + oy;
                    const finalSize = star.size * sizeFactor * scale;
                    const { color, isBright } = star;
                    const { r, g, b } = color;
                    if (finalSize > 0.8 && finalAlpha > 0.02) {
                        const glowR = finalSize * 2.5;
                        const grad = ctx.createRadialGradient(px, py, 0, px, py, glowR);
                        grad.addColorStop(0, `rgba(${r},${g},${b},${finalAlpha * 0.35})`);
                        grad.addColorStop(0.5, `rgba(${r},${g},${b},${finalAlpha * 0.10})`);
                        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(px, py, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = finalAlpha;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.beginPath();
                    ctx.arc(px, py, finalSize * 0.85, 0, Math.PI * 2);
                    ctx.fill();
                    if (isBright && finalAlpha > 0.2) {
                        const len = 10 + finalSize * 4;
                        for (let ang = 0; ang < Math.PI * 2; ang += Math.PI / 4) {
                            const ca = Math.cos(ang),
                                sa = Math.sin(ang);
                            ctx.globalAlpha = finalAlpha * 0.25;
                            ctx.strokeStyle = `rgba(${r},${g},${b},${finalAlpha * 0.25})`;
                            ctx.lineWidth = 0.6;
                            ctx.beginPath();
                            ctx.moveTo(px + ca * 1.5, py + sa * 1.5);
                            ctx.lineTo(px + ca * len, py + sa * len);
                            ctx.stroke();
                        }
                    }
                    ctx.globalAlpha = 1;
                }
            }

            // --- 太空星星 ---
            const SPACE_STAR_COLORS = [
                { r: 255, g: 255, b: 255 }, { r: 255, g: 245, b: 235 },
                { r: 235, g: 240, b: 255 }, { r: 255, g: 230, b: 210 },
                { r: 210, g: 220, b: 255 }, { r: 255, g: 210, b: 180 }
            ];
            const SPACE_LAYERS = [
                { name: '远层', parallax: 0.15, count: 300, sizeMin: 0.2, sizeMax: 1.2, alphaBase: 0.3 },
                { name: '中层', parallax: 0.45, count: 250, sizeMin: 0.4, sizeMax: 2.0, alphaBase: 0.5 },
                { name: '近层', parallax: 0.95, count: 150, sizeMin: 0.8, sizeMax: 3.5, alphaBase: 0.7 }
            ];
            let spaceStarLayers = [];

            function initSpaceStars() {
                spaceStarLayers = [];
                for (let li = 0; li < SPACE_LAYERS.length; li++) {
                    const cfg = SPACE_LAYERS[li];
                    const stars = [];
                    for (let i = 0; i < cfg.count; i++) {
                        const mag = Math.random(),
                            bri = Math.pow(mag, 1.8);
                        const size = cfg.sizeMin + bri * (cfg.sizeMax - cfg.sizeMin);
                        const isBright = bri > 0.7 && Math.random() < 0.2;
                        const ci = Math.floor(Math.random() * SPACE_STAR_COLORS.length);
                        const col = SPACE_STAR_COLORS[ci];
                        const spd = 0.15 + Math.random() * 0.6,
                            ph = Math.random() * Math.PI * 2;
                        const fa = 0.1 + bri * 0.3;
                        stars.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            size,
                            brightness: bri,
                            baseAlpha: cfg.alphaBase + bri * 0.5,
                            alpha: 0,
                            speed: spd,
                            phase: ph,
                            flickerAmt: fa,
                            color: col,
                            isBright,
                            parallax: cfg.parallax
                        });
                    }
                    spaceStarLayers.push(stars);
                }
            }
            initSpaceStars();

            function drawSpaceStars(time, vp, alphaMul) {
                const scale = vp.scale;
                const alphaMult = (alphaMul !== undefined) ? alphaMul : 1.0;
                if (alphaMult < 0.001) return;
                for (let li = 0; li < spaceStarLayers.length; li++) {
                    const stars = spaceStarLayers[li];
                    const parallax = SPACE_LAYERS[li].parallax;
                    const offFactor = (scale - 0.05) * 0.8;
                    const offX = (vp.cx - W / 2) * parallax * offFactor * 0.3;
                    const offY = (vp.cy - H / 2) * parallax * offFactor * 0.3;
                    for (const star of stars) {
                        const flicker = Math.sin(time * star.speed + star.phase);
                        const af = 0.5 + 0.5 * flicker;
                        const mod = 1 + star.flickerAmt * (af - 0.5) * 2;
                        star.alpha = star.baseAlpha * mod;
                        star.alpha = clamp(star.alpha, 0.05, 1);
                        const px = star.x + offX * (1 + star.parallax * 0.5);
                        const py = star.y + offY * (1 + star.parallax * 0.5);
                        const szScale = 0.8 + 0.4 * (1 - parallax);
                        const drawSize = star.size * szScale;
                        const finalAlpha = star.alpha * alphaMult;
                        if (finalAlpha < 0.001) continue;
                        if (drawSize > 0.8 && finalAlpha > 0.02) {
                            const glowR = drawSize * 2.5;
                            const grad = ctx.createRadialGradient(px, py, 0, px, py, glowR);
                            grad.addColorStop(0,
                                `rgba(${star.color.r},${star.color.g},${star.color.b},${finalAlpha * 0.3})`);
                            grad.addColorStop(0.5,
                                `rgba(${star.color.r},${star.color.g},${star.color.b},${finalAlpha * 0.08})`);
                            grad.addColorStop(1, `rgba(${star.color.r},${star.color.g},${star.color.b},0)`);
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(px, py, glowR, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = finalAlpha;
                        ctx.fillStyle = `rgb(${star.color.r},${star.color.g},${star.color.b})`;
                        ctx.beginPath();
                        ctx.arc(px, py, drawSize * 0.85, 0, Math.PI * 2);
                        ctx.fill();
                        if (star.isBright && finalAlpha > 0.2) {
                            const len = 10 + drawSize * 4;
                            for (let ang = 0; ang < Math.PI * 2; ang += Math.PI / 4) {
                                const ca = Math.cos(ang),
                                    sa = Math.sin(ang);
                                ctx.globalAlpha = finalAlpha * 0.2;
                                ctx.strokeStyle =
                                    `rgba(${star.color.r},${star.color.g},${star.color.b},${finalAlpha * 0.2})`;
                                ctx.lineWidth = 0.6;
                                ctx.beginPath();
                                ctx.moveTo(px + ca * 1.5, py + sa * 1.5);
                                ctx.lineTo(px + ca * len, py + sa * len);
                                ctx.stroke();
                            }
                        }
                        ctx.globalAlpha = 1;
                    }
                }
            }

            // --- 悬浮粒子 ---
            let floatParticles = [];
            const PARTICLE_COUNT = 120;

            function initFloatParticles() {
                floatParticles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    floatParticles.push({
                        x: rand(0, W),
                        y: rand(0, H),
                        z: rand(0.1, 1.0),
                        size: rand(0.5, 2.8),
                        vx: rand(-0.15, 0.15),
                        vy: rand(-0.10, 0.10),
                        phase: rand(0, Math.PI * 2),
                        alpha: rand(0.05, 0.25),
                        color: { r: rand(180, 255), g: rand(180, 255), b: rand(200, 255) }
                    });
                }
            }
            initFloatParticles();

            function updateFloatParticles(time) {
                for (const p of floatParticles) {
                    p.x += p.vx + Math.sin(time * 0.0003 + p.phase) * 0.04;
                    p.y += p.vy + Math.cos(time * 0.0004 + p.phase * 1.3) * 0.03;
                    if (p.x < -20) p.x = W + 20;
                    if (p.x > W + 20) p.x = -20;
                    if (p.y < -20) p.y = H + 20;
                    if (p.y > H + 20) p.y = -20;
                    p.alpha = p.alpha * 0.998 + (0.05 + 0.2 * (0.5 + 0.5 * Math.sin(time * 0.001 + p.phase))) * 0.002;
                    p.alpha = clamp(p.alpha, 0.02, 0.35);
                }
            }

            function drawFloatParticles() {
                for (const p of floatParticles) {
                    const depth = p.z,
                        size = p.size * (0.4 + 0.6 * depth),
                        alpha = p.alpha * (0.3 + 0.7 * depth);
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha})`;
                    ctx.fill();
                    if (size > 0.8 && alpha > 0.05) {
                        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
                        grad.addColorStop(0, `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha * 0.2})`);
                        grad.addColorStop(1, `rgba(${p.color.r},${p.color.g},${p.color.b},0)`);
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            // --- 星云 ---
            let clouds = [];

            function initClouds() {
                clouds = [];
                const count = 30 + Math.floor(Math.random() * 30);
                for (let i = 0; i < count; i++) {
                    const cx = Math.random() * W,
                        cy = Math.random() * H * 0.7;
                    const radius = 80 + Math.random() * 300;
                    const alpha = 0.015 + Math.random() * 0.035;
                    let r, g, b;
                    const s = Math.random();
                    if (s < 0.33) {
                        r = 80;
                        g = 120;
                        b = 200;
                    } else if (s < 0.66) {
                        r = 120;
                        g = 100;
                        b = 180;
                    } else {
                        r = 200;
                        g = 180;
                        b = 160;
                    }
                    clouds.push({ x: cx, y: cy, radius, alpha, r, g, b });
                }
            }
            initClouds();

            function drawClouds(scale) {
                if (clouds.length === 0) return;
                const ca = smoothstep(0.05, 0.6, scale);
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                for (const cloud of clouds) {
                    const grad = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.radius);
                    const a = cloud.alpha * (0.3 + 0.7 * (1 - ca));
                    grad.addColorStop(0, `rgba(${cloud.r},${cloud.g},${cloud.b},${a})`);
                    grad.addColorStop(0.5, `rgba(${cloud.r},${cloud.g},${cloud.b},${a * 0.5})`);
                    grad.addColorStop(1, `rgba(${cloud.r},${cloud.g},${cloud.b},0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // --- 建筑系统 ---
            let buildings = [];

            function generateBuildings() {
                buildings = [];
                const horizonY = H * 0.20;

                function perspective(baseY) {
                    let t = (baseY - horizonY) / (H * 0.85 - horizonY);
                    return Math.max(0, Math.min(1, t));
                }

                function fillRow(yMin, yMax, cellW, layerType) {
                    const rows = Math.max(1, Math.round((yMax - yMin) / (H * 0.045)));
                    const rowH = (yMax - yMin) / rows;
                    const phase = Math.random() * cellW;
                    const cols = Math.ceil(W / cellW) + 1;
                    for (let r = 0; r < rows; r++) {
                        const rowOff = phase + (r % 2 === 1 ? cellW * 0.5 : 0) + (Math.random() - 0.5) * cellW * 0.3;
                        let prevBh = -1;
                        for (let c = 0; c < cols; c++) {
                            if (Math.random() < 0.08) continue;
                            const baseY = yMin + r * rowH + Math.random() * rowH;
                            const t = perspective(baseY);
                            let bw, bh;
                            if (layerType === 'far') {
                                bw = 5 + Math.random() * 5 + t * 6;
                                const tf = 1 - t;
                                bh = (13 + Math.random() * 14) * (0.60 + tf * 1.15);
                                if (Math.random() < 0.07) bh *= 1.5 + Math.random() * 0.6;
                            } else if (layerType === 'mid') {
                                bw = 14 + Math.random() * 14 + t * 14;
                                bh = (30 + Math.random() * 26) * (0.45 + t * 1.1);
                            } else {
                                bw = 34 + Math.random() * 26 + t * 24;
                                bh = (60 + Math.random() * 46) * (0.5 + t * 0.9);
                            }
                            if (prevBh > 0 && Math.abs(bh - prevBh) < prevBh * 0.12) bh *= Math.random() > 0.5 ? 1.25 :
                                0.78;
                            prevBh = bh;
                            bw = Math.min(bw, cellW * 0.85);
                            const jit = (Math.random() - 0.5) * cellW * 0.5;
                            const bx = c * cellW + rowOff + jit;
                            if (bx + bw < 0 || bx > W) continue;
                            const seed = hash(bx, baseY);
                            const windows = [];
                            if (layerType === 'far') {
                                const cnt = 3 + Math.floor(seed * 6);
                                for (let i = 0; i < cnt; i++) {
                                    windows.push({
                                        x: 1 + Math.random() * (bw - 2),
                                        y: 1 + Math.random() * (bh - 2),
                                        w: 1,
                                        h: Math.random() > 0.5 ? 2 : 1,
                                        lit: true,
                                        alpha: 0.2 + Math.random() * 0.4
                                    });
                                }
                            } else {
                                const scale = (layerType === 'mid') ? (0.8 + t * 0.4) : (0.85 + t * 0.35);
                                const winW = (layerType === 'mid') ? 3 * scale : 5 * scale;
                                const winH = (layerType === 'mid') ? 5 * scale : 7 * scale;
                                const gapX = (layerType === 'mid') ? 4 : 3,
                                    gapY = (layerType === 'mid') ? 4 : 3;
                                const padX = (layerType === 'mid') ? 4 : 5,
                                    padY = (layerType === 'mid') ? 6 : 8;
                                const stepX = winW + gapX,
                                    stepY = winH + gapY;
                                const colsW = Math.max(1, Math.floor((bw - 2 * padX + gapX) / stepX));
                                const rowsW = Math.max(1, Math.floor((bh - 2 * padY + gapY) / stepY));
                                const totalW = colsW * stepX - gapX,
                                    totalH = rowsW * stepY - gapY;
                                const startX = padX + (bw - 2 * padX - totalW) / 2;
                                const startY = padY + (bh - 2 * padY - totalH) / 2;
                                const rowStates = [];
                                let cr = 0;
                                while (cr < rowsW) {
                                    const lc = 3 + Math.floor(Math.random() * 3),
                                        dc = 2 + Math.floor(Math.random() * 2);
                                    for (let i = 0; i < lc && cr < rowsW; i++) {
                                        rowStates.push(true);
                                        cr++;
                                    }
                                    for (let i = 0; i < dc && cr < rowsW; i++) {
                                        rowStates.push(false);
                                        cr++;
                                    }
                                }
                                const lightRate = (layerType === 'mid') ? (0.6 + Math.random() * 0.2) : (0.35 + Math
                                    .random() *
                                    0.15);
                                for (let r2 = 0; r2 < rowsW; r2++) {
                                    if (!rowStates[r2]) continue;
                                    for (let c2 = 0; c2 < colsW; c2++) {
                                        if (Math.random() > lightRate) continue;
                                        const wx = startX + c2 * stepX,
                                            wy = startY + r2 * stepY;
                                        const rnd = Math.random();
                                        let color;
                                        if (rnd < 0.02) color = '248,113,113';
                                        else if (rnd < 0.07) color = '122,183,212';
                                        else color = Math.random() > 0.5 ? '251,191,36' : '252,211,77';
                                        let alpha = (layerType === 'mid') ? (0.3 + Math.random() * 0.7) : (0.7 + Math
                                            .random() * 0.3);
                                        windows.push({ x: wx, y: wy, w: winW, h: winH, lit: true, color, alpha });
                                    }
                                }
                            }
                            buildings.push({ type: layerType, x: bx, y: baseY - bh, w: bw, h: bh, t, windows, seed });
                        }
                    }
                }
                fillRow(H * 0.20, H * 0.38, 14, 'far');
                fillRow(H * 0.30, H * 0.62, 34, 'mid');
                fillRow(H * 0.52, H * 0.98, 78, 'near');
            }
            generateBuildings();

            function drawBuilding(b, offY) {
                const { type, x, y, w, h, t, windows } = b;
                const by = y + offY;
                const fog = type === 'far' ? 0.55 : (type === 'mid' ? 0.30 : 0.10);
                const depth = 0.35 + t * 0.65;
                let baseR, baseG, baseB;
                if (type === 'far') {
                    baseR = 18 + t * 10;
                    baseG = baseR + 8;
                    baseB = baseR + 22;
                } else if (type === 'mid') {
                    baseR = (20 + Math.random() * 8) * depth + fog * 20;
                    baseG = (32 + Math.random() * 10) * depth + fog * 26;
                    baseB = (52 + Math.random() * 14) * depth + fog * 38;
                } else {
                    baseR = (13 * depth) | 0;
                    baseG = (22 * depth + 6) | 0;
                    baseB = (36 * depth + 8) | 0;
                }
                ctx.fillStyle = `rgb(${baseR | 0},${baseG | 0},${baseB | 0})`;
                ctx.fillRect(x, by, w, h);
                const roofH = Math.max(2, h * (type === 'far' ? 0.03 : 0.06));
                const roofR = Math.min(255, baseR + 25),
                    roofG = Math.min(255, baseG + 30),
                    roofB = Math.min(255, baseB + 35);
                ctx.fillStyle = `rgb(${roofR | 0},${roofG | 0},${roofB | 0})`;
                ctx.fillRect(x, by - roofH, w, roofH);
                ctx.fillStyle = `rgba(200,220,255,${0.05 + t * 0.08})`;
                ctx.fillRect(x, by - roofH, w, 0.8);
                const sideW = Math.max(2, w * 0.08);
                ctx.fillStyle =
                    `rgb(${Math.max(0, baseR * 0.6) | 0},${Math.max(0, baseG * 0.6) | 0},${Math.max(0, baseB * 0.6) | 0})`;
                ctx.fillRect(x + w, by, sideW, h);
                ctx.fillStyle = `rgba(150,180,220,${0.03 + t * 0.06})`;
                ctx.fillRect(x + w + sideW - 1, by, 1, h);
                for (const win of windows) {
                    if (!win.lit) continue;
                    ctx.fillStyle = `rgba(${win.color || '251,191,36'}, ${win.alpha || 0.2})`;
                    ctx.fillRect(x + win.x, by + win.y, win.w, win.h);
                }
                ctx.fillStyle = `rgba(160,200,240,${0.08 + t * 0.15})`;
                ctx.fillRect(x, by, w, 1.2);
                if (type !== 'far' && Math.random() > 0.5) {
                    const ah = 4 + Math.random() * 10,
                        ax = x + Math.random() * w;
                    ctx.fillStyle = `rgba(160,200,240,${0.05 + t * 0.12})`;
                    ctx.fillRect(ax, by - roofH - ah, 1.0, ah);
                    ctx.fillStyle = `rgba(255,240,200,${0.03 + Math.random() * 0.06})`;
                    ctx.fillRect(ax - 0.5, by - roofH - ah - 1, 2, 1.5);
                }
            }

            function drawCityGlow(offY, intensity, liftProg) {
                if (intensity < 0.01) return;
                const g = CONFIG.glow;
                const nearB = [],
                    midB = [],
                    farB = [];
                buildings.forEach(b => {
                    if (b.type === 'near') nearB.push(b);
                    else if (b.type === 'mid') midB.push(b);
                    else farB.push(b);
                });
                const drawBatch = (batch, alphaMul, radiusMul, off) => {
                    if (batch.length === 0) return;
                    const isNear = batch[0].type === 'near';
                    for (const b of batch) {
                        const t = b.t || 0.5,
                            cx = b.x + b.w / 2,
                            cy = b.y + offY;
                        const sz = Math.max(b.w * 0.4, b.h * 0.15);
                        const radius = sz * (radiusMul + t * 0.5) + off;
                        const alpha = alphaMul * (0.5 + t * 0.5) * intensity * (1 - liftProg * 0.3);
                        if (alpha < 0.002) continue;
                        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                        grad.addColorStop(0, `rgba(255,180,60,${alpha * 0.9})`);
                        grad.addColorStop(0.1, `rgba(250,175,55,${alpha * 0.7})`);
                        grad.addColorStop(0.3, `rgba(240,165,50,${alpha * 0.35})`);
                        grad.addColorStop(0.6, `rgba(225,155,45,${alpha * 0.12})`);
                        grad.addColorStop(1, `rgba(205,145,40,0)`);
                        ctx.globalCompositeOperation = 'screen';
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                        if (isNear && alpha > 0.08) {
                            const cr = radius * 0.1,
                                cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
                            cg.addColorStop(0, `rgba(255,230,180,${alpha * 0.4})`);
                            cg.addColorStop(1, `rgba(255,200,140,0)`);
                            ctx.globalCompositeOperation = 'screen';
                            ctx.fillStyle = cg;
                            ctx.beginPath();
                            ctx.arc(cx, cy, cr, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.globalCompositeOperation = 'source-over';
                        }
                    }
                };
                drawBatch(farB, g.farAlpha, g.farRadius, g.farOffset);
                drawBatch(midB, g.midAlpha, g.midRadius, g.midOffset);
                drawBatch(nearB, g.nearAlpha, g.nearRadius, g.nearOffset);
                const ha = g.horizonAlpha * intensity * (1 - liftProg * 0.6);
                if (ha > 0.001) {
                    const grad = ctx.createRadialGradient(W / 2, H * 0.75 + offY * 0.5, 0, W / 2, H * 0.75 + offY * 0.5,
                        Math.max(W, H) * 0.5);
                    grad.addColorStop(0, `rgba(255,200,150,${ha * 0.8})`);
                    grad.addColorStop(0.5, `rgba(200,160,120,${ha * 0.3})`);
                    grad.addColorStop(1, `rgba(100,80,60,0)`);
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(W / 2, H * 0.75 + offY * 0.5, Math.max(W, H) * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }
            }

            // --- 行星系统 ---
            class Planet {
                constructor(x, y, radius, color, ringLayers, craterCount) {
                    this.x = x;
                    this.y = y;
                    this.radius = radius;
                    this.color = color;
                    this.ringLayers = ringLayers;
                    this.craterCount = craterCount || 20;
                    this.rotation = 0;
                    this.origRadius = radius;
                    this.craters = [];
                    for (let i = 0; i < this.craterCount; i++) {
                        const a = Math.random() * Math.PI * 2,
                            d = Math.random() * this.radius * 0.85;
                        const cx = Math.cos(a) * d,
                            cy = Math.sin(a) * d,
                            r = 1.5 + Math.random() * 6,
                            dep = 0.3 + Math.random() * 0.7;
                        this.craters.push({ x: cx, y: cy, r, depth: dep });
                    }
                }
                update() { this.rotation += 0.001; for (const l of this.ringLayers) l.angle += l.speed; }
                draw(ctx, cx, cy, radiusOverride, alpha, blurAmt) {
                    const px = cx !== undefined ? cx : this.x,
                        py = cy !== undefined ? cy : this.y;
                    const r = radiusOverride !== undefined ? radiusOverride : this.radius;
                    if (blurAmt && blurAmt > 0.5) {
                        ctx.shadowBlur = blurAmt * 4;
                        ctx.shadowColor = 'rgba(0,0,0,0)';
                    }
                    const grad = ctx.createRadialGradient(px - r * 0.3, py - r * 0.3, r * 0.1, px, py, r);
                    const base = this.color;
                    grad.addColorStop(0, lighten(base, 40));
                    grad.addColorStop(0.5, base);
                    grad.addColorStop(1, darken(base, 60));
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.shadowColor = 'rgba(180,200,255,0.12)';
                    ctx.shadowBlur = 35;
                    ctx.beginPath();
                    ctx.arc(px, py, r * 0.98, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200,220,255,0.04)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(this.rotation);
                    const sf = r / this.origRadius;
                    for (const c of this.craters) {
                        const cr = c.r * sf;
                        ctx.beginPath();
                        ctx.ellipse(c.x * sf, c.y * sf, cr * 0.8, cr * 0.6, 0, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(0,0,0,${0.15 + c.depth * 0.2})`;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(c.x * sf - cr * 0.1, c.y * sf - cr * 0.1, cr * 0.7, cr * 0.5, 0, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,240,${0.05 + c.depth * 0.1})`;
                        ctx.fill();
                        if (c.depth > 0.6) {
                            ctx.beginPath();
                            ctx.arc(c.x * sf - cr * 0.3, c.y * sf - cr * 0.3, cr * 0.2, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(255,255,255,0.15)';
                            ctx.fill();
                        }
                    }
                    ctx.restore();
                    ctx.save();
                    ctx.translate(px, py);
                    for (let i = 0; i < 5; i++) {
                        const a = Math.random() * Math.PI * 2,
                            d = r * (0.3 + Math.random() * 0.6);
                        const x = Math.cos(a) * d,
                            y = Math.sin(a) * d;
                        ctx.beginPath();
                        ctx.arc(x, y, 2 + Math.random() * 4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,240,${0.03 + Math.random() * 0.08})`;
                        ctx.fill();
                    }
                    ctx.restore();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
                drawRings(ctx, cx, cy, radiusOverride, alpha, blurAmt) {
                    const px = cx !== undefined ? cx : this.x,
                        py = cy !== undefined ? cy : this.y;
                    const r = radiusOverride !== undefined ? radiusOverride : this.radius;
                    const sf = r / this.origRadius;
                    for (const layer of this.ringLayers) {
                        this.drawRingLayer(ctx, layer, px, py, sf, alpha, blurAmt);
                    }
                }
                drawRingLayer(ctx, layer, px, py, sf, alpha, blurAmt) {
                    const { particles, a, b, tilt, angle, color } = layer;
                    const cosT = Math.cos(tilt),
                        sinT = Math.sin(tilt);
                    const aS = a * sf,
                        bS = b * sf;
                    if (blurAmt && blurAmt > 0.5) {
                        ctx.shadowBlur = blurAmt * 3;
                        ctx.shadowColor = 'rgba(0,0,0,0)';
                    }
                    for (const p of particles) {
                        if (p.detached) continue;
                        const totalA = p.angleOffset + angle;
                        const rx = aS + p.radialOffset * sf,
                            ry = bS + p.radialOffset * sf * 0.6;
                        const x0 = rx * Math.cos(totalA),
                            y0 = ry * Math.sin(totalA);
                        const lx = x0 * cosT - y0 * sinT,
                            ly = x0 * sinT + y0 * cosT;
                        const wx = px + lx,
                            wy = py + ly;
                        const bri = 0.6 + 0.4 * (1 - Math.hypot(lx, ly) / (aS * 1.2));
                        const sz = p.size * sf * 0.9;
                        ctx.globalAlpha = alpha * (0.6 + 0.4 * bri);
                        ctx.beginPath();
                        ctx.arc(wx, wy, sz, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.shadowColor = 'rgba(255,255,255,0.05)';
                        ctx.shadowBlur = 3;
                        ctx.beginPath();
                        ctx.arc(wx - sz * 0.2, wy - sz * 0.2, sz * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
                getParticlePosition(li, pi) {
                    const layer = this.ringLayers[li],
                        p = layer.particles[pi];
                    const totalA = p.angleOffset + layer.angle;
                    const rx = layer.a + p.radialOffset,
                        ry = layer.b + p.radialOffset * 0.6;
                    const x0 = rx * Math.cos(totalA),
                        y0 = ry * Math.sin(totalA);
                    const cosT = Math.cos(layer.tilt),
                        sinT = Math.sin(layer.tilt);
                    const lx = x0 * cosT - y0 * sinT,
                        ly = x0 * sinT + y0 * cosT;
                    return { x: this.x + lx, y: this.y + ly };
                }
                getParticleTangent(li, pi) {
                    const layer = this.ringLayers[li],
                        p = layer.particles[pi];
                    const totalA = p.angleOffset + layer.angle;
                    const rx = layer.a + p.radialOffset,
                        ry = layer.b + p.radialOffset * 0.6;
                    const tx = -rx * Math.sin(totalA),
                        ty = ry * Math.cos(totalA);
                    const cosT = Math.cos(layer.tilt),
                        sinT = Math.sin(layer.tilt);
                    const ltx = tx * cosT - ty * sinT,
                        lty = tx * sinT + ty * cosT;
                    return Math.atan2(lty, ltx);
                }
                detachParticle(li, pi) { this.ringLayers[li].particles[pi].detached = true; }
                resetAllParticles() {
                    for (const l of this.ringLayers)
                        for (const p of l.particles) p.detached = false;
                }
            }

            function createRingParticles(count, a, b) {
                const ps = [];
                for (let i = 0; i < count; i++) {
                    ps.push({
                        angleOffset: (i / count) * Math.PI * 2 + Math.random() * 0.02,
                        size: 1.8 + Math.random() * 3.2,
                        radialOffset: (Math.random() - 0.5) * 15,
                        detached: false
                    });
                }
                return ps;
            }

            let planets = [],
                mainPlanet = null;
            let attachInfo = { layerIndex: 0, angle: -0.6, x: 0, y: 0, tangentX: 1, tangentY: 0 };

            function initPlanets() {
                planets = [];
                const minDim = Math.min(W, H);
                const pos = [{ x: W * 0.28, y: H * 0.38 }, { x: W * 0.72, y: H * 0.22 }, { x: W * 0.20, y: H * 0.78 },
                { x: W * 0.75, y: H * 0.72 }, { x: W * 0.50, y: H * 0.15 }];
                const cfg = [{ radius: minDim * 0.08, color: '#b8a088', layers: 3, tiltBase: 0.2 },
                { radius: minDim * 0.06, color: '#a09080', layers: 2, tiltBase: 0.8 },
                { radius: minDim * 0.055, color: '#908880', layers: 2, tiltBase: 1.0 },
                { radius: minDim * 0.07, color: '#8a9a7a', layers: 2, tiltBase: 0.5 },
                { radius: minDim * 0.05, color: '#9a8a8a', layers: 1, tiltBase: 1.2 }];
                for (let idx = 0; idx < 5; idx++) {
                    const p = pos[idx],
                        c = cfg[idx];
                    const ringLayers = [];
                    for (let i = 0; i < c.layers; i++) {
                        const a = c.radius * (2.2 + i * 1.2),
                            b = a * (0.5 + Math.random() * 0.25);
                        const tilt = c.tiltBase + (Math.random() - 0.5) * 0.8;
                        const speed = (0.005 + Math.random() * 0.005) * (i + 1) * 0.5;
                        const count = Math.floor(120 + Math.random() * 100);
                        const colors = ['#8a7a6a', '#7a8a7a', '#9a8a7a', '#8a8a7a', '#7a7a7a'];
                        const col = colors[Math.floor(Math.random() * colors.length)];
                        ringLayers.push({
                            particles: createRingParticles(count, a, b),
                            a,
                            b,
                            tilt,
                            angle: Math.random() * Math.PI * 2,
                            speed,
                            color: col
                        });
                    }
                    planets.push(new Planet(p.x, p.y, c.radius, c.color, ringLayers, 25 + Math.floor(Math.random() *
                        20)));
                }
                mainPlanet = planets[0];
                const li = 1,
                    ang = -0.6;
                let best = null,
                    bestDiff = Infinity;
                const layer = mainPlanet.ringLayers[li];
                if (layer) {
                    for (let pi = 0; pi < layer.particles.length; pi++) {
                        const p = layer.particles[pi];
                        const totalA = p.angleOffset + layer.angle;
                        let diff = totalA - ang;
                        diff = ((diff % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
                        if (Math.abs(diff) < bestDiff) {
                            bestDiff = Math.abs(diff);
                            best = pi;
                        }
                    }
                }
                if (best !== null) {
                    const pos2 = mainPlanet.getParticlePosition(li, best);
                    const tangent = mainPlanet.getParticleTangent(li, best);
                    attachInfo.x = pos2.x;
                    attachInfo.y = pos2.y;
                    attachInfo.layerIndex = li;
                    attachInfo.angle = ang;
                    attachInfo.tangentX = tangent ? Math.cos(tangent) : 1;
                    attachInfo.tangentY = tangent ? Math.sin(tangent) : 0;
                } else {
                    const r = mainPlanet.radius * 2.5;
                    attachInfo.x = mainPlanet.x + r * Math.cos(ang);
                    attachInfo.y = mainPlanet.y + r * Math.sin(ang);
                    attachInfo.tangentX = -Math.sin(ang);
                    attachInfo.tangentY = Math.cos(ang);
                }
                resetMeteor();
            }

            // --- 陨星系统 ---
            let meteor = {
                state: 'attached',
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
                speed: 0,
                shadowBlur: 0,
                history: [],
                gravity: CONFIG.meteor.gravity,
                brokenPieces: [],
                headColor: { r: 180, g: 160, b: 140 },
                flyTimer: 0,
                flyDuration: 60,
                attachStartTime: 0,
                attachDuration: CONFIG.meteor.attachDuration,
            };

            function resetMeteor() {
                meteor.x = attachInfo.x;
                meteor.y = attachInfo.y;
                meteor.state = 'attached';
                meteor.vx = 0;
                meteor.vy = 0;
                meteor.speed = 0;
                meteor.shadowBlur = 0;
                meteor.history = [];
                meteor.brokenPieces = [];
                meteor.flyTimer = 0;
                meteor.attachStartTime = performance.now();
                meteor.headColor = { r: 180, g: 160, b: 140 };
                if (mainPlanet) mainPlanet.resetAllParticles();
            }

            function triggerDetach() {
                if (meteor.state !== 'attached') return;
                const tx = attachInfo.tangentX,
                    ty = attachInfo.tangentY;
                const dx = tx * 0.7 + 0.3,
                    dy = ty * 0.7 + 0.3;
                const len = Math.hypot(dx, dy),
                    nx = dx / len,
                    ny = dy / len;
                const spd = rand(CONFIG.meteor.startSpeed, CONFIG.meteor.startSpeed + 2);
                meteor.vx = nx * spd;
                meteor.vy = ny * spd;
                meteor.speed = spd;
                meteor.shadowBlur = CONFIG.meteor.startBlur;
                meteor.headColor = { r: 255, g: 200, b: 100 };
                meteor.history = [];
                for (let i = 0; i < CONFIG.meteor.historyLength; i++) {
                    const t = i * 2.2;
                    meteor.history.push({ x: meteor.x - t * nx, y: meteor.y - t * ny });
                }
                meteor.flyTimer = 0;
                meteor.flyDuration = randInt(CONFIG.meteor.flyDurationMin, CONFIG.meteor.flyDurationMax);
                meteor.state = 'flying';
                viewport.targetCx = meteor.x;
                viewport.targetCy = meteor.y;
                viewport.targetScale = CONFIG.spaceOpen.endScale;
                viewport.transitioning = false;
                epicFlowState = 'flying';
                if (soundInitialized && !soundMuted && soundEngine) {
                    soundEngine.playSound('meteor', 0, 3.5, 0.6, 0.2, false, true).then(entry => {
                        if (entry) meteorSoundId = entry.id;
                    });
                }
            }

            function breakMeteor() {
                if (meteor.state !== 'flying' || meteor.brokenPieces.length > 0) return;
                const cx = meteor.x,
                    cy = meteor.y;
                const count = randInt(CONFIG.meteor.pieceCountMin, CONFIG.meteor.pieceCountMax);
                const colors = [
                    { r: 255, g: 200, b: 100 }, { r: 255, g: 160, b: 60 },
                    { r: 240, g: 140, b: 50 }, { r: 255, g: 180, b: 80 },
                    { r: 200, g: 220, b: 255 }
                ];
                const dir = Math.atan2(meteor.vy, meteor.vx),
                    baseSpd = Math.hypot(meteor.vx, meteor.vy) || 3;
                for (let i = 0; i < count; i++) {
                    const off = rand(-Math.PI / 7, Math.PI / 7),
                        a = dir + off,
                        spd = rand(3, 6) + baseSpd * 0.5,
                        sz = rand(5, 16),
                        c = colors[randInt(0, colors.length - 1)];
                    const piece = {
                        x: cx + rand(-6, 6),
                        y: cy + rand(-6, 6),
                        vx: Math.cos(a) * spd,
                        vy: Math.sin(a) * spd - rand(0.3, 1.5),
                        size: sz,
                        color: c,
                        life: randInt(80, 150),
                        alpha: 1,
                        rotation: rand(0, Math.PI * 2),
                        rotSpeed: rand(-0.06, 0.06),
                        history: []
                    };
                    for (let j = 0; j < CONFIG.meteor.pieceHistoryLen; j++) {
                        const t = j * 1.5;
                        piece.history.push({ x: piece.x - Math.cos(a) * t, y: piece.y - Math.sin(a) * t });
                    }
                    meteor.brokenPieces.push(piece);
                }
                meteor.state = 'broken';
                epicFlowState = 'broken';
                if (soundInitialized && !soundMuted && soundEngine) {
