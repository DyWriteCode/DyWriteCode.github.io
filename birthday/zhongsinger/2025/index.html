<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <meta content="no-referrer" name="referrer" />
    <link href="https://cdn.jsdmirror.com?v=20260819074040" rel="preconnect" />
    <link href="https://cdn.jsdmirror.com?v=20260819074040" rel="dns-prefetch" />
    <link as="audio" crossorigin="anonymous"
        href="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@ec60fc2/birthday/zhongsinger/2025/music/bir.mp3?v=20260819074040"
        rel="preload" type="audio/mpeg" />
    <link
        href="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@ec60fc2/birthday/zhongsinger/2025/images/happy.ico?v=20260819074040"
        rel="icon" type="image/png" />
    <link href="style.css?v=20260819074040" rel="stylesheet" />
    <script crossorigin=""
        src="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@ec60fc2/preview_assets/check-update.js?v=20260819074040"
        type="module">
        </script>
    <title>钟芯尔的生日空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            perspective: 1000px;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .heart-gate {
            width: 320px;
            height: 320px;
            position: relative;
            transform-style: preserve-3d;
            animation: floatHeart 6s infinite ease-in-out;
        }

        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ff6b6b;
            border-radius: 50%;
            clip-path: polygon(50% 15%,
                    70% 0%,
                    85% 15%,
                    100% 35%,
                    85% 70%,
                    70% 90%,
                    50% 100%,
                    30% 90%,
                    15% 70%,
                    0% 35%,
                    15% 15%,
                    30% 0%);
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.6);
        }

        .gate-knob {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ffd166;
            border-radius: 50%;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            box-shadow: 0 0 15px rgba(255, 209, 102, 0.8);
            cursor: pointer;
        }

        .welcome-text {
            text-align: center;
            margin-top: 30px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #ffd166, #ff6b6b);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            margin-top: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        .enter-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0;
        }

        .message-bubble {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 70%;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: floatBubble 8s infinite;
            transform-origin: bottom right;
        }

        .message-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 30px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid rgba(255, 255, 255, 0.9);
        }

        @keyframes twinkle {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0.3);
            }
        }

        @keyframes floatHeart {

            0%,
            100% {
                transform: translateY(0) rotateY(0) scale(1);
            }

            50% {
                transform: translateY(-15px) rotateY(10deg) scale(1.05);
            }
        }

        @keyframes floatBubble {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-10px) scale(1.05);
            }
        }
    </style>
</head>

<body>
    <script src="click.js?v=20260819074040" type="text/javascript"></script>
    <script crossorigin=""
        src="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@ec60fc2/preview_assets/index.js?v=20260819074040">
        </script>
    <!--背景音乐-->
    <audio autoplay="" id="music" loop="" preload="auto"
        src="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@ec60fc2/birthday/zhongsinger/2025/music/bir.mp3?v=20260819074040">
    </audio>
    <div class="container">
        <div class="stars" id="stars"></div>
        <div class="heart-gate">
            <div class="heart"></div>
            <div class="gate-knob" onclick="openHeartGate()"></div>
        </div>
        <div class="welcome-text">
            <h1>
                钟芯尔的
                <br />
                生日空间
            </h1>
            <p>点击心形门环，进入专属你的生日世界</p>
            <button class="enter-btn" onclick="openHeartGate()">开启神秘之旅</button>
        </div>
        <div class="message-bubble">当你进入空间，将收到一个特别的惊喜</div>
    </div>
    <script>
        function createStars() {
            const stars = document.getElementById('stars');
            const starCount = 50;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * 4 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;

                const duration = Math.random() * 5 + 2;
                star.style.setProperty('--duration', `${duration}s`);

                stars.appendChild(star);
            }
        }

        function openHeartGate() {
            window.location.href='memory.html?v=20260819074040';
        }

        function toggleSound() {
            var music = document.getElementById("music");//获取ID  
            if (music.paused) {
                music.paused = false;
                music.play(); //没有就播放 
            }
        }

        window.onload = function () {
            createStars();
            setInterval("toggleSound()", 10);
        };
    </script>
</body>

</html>
