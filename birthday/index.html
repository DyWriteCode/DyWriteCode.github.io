<!DOCTYPE html>

    <link rel="preconnect" href="https://cdn.jsdmirror.com">

    <script type="module" crossorigin

    <style>
        /* 修复布局：顶部与底部文字居中 */
        .hero-section {
            flex-direction: column;
            align-items: center;
            padding: 20px 0 0 0;
            /* 调整顶部间距 */
        }

        .hero-section>* {
            width: 100%;
        }

        /* 顶部与底部文字的全局样式 */
        .page-header {
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 24px 20px 12px 20px;
            letter-spacing: 2px;
        }

        .page-footer {
            text-align: center;
            color: #999;
            font-size: 16px;
            padding: 30px 20px 24px 20px;
            line-height: 2.2;
            font-family: 'Georgia', 'SimSun', serif;
        }

        .page-footer strong {
            color: #666;
            font-weight: 700;
            font-size: 1.1em;
        }

        /* 链接样式美化 */
        .page-header a {
            color: #b5654b;
            text-decoration: none;
            border-bottom: 1px dashed #dccfc8;
            transition: color 0.3s, border-color 0.3s;
            padding-bottom: 1px;
        }

        .page-header a:hover {
            color: #8a5a3a;
            border-bottom-color: #b5654b;
            border-bottom-style: solid;
        }

        @media (max-width: 540px) {
            .page-header {
                font-size: 15px;
                padding: 16px 12px 8px 12px;
            }

            .page-footer {
                font-size: 14px;
                padding: 20px 12px 16px 12px;
                line-height: 2;
            }
        }

</head>

<body>
    <script type="text/javascript" src="preview_assets/click.js"></script>
    <section class="hero-section background_color">

        <!-- 顶部灰色居中文字 -->
        <div class="page-header">

            </p>
        </div>

            <a class="card" href="dingyang/egg/index.html" id="customLink" data-password="20090907">

                    style="background-image: url(https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@main/birthday/preview_assets/me.jpeg);">
                </div>
                <div class="card__content">
                    <p class="card__category">To 自己</p>

                    <img class="card__qrcode"
                        src="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@main/birthday/preview_assets/me.jpeg" />
                </div>
            </a>
            <a class="card" href="zhongsinger/index.html">
                <div class="card__background"
                    style="background-image: url(https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@main/birthday/preview_assets/flower.jpg);">
                </div>
                <div class="card__content">
                    <p class="card__category">To 钟芯尔</p>
                    <h3 class="card__heading">我的好朋友</h3>
                    <img class="card__qrcode"
                        src="https://cdn.jsdmirror.com/gh/DyWriteCode/DyWriteCode.github.io@main/birthday/preview_assets/flower.jpg" />
                </div>

        </div>

        <div class="page-footer">
            <p style="margin:0;"><strong>三</strong>十<strong>三</strong>重天外天，九霄云外有神仙</p>
            <p style="margin:0;">神仙本是凡人变，唯恐凡人心不坚</p>
            <p style="margin:0;">一言半句便通玄，何须丹书千万篇</p>
            <p style="margin:0;">人若不为形所累，眼前便是大罗天。</p>
        </div>

    </section>
    <div id="myModal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:12px; text-align:center; min-width:280px;">
            <h3>请输入访问密钥</h3>
            <input type="password" id="codeInput" placeholder="请输入数字"
                style="margin:15px 0; padding:10px; width:80%; border:1px solid #ccc; border-radius:6px;">
            <div>
                <button onclick="verifyAccess()"
                    style="padding:8px 30px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer;">确认</button>
            </div>
        </div>

    <script type="text/javascript" src="preview_assets/popup.js"></script>
